<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Αρχιτέκτονες του αρχαίου κόσμου</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
  }
  canvas {
    display: block;
    touch-action: none;
    user-select: none;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script src="../lib/planck.min.js"></script>
<script src="levels.js"></script>
<script src="map-routes.js"></script>
<script>
(function () {
  "use strict";

  // Map: grep -n "SECTION:" this file for the list, then read just that
  // section (sed -n 'A,Bp' or Read with offset/limit). Do not read the whole file.

  // ---------------------------------------------------------------------
  // SECTION: SKIN -- drawing goes through here so art can be replaced later.
  // ---------------------------------------------------------------------
  const SKIN = {
    background(ctx, w, h, sky) {
      if (sky && sky.complete && sky.naturalWidth) { ctx.drawImage(sky, 0, 0, w, h); return; }
      ctx.fillStyle = "#bfe3f0";
      ctx.fillRect(0, 0, w, h);
    },
    ground(ctx, w, h) {
      ctx.fillStyle = "#d8c08a";
      ctx.fillRect(0, 0, w, h);
      ctx.fillStyle = "#c2a86f";
      ctx.fillRect(0, 0, w, Math.max(4, h * 0.08));
    },
    dust(ctx, x, y, r, alpha) {
      ctx.fillStyle = "rgba(214, 196, 160, " + (0.5 * alpha) + ")";
      ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
    },
    chip(ctx, x, y, r, angle, alpha) {
      ctx.save(); ctx.translate(x, y); ctx.rotate(angle);
      ctx.fillStyle = "rgba(" + chipRGB("stone") + ", " + alpha + ")";
      ctx.beginPath(); ctx.moveTo(-r, -r * 0.6); ctx.lineTo(r, -r * 0.3); ctx.lineTo(r * 0.3, r); ctx.closePath(); ctx.fill();
      ctx.restore();
    },
    mapImage(ctx, img, x, y, w, h) {
      if (img.complete && img.naturalWidth) ctx.drawImage(img, x, y, w, h);
    },
    // Sea: the owner's water picture (royalty free, owner 13 Nov), 1.5x its own size, tiled over the map. Its
    // frames jump, so instead two of them drift slowly the same way across its diagonal bands, one over the other.
    mapWater(ctx, img, v, t) {
      const s = img.naturalWidth, n = Math.max(1, Math.floor(img.naturalHeight / s)), SC = 1.5;
      if (!img._frames) img._frames = Array.from({ length: n }, (_, i) => { const c = document.createElement("canvas"); c.width = c.height = s; c.getContext("2d").drawImage(img, 0, i * s, s, s, 0, 0, s, s); return c; });
      const w = (cssWidth - v.ox) / SC + s, h = (cssHeight - v.oy) / SC + s;
      const layer = (fr, dx, dy, alpha) => { // dx, dy: picture pixels per second
        const ox = (((t * dx) % s) + s) % s, oy = (((t * dy) % s) + s) % s;
        ctx.save(); ctx.globalAlpha = alpha; ctx.translate(v.ox, v.oy); ctx.scale(SC, SC); ctx.translate(ox - s, oy - s);
        ctx.fillStyle = ctx.createPattern(img._frames[fr], "repeat"); ctx.fillRect(0, 0, w + s, h + s); ctx.restore();
      };
      layer(0, 5, 5, 1); layer(Math.floor(n / 2), 3.5, 3.5, 0.5);
    },
    // A boat on the map, drawn centred at (x, y), `size` pixels wide, mirrored when sailing left.
    mapBoat(ctx, img, x, y, size, flip, tilt) {
      if (!img.complete || !img.naturalWidth) return;
      const h = (size * img.naturalHeight) / img.naturalWidth;
      ctx.save(); ctx.translate(x, y); ctx.rotate(tilt); if (flip) ctx.scale(-1, 1);
      ctx.drawImage(img, -size / 2, -h * 0.8, size, h);
      ctx.restore();
    },
    // Small ripples behind a sailing boat drawn as mapBoat draws it (same x, y, size, flip).
    // `ang`: the way the boat is sailing; the ripples start at the stern and trail out the other way.
    mapWake(ctx, img, x, y, size, flip, ang, t) {
      if (!img.complete || !img.naturalWidth) return;
      const h = (size * img.naturalHeight) / img.naturalWidth, sx = x + (flip ? 1 : -1) * size * 0.4, sy = y + h * 0.14; // stern, at the waterline
      const bx = -Math.cos(ang), by = -Math.sin(ang);
      ctx.save(); ctx.lineWidth = Math.max(1, size * 0.03); ctx.lineCap = "round";
      for (let i = 0; i < 3; i++) {
        const p = (t * 0.7 + i / 3) % 1, rx = size * (0.08 + 0.18 * p), d = size * 0.5 * p;
        ctx.strokeStyle = "rgba(255, 255, 255, " + (0.75 * (1 - p)).toFixed(3) + ")";
        ctx.beginPath(); ctx.ellipse(sx + bx * d, sy + by * d, rx, rx * 0.3, ang, 0, Math.PI * 2); ctx.stroke();
      }
      ctx.restore();
    },
    // The textures switch: a little wall of four blocks inside the button, plain colours when off, the real
    // textures when on (with a green ring).
    texSwitch(ctx, x, y, size, on, tex) {
      const w = size * 0.26, h = size * 0.15, keys = TEX_BUTTON.map((b) => b[0]), plain = TEX_BUTTON.map((b) => PLAIN[b[1]]);
      ctx.save();
      [[-1, -1], [0, -1], [-1, 0], [0, 0]].forEach(([i, j], n) => {
        const bx = x + i * w, by = y + j * h - h * 0.05, im = tex[keys[n]];
        if (on && im.complete && im.naturalWidth) {
          if (keys[n] === "wood") { ctx.save(); ctx.translate(bx + w / 2, by + h / 2); ctx.rotate(Math.PI / 2); ctx.drawImage(im, 0, 0, im.naturalWidth / 6, im.naturalWidth / 3, -h / 2, -w / 2, h, w); ctx.restore(); } // grain along the block
          else ctx.drawImage(im, 0, 0, im.naturalWidth / 3, im.naturalWidth / 6, bx, by, w, h);
        }
        else { ctx.fillStyle = plain[n]; ctx.fillRect(bx, by, w, h); }
        ctx.strokeStyle = "#3c3226"; ctx.lineWidth = 1.2; ctx.strokeRect(bx, by, w, h);
      });
      if (on) { ctx.strokeStyle = "#5fbf4a"; ctx.lineWidth = Math.max(3, size * 0.06); ctx.beginPath(); ctx.arc(x, y, size * 0.5, 0, Math.PI * 2); ctx.stroke(); }
      ctx.restore();
    },
    // An empty building site: a pale dashed circle.
    mapSite(ctx, x, y, r) {
      ctx.fillStyle = "rgba(255, 248, 230, 0.85)";
      ctx.strokeStyle = "#5a4a36"; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
      ctx.setLineDash([6, 5]); ctx.stroke(); ctx.setLineDash([]);
    },
    // Level outline (screen-pixel paths): the building's shape, its openings kept clear.
    outline(ctx, solid, holes, guides) {
      const shape = new Path2D(solid); shape.addPath(holes); // the openings cut out, so the sky shows through them
      ctx.fillStyle = "rgba(255, 244, 214, 0.6)"; ctx.fill(shape, "evenodd");
      ctx.strokeStyle = "#8a6d3b"; ctx.lineWidth = 2; ctx.setLineDash([8, 6]);
      ctx.stroke(solid); ctx.stroke(holes); ctx.setLineDash([]);
      if (guides) { ctx.lineWidth = 1; ctx.strokeStyle = "rgba(138, 109, 59, 0.6)"; ctx.stroke(guides); } // thin lines: where the arch stones go
    },
    // Where wood goes (wood courses, or temporary wooden supports).
    woodZone(ctx, path) {
      ctx.fillStyle = "rgba(196, 154, 98, 0.45)"; ctx.fill(path);
      ctx.strokeStyle = "#9a6a3a"; ctx.lineWidth = 2; ctx.setLineDash([4, 4]); ctx.stroke(path); ctx.setLineDash([]);
    },
    // Where the load will be lowered on.
    loadGhost(ctx, path, bad) {
      if (bad) { ctx.fillStyle = "rgba(220, 40, 30, " + (0.25 + 0.2 * Math.sin(performance.now() / 120)) + ")"; ctx.fill(path); }
      ctx.strokeStyle = bad ? "#c0281e" : "rgba(90, 60, 30, 0.75)"; ctx.lineWidth = bad ? 3 : 2; ctx.setLineDash([3, 5]); ctx.stroke(path); ctx.setLineDash([]);
    },
    // The load itself, drawn in metres with y up, centred on its body.
    load(ctx, verts, bad) {
      ctx.fillStyle = bad ? "#c0503c" : "#e8902e"; ctx.strokeStyle = bad ? "#7a1a10" : "#8a4a12"; ctx.lineWidth = 0.06;
      ctx.beginPath(); verts.forEach(([x, y], i) => (i ? ctx.lineTo(x, y) : ctx.moveTo(x, y))); ctx.closePath();
      ctx.fill(); ctx.stroke();
    },
    // a gust: a long wavy streak with a curl at its head, trailing behind the way it blows
    wind(ctx, x, y, len, alpha, dir, ph) {
      const a = Math.min(1, alpha * 1.6), amp = len * 0.06;
      ctx.save(); ctx.lineCap = "round";
      ctx.strokeStyle = "rgba(255, 255, 255, " + (0.85 * a) + ")"; ctx.lineWidth = 3.5;
      ctx.beginPath();
      for (let i = 0; i <= 16; i++) { const t = i / 16, px = x - dir * len * (1 - t), py = y + Math.sin(ph + t * 7) * amp * (1 - t); if (i) ctx.lineTo(px, py); else ctx.moveTo(px, py); }
      const cr = len * 0.07;
      ctx.arc(x, y - cr, cr, Math.PI / 2, dir > 0 ? Math.PI * 2.2 : -Math.PI * 0.2, dir < 0);
      ctx.stroke();
      ctx.strokeStyle = "rgba(255, 255, 255, " + (0.45 * a) + ")"; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(x - dir * len * 0.9, y + len * 0.12); ctx.lineTo(x - dir * len * 0.3, y + len * 0.12); ctx.stroke();
      ctx.restore();
    },
    petal(ctx, x, y, r, angle, alpha, hue) {
      ctx.save(); ctx.translate(x, y); ctx.rotate(angle);
      ctx.fillStyle = "hsla(" + hue + ", 80%, 60%, " + alpha + ")"; ctx.fillRect(-r, -r * 0.5, r * 2, r);
      ctx.restore();
    },
    // A site that can be played now: solid bright circle.
    mapSiteOpen(ctx, x, y, r) {
      ctx.fillStyle = "#f2c230"; ctx.strokeStyle = "#5a4a36"; ctx.lineWidth = 3; // owner 14 Nov: open sites yellow (red means damaged)
      ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    },
    // A finished site; the player's own building is drawn on top of it.
    mapSiteDone(ctx, x, y, r) {
      ctx.fillStyle = "rgba(120, 200, 110, 0.6)"; ctx.strokeStyle = "#3d6b2f"; ctx.lineWidth = 3; // semi-transparent green
      ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    },
    // What broke a rule: red cells over the outline.
    failCells(ctx, path, alpha) {
      ctx.fillStyle = "rgba(220, 40, 30, " + alpha + ")"; ctx.fill(path);
    },
    // Cracks on an overloaded piece, in metres, centred, across its short side.
    crack(ctx, hx, hy, strain, material) {
      ctx.strokeStyle = "rgba(40, 25, 10, " + Math.min(1, strain * 1.3) + ")"; ctx.lineWidth = 0.05;
      const n = material === "mudbrick" ? 3 : 1, along = hx >= hy;
      for (let i = 0; i < n; i++) {
        const t = n === 1 ? 0 : (i - 1) * 0.55;
        ctx.beginPath();
        for (let k = 0; k <= 5; k++) {
          const u = -1 + (2 * k) / 5, z = (k % 2 ? 0.12 : -0.12) * Math.min(1, strain + 0.3);
          const x = along ? (t + z) * hx : u * hx, y = along ? u * hy : (t + z) * hy;
          if (k) ctx.lineTo(x, y); else ctx.moveTo(x, y);
        }
        ctx.stroke();
      }
    },
    mudChip(ctx, x, y, r, angle, alpha) {
      ctx.save(); ctx.translate(x, y); ctx.rotate(angle);
      ctx.fillStyle = "rgba(" + chipRGB("mudbrick") + ", " + alpha + ")";
      ctx.beginPath(); ctx.moveTo(-r, -r * 0.6); ctx.lineTo(r, -r * 0.3); ctx.lineTo(r * 0.3, r); ctx.closePath(); ctx.fill();
      ctx.restore();
    },
    splinter(ctx, x, y, len, angle, alpha) {
      ctx.save(); ctx.translate(x, y); ctx.rotate(angle);
      ctx.strokeStyle = "rgba(150, 105, 60, " + alpha + ")"; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(-len / 2, 0); ctx.lineTo(len / 2, 0); ctx.stroke();
      ctx.restore();
    },
    // The sidebar bin that holds a level's pieces.
    pileBin(ctx, x, y, w, h) {
      ctx.fillStyle = "#3f362c"; ctx.fillRect(x, y, w, h);
      ctx.strokeStyle = "#2a231c"; ctx.lineWidth = 2; ctx.strokeRect(x, y, w, h);
    },
    pile(ctx, w, h) {
      ctx.fillStyle = "#8a7560";
      ctx.fillRect(0, 0, w, h);
      ctx.fillStyle = "#73604d";
      ctx.fillRect(0, 0, w, Math.max(3, h * 0.05));
    },
    piece: {
      block(ctx, w, h) {
        ctx.fillStyle = "#c9b088";
        ctx.strokeStyle = "#5a4a36";
        ctx.lineWidth = 0.06;
        ctx.fillRect(-w / 2, -h / 2, w, h);
        ctx.strokeRect(-w / 2, -h / 2, w, h);
      },
      column(ctx, w, h, material) {
        ctx.fillStyle = "#d6c097";
        ctx.strokeStyle = "#5a4a36";
        ctx.lineWidth = 0.06;
        ctx.fillRect(-w / 2, -h / 2, w, h);
        ctx.strokeRect(-w / 2, -h / 2, w, h);
        if (material === "wood") return; // wood shows only its grain stripes
        // fluting lines along the long axis
        ctx.beginPath();
        const long = Math.max(w, h);
        const vertical = h >= w;
        const n = 3;
        for (let i = 1; i <= n; i++) {
          const t = -0.5 + i / (n + 1);
          if (vertical) {
            ctx.moveTo(t * w, -h / 2);
            ctx.lineTo(t * w, h / 2);
          } else {
            ctx.moveTo(-w / 2, t * h);
            ctx.lineTo(w / 2, t * h);
          }
        }
        ctx.stroke();
      },
      beam(ctx, w, h) {
        ctx.fillStyle = "#b99a6b";
        ctx.strokeStyle = "#5a4a36";
        ctx.lineWidth = 0.06;
        ctx.fillRect(-w / 2, -h / 2, w, h);
        ctx.strokeRect(-w / 2, -h / 2, w, h);
      },
      centering(ctx, w, h) {
        const R = w / 2, c = (4 * R) / (3 * Math.PI);
        ctx.fillStyle = "#c9a36b"; ctx.strokeStyle = "#5a4a36"; ctx.lineWidth = 0.06;
        ctx.beginPath(); ctx.moveTo(R, -c); ctx.arc(0, -c, R, 0, Math.PI, false); ctx.closePath(); ctx.fill(); ctx.stroke();
      },
      gable() {}, // drawn from its polygon like any shaped piece (fill and outline below)
      wedge(ctx, w, h) {
        ctx.fillStyle = "#c9b088";
        ctx.strokeStyle = "#5a4a36";
        ctx.lineWidth = 0.06;
        ctx.beginPath();
        ctx.moveTo(-w / 3, -h / 2); ctx.lineTo(w / 3, -h / 2); ctx.lineTo(w / 2, h / 2); ctx.lineTo(-w / 2, h / 2);
        ctx.closePath(); ctx.fill(); ctx.stroke();
      },
      drum(ctx, r) {
        ctx.fillStyle = "#cdb892";
        ctx.strokeStyle = "#5a4a36";
        ctx.lineWidth = 0.06;
        ctx.beginPath();
        ctx.arc(0, 0, r, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
        // one line across it so rolling is visible
        ctx.beginPath();
        ctx.moveTo(-r, 0);
        ctx.lineTo(r, 0);
        ctx.stroke();
      },
    },
    // two arrowheads on a button: the test will run fast (Ctrl)
    fastBadge(ctx, x, y, size) {
      const r = size * 0.2, cx = x + size * 0.36, cy = y + size * 0.36;
      ctx.save();
      ctx.fillStyle = "#f2c230"; ctx.strokeStyle = "#3c3226"; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      ctx.fillStyle = "#3c3226";
      for (const dx of [-0.55, 0.05]) {
        ctx.beginPath(); ctx.moveTo(cx + dx * r, cy - 0.5 * r); ctx.lineTo(cx + (dx + 0.5) * r, cy); ctx.lineTo(cx + dx * r, cy + 0.5 * r); ctx.closePath(); ctx.fill();
      }
      ctx.restore();
    },
    button(ctx, name, x, y, size, pressed) {
      const r = size * (pressed ? 0.46 : 0.5);
      ctx.save();
      ctx.translate(x, y);
      ctx.fillStyle = name === "test" ? (pressed ? "#c0392b" : "#4f8a3c") : name === "confirm" ? "#c0392b" : pressed ? "#5f5042" : "#6e5d4a";
      ctx.strokeStyle = "#3c3226";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(0, 0, r, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle = "#e8dcc5";
      ctx.strokeStyle = "#3c3226";
      ctx.lineWidth = 1.5;
      const s = r * 0.55;
      if (name === "block") {
        ctx.fillRect(-s * 0.9, -s * 0.45, s * 1.8, s * 0.9);
        ctx.strokeRect(-s * 0.9, -s * 0.45, s * 1.8, s * 0.9);
      } else if (name === "block-end") {
        ctx.fillRect(-s * 0.45, -s * 0.9, s * 0.9, s * 1.8);
        ctx.strokeRect(-s * 0.45, -s * 0.9, s * 0.9, s * 1.8);
      } else if (name === "column") {
        ctx.fillRect(-s * 0.3, -s, s * 0.6, s * 2);
        ctx.strokeRect(-s * 0.3, -s, s * 0.6, s * 2);
      } else if (name === "column-lying") {
        ctx.fillRect(-s, -s * 0.3, s * 2, s * 0.6);
        ctx.strokeRect(-s, -s * 0.3, s * 2, s * 0.6);
      } else if (name === "beam") {
        ctx.fillRect(-s, -s * 0.25, s * 2, s * 0.5);
        ctx.strokeRect(-s, -s * 0.25, s * 2, s * 0.5);
      } else if (name === "wedge") {
        ctx.beginPath();
        ctx.moveTo(-s * 0.5, s * 0.8); ctx.lineTo(s * 0.5, s * 0.8); ctx.lineTo(s * 0.75, -s * 0.8); ctx.lineTo(-s * 0.75, -s * 0.8);
        ctx.closePath(); ctx.fill(); ctx.stroke();
      } else if (name === "drum") {
        ctx.beginPath();
        ctx.arc(0, 0, s * 0.8, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
      } else if (name === "home") {
        // a little folded map
        ctx.beginPath();
        ctx.moveTo(-s, -s * 0.6); ctx.lineTo(-s * 0.33, -s * 0.8); ctx.lineTo(s * 0.33, -s * 0.6); ctx.lineTo(s, -s * 0.8);
        ctx.lineTo(s, s * 0.6); ctx.lineTo(s * 0.33, s * 0.8); ctx.lineTo(-s * 0.33, s * 0.6); ctx.lineTo(-s, s * 0.8);
        ctx.closePath(); ctx.fill(); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(-s * 0.33, -s * 0.8); ctx.lineTo(-s * 0.33, s * 0.6);
        ctx.moveTo(s * 0.33, -s * 0.6); ctx.lineTo(s * 0.33, s * 0.8); ctx.stroke();
      } else if (name === "test") {
        // start the test: one plain "go" triangle (owner 14 Nov: red until ready, then green; simpler symbol)
        ctx.beginPath(); ctx.moveTo(-0.45 * s, -0.6 * s); ctx.lineTo(0.65 * s, 0); ctx.lineTo(-0.45 * s, 0.6 * s); ctx.closePath(); ctx.fill(); ctx.stroke();
      } else if (name === "autobuild") {
        // parent override: a little stack being built
        for (const [bx, by, bw] of [[-0.9, 0.35, 0.85], [0.05, 0.35, 0.85], [-0.42, -0.35, 0.85]]) {
          ctx.fillRect(bx * s, by * s, bw * s, 0.6 * s); ctx.strokeRect(bx * s, by * s, bw * s, 0.6 * s);
        }
      } else if (name === "broom") {
        ctx.save();
        ctx.rotate(-0.5);
        ctx.fillRect(-s * 0.08, -s * 0.9, s * 0.16, s * 1.1);
        ctx.beginPath();
        ctx.moveTo(-s * 0.35, s * 0.15);
        ctx.lineTo(s * 0.35, s * 0.15);
        ctx.lineTo(s * 0.22, s * 0.95);
        ctx.lineTo(-s * 0.22, s * 0.95);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
        ctx.restore();
      } else if (name === "undo") {
        // a hooked arrow turning back to the left
        const R = s * 0.62;
        ctx.lineWidth = s * 0.26; ctx.strokeStyle = "#e8dcc5"; ctx.lineCap = "butt";
        ctx.beginPath(); ctx.arc(s * 0.1, s * 0.15, R, 0, -Math.PI, true); ctx.stroke();
        const ex = s * 0.1 - R, ey = s * 0.15;
        ctx.beginPath(); ctx.moveTo(ex - s * 0.4, ey); ctx.lineTo(ex + s * 0.4, ey); ctx.lineTo(ex, ey + s * 0.5); ctx.closePath(); ctx.fill();
      } else if (name === "confirm") {
        // a tick: yes, do it
        ctx.lineWidth = s * 0.3; ctx.strokeStyle = "#e8dcc5"; ctx.lineCap = "round"; ctx.lineJoin = "round";
        ctx.beginPath(); ctx.moveTo(-s * 0.55, 0); ctx.lineTo(-s * 0.15, s * 0.42); ctx.lineTo(s * 0.6, -s * 0.45); ctx.stroke();
      } else if (name === "restart") {
        // a circular arrow: start again
        const R = s * 0.7, a = -Math.PI * 0.3; // the arrow's end, top right; the arc runs round from there
        ctx.lineWidth = s * 0.28; ctx.strokeStyle = "#e8dcc5"; ctx.lineCap = "butt";
        ctx.beginPath(); ctx.arc(0, 0, R, a, Math.PI * 1.3); ctx.stroke();
        const ex = Math.cos(a) * R, ey = Math.sin(a) * R, tx = Math.sin(a), ty = -Math.cos(a), nx = Math.cos(a), ny = Math.sin(a); // along the arc onward; outward
        ctx.beginPath(); ctx.moveTo(ex + tx * s * 0.45, ey + ty * s * 0.45); ctx.lineTo(ex + nx * s * 0.36, ey + ny * s * 0.36); ctx.lineTo(ex - nx * s * 0.36, ey - ny * s * 0.36); ctx.closePath(); ctx.fill();
      } else if (name === "sandbox") {
        // free play (owner 16 Nov): three stacked blocks, two below and one on top in the middle
        const w = s * 0.92, h = s * 0.56, y0 = s * 0.1;
        for (const [bx, by] of [[-w, y0], [0, y0], [-w / 2, y0 - h]]) { ctx.fillRect(bx, by, w, h); ctx.strokeRect(bx, by, w, h); }
      } else if (name === "gear") {
        // settings (owner 16 Nov): a cog with eight teeth and a hole
        ctx.beginPath();
        for (let k = 0; k < 16; k++) { const a0 = (k / 16) * Math.PI * 2, a1 = ((k + 1) / 16) * Math.PI * 2, R = k % 2 ? s * 0.68 : s * 0.92; ctx.arc(0, 0, R, a0, a1); }
        ctx.closePath(); ctx.moveTo(s * 0.3, 0); ctx.arc(0, 0, s * 0.3, 0, Math.PI * 2, true); ctx.fill("evenodd"); ctx.stroke();
      }
      ctx.restore();
    },
    // label under a map button
    buttonLabel(ctx, text, x, y, size) {
      ctx.save(); ctx.font = "bold " + Math.round(size * 0.22) + "px sans-serif"; ctx.textAlign = "center"; ctx.textBaseline = "top";
      ctx.lineWidth = 4; ctx.strokeStyle = "rgba(255, 248, 230, 0.9)"; ctx.strokeText(text, x, y); ctx.fillStyle = "#3c3226"; ctx.fillText(text, x, y);
      ctx.restore();
    },
    // map taps (SECTION MAP, mapTap): one particle; kind water/sand/leaf/rock, size r px, life 1..0
    mapTapBit(ctx, q) {
      const a = Math.max(0, Math.min(1, q.life));
      ctx.save(); ctx.translate(q.x, q.y);
      if (q.kind === "ring") { ctx.strokeStyle = `rgba(235, 248, 255, ${a * 0.9})`; ctx.lineWidth = 2.5; ctx.beginPath(); ctx.ellipse(0, 0, q.r, q.r * 0.6, 0, 0, Math.PI * 2); ctx.stroke(); }
      else if (q.kind === "drop") { ctx.fillStyle = `rgba(225, 242, 255, ${a})`; ctx.beginPath(); ctx.arc(0, 0, q.r, 0, Math.PI * 2); ctx.fill(); }
      else if (q.kind === "sand") { ctx.fillStyle = `rgba(222, 190, 128, ${a * 0.55})`; ctx.beginPath(); ctx.arc(0, 0, q.r, 0, Math.PI * 2); ctx.fill(); }
      else if (q.kind === "leaf") { ctx.rotate(q.a); ctx.fillStyle = `hsla(${q.hue}, 55%, 38%, ${a})`; ctx.beginPath(); ctx.ellipse(0, 0, q.r, q.r * 0.45, 0, 0, Math.PI * 2); ctx.fill(); }
      else { ctx.rotate(q.a); ctx.fillStyle = `rgba(${q.grey}, ${q.grey - 8}, ${q.grey - 18}, ${a})`; ctx.strokeStyle = `rgba(60, 50, 40, ${a})`; ctx.lineWidth = 1.2;
        ctx.beginPath(); ctx.moveTo(-q.r, -q.r * 0.6); ctx.lineTo(q.r * 0.8, -q.r * 0.8); ctx.lineTo(q.r, q.r * 0.4); ctx.lineTo(-q.r * 0.3, q.r); ctx.closePath(); ctx.fill(); ctx.stroke(); }
      ctx.restore();
    },
    // A finished site that is no longer whole (its headpiece out of place): see-through red; it is drawn as it is now.
    mapSiteBroken(ctx, x, y, r) {
      ctx.fillStyle = "rgba(224, 71, 59, 0.45)"; ctx.strokeStyle = "#7a2a1e"; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    },
    // cues (SECTION CUES): what a line points at: its outline glowing, and a ring spreading out from it (u 0..1 through one ring)
    highlight(ctx, pathAt, region, color, u, ring) {
      ctx.save(); ctx.lineJoin = "round"; ctx.strokeStyle = color;
      ctx.globalAlpha = 0.7 + 0.3 * Math.cos(u * 2 * Math.PI); ctx.lineWidth = 8; ctx.shadowColor = color; ctx.shadowBlur = 12; ctx.stroke(pathAt(4));
      ctx.shadowBlur = 0; ctx.globalAlpha = 0.85 * (1 - u);
      if (region) { ctx.lineWidth = 7 + 2 * ring * u; ctx.stroke(pathAt(0)); } else { ctx.lineWidth = 7; ctx.stroke(pathAt(5 + ring * u)); }
      ctx.restore();
    },
    // the rest of the screen darkened while a cue holds attention; `holes` (paths) stay bright
    dim(ctx, w, h, holes) { // holes cut out one by one, so two holes over the same thing never darken it again
      const c = this.dimCanvas || (this.dimCanvas = document.createElement("canvas")), d = c.getContext("2d");
      if (c.width !== ctx.canvas.width || c.height !== ctx.canvas.height) { c.width = ctx.canvas.width; c.height = ctx.canvas.height; }
      d.setTransform(1, 0, 0, 1, 0, 0); d.clearRect(0, 0, c.width, c.height); d.setTransform(ctx.getTransform());
      d.globalCompositeOperation = "source-over"; d.fillStyle = "rgba(0, 0, 0, 0.5)"; d.fillRect(0, 0, w, h);
      d.globalCompositeOperation = "destination-out"; d.fillStyle = "#000"; for (const q of holes) d.fill(q);
      ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.drawImage(c, 0, 0); ctx.restore();
    },
    // a button held down (it acts when let go)
    pressed(ctx, path) { ctx.save(); ctx.fillStyle = "rgba(0, 0, 0, 0.32)"; ctx.fill(path); ctx.restore(); },
    // the see-through pointing hand of the cues: index finger out, three fingers curled, thumb; the fingertip at (x, y)
    ghostHand(ctx, x, y, pressed, alpha) {
      ctx.save(); ctx.globalAlpha = alpha; ctx.translate(x, y);
      if (pressed) { ctx.strokeStyle = "#ffffff"; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(0, 0, 16, 0, Math.PI * 2); ctx.stroke(); }
      ctx.rotate(-0.35); if (pressed) ctx.scale(0.92, 0.92);
      ctx.fillStyle = "#fbe3cf"; ctx.strokeStyle = "#5a3d2b"; ctx.lineWidth = 2.5; ctx.lineJoin = "round";
      const part = (f) => { ctx.beginPath(); f(); ctx.fill(); ctx.stroke(); };
      part(() => ctx.roundRect(6, 28, 14, 30, 7));
      part(() => ctx.roundRect(18, 32, 13, 28, 6.5));
      part(() => ctx.roundRect(29, 37, 12, 24, 6));
      part(() => ctx.roundRect(-12, 42, 54, 42, 16));
      part(() => ctx.ellipse(-14, 62, 8, 18, -0.7, 0, Math.PI * 2));
      part(() => ctx.roundRect(-8, 0, 16, 58, 8));
      ctx.restore();
    },
    // a damaged site on the map: red rings spreading out (t 0..1)
    ringFlash(ctx, x, y, r, t) {
      ctx.save(); ctx.lineWidth = 4;
      for (let k = 0; k < 3; k++) { const u = t * 1.5 - k * 0.25; if (u < 0 || u > 1) continue; ctx.strokeStyle = `rgba(224, 60, 45, ${1 - u})`; ctx.beginPath(); ctx.arc(x, y, r * (1 + u * 1.2), 0, Math.PI * 2); ctx.stroke(); }
      ctx.restore();
    },
  };

  // ---------------------------------------------------------------------
  // SECTION: PIECE DEFINITIONS -- materials, piece shapes/sizes, sidebar buttons
  // ---------------------------------------------------------------------
  // plain colours (textures off), each close to its texture's own colour; marble levels show their stone in marble (owner 15 Nov)
  const PLAIN = { stone: "#89939b", stoneLine: "#4d5962", marble: "#e4dfd4", marbleLine: "#8e887c", wood: "#c9a36b", mudbrick: "#ad7f52", mudbrickLine: "#5b3b20" };
  const TEX_BUTTON = [["silver-sandstone", "stone"], ["wood", "wood"], ["mudbrick", "mudbrick"], ["marble", "marble"]]; // the textures button's little wall: texture, plain colour
  const MATERIALS = {
    wood:  { label: "WOOD",  density: 1.1,  friction: 0.6,  restitution: 0.015 },
    // mudbrick: between wood and stone in weight; crumbles under heavy weight (SECTION BREAKING)
    mudbrick: { label: "MUDBRICK", density: 3.2, friction: 0.84, restitution: 0.0 },
    stone: { label: "STONE", density: 5.0,  friction: 0.72, restitution: 0.0 }, // frictions 20% higher (owner 15 Nov)
  };
  let selectedMaterial = "wood";

  const PIECE_DEFS = {
    block:  { shape: "box", hx: 1.0, hy: 0.5, densityScale: 1.0, skin: "block", half: "block-half" },
    column: { shape: "box", hx: 0.3, hy: 1.2, densityScale: 1.0, skin: "column", half: "column-half" },
    beam:   { shape: "box", hx: 1.6, hy: 0.25, densityScale: 1.0, skin: "beam", half: "beam-half" },
    // plank (new, owner 13 Nov): a long wooden beam, 6 m, three blocks long: two blocks on it spread their weight into three below (Ziggurat)
    plank:  { shape: "box", hx: 3.0, hy: 0.25, densityScale: 1.0, skin: "beam", half: "plank-half" },
    // plank10, plank14 (new, owner 14 Nov): wooden planks as long as the ziggurat row they lie on (10 m on the five-block row,
    // 14 m on the seven-block bottom row), so the rows above press evenly on every block of that row
    plank10: { shape: "box", hx: 5.0, hy: 0.25, densityScale: 1.0, skin: "beam", half: "plank10-half" },
    plank14: { shape: "box", hx: 7.0, hy: 0.25, densityScale: 1.0, skin: "beam", half: "plank14-half" },
    // plank8, plank12 (new): the same for the second and fourth rows, so the owner can try wood on every row but the top
    plank8: { shape: "box", hx: 4.0, hy: 0.25, densityScale: 1.0, skin: "beam", half: "plank8-half" },
    plank12: { shape: "box", hx: 6.0, hy: 0.25, densityScale: 1.0, skin: "beam", half: "plank12-half" },
    "plank8-half": { shape: "box", hx: 2.0, hy: 0.25, densityScale: 1.0, skin: "beam" },
    "plank12-half": { shape: "box", hx: 3.0, hy: 0.25, densityScale: 1.0, skin: "beam" },
    "plank10-half": { shape: "box", hx: 2.5, hy: 0.25, densityScale: 1.0, skin: "beam" },
    "plank14-half": { shape: "box", hx: 3.5, hy: 0.25, densityScale: 1.0, skin: "beam" },
    // big square (new, owner 14 Nov): 2 m x 2 m, two blocks stacked; free play only
    bigsquare: { shape: "box", hx: 1.0, hy: 1.0, densityScale: 1.0, skin: "block" },
    // long plank (new, owner 14 Nov): 9 m; free play only
    longplank: { shape: "box", hx: 4.5, hy: 0.25, densityScale: 1.0, skin: "beam", half: "longplank-half" }, // 9 m (owner 14 Nov, was 12)
    // long block (new, owner 14 Nov): two stone blocks end to end, 4 m; free play only
    longblock: { shape: "box", hx: 2.0, hy: 0.5, densityScale: 1.0, skin: "block" },
    // capital (new, fourth standard size): a flat slab laid on a pillar; an upright block (2 m) plus a capital is one column high
    capital: { shape: "box", hx: 0.8, hy: 0.2, densityScale: 1.0, skin: "beam", half: "capital-half" },
    // abacus (new): a small oblong block, half a capital; two stacked make a column's capital (Karnak)
    abacus: { shape: "box", hx: 0.4, hy: 0.2, densityScale: 1.0, skin: "beam" },
    // square (new, fifth standard size): half a block, for spandrels and staggered joints
    square: { shape: "box", hx: 0.5, hy: 0.5, densityScale: 1.0, skin: "block" },
    // pediment halves (new): right-angled triangles with a short flat tip for the top slab; shapes in src/levels.js
    gableL: { shape: "poly", verts: LEVEL_PIECES.gableL, hx: Math.max(...LEVEL_PIECES.gableL.map((v) => Math.abs(v[0]))), hy: Math.max(...LEVEL_PIECES.gableL.map((v) => Math.abs(v[1]))), densityScale: 1.0, skin: "gable" },
    gableR: { shape: "poly", verts: LEVEL_PIECES.gableR, hx: Math.max(...LEVEL_PIECES.gableR.map((v) => Math.abs(v[0]))), hy: Math.max(...LEVEL_PIECES.gableR.map((v) => Math.abs(v[1]))), densityScale: 1.0, skin: "gable" },
    // triangle (new): right-angled, short sides 1.5 m; fills the corner between an arch and the wall beside it (Lion Gate, Ishtar, Valens)
    tri: { shape: "poly", verts: LEVEL_PIECES.tri, hx: Math.max(...LEVEL_PIECES.tri.map((v) => Math.abs(v[0]))), hy: Math.max(...LEVEL_PIECES.tri.map((v) => Math.abs(v[1]))), densityScale: 1.0, skin: "gable" },
    trib: { shape: "poly", verts: LEVEL_PIECES.trib, hx: Math.max(...LEVEL_PIECES.trib.map((v) => Math.abs(v[0]))), hy: Math.max(...LEVEL_PIECES.trib.map((v) => Math.abs(v[1]))), densityScale: 1.0, skin: "gable" },
    // what a snapped wooden piece breaks into (two halves along its length; they do not snap again)
    "block-half":  { shape: "box", hx: 0.5, hy: 0.5, densityScale: 1.0, skin: "block" },
    "column-half": { shape: "box", hx: 0.3, hy: 0.6, densityScale: 1.0, skin: "column" },
    "beam-half":   { shape: "box", hx: 0.8, hy: 0.25, densityScale: 1.0, skin: "beam" },
    "longplank-half": { shape: "box", hx: 2.25, hy: 0.25, densityScale: 1.0, skin: "beam" },
    "plank-half":  { shape: "box", hx: 1.5, hy: 0.25, densityScale: 1.0, skin: "beam" },
    "capital-half": { shape: "box", hx: 0.4, hy: 0.2, densityScale: 1.0, skin: "beam" },
    drum:   { shape: "circle", r: 0.6, densityScale: 1.0, skin: "drum" },
    // arch stone: narrow end down; about ten make a half circle
    // nine make a half circle (20 degrees each, a keystone in the middle): inner radius 2, outer 3
    // wedge: 9 make a half circle (20 degrees each), faces 2.0 and 3.0 m from the centre: the arch top is exactly 3 m above its springing
    wedge:  { shape: "poly", verts: [[-0.3527, -0.5], [0.3527, -0.5], [0.529, 0.5], [-0.529, 0.5]], hx: 0.529, hy: 0.5, densityScale: 1.0, skin: "wedge" },
    // arch centering (new): the wooden half-round form an arch is built on, flat side down,
    // radius just under the arch's inner radius of 2 m; origin at its centre of mass
    centering: { shape: "poly", verts: Array.from({ length: 11 }, (_, i) => { const t = (Math.PI * i) / 10, R = 2.0; return [R * Math.cos(t), R * Math.sin(t) - (4 * R) / (3 * Math.PI)]; }),
                 hx: 2.0, hy: 1.0, densityScale: 1.0, skin: "centering" },
  };
  // Planck keeps touching shapes apart by its polygon skin; each piece's physical shape is this much
  // smaller on every side than drawn, so pieces sit on each other where they are drawn (measured: 1.4 cm per course)
  const SKIN_GAP = 0.005;
  function insetPoly(verts, d) { // convex polygon, every edge moved in by d
    const n = verts.length, ccw = verts.reduce((a, [x, y], i) => a + x * verts[(i + 1) % n][1] - verts[(i + 1) % n][0] * y, 0) > 0 ? 1 : -1;
    const lines = verts.map(([x0, y0], i) => { const [x1, y1] = verts[(i + 1) % n], L = Math.hypot(x1 - x0, y1 - y0), nx = (-(y1 - y0) / L) * ccw, ny = ((x1 - x0) / L) * ccw;
      return [x0 + nx * d, y0 + ny * d, x1 - x0, y1 - y0]; });
    return lines.map((a, i) => { const b = lines[(i + n - 1) % n], den = b[2] * a[3] - b[3] * a[2];
      if (Math.abs(den) < 1e-12) return [a[0], a[1]];
      const t = ((a[0] - b[0]) * a[3] - (a[1] - b[1]) * a[2]) / den; return [b[0] + t * b[2], b[1] + t * b[3]]; });
  }
  // Level polygon pieces from tools/make-levels.py not defined above (the big triangle beside arches).
  for (const [k, verts] of Object.entries(LEVEL_PIECES)) {
    const hx = Math.max(...verts.map((v) => Math.abs(v[0]))), hy = Math.max(...verts.map((v) => Math.abs(v[1])));
    if (!PIECE_DEFS[k]) PIECE_DEFS[k] = { shape: "poly", verts, hx, hy, densityScale: 1.0, skin: "wedge" };
  }

  // Free play: the shapes each material comes in. Every shape and material the levels use, except the long mudbricks
  // (owner: long mudbricks make no sense), plus the long block. Owner 16 Nov night: the sidebar is a pile like the
  // levels', one of each; a piece taken out is replaced by a new one falling in from above; the wooden planks stand on end
  // side by side, so their lengths compare.
  const SANDBOX_SHAPES = {
    wood: [["square", "block"], ["column", "drum"], ["beam", "plank"], ["plank8", "plank10"], ["centering"]], // owner 16 Nov night: no 14 m, 12 m or 9 m plank
    mudbrick: [["square", "block"], ["abacus", "drum"]],
    stone: [["square", "block"], ["bigsquare"], ["longblock"], ["abacus", "capital"], ["beam"], ["column", "drum"], ["wedge", "tri"], ["trib"], ["gableL", "gableR"]],
  };
  const BUTTONS = [
    { kind: "piece", def: "block", angle: 0, icon: "block" },
    { kind: "piece", def: "column", angle: 0, icon: "column" },
    { kind: "piece", def: "beam", angle: 0, icon: "beam" },
    { kind: "piece", def: "drum", angle: 0, icon: "drum" },
    { kind: "piece", def: "wedge", angle: 0, icon: "wedge" },
    { kind: "broom", icon: "broom" },
    { kind: "home", icon: "home" },
    { kind: "test", icon: "test" }, // levels only
  ];

  // ---------------------------------------------------------------------
  // SECTION: WORLD SETUP -- planck world, ground, boundaries, piece list
  // ---------------------------------------------------------------------
  const WORLD_WIDTH = 16; // metres
  const WORLD_CENTER_X = 20; // middle of the level check grid (0..40 m), so wide levels fit it
  const PICK_MARGIN = 0.12; // metres
  const WALL_THICKNESS = 0.18; // metres
  const WALL_EXTRA_HEIGHT = 30; // metres above the visible area
  let worldWidth = WORLD_WIDTH; // visible width; wider than 16 m when a tall level zooms out
  let viewX0 = 0; // world x at the left edge of the building area (negative when zoomed out, so the level stays centred)

  // The world is made fresh when a level starts, when the quick build starts and when the test starts, so what
  // happens in it depends only on the pieces put into it, never on what was built and taken away before (owner:
  // the same quick build and test failed once and passed once).
  let world = new planck.World({ gravity: planck.Vec2(0, -10) });
  const worldEvents = [];
  function onWorld(ev, fn) { worldEvents.push([ev, fn]); world.on(ev, fn); }
  // Collision groups: a piece just out of the sidebar (ghost) passes through other pieces but not the ground or walls.
  const SOLID_CAT = 2, GHOST_CAT = 4;

  // Kinematic so the earthquake can move it; at rest it behaves as static.
  let groundBody, anchorBody, boundaryBodies = [];
  function makeGround() {
    groundBody = world.createBody({ type: "kinematic", position: planck.Vec2(WORLD_CENTER_X, -2) });
    groundBody.createFixture({
      shape: planck.Box(40, 2),
      friction: 0.96, // owner 15 Nov: all friction 20% higher
      filterCategoryBits: SOLID_CAT,
    });
    anchorBody = world.createBody({ type: "static" });
  }
  makeGround();
  function freshWorld() { // call with no pieces, loads or hands left in the old world
    world = new planck.World({ gravity: planck.Vec2(0, -10) });
    for (const [ev, fn] of worldEvents) world.on(ev, fn);
    makeGround();
    boundaryBodies = [];
    if (scale) rebuildBoundaries();
  }

  // Keep every piece inside the visible building area. The walls extend well
  // above the viewport so tall towers are not capped by an invisible ceiling.
  function rebuildBoundaries() {
    for (const body of boundaryBodies) world.destroyBody(body);
    boundaryBodies = [];
    const visibleWorldHeight = buildingHeightPx / scale;
    const halfHeight = (visibleWorldHeight + WALL_EXTRA_HEIGHT) / 2 + 2;
    const centerY = (visibleWorldHeight + WALL_EXTRA_HEIGHT) / 2;
    for (const x of [viewX0 - WALL_THICKNESS / 2, viewX0 + worldWidth + WALL_THICKNESS / 2]) {
      const wall = world.createBody({ type: "static", position: planck.Vec2(x, centerY) });
      wall.createFixture({
        filterCategoryBits: SOLID_CAT,
        shape: planck.Box(WALL_THICKNESS / 2, halfHeight),
        friction: 1.35,
        restitution: 0,
      });
      boundaryBodies.push(wall);
    }
  }

  /** @type {Array<{id:number, defKey:string, body:any, hx?:number, hy?:number, r?:number}>} */
  const pieces = [];
  let nextPieceId = 1;

  let demo = null; // SECTION CUES: the demo running, if any; pieces made meanwhile are its see-through pieces
  function spawnPiece(defKey, worldX, worldY, angle, materialKey = selectedMaterial) {
    const def = PIECE_DEFS[defKey];
    const material = MATERIALS[materialKey];
    const body = world.createBody({
      type: "dynamic",
      position: planck.Vec2(worldX, worldY),
      angle: angle || 0,
      linearDamping: 0.015,
      angularDamping: 0.08,
    });
    const density = material.density * def.densityScale;
    const fixtureOptions = {
      density,
      friction: material.friction,
      restitution: material.restitution,
    };
    if (def.shape === "poly") {
      body.createFixture({ ...fixtureOptions, shape: planck.Polygon(insetPoly(def.verts, SKIN_GAP).map(([x, y]) => planck.Vec2(x, y))) });
    } else if (def.shape === "box") {
      body.createFixture({ ...fixtureOptions, shape: planck.Box(def.hx - SKIN_GAP, def.hy - SKIN_GAP) });
    } else {
      body.createFixture({ ...fixtureOptions, shape: planck.Circle(def.r - SKIN_GAP) });
    }
    const piece = { id: nextPieceId++, defKey, material: materialKey, body, hx: def.hx, hy: def.hy, r: def.r, verts: def.verts };
    piece.strain = 0; piece.crush = 0; piece.sup = []; piece.loads = []; piece.impacts = []; // SECTION BREAKING
    piece.canSnap = materialKey === "wood" && def.shape === "box" && !!def.half;
    if (demo) piece.demo = true;
    body.piece = piece;
    pieces.push(piece);
    return piece;
  }

  function removePiece(piece) {
    const idx = pieces.indexOf(piece);
    if (idx >= 0) pieces.splice(idx, 1);
    if (piece.grip) {
      dropHand(piece);
    }
    for (let e = piece.body.getContactList(); e; e = e.next) e.other.setAwake(true); // what rested on it feels it go (a sleeping beam would float)
    world.destroyBody(piece.body);
  }

  function clearAllPieces() {
    // Destroy drag joints before destroying their bodies; this also clears
    // pointer ownership cleanly if the broom is used during a multi-touch drag.
    for (const pointerId of Array.from(pointers.keys())) releaseHold(pointerId);
    while (pieces.length) removePiece(pieces[pieces.length - 1]);
    for (const l of loads) world.destroyBody(l.body); // a finished site's load goes with its building
    loads = [];
  }

  // ---------------------------------------------------------------------
  // SECTION: LAYOUT -- canvas, scale, screen<->world, sidebar/button positions
  // ---------------------------------------------------------------------
  const canvas = document.getElementById("c");
  const ctx = canvas.getContext("2d");

  let cssWidth = 0, cssHeight = 0;
  let scale = 1; // pixels per metre
  let buildingWidthPx = 0;
  let buildingHeightPx = 0;
  const GROUND_PX = 24; // the ground strip at the bottom of the building area; its top is y = 0
  let sidebarWidthPx = 0;
  let currentLevel = null; // index into LEVELS; null = free play
  let levelTop = 0, levelWidth = WORLD_WIDTH; // metres of height and width the current level needs on screen

  let mode = "map"; // "map" | "build"
  function hasPile() { return mode === "build"; } // a site or free play: the sidebar is a pile
  function layout() {
    const dpr = window.devicePixelRatio || 1;
    cssWidth = window.innerWidth;
    cssHeight = window.innerHeight;
    canvas.width = Math.round(cssWidth * dpr);
    canvas.height = Math.round(cssHeight * dpr);
    canvas.style.width = cssWidth + "px";
    canvas.style.height = cssHeight + "px";
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    sidebarWidthPx = Math.min(156, Math.max(92, cssWidth * 0.23));
    if (cssWidth - sidebarWidthPx < 160) sidebarWidthPx = Math.max(72, cssWidth * 0.28);
    if (hasPile()) { // the pile bin is PILE_BIN_W metres wide (three blocks and a little); one piece size for every
      // level: the largest at which every level's full pile fits in the bin's height (the sidebar follows from it)
      for (pilePx = 60; pilePx > 8; pilePx *= 0.97) {
        const w = PILE_BIN_W * pilePx + 16, size = Math.min(64, (w - 32) / 3), bin = { w: w - 16, h: cssHeight - size - 24 };
        if (w <= cssWidth * 0.45 && LEVELS.every((L, i) => pileLayout(stockItems(i), bin, pilePx)[2]) && (bin.h / pilePx) * 0.95 >= PILE_REF_HEIGHT) break;
      }
      pilePx *= 1.5; // owner: sidebar and its pieces one and a half times bigger
      sidebarWidthPx = PILE_BIN_W * pilePx + 16;
    }
    buildingWidthPx = cssWidth - sidebarWidthPx;
    buildingHeightPx = cssHeight;
    scale = buildingWidthPx / WORLD_WIDTH;

    const ext = (k) => { const d = PIECE_DEFS[k]; return d.shape === "circle" ? [2 * d.r, 2 * d.r] : [2 * d.hx, 2 * d.hy]; };

  // Music: one loop for the map, another while building.

  // Sliding: a quiet loop per material group, as loud as the fastest sliding piece.

    const bA = contact.getFixtureA().getBody(), bB = contact.getFixtureB().getBody();
    const n = Math.max(...impulse.normalImpulses.slice(0, contact.getManifold().pointCount));
    if (pile && gameNow() < pileQuietUntil) return; // pieces settling into a freshly filled pile

        else puffs.push({ kind, pile, x, y, vx: (Math.random() - 0.5) * 3, vy: 1 + Math.random() * 2, r: 0.04 + Math.random() * 0.05, a: Math.random() * 6, life: 1 });

  // Bending: a load over a gap counts as if spread over that gap (P x gap / 4, so a

  function bendMoment(p, minSpan = 0) {

    for (const [x, P] of p.loads) {

  // Impact on a beam (energy method): an object bringing kinetic energy KE onto a span L
  // between supports raises the bending moment by sqrt(6 * KE * EI / L) wherever it lands,
  // on top of its weight's own moment W*a*b/L; past the last support the arm a replaces L
  // and the weight's moment is W*a. Stiffer or shorter spans take more of the blow.

  const SUPPORT_NY = 0.3; // a contact facing up at least this much carries weight (arch stones included)

  function updateStrain() {

  // Anything that breaks during the test fails it; its place is shown red.
  function noteBroken(p) {
    if (!test || !grid) return;
    const v = planck.Vec2(0, 0);
    for (let f = p.body.getFixtureList(); f; f = f.getNext()) {
      const bb = f.getAABB(0);
      for (let x = Math.floor(bb.lowerBound.x / CELL); x <= Math.floor(bb.upperBound.x / CELL); x++)
        for (let y = Math.max(0, Math.floor(bb.lowerBound.y / CELL)); y <= Math.floor(bb.upperBound.y / CELL); y++) {

        }

  }

    for (let i = 0; i < 26; i++) {
      const lx = (Math.random() * 2 - 1) * hx, ly = (Math.random() * 2 - 1) * hy;
      const x = c.x + lx * ca - ly * sa, y = c.y + lx * sa + ly * ca;
      if (i % 2) puffs.push({ kind: "dust", x, y, vx: (Math.random() - 0.5) * 1.5, vy: Math.random() * 0.6, r: 0.12 + Math.random() * 0.15, life: 1 });
      else puffs.push({ kind: "mudchip", x, y, vx: (Math.random() - 0.5) * 2.5, vy: Math.random() * 1.5, r: 0.05 + Math.random() * 0.07, a: Math.random() * 6, life: 1 });
    }
    playSound("crumble", inBlocks(p.body, p.material)); // by weight (owner 17 Nov)
    shake = Math.max(shake, 4);
    onBreak("crumble", p);
    noteBroken(p);
    removePiece(p);
  }

  function snapWood(p) {

      q.body.setLinearVelocity(planck.Vec2(vx, vy));
      q.body.setAngularVelocity(w + s * 0.6); // the broken middle drops: the halves fold into a V
    }
    for (let i = 0; i < 12; i++) puffs.push({ kind: "splinter", x: c.x, y: c.y, vx: (Math.random() - 0.5) * 3, vy: Math.random() * 2.5, r: 0.12 + Math.random() * 0.1, a: Math.random() * 6, life: 1 });
    playSound("snap", wt); // by weight (owner 17 Nov)
  }

  // ---------------------------------------------------------------------
  // SECTION: PILE -- levels only: the sidebar holds the level's limited pieces as a small physics pile
  // ---------------------------------------------------------------------
  // Pieces keep their real sizes in this separate world; only the drawing is
  // small. Dragging one out gives the real piece; dropping a piece back on
  // the sidebar returns it.
  const pileWorld = new planck.World({ gravity: planck.Vec2(0, -10) });

  pileWorld.on("pre-solve", (contact) => { contact.tbVn = approachSpeed(contact); }); // SECTION FEEL
  pileWorld.on("post-solve", (contact, impulse) => feelContact(contact, impulse, true)); // SECTION FEEL
  let pileScale = 20;      // px per metre in the sidebar
  const PILE_ANG_DAMP = 3; // pile pieces not in the hand
  const PILE_SWING_DAMP = { wood: 0.25, mudbrick: 0.12, stone: 0.04 }; // held near an end in the sidebar it swings freely, so it can be turned upright
  const PILE_MAX_SPEED = 4, PILE_MAX_UP = 2; // m/s, pile pieces not in the hand
  let pileBinRect = null;  // px rect of the bin
  function freeItems() { // free play's pile: one of each shape in each material
    const out = [];

    return out;
  }

    return out;
  }
  function pileItems() { return pileBodies().map((b) => b.pileItem); }

  }
  function createPileBody(item, x, y) {

    const body = pileWorld.createBody({ type: "dynamic", position: planck.Vec2(x, y), angularDamping: PILE_ANG_DAMP, linearDamping: 0.3 });
    const fo = { density: mat.density * def.densityScale, friction: 0.7, restitution: 0 };
    if (def.shape === "poly") body.createFixture({ ...fo, shape: planck.Polygon(def.verts.map(([vx, vy]) => planck.Vec2(vx, vy))) });
    else if (def.shape === "box") body.createFixture({ ...fo, shape: planck.Box(def.hx, def.hy) });
    else body.createFixture({ ...fo, shape: planck.Circle(def.r) });

  }
  function fillPile(items) {
    for (const [id, h] of Array.from(pointers)) if (h.pileBody) pointers.delete(id);
    for (let b = pileWorld.getBodyList(); b; ) { const nb = b.getNext(); pileWorld.destroyBody(b); b = nb; }
    const r = pileBinRect;
    if (!r) return;
    // the same piece size in every level's pile (pilePx); only a screen too narrow for it shrinks it
    let places;
    [pileScale, places] = pileLayout(items, r, pilePx);
    const W = r.w / pileScale, H = r.h / pileScale;
    const walls = (pileWalls = pileWorld.createBody({ type: "static" }));
    pileQuietUntil = gameNow() + 1500;
    walls.createFixture({ shape: planck.Box(W, 0.5, planck.Vec2(W / 2, -0.5), 0), friction: 0.8 });
    walls.createFixture({ shape: planck.Box(0.5, H * 3, planck.Vec2(-0.5, H * 1.5), 0), friction: 0.3 });
    walls.createFixture({ shape: planck.Box(0.5, H * 3, planck.Vec2(W + 0.5, H * 1.5), 0), friction: 0.3 });

    for (const [it, x, y, a] of places) { const b = createPileBody(it, x, y); if (a) b.setTransform(b.getPosition(), a); }

  }
  let pilePx = 34; // px per metre in the sidebar, set by layout()
  const PILE_BIN_W = 6.4; // m: three blocks side by side and a little room
  // Where each piece goes in the bin: [scale, [[item, x, y, angle]...]]. scale null: as big as fits.
  function pileLayout(items, r, fixedScale) {
    // Orderly: by material (sturdiest lowest: stone, wood, mudbrick), then tallest first and like
    // with like, packed in rows; as big as the bin allows with every row inside it.
    const STURDY = { stone: 0, wood: 1, mudbrick: 2 };
    const lying = (it) => it.defKey === "column" || it.stand || (PIECE_DEFS[it.defKey].shape === "box" && 2 * PIECE_DEFS[it.defKey].hx > PILE_BIN_W - 0.3); // columns lie down in the pile (held near an end they swing upright); pieces longer than the bin is wide stand on their end (owner, 14 Nov)

    const ext = (d) => { const xs = d.verts.map((v) => v[0]), ys = d.verts.map((v) => v[1]); return [Math.min(...xs), Math.max(...xs), Math.min(...ys), Math.max(...ys)]; };

    const size = (it) => { const d = PIECE_DEFS[it.defKey]; if (own(it)) { const [a, b, c, e] = ext(d); return [b - a, e - c]; }

    // down and nest into a flat band; the curved forms and the pediment halves go on top, where nothing rests on them.
    const curved = (it) => (it.defKey === "centering" || /^gable/.test(it.defKey) ? 1 : 0); // sloped or round tops
    items = items.slice().sort((a, b) => curved(a) - curved(b) || STURDY[a.material] - STURDY[b.material] || size(b)[1] - size(a)[1] || size(b)[0] - size(a)[0] || (a.defKey < b.defKey ? -1 : a.defKey > b.defKey ? 1 : 0));

        const pairW = it.defKey === "wedge" ? 1.95 : /^tri/.test(it.defKey) ? w + 0.03 : w; // a nested pair's width

        if (own(it)) { const [a0, , c0] = ext(PIECE_DEFS[it.defKey]); px = x - a0; py = y - c0; }
        if (it.defKey === "wedge") { px = x + 0.525 + (second ? 0.9 : 0); a = second ? Math.PI : 0; } // narrow end down, then wide end down beside it
        if (/^tri/.test(it.defKey)) { const c = PIECE_DEFS[it.defKey].verts; // two make a square: right angle bottom left, then top right
          const lx = -Math.min(...c.map((v) => v[0])), ly = -Math.min(...c.map((v) => v[1]));
          px = x + (second ? w - lx + 0.03 : lx); py = y + (second ? h - ly + 0.03 : ly); a = second ? Math.PI : 0; }

    const p = planck.Vec2((px - r.x) / pileScale, (r.y + r.h - py) / pileScale);

  }

  // --- quick build (parent override): with Ctrl held a button appears on the pile; it tidies

  let auto = null; // { queue, cur, wait }
  function autoBuildButton() {

    const r = pileBinRect, size = Math.min(48, r.w * 0.35);

  function placeAuto(c, quiet) { // quiet: already standing (a demo's ready pieces), no landing sound

    b.setTransform(planck.Vec2(c.tx, c.ty), c.ta);
    b.setDynamic();
    for (let f = b.getFixtureList(); f; f = f.getNext()) f.setSensor(false);
    b.setAwake(true);

      const o = f.getBody();
      if (o !== b && o.piece && !o.piece.ghost && !o.piece.auto) { under = o.piece.material; return false; }
      return true;
    });

  }
  function cancelAuto() {
    if (auto && auto.cur && pieces.includes(auto.cur.piece)) placeAuto(auto.cur);
    auto = null;
  }
  function autoTick(dt) {
    if (!auto) return;
    const c = auto.cur;
    if (c && !pieces.includes(c.piece)) { auto.cur = null; return; }
    if (c) {
      const b = c.piece.body, q = b.getPosition(), dx = c.tx - q.x, dy = c.ty - q.y, d = Math.hypot(dx, dy);
      if (d <= AUTO_SPEED * dt) { placeAuto(c); auto.cur = null; auto.wait = AUTO_PAUSE; return; }
      b.setLinearVelocity(planck.Vec2((dx / d) * AUTO_SPEED, (dy / d) * AUTO_SPEED));
      b.setAngularVelocity((c.ta - b.getAngle()) / Math.max(dt, d / AUTO_SPEED));

    }

      const sup = supportPieces();

    } else if (test.phase === "fail") {

    }
  }

  // Wind from the left (dir 1) or right (dir -1): each 0.1 m band of height pushes only

  function applyWind(P, dir) {
    const xa = dir > 0 ? viewX0 + 0.02 : viewX0 + worldWidth - 0.02, xb = dir > 0 ? viewX0 + worldWidth - 0.02 : viewX0 + 0.02;
    for (let y = 0.05; y < levelTop; y += 0.1) {
      let hit = null, hx = 0, hy = 0;
      world.rayCast(planck.Vec2(xa, y), planck.Vec2(xb, y), (f, pt, nrm, frac) => {
        const b = f.getBody();
        if (!b.piece && !b.isLoad) return -1;
        hit = b; hx = pt.x; hy = pt.y;
        return frac;
      });
      if (hit) hit.applyForce(planck.Vec2(dir * P * 0.1, 0), planck.Vec2(hx, hy), true);
    }
  }

  function spawnLoads() {
    loads = grid.load.map((ring, k) => {
      const [cx, cy] = ringCentre(ring);
      const verts = ring.map(([x, y]) => [x - cx, y - cy]);
      // starts just above the top of the screen and is lowered all the way
      const top = screenToWorld(0, 0).y, low = Math.min(...verts.map((v) => v[1]));
      const body = world.createBody({ type: "kinematic", position: planck.Vec2(cx, Math.max(cy + LOAD_DROP, top - low + 0.1)) });
      body.createFixture({ shape: planck.Polygon(verts.map(([x, y]) => planck.Vec2(x, y))), density: loadDensity(currentLevel, k, verts), friction: 0.72, restitution: 0 });
      body.isLoad = true;

    });
  }

    { key: "ziggurat",  x: 1960, y: 900  }, // Ur, c. 2100 BC

  const waterImg = new Image(); waterImg.src = "art/water.png"; // owner's water (royalty free), frames one under another
  let mapLand = null; // the picture with its water cut out, at the current screen size
  function mapLandCanvas(v) {

  const boatImg = new Image(); boatImg.src = "art/boat-owner.png"; // owner's picture, white background cut out

  function mapView() {

    let x0 = Infinity, x1 = -Infinity, y0 = Infinity, y1 = -Infinity;
    for (const s of SITES) { x0 = Math.min(x0, s.x); x1 = Math.max(x1, s.x); y0 = Math.min(y0, s.y); y1 = Math.max(y1, s.y); }

    const ox = fit((x0 + x1) / 2, cssWidth, MAP_W), oy = fit((y0 - rImg + y1 + rImg) / 2, cssHeight, MAP_H);

  }
  // Land (src/map-routes.js MAP_LAND): finished buildings and travellers only ever stand where this is true.
  const LAND = (() => {
    const g = new Uint8Array(MAP_LAND.w * Math.ceil(MAP_W / MAP_LAND.s) * Math.ceil(MAP_H / MAP_LAND.s));
    let i = 0, on = 0;
    for (const n of MAP_LAND.runs.split(",")) { const m = +n; if (on) g.fill(1, i, i + m); i += m; on ^= 1; }
    return g;
  })();
  function isLand(x, y) {
    const c = Math.floor(x / MAP_LAND.s), r = Math.floor(y / MAP_LAND.s);
    return x >= 0 && y >= 0 && c < MAP_LAND.w && !!LAND[r * MAP_LAND.w + c];
  }
  // Screen offsets nearest first, for searching the closest good place.
  const NEAR = []; for (let dy = -700; dy <= 700; dy += 5) for (let dx = -700; dx <= 700; dx += 5) if (dx * dx + dy * dy <= 490000) NEAR.push([dx, dy]);
  NEAR.sort((a, b) => a[0] * a[0] + a[1] * a[1] - b[0] * b[0] - b[1] * b[1]);
  // Connected pieces of land (mainland, each island), so a site stays on its own coast and never moves onto an island.
  let LANDMASS = null;
  function massAt(x, y) {
    const w = MAP_LAND.w, h = LAND.length / w;
    if (!LANDMASS) {

      for (let i = 0; i < LAND.length; i++) if (LAND[i] && !LANDMASS[i]) {
        LANDMASS[i] = ++n; st.push(i);
        while (st.length) { const c = st.pop(), cx = c % w; for (const d of [c - w, c + w, cx > 0 ? c - 1 : -1, cx < w - 1 ? c + 1 : -1]) if (d >= 0 && d < LAND.length && LAND[d] && !LANDMASS[d]) { LANDMASS[d] = n; st.push(d); } }
      }
    }

  function siteMass(s) { for (const [dx, dy] of NEAR) { const m = massAt(s.x + dx, s.y + dy); if (m) return m; } return 0; }

  function sitePlaces(v) {

    const shore = (s) => { for (const [dx, dy] of NEAR) if (!isLand(s.x + dx, s.y + dy)) return dx * dx + dy * dy; return Infinity; };

  }
  // Ten boats, each sailing its fixed ports back and forth (src/map-routes.js: legs keep to open water).
  const BOAT_SPEED = 20, BOAT_REST = 3, BOAT_SIZE = 56, BOAT_BACK = 2; // map pixels per second, seconds in port, map pixels wide; how quickly a pushed boat returns to its route (1/s)

      drawCues();
      if (settingsOpen) { drawSettings(); drawPressed(); } // the settings box lies above everything, cues included
      requestAnimationFrame(frame);
      return;
    }
    if (!cueFrozen()) { // a blocking line freezes the game (SECTION CUES)
      const fast = test && test.fast && test.phase !== "fail" && test.phase !== "pass" ? TEST_FAST : 1;
      stepPhysics(dt * fast, MAX_STEPS * fast);
      cleanupOutOfBounds();
      updateCheck(dt);
      updateFeel(dt);
    }
    ctx.save();
    if (shake > 0) ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
    render();
    drawFeel();
    ctx.restore();
    drawPressed();
    drawCues();
    drawIntro();
    requestAnimationFrame(frame);
  }
  // Try sound right away (browsers may hold it until the first press or key; it then starts).
  startAudio();
  for (const ev of ["pointerdown", "touchstart", "mousedown", "keydown"]) window.addEventListener(ev, startAudio, { capture: true });
  // Load screen (owner 17 Nov): the game's title picture for two seconds, then it fades into the map and the game starts.
  const LOAD_SCREEN_MS = 2000; // the harness sets 0
  if (LOAD_SCREEN_MS > 0) {
    const ld = document.createElement("div");
    ld.style.cssText = "position:fixed;inset:0;z-index:50;background:#000 center/cover no-repeat;transition:opacity .5s;touch-action:none";
    ld.style.backgroundImage = "url(" + "art/loading.jpg" + ")";
    document.body.appendChild(ld);
    setTimeout(() => { mapStart(); requestAnimationFrame(frame); ld.style.opacity = "0"; setTimeout(() => ld.remove(), 600); }, LOAD_SCREEN_MS);
  } else { mapStart(); requestAnimationFrame(frame); }
})();
</script>
</body>
</html>
