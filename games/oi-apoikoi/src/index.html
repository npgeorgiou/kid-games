<script>
// Οι Άποικοι: a prototype of the rules in design.md, in the new look (design.md section 3): a sea board in isometric view, land pictures, material pictures.
// The model, in plain words:
// 1. A round: 4 tiles are dealt one by one from the pile; players pick in turn (the token holder first, else the kid) and the picker takes the tile.
//    A tile you can't place is greyed for you; with nothing to pick your turn passes and the other plays again.
// 2. A tile fits on two free squares with at least one matching edge with your own land. Each connection (a matching edge, with any land) gives a jar and lights
//    the connected land of its colour, both players'; each lit square gives one material; JAR_GOODS (5) of a colour make a jar at once. Materials carry over between rounds.
// 3. Jars hold nothing, coins or a bonus, in the mix JAR_MIX. The game ends when no tile left can be placed by either player; the taller pile of coins wins.
// The tile you win stays where it is until it snaps: tap it to turn it, drag it and leave it anywhere, as often as you like.
// The PC plays through the same taps and drags as the kid, with a hand you can see (Fluent Emoji hands, MIT, src/hands/).

// SECTION: SETUP -- colours, the board, the random source, speeds, test switches
const LANDS = ['wheat', 'pomegranate', 'vineyard', 'forest', 'mountain', 'town'], MATERIALS = ['grain', 'pomegranate', 'grapes', 'timber', 'ruby', 'statue'];  // the six lands and their materials (owner 25 Nov, design 3), most common first (in design.md's order: built for now)
const COLOUR_IDS = LANDS.map((c, k) => k), noGoods = () => LANDS.map(() => 0);
const HALVES = [10, 10, 9, 9, 9, 9];  // the 56 halves of the 28 tiles, per colour (owner 25 Nov)
const BORDER = ['#22a33a', '#d42a2a'], TINT = ['#eef8e6', '#fbebe8'];  // the kid's land green, the PC's red; their areas' light tints
const JAR_MIX = { empty: 10, coins: 45, coins2: 10, tile: 4, slot: 5, first: 8, jar: 8, set: 10 };  // what jars hold, per 100 jars (owner 25 Nov)
const JAR_GOODS = 5;  // this many goods of one colour make a jar at once (owner 24 Nov)
const COINS_PER_ROW = 8, GOOD_SIZE = 0.9;  // coins in a row at most; a material's and a coin's radius, in half square heights: 1.5 times their old size (owner 25 Nov, design 3)
const COLS = 16, ROWS = 16, STARTS = [[4, 10, 0], [10, 4, 1]];  // a square board of sea (owner 25 Nov, design 3); each start tile at the centre of its half of the diamond, the PC's the kid's mirror image
const DIRS = [[1, 0], [0, 1], [-1, 0], [0, -1]];  // where a tile's second half is, by turn
const params = new URLSearchParams(location.search);
let fast = params.has('fast');  // tests: the PC moves without waiting, and nothing travels: it is where it goes at once
const HAND_SPEED = 450;  // px per second: slow enough to follow
const STAGGER = 120, GOOD_FLY = 450;  // things that go one after another leave STAGGER apart; a good flies GOOD_FLY
const RISE_MS = 500, SHOW_MS = 900, GLIDE_MS = 300, REWARD_MS = 550;  // a jar opened: what it held rises out of it, shows, and its reward flies to its place; the other jars close up
const DEAL_MS = 260, DROP_MS = 600, INTO_MS = 450, SPECK_MS = 700;  // a market tile dealt from the pile; a jar dropping from the top; each good flying into it; a broken jar's specks fading
const DUSK_MS = 1600, DAWN_MS = 900;  // evening falling at a round's end; morning light sweeping over at a round's start
const GLOW_MS = 1800;  // a connection's edge glows GLOW_MS
let rnd = Math.random;
function seeded(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
// Time passes only for the game that asked: when a new game has started, an old game's pause or hand move never ends,
// so whatever the old game was doing (a jar, a move, a turn) stops there and never touches the new game.
const pause = ms => { const my = G; return fast ? Promise.resolve() : new Promise(r => setTimeout(() => { if (G === my) r(); }, ms)); };

// SECTION: SOUNDS -- one soft family of built-in sounds, one per thing that happens (owner 24 Nov), until his own files come
// Made like real objects (the standard Web Audio recipes): a knock is a short tone that drops in pitch, like wood; a clink is a bell-like
// pair of partials, like metal; a break is a burst of filtered noise with a few shards, like clay; a chime is soft sine notes; a whoosh is noise swept upward.
const SOUNDS = {  // kind and its notes (Hz)
  good: ['knock', [640]], board: ['knock', [180]], pick: ['knock', [520]], deal: ['knock', [520]], snap: ['knock', [300, 220]], stop: ['knock', [360]], clamp: ['knock', [250]], pass: ['chime', [392, 294]],
  jar: ['break', []], coin: ['clink', [1320, 1760]], made: ['chime', [392, 494, 587]], win: ['chime', [523, 659, 784, 1047]],
  dawn: ['chime', [392, 523, 659]], token: ['chime', [523, 784]], into: ['knock', [460]], edge: ['chime', [784]], turn: ['chime', [587, 784]], roundend: ['chime', [784, 659, 523, 392]], spin: ['whoosh', []], roll: ['knock', [700]],
};
let audio = null, heard = [];  // heard: every sound played in this game, in order (the flows read it)
function noise(len) { const b = audio.createBuffer(1, audio.sampleRate * len, audio.sampleRate), d = b.getChannelData(0); for (let k = 0; k < d.length; k++) d[k] = Math.random() * 2 - 1; const n = audio.createBufferSource(); n.buffer = b; return n; }
function env(t, peak, len, attack = 0.004) { const g = audio.createGain(); g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(peak, t + attack); g.gain.exponentialRampToValueAtTime(0.0001, t + len); g.connect(audio.destination); return g; }
function tone(f, t, len, peak, type = 'sine', drop = 1) { const o = audio.createOscillator(); o.type = type; o.frequency.setValueAtTime(f, t); if (drop !== 1) o.frequency.exponentialRampToValueAtTime(f * drop, t + len); o.connect(env(t, peak, len)); o.start(t); o.stop(t + len); }
const MAKE = {
  knock: (ns, t, times) => times ? times.forEach(d => tone(ns[0], t + d, 0.04, 0.12, 'triangle', 0.6))  // a small click at each of the given times (a wheel's pictures passing)
    : ns.forEach((f, k) => tone(f, t + k * 0.07, 0.12, 0.3, 'triangle', 0.55)),
  clink: (ns, t) => ns.forEach((f, k) => { tone(f, t + k * 0.06, 0.3, 0.1); tone(f * 2.76, t + k * 0.06, 0.15, 0.04); }),
  chime: (ns, t, times) => (times || ns.map((f, k) => k * 0.09)).forEach((d, k) => tone(ns[k % ns.length], t + d, 0.45, 0.12)),
  break: (ns, t) => {
    const n = noise(0.4), bp = audio.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 1500; bp.Q.value = 0.7; n.connect(bp).connect(env(t, 0.45, 0.35, 0.002)); n.start(t);
    for (let k = 0; k < 4; k++) tone(1400 + Math.random() * 1400, t + 0.03 + Math.random() * 0.18, 0.06, 0.12, 'triangle', 0.7);  // shards
  },
  whoosh: (ns, t) => { const n = noise(0.35), bp = audio.createBiquadFilter(); bp.type = 'bandpass'; bp.Q.value = 1.2; bp.frequency.setValueAtTime(400, t); bp.frequency.exponentialRampToValueAtTime(1600, t + 0.3); n.connect(bp).connect(env(t, 0.2, 0.32, 0.06)); n.start(t); },
};
function sound(name, times) {
  heard.push(name); if (fast) return;  // at test speed everything happens at once: sounds are only noted, not played
  try { audio = audio || new AudioContext(); if (audio.state === 'suspended') audio.resume(); const [kind, ns] = SOUNDS[name]; MAKE[kind](ns, audio.currentTime, times); }
  catch (e) { /* no sound on this machine: the game goes on */ }
}

// SECTION: MODEL -- the shared board, tiles, matches, goods and sets
let G = null, tileNo = 1;
function newPlayer(human) { return { human, goods: noGoods(), coming: noGoods(), coins: 0, jarList: [], reserved: new Set(), get jars() { return this.jarList.length; }, opened: {}, got: 0, passes: 0 }; }  // jarList: each waiting jar {slot, fresh, parked}; reserved: places of jars on their way; opened: what his jars held, by kind
const key = (x, y) => x + ',' + y;
function halves(x, y, r) { const d = DIRS[r]; return [[x, y], [x + d[0], y + d[1]]]; }
const cellMark = (x, y, c, o) => Math.imul((((x * 31 + y) * 7 + c) * 2 + o) + 1, 2654435761) ^ (x * 0x9E3779B1 + y);  // a number per square, colour and owner
function mark(t) { halves(t.x, t.y, t.r).forEach(([a, b], h) => { G.board ^= cellMark(a, b, t.cs[h], t.o); }); }  // the board's mark: the same board always has the same mark (lifting a tile and putting it back restores it)
function put(t) { mark(t); G.tiles.set(t.id, t); halves(t.x, t.y, t.r).forEach(([a, b], h) => G.cells.set(key(a, b), { x: a, y: b, c: t.cs[h], o: t.o, t: t.id })); }
function lift(t) { mark(t); halves(t.x, t.y, t.r).forEach(([a, b]) => G.cells.delete(key(a, b))); G.tiles.delete(t.id); }
const free = (x, y) => x >= 0 && y >= 0 && x < COLS && y < ROWS && !G.cells.has(key(x, y));
function matchEdges(cs, x, y, r, owner) {  // the edges where a half meets the same colour (owner: only that player's land): the half's square, the side and the colour
  const out = [];
  halves(x, y, r).forEach(([hx, hy], i) => DIRS.forEach((d, side) => { const s = G.cells.get(key(hx + d[0], hy + d[1])); if (s && s.c === cs[i] && (owner == null || s.o === owner)) out.push({ x: hx, y: hy, d: side, c: cs[i] }); }));
  return out;
}
const matchesAt = (cs, x, y, r, owner) => matchEdges(cs, x, y, r, owner).length;
const BLANK_TILE = 'blank';  // a tile seen before its colours are shown
const spotMemo = new Map();  // the places for a tile only change when the board does: worked out once each
function spots(cs, r, i) {  // where player i can place a tile: two free squares next to his land, with at least one matching edge with it; m = the goods it gives
  const mk = G.board + '|' + cs + '|' + r + '|' + i;
  if (spotMemo.has(mk)) return spotMemo.get(mk);
  if (spotMemo.size > 5000) spotMemo.clear();
  const out = [], seen = new Set(), d = DIRS[r];
  for (const c of G.cells.values()) if (c.o === i) for (const [dx, dy] of DIRS) {  // only places with a half next to his land can match it
    const nx = c.x + dx, ny = c.y + dy;
    for (const [x, y] of [[nx, ny], [nx - d[0], ny - d[1]]]) {
      const k = key(x, y); if (seen.has(k)) continue; seen.add(k);
      if (!halves(x, y, r).every(([a, b]) => free(a, b))) continue;
      if (matchesAt(cs, x, y, r, i)) out.push({ x, y, r, m: matchesAt(cs, x, y, r), cs });
    }
  }
  out.sort((a, b) => a.y - b.y || a.x - b.x); spotMemo.set(mk, out); return out;
}
// What a move is worth to the PC (owner: the best expected result for this turn): 1. the jars it makes now: one per connection, and one per 5 materials
// of a colour, counting the land it lights onto what he has; 2. between moves making as many jars, the one lighting more squares (more materials toward the next jars).
function moveWorth(cs, sp, i) {
  const edges = matchEdges(cs, sp.x, sp.y, sp.r), t = { id: 'trial', cs, x: sp.x, y: sp.y, r: sp.r, o: i }, p = G.players[i];
  put(t); const lit = litLand(edges); lift(t);
  const g = p.goods.map((n, c) => n + p.coming[c]); lit.forEach(([c]) => g[c]++);
  return { jars: edges.length + g.reduce((a, n) => a + Math.floor(n / JAR_GOODS), 0), lit: lit.length };
}
const better = (a, b) => !b || a.jars > b.jars || (a.jars === b.jars && a.lit > b.lit);
function bestPlace(cs, i) { let best = null, bw = null; for (let r = 0; r < 4; r++) for (const sp of spots(cs, r, i)) { const w = moveWorth(cs, sp, i); if (better(w, bw)) { best = sp; bw = w; } } return best && { ...best, worth: bw }; }
const fits = (cs, i) => !!cs && [0, 1, 2, 3].some(r => spots(cs, r, i).length > 0);
function freeTile(i) { for (let k = 0; k < 40; k++) { const t = [0, 1].map(() => Math.floor(rnd() * LANDS.length)); if (fits(t, i)) return t; } return null; }  // a jar's free tile: random colours, one that fits his land (owner 25 Nov)
function makeBag() {  // the halves shuffled into tiles; of the first round's 4, 2 meet a start colour (one for each player, owner 24 Nov), the other 2 come as shuffled, in random places
  const hs = HALVES.flatMap((n, c) => Array(n).fill(c)), shuffle = a => { for (let k = a.length - 1; k > 0; k--) { const j = Math.floor(rnd() * (k + 1)); [a[k], a[j]] = [a[j], a[k]]; } return a; };
  shuffle(hs); const tiles = []; for (let k = 0; k < hs.length; k += 2) tiles.push([hs[k], hs[k + 1]]);
  const sure = [], rest = [];
  for (const t of tiles) (sure.length < 2 && (t[0] < 2 || t[1] < 2) ? sure : rest).push(t);
  return shuffle(sure.concat(rest.splice(0, 2))).concat(rest);
}

// SECTION: TURNS -- the game waits for a tap or a drag; the PC makes the same taps and drags with its hand
let wait = null, press = null;
function ask(kind, who, extra) {
  if (G.players[who].human) handHome();
  return new Promise(res => { wait = { kind, who, res, r: 0, ...extra }; });
}
function answer(v) { const w = wait; wait = null; if (!press || !press.taking) press = null; w.res(v); }  // a press that takes a tile lives on as its drag
async function choose(kind, who, extra, pcMoves) {  // a human answers by tapping; the PC's hand makes its moves on the same screen
  const my = G, chosen = ask(kind, who, extra);
  if (!G.players[who].human) { await pause(500); if (G === my) await pcMoves(); }
  return chosen;
}
function handTo(x, y, ms) {  // the hand glides to a point (eased), slow enough to follow
  const h = G.hand, d = Math.hypot(x - h.x, y - h.y);
  if (fast || d < 1) { h.x = x; h.y = y; return Promise.resolve(); }
  const t0 = performance.now(), x0 = h.x, y0 = h.y, T = ms || Math.max(350, d / HAND_SPEED * 1000);
  return new Promise(res => {
    const my = G, step = () => { if (G !== my) return; const k = Math.min(1, (performance.now() - t0) / T), e = k < 0.5 ? 2 * k * k : 1 - 2 * (1 - k) * (1 - k); h.x = x0 + (x - x0) * e; h.y = y0 + (y - y0) * e; k < 1 ? requestAnimationFrame(step) : res(); };
    requestAnimationFrame(step);
  });
}
function handHome() { G.hand.g = 'point'; const p = homeSpot(); if (G.hand.x !== p[0] || G.hand.y !== p[1]) handTo(p[0], p[1]); }
async function handTap(x, y) { G.hand.g = 'point'; await handTo(x, y); G.hand.down = true; await pause(220); G.hand.down = false; }
async function pcTap(id) {  // the hand goes to the button, presses it, and the game takes it like a tap
  const my = G; render(); const b = buttons.find(c => c.id === id); if (!b) return;
  await handTap(b.x + b.w / 2, b.y + b.h / 2);
  if (G !== my) return;  // a new game started meanwhile: this move belonged to the old one
  b.fn(); await pause(250);
}
// A carried tile tilts toward where it moves (the standard "card sway" of digital card games, as in Hearthstone):
// 1. each move sets the tilt from how fast the tile goes sideways (up to TILT degrees); 2. the tilt fades out once the tile stops moving.
const TILT = 12, TILT_FADE = 120;  // degrees at most; ms for the tilt to fade to about a third
function carry(w, pos) { const now = performance.now(), v = (pos[0] - w.pos[0]) / Math.max(8, now - (w.moved || 0)); w.tilt = Math.max(-TILT, Math.min(TILT, v * 6)); w.moved = now; w.pos = pos; }
function tiltNow(w) { return w.tilt ? w.tilt * Math.exp(-(performance.now() - w.moved) / TILT_FADE) : 0; }
async function pcPlace(sp) {  // tap the tile where it lies to turn it, then grab it, drag it to its place and let go
  const my = G, w = wait, live = () => G === my && wait === w;  // the move belongs to this game and this tile; a new game ends it
  while (live() && w.r !== sp.r) { await handTap(w.pos[0], w.pos[1]); if (live()) w.r = (w.r + 1) % 4; await pause(350); }
  if (!live()) return;
  await handTo(w.pos[0], w.pos[1]); my.hand.g = 'grab'; await pause(250);
  const [gx, gy] = tileCentre(sp.x, sp.y, sp.r), h = my.hand;
  my.dragging = true; const follow = handTo(gx, gy, fast ? 0 : 1300);
  const track = () => { if (live() && my.dragging) { carry(w, [h.x, h.y]); requestAnimationFrame(track); } };
  if (!fast) requestAnimationFrame(track); await follow;
  my.dragging = false; if (!live()) return;
  w.pos = [gx, gy]; await pause(250);
  if (!live()) return;
  my.hand.g = 'open'; drop(); await pause(400); my.hand.g = 'point';
}
function drop() {  // a tile left near a place it fits snaps in; left on its own market place it goes back there; anywhere else it stays where it was left
  const s = snapSpot(), h = wait.home, { ds } = L();
  if (s) answer(s); else if (h && Math.abs(wait.pos[0] - h[0]) < ds && Math.abs(wait.pos[1] - h[1]) < ds * 0.75) answer('back');
}

// SECTION: MOTION -- things travelling on curves from where they are to where they go
// The standard tween (Disney's arcs and slow in, slow out; Material's shared element: one object, one journey):
// 1. A flight is one object leaving its place and arriving at its new one, eased in and out, lifted on an arc; it lands when its time is up.
// 2. While it flies it is drawn only as the flight: its new place counts it when it lands.
// 3. At test speed (fast) nothing travels: a flight lands at once.
let flights = [];
const easeInOut = u => u < 0.5 ? 2 * u * u : 1 - 2 * (1 - u) * (1 - u);
function fly(look, from, to, ms, o = {}) {
  const my = G, f = { look, from, to, t0: performance.now(), ms, arc: o.arc ?? 70, z0: o.z0 ?? 1, z1: o.z1 ?? 1 };
  if (!fast) flights.push(f);
  return pause(ms).then(() => { if (G === my) flights = flights.filter(g => g !== f); });
}
let specks = [];
function shatter(at, col, size) {  // a thing breaks where it is: its specks fly out and fade (loss, a jar breaking)
  if (fast) return;
  const t0 = performance.now(); for (let k = 0; k < 9; k++) { const a = rnd2() * 7, v = 60 + rnd2() * 120; specks.push({ x: at[0], y: at[1], vx: Math.cos(a) * v, vy: Math.sin(a) * v - 80, col, size: size * (0.3 + rnd2() * 0.3), t0 }); }
}
const rnd2 = Math.random;  // how specks scatter is looks only: it never touches the game's own random source
const PUFF_MS = 320;  // a tap's dust: quick, it happens often
function puff(at) { const t0 = performance.now(); for (let k = 0; k < 8; k++) { const a = k * Math.PI / 4 + rnd2() * 0.4, v = 70 + rnd2() * 40; specks.push({ x: at[0], y: at[1], vx: Math.cos(a) * v, vy: Math.sin(a) * v - 40, col: '#c9b48a', size: 4 + rnd2() * 2, t0, ms: PUFF_MS }); } }  // a tap on the board raises a ring of dust
function flightAt(f, now) { const u = Math.min(1, (now - f.t0) / f.ms), e = easeInOut(u); return [f.from[0] + (f.to[0] - f.from[0]) * e, f.from[1] + (f.to[1] - f.from[1]) * e - Math.sin(Math.PI * u) * f.arc, f.z0 + (f.z1 - f.z0) * e]; }
async function goodFrom(i, c, from, noise = 'good') {  // one good leaves where it is made and flies to its place in player i's stockpile, with a sound
  const p = G.players[i], my = G, to = slotPos(i, c, p.goods[c] + p.coming[c]); p.coming[c]++;
  sound(noise); await fly({ k: 'good', c, o: i }, from, to, GOOD_FLY); if (G !== my) return;
  p.coming[c]--; p.goods[c]++;
}
// Goods coming in (the one way goods arrive, owner 25 Nov): 1. they leave gap apart, each colour in its own line, so a colour never waits for another;
// 2. a good that fills its row starts its jar at once, dropping while it flies; the next good of that colour leaves only when the row's goods have left for the jar,
// so a row never needs more than JAR_GOODS places.
async function gain(i, list, gap) {  // list: [colour, from, sound] per good
  const p = G.players[i], my = G, line = {}, going = [];
  await Promise.all(list.map(([c, from, noise], k) => (line[c] = Promise.all([line[c], pause(k * gap)]).then(async () => {
    if (G !== my) return;
    const fills = p.goods[c] + p.coming[c] + 1 >= JAR_GOODS, f = goodFrom(i, c, from, noise); going.push(f);
    if (fills) { going.push(...await makeJar(i, c, f)); await pause(JAR_GOODS * STAGGER); }  // by then the last of the row has left
  }))));
  await Promise.all(going);
}
// Jars (owner 25 Nov): 1. each jar has its own place in lines of JARS_PER_ROW, each line centred on its places; 2. a new jar takes the first free place
// (a line that grows re-centres, its jars slide); 3. a broken jar leaves its place empty; every jar drops from the top of the screen (or flies from where it was won) to its place.
const freeSlot = p => { let k = 0; while (p.jarList.some(j => j.slot === k) || p.reserved.has(k)) k++; return k; };
const places = p => Math.max(0, ...p.jarList.map(j => j.slot + 1), ...[...p.reserved].map(k => k + 1));  // how many places his jars' lines hold now
async function dropJar(i, from) {  // one more jar for player i: it flies to its place, then counts; it gives where it landed
  const my = G, p = G.players[i], slot = freeSlot(p); G.jarWho = i; p.reserved.add(slot); const at = jarSpot(slot, places(p));
  await fly({ k: 'jar' }, from || [at[0], -JAR_SIZE()], at, DROP_MS, { arc: from ? 60 : 0 }); if (G !== my) return at;
  p.reserved.delete(slot); p.jarList.push({ slot, fresh: true }); return jarSpot(slot, places(p));
}
async function parkJars(i, away) {  // the waiting jars fly together to a free place over the market, smaller, and back again to their places
  const p = G.players[i], my = G, list = away ? p.jarList.slice() : p.jarList.filter(j => j.parked), n = list.length;
  list.forEach(j => { j.moving = true; }); G.parking = true;
  await Promise.all(list.map((j, k) => fly({ k: 'jar' }, away ? jarSpot(j.slot, places(p)) : parkSpot(k, n), away ? parkSpot(k, n) : jarSpot(j.slot, places(p)), GLIDE_MS * 2, { arc: 40, z0: away ? 1 : PARKED, z1: away ? PARKED : 1 })));

      halves: COLOUR_IDS.map(c => G.bag.concat(G.draft.filter(t => t)).flat().filter(v => v === c).length), left: G.bag.length + G.draft.filter(t => t).length, fromNowhere: G.fromNowhere, leftFits: G.bag.concat(G.draft.filter(t => t)).some(t => fits(t, 0) || fits(t, 1)),
      tiles: [...G.tiles.values()].map(t => [t.x, t.y, t.r, t.cs[0], t.cs[1], t.o, t.id]), passes: G.players.map(p => p.passes),
      hand: { x: G.hand.x, y: G.hand.y, g: G.hand.g }, handDrag: G.dragging,
      players: G.players.map(p => ({ goods: p.goods.slice(), coins: p.coins, jars: p.jars, got: p.got, opened: { ...p.opened } })),
    };
  },
};
restart(params.has('seed') ? { seed: +params.get('seed') } : {});
frame();
picsReady.then(() => { __dg.ready = true; });  // ready once every picture is drawn onto its canvas
</script>
