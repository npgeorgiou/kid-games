<!DOCTYPE html>

<title>Οι Άποικοι</title>
<style>
html, body { margin: 0; height: 100%; overflow: hidden; background: #efe4cc; touch-action: none; user-select: none; }
canvas { display: block; width: 100vw; height: 100vh; }
</style>

<body>
<canvas id="c"></canvas>
<script>
// Οι Άποικοι: a prototype of the rules in design.md. Lands are colours only for now (owner 23 Nov).
// The model, in plain words:
// 1. A round: every square makes 1 good of its colour (a tile placed during the round makes its 2 at once); 4 tiles are laid out; players pick in turn (the token holder first, else the kid).
//    A tile you can't place is greyed for you; with nothing to pick your turn passes and the other plays again. The other may bid
//    sets (5 goods, one of each) and they go on; a tie goes to the picker; the winner pays and places the tile.
// 2. A tile fits on two free squares with at least one matching edge with your own land. Every matching edge, with any land, earns a jar,
//    opened at once; at the end of the round each 3 of the same leftover good fly into a jar, one group at a time, and the rest fade out, lost.
// 3. Jars hold 1 coin (half the time) or a bonus. The game ends when no tile left can be placed by either player; the longer row of coins wins.
// The tile you win stays where it is until it snaps: tap it to turn it, drag it and leave it anywhere, as often as you like.
// The PC plays through the same taps and drags as the kid, with a hand you can see (Fluent Emoji hands, MIT, src/hands/).

// SECTION: SETUP -- colours, the board, the random source, speeds, test switches
const COLOURS = ['#e8c547', '#3f86c8', '#8e5bb0', '#e27fb0', '#9a6a3a'];  // the five lands, most common first; what each land is comes later
const HALVES = [19, 18, 16, 14, 13];  // the 80 halves of the 40 tiles: about 24/22/20/18/16% (built for now)
const BORDER = ['#22a33a', '#d42a2a'];  // the kid's land green, the PC's red
const BONUSES = ['slot', 'steal', 'first', 'tile', 'jar', 'set', 'coins2'];  // the other half of jars, equal shares
const COLS = 20, ROWS = 13, STARTS = [[4, 6], [14, 6]];  // the start tiles sit at the centres of the board's two halves
const DIRS = [[1, 0], [0, 1], [-1, 0], [0, -1]];  // where a tile's second half is, by turn
const params = new URLSearchParams(location.search);
let fast = params.has('fast');  // tests: the PC moves without waiting
const HAND_SPEED = 450;  // px per second: slow enough to follow
const MAKE_MS = 800, FADE_MS = 600;  // at the round's end: 3 goods flying into a jar; the leftovers fading out
let rnd = Math.random;
function seeded(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
// Time passes only for the game that asked: when a new game has started, an old game's pause or hand move never ends,
// so whatever the old game was doing (a jar, a move, a turn) stops there and never touches the new game.
const pause = ms => { const my = G; return fast ? Promise.resolve() : new Promise(r => setTimeout(() => { if (G === my) r(); }, ms)); };

// SECTION: SOUNDS -- one simple built-in sound per thing that happens (owner 24 Nov), until his own files come
const SOUNDS = {  // notes in Hz, one after another; wave shape; length of each note in seconds
  pick: [[660], 'square', 0.07], bid: [[392, 523], 'triangle', 0.1], snap: [[180, 120], 'triangle', 0.09], pass: [[330, 247], 'sine', 0.18],
  jar: [[523, 659, 784], 'sine', 0.09], coin: [[988, 1319], 'square', 0.07], made: [[392, 494, 587], 'triangle', 0.08],
  spin: [[220, 260, 220, 260], 'square', 0.04], stop: [[440], 'triangle', 0.06], win: [[523, 659, 784, 1047], 'square', 0.09], steal: [[700, 350], 'sawtooth', 0.1],
};
let audio = null, heard = [];  // heard: every sound played in this game, in order (the flows read it)
function sound(name) {
  heard.push(name); if (fast) return;  // at test speed everything happens at once: sounds are only noted, not played
  try {
    audio = audio || new AudioContext(); if (audio.state === 'suspended') audio.resume();
    const [notes, type, len] = SOUNDS[name], t0 = audio.currentTime;
    notes.forEach((f, k) => {
      const o = audio.createOscillator(), g = audio.createGain(), t = t0 + k * len;
      o.type = type; o.frequency.value = f; g.gain.setValueAtTime(0.12, t); g.gain.exponentialRampToValueAtTime(0.001, t + len * 0.95);
      o.connect(g).connect(audio.destination); o.start(t); o.stop(t + len);
    });
  } catch (e) { /* no sound on this machine: the game goes on */ }
}

// SECTION: MODEL -- the shared board, tiles, matches, goods and sets
let G = null, tileNo = 1;
function newPlayer(human) { return { human, goods: [0, 0, 0, 0, 0], coins: 0, jars: 0, fresh: 0, got: 0, bid: 0, passes: 0 }; }
const key = (x, y) => x + ',' + y;
function halves(x, y, r) { const d = DIRS[r]; return [[x, y], [x + d[0], y + d[1]]]; }
const cellMark = (x, y, c, o) => Math.imul((((x * 31 + y) * 7 + c) * 2 + o) + 1, 2654435761) ^ (x * 0x9E3779B1 + y);  // a number per square, colour and owner
function mark(t) { halves(t.x, t.y, t.r).forEach(([a, b], h) => { G.board ^= cellMark(a, b, t.cs[h], t.o); }); }  // the board's mark: the same board always has the same mark (lifting a tile and putting it back restores it)
function put(t) { mark(t); G.tiles.set(t.id, t); halves(t.x, t.y, t.r).forEach(([a, b], h) => G.cells.set(key(a, b), { x: a, y: b, c: t.cs[h], o: t.o, t: t.id })); }
function lift(t) { mark(t); halves(t.x, t.y, t.r).forEach(([a, b]) => G.cells.delete(key(a, b))); G.tiles.delete(t.id); }
const free = (x, y) => x >= 0 && y >= 0 && x < COLS && y < ROWS && !G.cells.has(key(x, y));
function matchesAt(cs, x, y, r, owner) {  // edges where a half meets the same colour (owner: only that player's land)
  let m = 0;
  halves(x, y, r).forEach(([hx, hy], i) => { for (const d of DIRS) { const s = G.cells.get(key(hx + d[0], hy + d[1])); if (s && s.c === cs[i] && (owner == null || s.o === owner)) m++; } });
  return m;
}
const spotMemo = new Map();  // the places for a tile only change when the board does: worked out once per board
function spots(cs, r, i) {  // where player i can place a tile: two free squares, at least one matching edge with his own land; m = the jars it earns
  const mk = G.board + '|' + cs + '|' + r + '|' + i;
  if (spotMemo.has(mk)) return spotMemo.get(mk);
  if (spotMemo.size > 5000) spotMemo.clear();
  const out = [], seen = new Set(), d = DIRS[r];
  for (const c of G.cells.values()) if (c.o === i) for (const [dx, dy] of DIRS) {  // only places with a half next to his land can match it
    const nx = c.x + dx, ny = c.y + dy;
    for (const [x, y] of [[nx, ny], [nx - d[0], ny - d[1]]]) {
      const k = key(x, y); if (seen.has(k)) continue; seen.add(k);
      if (halves(x, y, r).every(([a, b]) => free(a, b)) && matchesAt(cs, x, y, r, i)) out.push({ x, y, r, m: matchesAt(cs, x, y, r) });
    }
  }
  out.sort((a, b) => a.y - b.y || a.x - b.x); spotMemo.set(mk, out); return out;
}
function bestPlace(cs, i) { let best = null; for (let r = 0; r < 4; r++) for (const s of spots(cs, r, i)) if (!best || s.m > best.m) best = s; return best; }
const fits = (cs, i) => !!cs && !!bestPlace(cs, i);
const jarsFor = (cs, i) => { const b = cs && bestPlace(cs, i); return b ? b.m : 0; };
const sets = p => Math.min(...p.goods);
const leftoverJars = g => g.reduce((a, n) => a + Math.floor(Math.max(0, n) / 3), 0);
function stealable(i) {  // the opponent's tiles that fit for you once lifted; whether his land stays connected does not matter
  return [...G.tiles.values()].filter(t => t.o === 1 - i && !t.start).filter(t => { lift(t); const ok = fits(t.cs, i); put(t); return ok; }).map(t => t.id);
}
function randomColour() { let k = rnd() * 80; for (let c = 0; c < 5; c++) { k -= HALVES[c]; if (k < 0) return c; } return 4; }
function freeTile(i) {  // a tile from nowhere, by the colour split, always one that fits
  for (let k = 0; k < 400; k++) { const t = [randomColour(), randomColour()]; if (fits(t, i)) return t; }
  return null;
}
function makeBag() {  // the 80 halves shuffled into 40 tiles; the first round's 4 meet a start colour, so each player can place them
  const hs = HALVES.flatMap((n, c) => Array(n).fill(c));
  for (let k = hs.length - 1; k > 0; k--) { const j = Math.floor(rnd() * (k + 1)); [hs[k], hs[j]] = [hs[j], hs[k]]; }
  const tiles = []; for (let k = 0; k < hs.length; k += 2) tiles.push([hs[k], hs[k + 1]]);
  const first = [], rest = [];
  for (const t of tiles) (first.length < 4 && (t[0] < 2 || t[1] < 2) ? first : rest).push(t);
  return first.concat(rest);
}

// SECTION: TURNS -- the game waits for a tap or a drag; the PC makes the same taps and drags with its hand
let wait = null, press = null;
function ask(kind, who, extra) {
  if (G.players[who].human) handHome();
  return new Promise(res => { wait = { kind, who, res, r: 0, ...extra }; });
}
function answer(v) { const w = wait; wait = null; if (!press || !press.taking) press = null; w.res(v); }  // a press that takes a tile lives on as its drag
async function choose(kind, who, extra, pcMoves) {  // a human answers by tapping; the PC's hand makes its moves on the same screen
  const my = G, chosen = ask(kind, who, extra);
  if (!G.players[who].human) { await pause(500); if (G === my) await pcMoves(); }
  return chosen;
}
function handTo(x, y, ms) {  // the hand glides to a point (eased), slow enough to follow
  const h = G.hand, d = Math.hypot(x - h.x, y - h.y);
  if (fast || d < 1) { h.x = x; h.y = y; return Promise.resolve(); }
  const t0 = performance.now(), x0 = h.x, y0 = h.y, T = ms || Math.max(350, d / HAND_SPEED * 1000);
  return new Promise(res => {
    const my = G, step = () => { if (G !== my) return; const k = Math.min(1, (performance.now() - t0) / T), e = k < 0.5 ? 2 * k * k : 1 - 2 * (1 - k) * (1 - k); h.x = x0 + (x - x0) * e; h.y = y0 + (y - y0) * e; k < 1 ? requestAnimationFrame(step) : res(); };
    requestAnimationFrame(step);
  });
}
function handHome() { G.hand.g = 'point'; const p = homeSpot(); if (G.hand.x !== p[0] || G.hand.y !== p[1]) handTo(p[0], p[1]); }
async function handTap(x, y) { G.hand.g = 'point'; await handTo(x, y); G.hand.down = true; await pause(220); G.hand.down = false; }
async function pcTap(id) {  // the hand goes to the button, presses it, and the game takes it like a tap
  const my = G; render(); const b = buttons.find(c => c.id === id); if (!b) return;
  await handTap(b.x + b.w / 2, b.y + b.h / 2);
  if (G !== my) return;  // a new game started meanwhile: this move belonged to the old one
  b.fn(); await pause(250);
}
async function pcPlace(sp) {  // tap the tile where it lies to turn it, then grab it, drag it to its place and let go
  const my = G, w = wait, live = () => G === my && wait === w;  // the move belongs to this game and this tile; a new game ends it
  while (live() && w.r !== sp.r) { await handTap(w.pos[0], w.pos[1]); if (live()) w.r = (w.r + 1) % 4; await pause(350); }
  if (!live()) return;
  await handTo(w.pos[0], w.pos[1]); my.hand.g = 'grab'; await pause(250);
  const [gx, gy] = tileCentre(sp.x, sp.y, sp.r), h = my.hand;
  my.dragging = true; const follow = handTo(gx, gy, fast ? 0 : 1300);
  const track = () => { if (live() && my.dragging) { w.pos = [h.x, h.y]; requestAnimationFrame(track); } };
  if (!fast) requestAnimationFrame(track); await follow;
  my.dragging = false; if (!live()) return;
  w.pos = [gx, gy]; await pause(250);
  if (!live()) return;
  my.hand.g = 'open'; drop(); await pause(400); my.hand.g = 'point';
}
function drop() { const s = snapSpot(); if (s) answer(s); }  // a tile left near a place it fits snaps in; anywhere else it stays where it was left

// SECTION: ROUNDS -- start, picks and bids, passing, end of round, end of game
async function play() {
  const my = G;
  while (G === my && G.bag.some(t => fits(t, 0) || fits(t, 1))) {  // the game ends when no tile left can be placed by either player
    G.round++; G.phase = 'round';
    for (const p of G.players) { p.goods = [0, 0, 0, 0, 0]; p.got = 0; }
    for (const s of G.cells.values()) G.players[s.o].goods[s.c]++;
    G.draft = G.bag.splice(0, 4); G.locks = [];  // locks[k]: the player who won the bid on tile k; only he may pick it
    let turn = G.first ?? 0, passes = 0, passed = null;
    while (G === my && G.draft.some(t => t) && passes < 2) {
      const other = 1 - turn, P = G.players;
      if (P[turn].got >= 2 && P[other].got < 2 && passed !== other) turn = 1 - turn;  // 2 tiles each, unless the other has just passed
      if (!G.draft.some((t, k) => pickable(k, turn))) { await pass(turn); passes++; passed = turn; turn = 1 - turn; continue; }
      passes = 0; passed = null;
      const k = await pick(turn); if (G !== my) return;
      sound('pick');
      const tile = G.draft[k]; G.chosen = k;
      const winner = G.locks[k] === turn ? turn : await bidding(turn, tile); if (G !== my) return;  // a tile locked to you is yours without a bid
      G.chosen = -1;
      if (winner !== turn) { G.locks[k] = winner; continue; }  // the bid's winner locks the tile for himself; the picker picks again
      G.draft[k] = null; P[turn].got++;
      await place(turn, tile, draftSlot(k)); if (G !== my) return;
      turn = 1 - turn;
    }
    if (G !== my) return;
    G.bag.push(...G.draft.filter(t => t)); G.draft = [];  // tiles nobody could place are not thrown: they go back under the pile (built for now)
    G.phase = 'end';
    for (const i of [G.first ?? 0, 1 - (G.first ?? 0)]) { await goodsToJars(i); if (G !== my) return; await openJars(i); if (G !== my) return; }  // one player gains and opens, then the other
  }
  if (G !== my) return;
  const [a, b] = G.players.map(p => p.coins);
  G.over = true; G.winner = a > b ? 0 : b > a ? 1 : -1;
}
async function goodsToJars(i) {  // each 3 of a colour fly into a jar, one group at a time; then the leftovers fade out and are lost
  const p = G.players[i];
  for (let c = 0; c < 5; c++) while (p.goods[c] >= 3) { G.making = { who: i, c, t0: performance.now() }; await pause(MAKE_MS); p.goods[c] -= 3; p.jars++; sound('made'); }
  if (p.goods.some(g => g > 0)) { G.making = { who: i, c: -1, t0: performance.now() }; await pause(FADE_MS); }
  p.goods = [0, 0, 0, 0, 0]; G.making = null;
}
async function pass(i) { G.players[i].passes++; sound('pass'); G.passing = i; if (!G.players[i].human) G.hand.g = 'raised'; await pause(2400); G.passing = null; G.hand.g = 'point'; }
const pickable = (k, i) => fits(G.draft[k], i) && (G.locks[k] ?? i) === i;  // fits his land and is not locked to the other player
function pick(i) {
  let best = -1, bm = -1; G.draft.forEach((t, k) => { if (pickable(k, i) && jarsFor(t, i) > bm) { bm = jarsFor(t, i); best = k; } });
  return choose('pick', i, {}, () => pcTap('draft-' + best));
}
async function bidding(picker, tile) {  // the opponent outbids by one; the picker only has to match (a tie is his)
  const opp = 1 - picker, P = G.players;
  P[0].bid = P[1].bid = 0;
  let winner = picker;
  if (P[opp].got < 2) for (;;) {
    if (!await wantsBid(opp, tile, P[picker].bid + 1)) { winner = picker; break; }
    P[opp].bid = P[picker].bid + 1; sound('bid');
    if (!await wantsBid(picker, tile, P[opp].bid)) { winner = opp; break; }
    P[picker].bid = P[opp].bid; sound('bid');
  }
  const n = P[winner].bid; P[winner].goods = P[winner].goods.map(g => g - n);
  P[0].bid = P[1].bid = 0;
  return winner;
}
function pcBids(i, tile, n) {  // worth it when the tile's jars beat the next best tile's by more than the leftover jars the sets would cost
  const p = G.players[i], gain = jarsFor(tile, i) - Math.max(0, ...G.draft.filter(t => t && t !== tile).map(t => jarsFor(t, i)));
  return gain > leftoverJars(p.goods) - leftoverJars(p.goods.map(g => g - n));
}
async function wantsBid(i, tile, n) {
  if (sets(G.players[i]) < n || !fits(tile, i)) return false;
  return choose('bid', i, { n }, () => pcTap(pcBids(i, tile, n) ? 'bid' : 'letgo'));
}
async function place(i, cs, pos) {  // the tile lies at pos until it snaps
  const { x, y, r } = await choose('place', i, { tile: cs, pos }, () => pcPlace(bestPlace(cs, i)));
  const m = matchesAt(cs, x, y, r);
  put({ id: 't' + (tileNo++), cs, x, y, r, o: i });
  sound('snap'); cs.forEach(c => G.players[i].goods[c]++);  // a placed land makes its goods at once (owner 24 Nov), and again at each round's start
  G.players[i].jars += m; G.players[i].fresh = m;  // the jars this tile earned come first, shown apart from jars still waiting
  await openJars(i);
}

// SECTION: JARS -- opening, coins and bonuses, the slot machine
const jarQueue = [], slotQ = [];
function rollJar() {
  if (jarQueue.length) return jarQueue.shift();
  if (rnd() < 0.5) return { k: 'coins' };
  return { k: BONUSES[Math.floor(rnd() * BONUSES.length)] };
}
async function openJars(i) {
  const p = G.players[i], my = G;
  while (G === my && p.jars > 0) {
    await choose('jar', i, {}, () => pcTap('jar-0')); if (G !== my) return;
    p.jars--; p.fresh = Math.max(0, p.fresh - 1); const j = rollJar(); sound('jar'); G.shown = { who: i, j }; await pause(1100); G.shown = null;
    await bonus(i, j);
  }
}
async function bonus(i, j) {
  const p = G.players[i];
  if (j.k === 'coins') { p.coins += 1; sound('coin'); }
  else if (j.k === 'coins2') { p.coins += 2; sound('coin'); }
  else if (j.k === 'first') G.first = i;
  else if (j.k === 'jar') p.jars++;
  else if (j.k === 'set') p.goods = p.goods.map(g => g + 1);
  else if (j.k === 'tile') { const t = freeTile(i); if (t) await place(i, t, shownSpot()); }  // the free tile lies where the jar showed it
  else if (j.k === 'steal') {
    const ids = stealable(i); if (!ids.length) { await pause(900); return; }
    const worthOf = id => { const t = G.tiles.get(id); lift(t); const m = jarsFor(t.cs, i); put(t); return m; };
    const best = ids.reduce((a, b) => worthOf(b) > worthOf(a) ? b : a);
    const id = await choose('steal', i, { ids }, () => pcTap('steal-' + best));
    const t = G.tiles.get(id), pos = tileCentre(t.x, t.y, t.r); lift(t); sound('steal'); await place(i, t.cs, pos);  // the stolen tile is lifted where it lay
  }
  else if (j.k === 'slot') await slot(i);
}
const JAR_LABELS = {  // shown under what a jar held (Greek, for the child)
  coins: '1 νόμισμα', coins2: '2 νομίσματα', slot: 'Κουλοχέρης', steal: 'Κλέψε ένα πλακίδιο', first: 'Παίζεις πρώτος',
  tile: 'Ένα πλακίδιο δώρο', jar: 'Ένα πιθάρι ακόμα', set: 'Ένα από κάθε αγαθό',
};
const SYMBOLS = 7;  // the 5 goods, coins, jars
const spin = () => slotQ.length ? slotQ.shift() : Math.floor(rnd() * SYMBOLS);
const JAR_WORTH = (0.5 + 2 / 14) / (1 - 1 / 14);  // what the PC counts a jar as, in coins: 1 coin half the time, 2 coins a fourteenth, another jar a fourteenth
const worth = s => s === 5 ? 1 : s === 6 ? JAR_WORTH : JAR_WORTH / 3;  // a good: a third of a leftover jar
function prize(w) { const c = w.map(s => w.filter(t => t === s).length), n = Math.max(...c); return n >= 2 ? n * worth(w[c.indexOf(n)]) : 0; }
const slotMemo = new Map();  // the best choice depends only on the wheels and the coins, so it is worked out once
function slotPlan(w0, coins) {  // the PC's best choice: stop, or pay 1 coin to spin the wheels that give the most expected coins
  const memo = slotMemo;
  const V = (w, c) => {
    const k = w.join() + '|' + c; if (memo.has(k)) return memo.get(k).v;
    let best = { v: prize(w), sel: null };
    if (c > 0 && !(w[0] === w[1] && w[1] === w[2])) for (let m = 1; m < 8; m++) {
      const idx = [0, 1, 2].filter(j => m >> j & 1); let e = 0, n = 0;
      const all = (k2, ww) => { if (k2 === idx.length) { e += V(ww, c - 1); n++; return; } for (let s = 0; s < SYMBOLS; s++) { const w2 = ww.slice(); w2[idx[k2]] = s; all(k2 + 1, w2); } };
      all(0, w); const v = e / n - 1; if (v > best.v + 1e-9) best = { v, sel: idx };
    }
    memo.set(k, best); return best.v;
  };
  const c = Math.min(coins, 4); V(w0, c); return memo.get(w0.join() + '|' + c).sel;
}
const ROLL_MS = [700, 1000, 1300];  // each wheel rolls this long, so they stop one after another
async function roll(wheels) {  // the chosen wheels get their new pictures, roll, and stop one by one
  const now = performance.now();
  wheels.forEach(k => { G.slot.w[k] = spin(); G.slot.until[k] = fast ? 0 : now + ROLL_MS[k]; });
  sound('spin'); let t = 0;
  for (const k of wheels.slice().sort((a, b) => ROLL_MS[a] - ROLL_MS[b])) { await pause(ROLL_MS[k] - t); t = ROLL_MS[k]; sound('stop'); }
  await pause(100);
}
async function slot(i) {
  const p = G.players[i];
  G.slot = { who: i, w: [0, 0, 0], sel: [false, false, false], until: [0, 0, 0] };
  await roll([0, 1, 2]);
  for (;;) {
    const w = G.slot.w;
    if (w[0] === w[1] && w[1] === w[2]) { await pause(900); break; }
    const a = await choose('slot', i, {}, async () => {
      const plan = slotPlan(w, p.coins);

    cx.save(); cx.beginPath(); cx.rect(wx + 4, y - 146, ww - 8, 162); cx.clip();
    if (rolling) { const off = (now / 2.2) % 70; for (let j = -1; j < 3; j++) symbol(Math.floor(now / 60 + j * 3 + k * 2) % SYMBOLS, wx + ww / 2, y - 65 + off - j * 70, 30); }  // pictures sliding past
    else symbol(s, wx + ww / 2, y - 65, 46);
    cx.restore(); drawn.push({ k: 'wheel', n: k, rolling });
    if (S.sel[k]) { cx.strokeStyle = '#2f7de1'; cx.lineWidth = 5; cx.beginPath(); cx.arc(wx + ww - 22, y - 128, 13, 0.6, 5.8); cx.stroke(); }  // marked to spin again
    if (live) btn('wheel-' + k, wx, y - 150, ww, 170, () => { S.sel[k] = !S.sel[k]; });
  });
  if (!live) return;
  const n = S.sel.filter(v => v).length, can = p.coins > 0 && n > 0, prize = slotPrize(S.w);
  rrect(x - 240, y + 40, 230, 140, 18, can ? '#d8f0c8' : '#d6d0c8', '#3a8a2a', 4);  // spin again: costs 1 coin
  label(n ? 'Γύρνα ' + n + (n > 1 ? ' ρόδες' : ' ρόδα') : 'Διάλεξε ρόδες', x - 125, y + 80, 22, '#1f4d16', 'spin');
  label('−1', x - 140, y + 140, 34, '#7a2f2f', 'reroll'); coin(x - 95, y + 128, 16);
  if (can) btn('reroll', x - 240, y + 40, 230, 140, () => answer('reroll'));
  rrect(x + 10, y + 40, 230, 140, 18, '#ffe9a8', '#e0a020', 4);  // take what the wheels show
  label('Πάρε', x + 125, y + 80, 22, '#6e4a08', 'take');
  if (prize) { label('+' + prize.n, x + 100, y + 140, 34, '#3a5a10', 'collect'); symbol(prize.s, x + 160, y + 128, 20); }
  else label('τίποτα', x + 125, y + 140, 26, '#6e4a08', 'collect');
  btn('collect', x + 10, y + 40, 230, 140, () => answer('collect'));
}
function drawPass() {  // nothing fits: this turn passes to the other player
  const i = G.passing, x = W / 2, y = H * 0.5, k = Math.min(1, (performance.now() % 1200) / 900);
  shade(0.3); rrect(x - 260, y - 110, 520, 220, 30, '#fff8e8', BORDER[i], 6);
  dot(i ? x + 170 : x - 170, y, 46, BORDER[i]); dot(i ? x - 170 : x + 170, y, 46, BORDER[1 - i]);
  const a = i ? x + 110 : x - 110, b = i ? x - 110 : x + 110; arrow(a, y, a + (b - a) * k, y, '#555', 12);
}
function drawEnd() {  // the two rows of coins side by side; the longer one wins
  shade(0.4); rrect(W * 0.08, H * 0.28, W * 0.84, H * 0.44, 30, '#fff8e8', '#e0a020', 6);
  G.players.forEach((p, i) => {
    const y = H * 0.4 + i * H * 0.16, r = Math.min(16, W * 0.66 / Math.max(1, p.coins) / 2.2);
    dot(W * 0.13, y, 22, BORDER[i]); if (G.winner === i) star(W * 0.13, y, 18);
    for (let k = 0; k < p.coins; k++) coin(W * 0.18 + r + k * r * 2.2, y, r);
  });
  rrect(W * 0.86, H * 0.3, 64, 64, 16, '#d8f0c8', '#3a8a2a', 3);
  cx.strokeStyle = '#3a8a2a'; cx.lineWidth = 6; cx.beginPath(); cx.arc(W * 0.86 + 32, H * 0.3 + 32, 17, 0.5, 5.6); cx.stroke();
  btn('again', W * 0.86, H * 0.3, 64, 64, () => restart());
}
function render() {  // one picture of the game; it also lays out the buttons the taps (and the PC's hand) press
  buttons = []; drawn = []; cx.clearRect(0, 0, W, H);
  if (!G) return;
  drawBoard(); drawDraft(); drawPanel(0); drawPanel(1);
  if (wait && wait.kind === 'place') drawHeld();
  if (wait && wait.kind === 'bid') drawBid();
  if ((wait && wait.kind === 'jar') || G.shown || (G.making && (G.making.c >= 0 || G.players[G.making.who].jars))) drawJars();  // jars being made show with the jars already made
  if (G.slot) drawSlot();
  if (G.passing != null) drawPass();
  if (G.over) drawEnd();
  hand(G.hand);
}
function frame() { render(); requestAnimationFrame(frame); }

// SECTION: INPUT -- taps press buttons at once; the tile in hand turns on a tap, moves on a drag, and stays where it is left
const human = () => wait && G.players[wait.who].human;
cv.addEventListener('pointerdown', e => {
  if (!e.isPrimary || !human()) return;
  for (let k = buttons.length - 1; k >= 0; k--) { const b = buttons[k]; if (e.clientX >= b.x && e.clientX <= b.x + b.w && e.clientY >= b.y && e.clientY <= b.y + b.h) { b.fn(e); return; } }
});
cv.addEventListener('pointermove', e => {
  if (!press || !human() || wait.kind !== 'place') return;
  if (!press.moved && Math.hypot(e.clientX - press.x, e.clientY - press.y) > 12) press.moved = true;
  if (press.moved) wait.pos = [e.clientX + press.dx, e.clientY + press.dy];
});
cv.addEventListener('pointerup', () => {
  if (!press || !human() || wait.kind !== 'place') { press = null; return; }
  const { moved, taking } = press; press = null;
  if (moved) drop(); else if (!taking) wait.r = (wait.r + 1) % 4;  // a tap turns the tile, except the tap that took it
});

// SECTION: TEST HOOKS -- what the flows read and set
window.__dg = {
  ready: false, restart, render,
  btn(id) { const b = buttons.find(b => b.id === id); return b ? [b.x + b.w / 2, b.y + b.h / 2] : null; },
  buttons() { return buttons.map(b => b.id); },
  drawn() { return drawn; },
  sounds() { return heard.slice(); },
  held() { return wait && wait.kind === 'place' ? wait.pos.slice() : null; },
  tileAt: tileCentre,
  edge(x, y, d) { const { s, ox, oy } = L(); return [ox + (x + 0.5 + DIRS[d][0] / 2) * s, oy + (y + 0.5 + DIRS[d][1] / 2) * s]; },
  pixel(x, y) { const d = devicePixelRatio || 1; return [...cx.getImageData(Math.floor(x * d), Math.floor(y * d), 1, 1).data]; },
  sampleJars(n) { const m = {}; for (let k = 0; k < n; k++) { const j = rollJar(); m[j.k] = (m[j.k] || 0) + 1; } return m; },
  state() {
    return {
      round: G.round, phase: G.phase, first: G.first, over: G.over, winner: G.winner, passing: G.passing, slot: G.slot ? { w: G.slot.w.slice(), sel: G.slot.sel.slice() } : null,
      wait: wait ? { kind: wait.kind, who: wait.who, r: wait.r } : null, draft: G.draft.map(t => t && t.slice()), fits: G.draft.map((t, k) => pickable(k, 0)),
      spots: wait && wait.kind === 'place' ? [0, 1, 2, 3].flatMap(r => spots(wait.tile, r, wait.who)) : [], snap: (s => s && { x: s.x, y: s.y, r: s.r })(snapSpot()),
      halves: [0, 1, 2, 3, 4].map(c => G.bag.concat(G.draft.filter(t => t)).flat().filter(v => v === c).length), left: G.bag.length + G.draft.filter(t => t).length,
      tiles: [...G.tiles.values()].map(t => [t.x, t.y, t.r, t.cs[0], t.cs[1], t.o, t.id]), passes: G.players.map(p => p.passes),
      hand: { x: G.hand.x, y: G.hand.y, g: G.hand.g }, handDrag: G.dragging,
      players: G.players.map(p => ({ goods: p.goods.slice(), coins: p.coins, jars: p.jars, got: p.got, bid: p.bid })),
    };
  },
};
restart(params.has('seed') ? { seed: +params.get('seed') } : {});
frame();
__dg.ready = true;
</script>
