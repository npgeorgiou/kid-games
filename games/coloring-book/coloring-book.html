// SECTION: MODEL -- the paint model in plain words
/* The paint model (all of it runs on the graphics card, one small program per step). Words used: a medium is what
 you paint with, called a drawing tool (acrylic, watercolour, crayon (oil pastel), marker, simple brush, spray, shapes, ink, pencil); a brush shape is the shape of the brush or crayon
 tip (round, flat, dry brush, knife, mop; tip, side); paint load is how much paint the brush took (hold a colour longer).
 1. The picture is a grid of pixels on a canvas (watercolour paper, smooth paper, cotton canvas; each has its
    own surface grain). Each pixel holds how much light its paint swallows, per red/green/blue (absorbance,
    A = -ln(reflectance)), and how thick the paint is (H). Wet paints mix with each other like real pigment (Mixbox
    library, Kubelka-Munk based, by Secret Weapons, CC BY-NC 4.0); paint laid over paper or dry paint covers it
    (standard technique: Kubelka-Munk). See-through watercolour layers add their absorbance on top
    (standard technique: Beer-Lambert glazing).
 2. Oil and acrylic (standard technique: two-way paint transfer, as ArtRage and Rebelle do it): the brush tip is a small
    grid of paint that travels with the finger, shaped like the brush, turned across the stroke. At every dab each tip
    pixel gives some of its paint to the picture and takes some of the picture's wet paint back, so the brush carries and
    mixes colour and runs dry; with less paint it lays a thinner coat and runs out sooner. Only the
    paint on the outside of the bristles mixes; the paint deep in them refills it with the brush's own colour, and
    neighbouring bristles share a little paint. Across the tip the bristles are of uneven strength (streaks), and the
    stroke's sides get a ridge. Each pixel remembers when its paint was laid; paint dries (acrylic much faster than
    oil), and only the wet part can be picked up, so new paint sits on top of dry paint. Acrylic is thinner, covers
    better and is less glossy.
 3. Watercolour (standard techniques: Curtis et al. 1997 for pigment in water; the virtual-pipes shallow-water model,
    O'Brien and Hodgins 1995 / Mei et al. 2007, for the flow): the brush puts water and pigment on the paper and makes
    it damp; the brush's water runs out along the stroke. Water flows to lower neighbours (deeper water, the paper's
    dips) only into damp paper or pushed by deep water, and carries its pigment; pigment also spreads through the water.
    Water dries faster at the edge of a wet patch, so pigment moves out to the edge (darker rim). Pigment settles out of
    the water, a little more in the paper's dips (granulation), is lifted again while there is a lot of water, and is
    fixed when the paper is dry.
 4. Crayon is an oil pastel (owner 21 Nov, his reference pictures): a stick of soft, thick, opaque paint that never dries.
    It uses the brush model of part 2 with a tip that does not run out: it lays paint and picks up the soft paint it passes
    over (so it smears and blends), it touches the raised grain first, and pressing harder (the bucket level) reaches into
    the dips; paint already laid fills the dips, so passes build up; small lumps break off and stay.
 5. Simple brush: a dab with a shape, a size and a softness; one stroke is one even coat: each dab's soft edge adds
    towards that coat, never past it (standard technique: Krita's wash mode), so a stroke crossing itself has round corners.
 6. Marker: like the simple brush, one even coat per stroke, but the ink is see-through (its colour adds on top, so
    crossing lines get darker) and gathers a little at the line's edge.
 7. Spray and shape stamps (owner 23 Nov): each dab is laid over what is there. Spray is an airbrush: while pressed it puffs, many times a second (so a fast hand leaves the puffs further
    apart), drops of different sizes scattered round its aim, most near the middle (a bell curve cut off at the edge), each a little see-through, so they build up the longer it stays.
    Shapes (as the Squares Brush of av01d fabric-brushes): each shape as long along the stroke as the hand moved in one frame, twice that across, the next starting where it ends,
    turned with the stroke, outlined in the colour chosen, filled with a lighter tint of it (SHAPE_FILL), each fill slightly different.
 8. Ink and pencil (owner 23 Nov). Ink (as the av01d fabric-brushes ink): many fine opaque strands, one per hair of the tip,
    each drawn from where it was to where it is, thinner the faster the hand; a fast stroke throws drops off the tip, as
    many as the splash setting says. Pencil (one coat per stroke as in part 5) leaves its colour only where the paper's raised grain
    touches the lead; pressing harder (pressure and the bucket level) reaches lower into the grain.
 Pressure: a pen's pressure, or for a finger or the mouse its speed (slower is harder), gives more paint and a wider mark.

  PALETTES.push({ name: 'From your picture', by: '', colors: cenRGB, fromPicture: 1, thumb: th.toDataURL('image/jpeg', 0.8) });

// SECTION: CANVASES -- pick what to paint on: a new picture on that canvas
const cvBox = document.getElementById('cv');
function paperGrain(kind) { // the canvas grain of the full paper; a test paper takes its own part of it

function openCanvases() {
  if (stroke) return;

  const close = document.createElement('button'); close.className = 'btn'; close.dataset.id = 'canvas-close'; cvBox.appendChild(close);
  const cc = document.createElement('canvas'); close.appendChild(cc);
  close.addEventListener('pointerdown', (e) => { e.preventDefault(); cvBox.classList.add('hide'); });
  cvBox.classList.remove('hide'); drawIcon({ b: close, c: cc, draw: ICON_CLOSE });
  for (const id of Object.keys(CANVASES)) {
    const card = document.createElement('button'); card.className = 'card' + (id === st.canvas ? ' cur' : ''); card.dataset.id = 'canvas-' + id;
    card.appendChild(canvasSwatch(id)); cvBox.appendChild(card);
    card.addEventListener('click', async () => { cvBox.classList.add('hide'); await newPicture(id); });
  }
}
const ICON_CLOSE = (c) => { c.strokeStyle = '#3a2a1a'; c.lineWidth = 12; c.lineCap = 'round'; c.beginPath(); c.moveTo(28, 28); c.lineTo(72, 72); c.moveTo(72, 28); c.lineTo(28, 72); c.stroke(); };

// SECTION: GALLERY -- every picture kept on this PC (IndexedDB), the newest opens at start
let cur = { id: Date.now() }, isChanged = false, saveTimer = 0;
function changed() { isChanged = true; clearTimeout(saveTimer); saveTimer = setTimeout(() => save(), 2000); }
let dbp = null;
function db() { if (!dbp) dbp = new Promise((res, rej) => { const r = indexedDB.open('coloring-book', 1); r.onupgradeneeded = () => r.result.createObjectStore('pictures', { keyPath: 'id' }); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); return dbp; }
function req(mode, fn) { return db().then((d) => new Promise((res, rej) => { const t = d.transaction('pictures', mode), q = fn(t.objectStore('pictures')); t.oncomplete = () => res(q && q.result); t.onerror = () => rej(t.error); })); }
async function gz(u8) { return await new Response(new Blob([u8]).stream().pipeThrough(new CompressionStream('gzip'))).blob(); }

function thumb() { render(); if (stickDirty) drawStickers(); const c = document.createElement('canvas'); c.width = 320; c.height = 200; const x = c.getContext('2d'); x.drawImage(view, 0, 0, 320, 200); x.drawImage(document.getElementById('stick'), 0, 0, 320, 200); return c.toDataURL('image/jpeg', 0.8); }
let saving = Promise.resolve();
function save() {
  saving = saving.then(async () => {
    if (!isChanged || stroke) return;
    if (water.active) { changed(); return; } // kept once the wet paint is dry
    clearTimeout(saveTimer); isChanged = false;
    const { A, H } = readVisible(), qa = new Uint8Array(N * 3), qh = new Uint8Array(N);
    for (let i = 0; i < N * 3; i++) qa[i] = Math.min(255, Math.round(A[i] * 64));
    for (let i = 0; i < N; i++) qh[i] = Math.min(255, Math.round(H[i] * 127.5));
    const rec = { id: cur.id, time: Date.now(), thumb: thumb(), a: await gz(qa), h: await gz(qh), st: JSON.stringify(stickers), canvas: st.canvas, guide: guide.src };

}
function resetUndo() { for (const e of undoStack) release(e); undoStack.length = 0; open = null; }
function blank() {
  stopWater(); clearTex(PIC, [...CANVASES[st.canvas].paper.map(ab), 0]); clearTex(UNDER, [...CANVASES[st.canvas].paper.map(ab), 0]); clearTex(WAT, [0, 0, 0, 0]); clearTex(DEP, [0, 0, 0, 0]); clearTex(MISC, [-1e6, 0, 0, 0]); version++;
}
async function load(id) {
  const rec = await req('readonly', (s) => s.get(id)); if (!rec) return false;
  const qa = await gunz(rec.a), qh = await gunz(rec.h), f = new Float32Array(N * 4);

  stickers = JSON.parse(rec.st); stickDirty = true; cur = { id }; isChanged = false; guide.src = rec.guide || null; guide.on = false; showGuide(); // owner 23 Nov: a kept picture opens with its guide hidden

}
async function newPicture(canvas) { // a new picture on the same canvas, or on the one picked
  if (stroke) return; finishWater(); await save();
  if (canvas) useCanvas(canvas);
  blank(); stickers = []; stickDirty = true; cur = { id: Date.now() }; isChanged = false; guide.src = null; showGuide(); resetUndo(); renderAll(); refresh();
}
async function deletePicture() { // the open picture is removed from the gallery; the newest other one opens, or a new page
  if (stroke) return; finishWater(); clearTimeout(saveTimer); isChanged = false; await saving;
  await req('readwrite', (s) => s.delete(cur.id));
  const all = (await req('readonly', (s) => s.getAll())) || []; all.sort((a, b) => b.time - a.time);
  if (all.length) await load(all[0].id); else { blank(); stickers = []; stickDirty = true; cur = { id: Date.now() }; guide.src = null; showGuide(); resetUndo(); renderAll(); }

}
const gal = document.getElementById('gal');
async function openGallery() {
  if (stroke) return; finishWater(); await save();
  const all = (await req('readonly', (s) => s.getAll())) || [];
  all.sort((a, b) => b.time - a.time);
  gal.innerHTML = '';
  const close = document.createElement('button'); close.className = 'btn'; gal.appendChild(close);
  const cc = document.createElement('canvas'); close.appendChild(cc); close.dataset.id = 'gallery-close';
  close.addEventListener('pointerdown', (e) => { e.preventDefault(); gal.classList.add('hide'); });
  gal.classList.remove('hide'); drawIcon({ b: close, c: cc, draw: ICON_CLOSE });
  for (const r of all) {
    const card = document.createElement('button'); card.className = 'card' + (r.id === cur.id ? ' cur' : ''); card.dataset.id = 'pic-' + r.id;
    const im = document.createElement('img'); im.src = r.thumb; card.appendChild(im); gal.appendChild(card);
    card.addEventListener('click', async () => { gal.classList.add('hide'); if (r.id !== cur.id) { await load(r.id); refresh(); } });
    const bin = makeBtn(card, 'picdel-' + r.id, (c) => binDraw(bin)(c), () => { // delete in the gallery too, the same two presses (owner 21 Nov)
      if (delArmed !== bin) { armDelete(bin); return; }
      disarmDelete(); card.remove();
      if (r.id === cur.id) deletePicture(); else req('readwrite', (s) => s.delete(r.id));
    }, 'bin');
    bin.addEventListener('click', (e) => e.stopPropagation()); buttons[buttons.length - 1].inGal = true; drawIcon(buttons[buttons.length - 1]);
  }
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') { if (!stroke) finishWater(); save(); } });

// SECTION: LOOP -- wet paint moves, changed parts drawn once per frame
let lastT = 0;
function frame(t) {
  const dt = lastT ? Math.min(0.1, (t - lastT) / 1000) : 1 / 60; lastT = t;
  if (water.active) { water.acc = Math.min(water.acc + dt, MAX_STEPS * SIM_DT); while (water.acc >= SIM_DT) { simStep(SIM_DT); water.acc -= SIM_DT; } checkWater(); } // fixed steps: wet paint behaves the same at any frame rate
  keepRoom(); render();
  if (stickDirty) drawStickers();
  requestAnimationFrame(frame);
}
(async () => {
  await loadLut(); useCanvas('wc'); blank(); layout(); renderAll();
  try { const all = (await req('readonly', (s) => s.getAll())) || []; if (all.length) { all.sort((a, b) => b.time - a.time); await load(all[0].id); } } catch (e) { console.error(e); }
  window.__cb.ready = true;
})();
requestAnimationFrame(frame);

// SECTION: TEST HOOKS -- read-only views for the flow tests (age: let time pass for the oil paint)
let shot = null; // the paper as shown, for the checks below
window.__cb = { CW, CH, st, shapes: SHAPES, get freeTiles() { return freeSlots.length; }, get grain() { return grain; }, undoStack, water, get A() { return readPic().A; }, get Ht() { return readPic().H; }, get stickers() { return stickers; }, get cur() { return cur; }, ready: false,
  screenOf(x, y) { const r = view.getBoundingClientRect(); return [r.left + x * r.width / CW, r.top + y * r.height / CH]; },
  btn(id) { const b = document.querySelector('[data-id="' + id + '"]'); if (!b || b.classList.contains('hide')) return null; const r = b.getBoundingClientRect(); return [r.left + r.width / 2, r.top + r.height / 2]; },
  shown(x, y) { if (!shot) { render(); shot = new Uint8Array(CW * CH * 4); gl.bindFramebuffer(gl.READ_FRAMEBUFFER, null); gl.readPixels(0, 0, CW, CH, gl.RGBA, gl.UNSIGNED_BYTE, shot); Promise.resolve().then(() => { shot = null; }); } // the whole paper read once per check (one read a pixel stalled the graphics card each time), kept until the check's script ends
    const X = Math.round(x), Y = CH - 1 - Math.round(y); if (X < 0 || Y < 0 || X >= CW || Y >= CH) return [0, 0, 0]; const i = (Y * CW + X) * 4; return [shot[i], shot[i + 1], shot[i + 2]]; },
  cell(x, y, w, h) { render(); const d = new Uint8Array(w * h * 4); gl.bindFramebuffer(gl.READ_FRAMEBUFFER, null); gl.readPixels(x, CH - y - h, w, h, gl.RGBA, gl.UNSIGNED_BYTE, d); const c = document.createElement('canvas'); c.width = w; c.height = h; const x2 = c.getContext('2d'), im = x2.createImageData(w, h); for (let j = 0; j < h; j++) im.data.set(d.subarray((h - 1 - j) * w * 4, (h - j) * w * 4), j * w * 4); x2.putImageData(im, 0, 0); return c.toDataURL('image/png'); }, // tools/previews.py: a part of the picture as it shows
  paint(pts) { startStroke({ x: pts[0][0], y: pts[0][1] }, 1); for (let k = 1; k < pts.length; k++) { const [a, b] = [pts[k - 1], pts[k]], n = Math.ceil(Math.hypot(b[0] - a[0], b[1] - a[1]) / 4); for (let i = 1; i <= n; i++) moveStroke({ x: a[0] + (b[0] - a[0]) * i / n, y: a[1] + (b[1] - a[1]) * i / n }, 1); } endStroke(); }, // tools/previews.py: a stroke without waiting for a finger
  age(s) { clockShift += s; }, previews: PREVIEWS, palIndex(n) { return PALETTES.findIndex((p) => p.name === n); }, color() { return colorOf(st.color).map((v) => Math.round(v * 255)); }, pal(i) { return PALETTES[i] && PALETTES[i].colors; },
  fast(sec) { for (let i = 0; i < sec / SIM_DT && water.active; i++) { simStep(SIM_DT); if (i % 24 === 0) { water.frames = CHECK_EVERY - 1; checkWater(); gl.finish(); checkWater(); } } render(); }, // debug: let the wet paint run on

  sum(T, r) { const t = { W: WAT, D: DEP, P: PIC }[T], w = r[2] - r[0], h = r[3] - r[1], f = new Float32Array(w * h * 4); gl.bindFramebuffer(gl.READ_FRAMEBUFFER, t.fb); gl.readPixels(r[0], r[1], w, h, gl.RGBA, gl.FLOAT, f); const s = [0, 0, 0, 0]; for (let i = 0; i < f.length; i++) s[i & 3] += f[i]; return s.map((v) => +v.toFixed(1)); },
  probe(pts) { const f = new Float32Array(4), o = []; for (const [x, y] of pts) { const v = []; for (const T of [WAT, DEP]) { gl.bindFramebuffer(gl.READ_FRAMEBUFFER, T.fb); gl.readPixels(x, y, 1, 1, gl.RGBA, gl.FLOAT, f); v.push(+f[3].toFixed(3)); } o.push(v); } return o; }, save: () => save(), count: async () => ((await req('readonly', (s) => s.getAll())) || []).length };
</script>
