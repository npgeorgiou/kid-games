<canvas id="paper" class="pic"></canvas>
<canvas id="stick" class="pic"></canvas>
<div id="left" class="bar"></div>
<div id="right" class="bar"></div>
<div id="bottom" class="bar"></div>
<div id="gal" class="hide"></div>
<script>
'use strict';
// SECTION: MODEL -- the paint model in plain words
/* The paint model (all of it runs on the graphics card, one small program per step):
 1. The picture is a grid of pixels. Each pixel holds how much light its paint swallows, per red/green/blue
    (absorbance, A = -ln(reflectance)), and how thick the oil paint is (H). Opaque paints that mix (oil, crayon, simple
    brush) mix like real pigment: the pigments' light swallowing and scattering are averaged by amount and turned back
    into a colour (standard technique: Kubelka-Munk mixing). See-through watercolour layers add their absorbance on top
    (standard technique: Beer-Lambert glazing). Blue and yellow make green either way.
 2. Oil brush (standard technique: two-way paint transfer, as ArtRage and Rebelle do it): the brush tip is a small grid
    of paint that travels with the finger. At every dab each tip pixel gives some of its paint to the picture and takes
    some of the picture's wet paint back, so the brush carries and mixes colour along the stroke and runs dry. Only the
    paint on the outside of the bristles mixes; the paint deep in them refills it with the brush's own colour, and
    neighbouring bristles share a little paint. Across the stroke the tip is split into bristles of uneven strength
    (streaks), and the stroke's edges get a ridge of paint. Each pixel remembers when its oil was laid; oil dries
    slowly, and the brush can only pick up the part that is still wet, so new paint sits on top of dry paint.
 3. Watercolour (standard techniques: Curtis et al. 1997 for pigment in water; the virtual-pipes shallow-water model,
    O'Brien and Hodgins 1995 / Mei et al. 2007, for the flow): the brush puts water and pigment on the paper and makes
    the paper damp. Water flows to lower neighbours (deeper water, the paper's dips, and down the page when the paper is
    tilted), only into damp paper or pushed by deep water (water makes the paper it reaches damp, so a drip's trail keeps running), and carries its pigment along. Water dries faster at the edge
    of a wet patch, so water and pigment move out to the edge (darker rim). Pigment settles out of the water, more in the
    paper's dips (granulation), is lifted again while there is a lot of water, and is fixed for good when the paper is dry.
 4. Crayon: wax lands only on the raised grain of the paper, a fixed paper texture, so specks of paper stay.
 5. Simple brush: a round dab with a size and a softness; one stroke is one even coat (standard technique: a stroke
    mask that keeps the strongest dab per pixel).
 Light: oil thickness and the paper's grain are lit from the top left (bump shading); damp paper looks a little darker. */

// SECTION: SETUP -- picture size, paper grain, colours, tuning
const CW = 1600, CH = 1000, N = CW * CH, TS = 64, TX = Math.ceil(CW / TS), TY = Math.ceil(CH / TS);
const grain = new Float32Array(N);
const ab = (c) => -Math.log(Math.max(0.02, c));
const PAPER = [0.96, 0.945, 0.9], PAPER_A = PAPER.map(ab);
const COLORS = [ // reflectance, sRGB 0..1
  [0.97, 0.97, 0.95], [0.04, 0.04, 0.05], [0.86, 0.06, 0.07], [0.98, 0.45, 0.05], [1.0, 0.88, 0.06], [0.1, 0.55, 0.15],
  [0.35, 0.7, 0.95], [0.05, 0.2, 0.75], [0.45, 0.12, 0.6], [0.98, 0.55, 0.7], [0.45, 0.25, 0.1]];
const SIZES = [8, 18, 36]; // brush radius for each size dot, the same for every tool (owner 20 Nov)
const SOFT = [0.95, 0.6, 0.05]; // sharp, medium, fuzzy: how far out the dab stays full strength
// tuning (the prototype answers these with the child)
const K = {
  OIL_LOAD: 10, OIL_GIVE: 1 / 700, OIL_TAKE: 0.04, OIL_SURF: 0.3, OIL_RIDGE: 0.4, OIL_PAPER: 0.05, OIL_DRY: 25, // OIL_DRY: seconds for laid oil to lose most of its wetness
  BUMP: 2.8, PBUMP: 0.35, GLOSS: 30, WETDARK: 0.08,
  LX: -0.45, LY: -0.55, LZ: 0.70, HX: -0.45 / 1.843, HY: -0.55 / 1.843, HZ: 1.7 / 1.843, // light from the top left; half-way vector between light and eye
  W_ADD: 0.35, W_MAX: 1.5, PDIF: 25, W_DENS: 0.45, // water per dab, most water a pixel holds, pigment per water
  CF: 0.2, DEEP: 0.3, KP: 0.05, MAXF: 0.5, TILT_G: 0.9, // flow: speed, how deep water pushes onto dry paper, pull of the paper's dips, most water leaving a pixel per step, slope when tilted
  EV: 0.15, EDGE: 25, W0: 0.02, SETTLE: 30, DEP0: 0.05, GRAN: 0.8, LIFT: 0.3, DAMPW: 2, DAMPE: 2, FIX: 4, // drying, edge drying, settling, granulation, lifting, damp paper, fixing
  CRAY_T: 0.3, CRAY_RAMP: 0.3, CRAY_FLOW: 0.35,
};
const SIM_DT = 1 / 120, MAX_STEPS = 4, CHECK_EVERY = 6, W_EPS = 1e-4, DAMP_EPS = 0.01;

function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
(function makeGrain() { // fine noise blurred once, plus a coarse wave, then spread evenly over 0..1
  const r = rng(7), f = new Float32Array(N);
  for (let i = 0; i < N; i++) f[i] = r();
  const t = new Float32Array(N);
  for (let y = 0; y < CH; y++) for (let x = 1; x < CW - 1; x++) { const k = y * CW + x; t[k] = (f[k - 1] + f[k] + f[k + 1]) / 3; }
  for (let y = 1; y < CH - 1; y++) for (let x = 0; x < CW; x++) { const k = y * CW + x; f[k] = (t[k - CW] + t[k] + t[k + CW]) / 3; }
  const G = 7, gw = Math.ceil(CW / G) + 2, gh = Math.ceil(CH / G) + 2, c = new Float32Array(gw * gh);
  for (let i = 0; i < c.length; i++) c[i] = r();
  const hist = new Uint32Array(1024);
  for (let y = 0; y < CH; y++) for (let x = 0; x < CW; x++) {
    const gx = x / G, gy = y / G, ix = gx | 0, iy = gy | 0, fx = gx - ix, fy = gy - iy;
    const v = c[iy * gw + ix] * (1 - fx) * (1 - fy) + c[iy * gw + ix + 1] * fx * (1 - fy) + c[(iy + 1) * gw + ix] * (1 - fx) * fy + c[(iy + 1) * gw + ix + 1] * fx * fy;
    const k = y * CW + x, g = 0.65 * f[k] + 0.35 * v; grain[k] = g; hist[Math.min(1023, (g * 1024) | 0)]++;
  }
  const cdf = new Float32Array(1024); let s = 0; for (let i = 0; i < 1024; i++) { s += hist[i]; cdf[i] = s / N; }
  for (let k = 0; k < N; k++) grain[k] = cdf[Math.min(1023, (grain[k] * 1024) | 0)];
})();

// SECTION: GL -- the graphics card: picture textures, one pass = one small program over a rectangle (standard technique: render to texture)
const view = document.getElementById('paper'); view.width = CW; view.height = CH;
const gl = view.getContext('webgl2', { preserveDrawingBuffer: true, antialias: false, alpha: false, depth: false, stencil: false, powerPreference: 'high-performance' });
if (!gl || !gl.getExtension('EXT_color_buffer_float')) { document.body.innerHTML = '<p style="color:#fff;font:4vh sans-serif;padding:4vh">WebGL2</p>'; throw new Error('WebGL2 with float textures is needed'); }
gl.bindVertexArray(gl.createVertexArray());
function fbFor(...ts) { const f = gl.createFramebuffer(); gl.bindFramebuffer(gl.FRAMEBUFFER, f); ts.forEach((t, i) => gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0 + i, gl.TEXTURE_2D, t, 0)); return f; }
function tex(w, h, one) {
  const t = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, t);
  for (const p of [gl.TEXTURE_MIN_FILTER, gl.TEXTURE_MAG_FILTER]) gl.texParameteri(gl.TEXTURE_2D, p, gl.NEAREST);
  for (const p of [gl.TEXTURE_WRAP_S, gl.TEXTURE_WRAP_T]) gl.texParameteri(gl.TEXTURE_2D, p, gl.CLAMP_TO_EDGE);
  gl.texStorage2D(gl.TEXTURE_2D, 1, one ? gl.R32F : gl.RGBA32F, w, h);
  return { t, w, h, fb: fbFor(t) };
}
const PIC = tex(CW, CH), WAT = tex(CW, CH), DEP = tex(CW, CH), MISC = tex(CW, CH), B0 = tex(CW, CH), FLUX = tex(CW, CH), GRAIN = tex(CW, CH, true);
// PIC: absorbance rgb + oil thickness. WAT: pigment in the water rgb + water depth. DEP: settled pigment rgb + damp paper.
// MISC: r when the oil was laid (seconds), g simple-brush stroke mask, b which stroke that mask belongs to. B0: the picture before this simple stroke.
const STATES = [PIC, WAT, DEP, MISC];
const SC = [tex(CW, CH), tex(CW, CH), tex(CW, CH)];
const scFB = [1, 2, 3].map((k) => { const f = fbFor(...SC.slice(0, k).map((s) => s.t)); gl.drawBuffers([...Array(k).keys()].map((i) => gl.COLOR_ATTACHMENT0 + i)); return f; });
const TIP = [tex(80, 80), tex(80, 80)], TILES = tex(TX, TY);
const pbo = gl.createBuffer(); gl.bindBuffer(gl.PIXEL_PACK_BUFFER, pbo); gl.bufferData(gl.PIXEL_PACK_BUFFER, TX * TY * 16, gl.STREAM_READ); gl.bindBuffer(gl.PIXEL_PACK_BUFFER, null);
const tileBuf = new Float32Array(TX * TY * 4);
let version = 0; // grows whenever the picture changes (test hooks read the picture back only then)

const fl = (x) => (Number.isInteger(x) ? x.toFixed(1) : String(x));
const VS = '#version 300 es\nvoid main(){vec2 p=vec2(float((gl_VertexID&1)<<2),float((gl_VertexID&2)<<1));gl_Position=vec4(p-1.0,0.0,1.0);}';
const HEAD = `#version 300 es
precision highp float; precision highp int; precision highp sampler2D;
const int CW = ${CW}, CH = ${CH};
${Object.entries(K).map(([k, v]) => `const float ${k} = ${fl(v)};`).join('\n')}
float sm(float e0, float e1, float x) { float t = clamp((x - e0) / (e1 - e0), 0., 1.); return t * t * (3. - 2. * t); }
vec3 ks(vec3 a) { vec3 r = clamp(exp(-a), .02, .999); return (1. - r) * (1. - r) / (2. * r); }
vec3 unks(vec3 k) { vec3 r = 1. + k - sqrt(k * k + 2. * k); return -log(clamp(r, .02, 1.)); }
vec3 km(vec3 a, vec3 b, float t) { return t <= 0. ? a : unks(mix(ks(a), ks(b), min(t, 1.))); } // Kubelka-Munk mix of two paints
bool inside(ivec2 q) { return q.x >= 0 && q.y >= 0 && q.x < CW && q.y < CH; }
ivec2 cl(ivec2 q) { return clamp(q, ivec2(0), ivec2(CW - 1, CH - 1)); }
`;
function shader(type, src) { const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s); if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s)); return s; }
function program(fs) {
  const p = gl.createProgram(); gl.attachShader(p, shader(gl.VERTEX_SHADER, VS)); gl.attachShader(p, shader(gl.FRAGMENT_SHADER, HEAD + fs)); gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
  const u = {}; for (let i = 0, n = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS); i < n; i++) { const a = gl.getActiveUniform(p, i); u[a.name.replace('[0]', '')] = { loc: gl.getUniformLocation(p, a.name), type: a.type, size: a.size }; }
  return { p, u };
}
function use(pr, uni) {
  gl.useProgram(pr.p); let unit = 0;
  for (const k in uni) { const u = pr.u[k], v = uni[k]; if (!u) continue;
    switch (u.type) {
      case gl.SAMPLER_2D: gl.activeTexture(gl.TEXTURE0 + unit); gl.bindTexture(gl.TEXTURE_2D, v.t); gl.uniform1i(u.loc, unit++); break;
      case gl.FLOAT: if (u.size > 1) gl.uniform1fv(u.loc, v); else gl.uniform1f(u.loc, v); break;
      case gl.FLOAT_VEC2: gl.uniform2f(u.loc, v[0], v[1]); break;
      case gl.FLOAT_VEC3: gl.uniform3f(u.loc, v[0], v[1], v[2]); break;
      case gl.INT: gl.uniform1i(u.loc, v); break;
      case gl.INT_VEC2: gl.uniform2i(u.loc, v[0], v[1]); break;
    } }
}
const clip = (r) => r && [Math.max(0, r[0] | 0), Math.max(0, r[1] | 0), Math.min(CW - 1, Math.ceil(r[2])), Math.min(CH - 1, Math.ceil(r[3]))];
const grow = (r, d) => r && [r[0] - d, r[1] - d, r[2] + d, r[3] + d];
const join = (a, b) => (!a ? b && b.slice() : !b ? a.slice() : [Math.min(a[0], b[0]), Math.min(a[1], b[1]), Math.max(a[2], b[2]), Math.max(a[3], b[3])]);
function scissor(r) { gl.enable(gl.SCISSOR_TEST); gl.scissor(r[0], r[1], r[2] - r[0] + 1, r[3] - r[1] + 1); }
function blit(src, dst, sx, sy, w, h, dx, dy) {
  gl.disable(gl.SCISSOR_TEST); gl.bindFramebuffer(gl.READ_FRAMEBUFFER, src.fb); gl.bindFramebuffer(gl.DRAW_FRAMEBUFFER, dst.fb);
  gl.blitFramebuffer(sx, sy, sx + w, sy + h, dx, dy, dx + w, dy + h, gl.COLOR_BUFFER_BIT, gl.NEAREST);
}
function pass(pr, r, outs, uni) { // run a program over rectangle r of the picture, writing the listed picture textures
  if (!r || r[2] < r[0] || r[3] < r[1]) return;
  gl.bindFramebuffer(gl.FRAMEBUFFER, scFB[outs.length - 1]); gl.viewport(0, 0, CW, CH); scissor(r);
  use(pr, uni); gl.drawArrays(gl.TRIANGLES, 0, 3);
  outs.forEach((T, i) => blit(SC[i], T, r[0], r[1], r[2] - r[0] + 1, r[3] - r[1] + 1, r[0], r[1]));
  version++;
}
function drawTo(T, w, h, pr, uni, r) { gl.bindFramebuffer(gl.FRAMEBUFFER, T.fb); gl.viewport(0, 0, w, h); if (r) scissor(r); else gl.disable(gl.SCISSOR_TEST); use(pr, uni); gl.drawArrays(gl.TRIANGLES, 0, 3); }
function clearTex(T, v) { gl.bindFramebuffer(gl.FRAMEBUFFER, T.fb); gl.disable(gl.SCISSOR_TEST); gl.clearBufferfv(gl.COLOR, 0, v); }
const OUT3 = 'layout(location=0) out vec4 o0; layout(location=1) out vec4 o1; layout(location=2) out vec4 o2;\n';
const OUT2 = 'layout(location=0) out vec4 o0; layout(location=1) out vec4 o1;\n';
const OUT1 = 'out vec4 o0;\n';
const OIL = `uniform sampler2D P, M, T; uniform ivec2 C; uniform int R, NB; uniform vec2 D; uniform float SP, NOW, BR[80]; uniform vec3 RES;
bool oilAt(int i, int j, out vec4 pic, out vec4 mis, out vec4 tip) { // one tip pixel against the picture pixel under it (model part 2)
  ivec2 cp = C + ivec2(i, j); pic = texelFetch(P, cl(cp), 0); mis = texelFetch(M, cl(cp), 0); tip = texelFetch(T, ivec2(i + R, j + R), 0);
  int d2 = i * i + j * j; if (d2 > R * R || !inside(cp)) return false;
  float fR = float(R), sp = (-float(i) * D.y + float(j) * D.x) / fR;
  int bi = clamp(int((sp + 1.) * .5 * float(NB)), 0, NB - 1);
  float m = (1. - sm(.85, 1., sqrt(float(d2)) / fR)) * BR[bi]; if (m <= 0.) return false;
  float h = pic.a, L = tip.a, wet = exp(-max(0., NOW - mis.r) / OIL_DRY);
  float give = m * L * OIL_GIVE * SP * (1. + OIL_RIDGE * sm(.65, .95, abs(sp)));
  float take = m * OIL_TAKE * SP * h * wet;
  float hc = h - take + give, wc = give / (h * wet - take + give + OIL_PAPER);
  float L2 = L - give + take, wt = take / (min(L2, OIL_SURF) + take + 1e-6);
  vec3 a = pic.rgb, b = tip.rgb; pic.rgb = km(a, b, wc); tip.rgb = km(b, a, wt); pic.a = hc; tip.a = L2;
  if (L2 > OIL_SURF) tip.rgb = km(tip.rgb, RES, min(1., give / (4. * OIL_SURF))); // paint from deep in the bristles refills the outside
  if (hc > 1e-6) mis.r = mix(mis.r, NOW, clamp(give / hc, 0., 1.));
  return true;
}
`;
const PR = {
  oilPic: program(OIL + OUT2 + 'void main(){ ivec2 p = ivec2(gl_FragCoord.xy); vec4 a, m, t; oilAt(p.x - C.x, p.y - C.y, a, m, t); o0 = a; o1 = m; }'),
  oilTip: program(OIL + OUT1 + 'void main(){ ivec2 t = ivec2(gl_FragCoord.xy); vec4 a, m, q; oilAt(t.x - R, t.y - R, a, m, q); o0 = q; }'),
  tipBlend: program(`uniform sampler2D T; uniform int NB; ${OUT1} void main(){ // neighbouring bristles touch and share a little paint
    ivec2 p = ivec2(gl_FragCoord.xy), n = ivec2(NB - 1); vec4 c = texelFetch(T, p, 0);
    vec3 k = .6 * ks(c.rgb) + .1 * (ks(texelFetch(T, clamp(p - ivec2(1, 0), ivec2(0), n), 0).rgb) + ks(texelFetch(T, clamp(p + ivec2(1, 0), ivec2(0), n), 0).rgb)
      + ks(texelFetch(T, clamp(p - ivec2(0, 1), ivec2(0), n), 0).rgb) + ks(texelFetch(T, clamp(p + ivec2(0, 1), ivec2(0), n), 0).rgb));
    o0 = vec4(unks(k), c.a); }`),
  crayon: program(`uniform sampler2D P, G; uniform ivec2 C; uniform float R; uniform vec3 CA; ${OUT1} void main(){
    ivec2 p = ivec2(gl_FragCoord.xy); vec4 c = texelFetch(P, p, 0); float r = length(vec2(p - C)) / R;
    float cover = clamp((texelFetch(G, p, 0).r - CRAY_T) / CRAY_RAMP, 0., 1.), a = r > 1. ? 0. : (1. - sm(.7, 1., r)) * cover * CRAY_FLOW;
    o0 = vec4(km(c.rgb, CA, a), c.a); }`),
  simple: program(`uniform sampler2D P, M, B; uniform ivec2 C; uniform float R, HD, ID; uniform vec3 CA; ${OUT3} void main(){
    ivec2 p = ivec2(gl_FragCoord.xy); vec4 pic = texelFetch(P, p, 0), mis = texelFetch(M, p, 0), b0 = texelFetch(B, p, 0);
    bool mine = mis.b == ID; if (!mine) b0 = pic; float mo = mine ? mis.g : 0.;
    float rr = length(vec2(p - C)) / R, m = rr > 1. ? 0. : rr <= HD ? 1. : 1. - sm(HD, 1., rr);
    if (m > mo) { mis.g = m; mis.b = ID; pic.rgb = km(b0.rgb, CA, m); }
    o0 = pic; o1 = mis; o2 = b0; }`),
  water: program(`uniform sampler2D W, DP, G; uniform ivec2 C; uniform float R; uniform vec3 PG; ${OUT2} void main(){
    ivec2 p = ivec2(gl_FragCoord.xy); vec4 w = texelFetch(W, p, 0), d = texelFetch(DP, p, 0); float r = length(vec2(p - C)) / R + (texelFetch(G, p, 0).r - .5) * .12; // water soaks into the paper unevenly: a ragged edge
    float m = r > 1. ? 0. : 1. - sm(.85, 1., r), add = m * W_ADD * max(0., 1. - w.a / W_MAX);
    o0 = vec4(w.rgb + PG * add * W_DENS, w.a + add); o1 = vec4(d.rgb, max(d.a, m)); }`),
  flux: program(`uniform sampler2D W, DP, G; uniform float TILT; ${OUT1} void main(){ // water leaving this pixel to its 4 neighbours (left, right, down, up)
    ivec2 p = ivec2(gl_FragCoord.xy); float w = texelFetch(W, p, 0).a, h0 = w + KP * texelFetch(G, p, 0).r; vec4 f = vec4(0);
    ivec2 n[4] = ivec2[4](p - ivec2(1, 0), p + ivec2(1, 0), p + ivec2(0, 1), p - ivec2(0, 1)); float tl[4] = float[4](0., 0., TILT, -TILT);
    for (int k = 0; k < 4; k++) { ivec2 q = n[k]; if (!inside(q)) continue;
      float gq0 = texelFetch(G, q, 0).r, dh = h0 - texelFetch(W, q, 0).a - KP * gq0 + tl[k], gq = gq0, cond = clamp(texelFetch(DP, q, 0).a + w * w * DEEP * (.1 + 1.8 * gq * gq), 0., 1.); // into damp paper, or pushed by deep water where the paper lets it (so drips break out at some places)
      f[k] = max(0., dh) * CF * cond; }
    float s = f.x + f.y + f.z + f.w; if (s > MAXF * w) f *= MAXF * w / max(s, 1e-12); o0 = f; }`),
  upd: program(`uniform sampler2D W, DP, P, F, G; uniform float DT; ${OUT3} void main(){ // model part 3, one step
    ivec2 p = ivec2(gl_FragCoord.xy); vec4 wa = texelFetch(W, p, 0), dp = texelFetch(DP, p, 0), pic = texelFetch(P, p, 0), f = texelFetch(F, p, 0); float g = texelFetch(G, p, 0).r;
    float w = wa.a, outs = f.x + f.y + f.z + f.w; vec3 pg = wa.rgb * (1. - outs / max(w, 1e-9)); float win = 0.;

// SECTION: UI -- tool tray, paint pots, size and softness, undo, new, gallery (code-drawn icons)

const buttons = [];
function makeBtn(parent, id, draw, onDown, cls) {
  const b = document.createElement('button'); b.className = 'btn' + (cls ? ' ' + cls : ''); b.dataset.id = id;
  const c = document.createElement('canvas'); b.appendChild(c); parent.appendChild(b);
  b.addEventListener('pointerdown', (e) => { e.preventDefault(); onDown(e); });
  buttons.push({ b, c, draw }); return b;
}
function drawIcon(o) { const r = o.b.getBoundingClientRect(), d = devicePixelRatio || 1; o.c.width = Math.max(1, r.width * d); o.c.height = Math.max(1, r.height * d); const c = o.c.getContext('2d'); c.scale(o.c.width / 100, o.c.height / 100); o.draw(c); }
const rgb = (i) => 'rgb(' + COLORS[i].map((v) => Math.round(v * 255)).join(',') + ')';
const ICON = {
  oil(c) { c.fillStyle = rgb(st.color); c.beginPath(); c.moveTo(14, 86); c.quadraticCurveTo(30, 60, 52, 66); c.lineTo(60, 76); c.quadraticCurveTo(40, 80, 14, 86); c.fill();
    c.save(); c.translate(56, 46); c.rotate(-0.8); c.fillStyle = '#7a4a22'; c.fillRect(-6, -40, 12, 36); c.fillStyle = '#b8b8b8'; c.fillRect(-10, -6, 20, 14); c.fillStyle = rgb(st.color); c.fillRect(-10, 8, 20, 16); c.restore(); },
  water(c) { c.fillStyle = rgb(st.color); c.globalAlpha = 0.45; c.beginPath(); c.arc(32, 70, 20, 0, 7); c.fill(); c.beginPath(); c.arc(48, 76, 14, 0, 7); c.fill(); c.globalAlpha = 1;
    c.save(); c.translate(58, 44); c.rotate(-0.8); c.fillStyle = '#3a2a1a'; c.fillRect(-4, -40, 8, 34); c.fillStyle = '#c9a23a'; c.fillRect(-6, -8, 12, 12); c.fillStyle = rgb(st.color); c.beginPath(); c.moveTo(-6, 4); c.quadraticCurveTo(0, 34, 6, 4); c.fill(); c.restore(); },
  crayon(c) { c.save(); c.translate(50, 50); c.rotate(-0.8); c.fillStyle = rgb(st.color); c.fillRect(-11, -30, 22, 50); c.beginPath(); c.moveTo(-11, 20); c.lineTo(0, 40); c.lineTo(11, 20); c.fill(); c.fillStyle = 'rgba(255,255,255,.5)'; c.fillRect(-11, -14, 22, 6); c.fillRect(-11, 4, 22, 6); c.restore(); },
  simple(c) { c.fillStyle = rgb(st.color); c.beginPath(); c.arc(38, 64, 18, 0, 7); c.fill();
    c.save(); c.translate(60, 40); c.rotate(-0.8); c.fillStyle = '#e0e0e0'; c.fillRect(-5, -36, 10, 30); c.strokeStyle = '#888'; c.lineWidth = 2; c.strokeRect(-5, -36, 10, 30); c.fillStyle = rgb(st.color); c.beginPath(); c.ellipse(0, 4, 7, 12, 0, 0, 7); c.fill(); c.restore(); },
  sticker(c) { c.save(); c.translate(50, 50); c.scale(34, 34); SKIN.star(c); c.restore(); },
  undo(c) { c.strokeStyle = '#4a3a2a'; c.lineWidth = 9; c.lineCap = 'round'; c.beginPath(); c.arc(52, 56, 24, Math.PI * 1.1, Math.PI * 2.4); c.stroke(); c.fillStyle = '#4a3a2a'; c.beginPath(); c.moveTo(14, 46); c.lineTo(36, 30); c.lineTo(38, 56); c.fill(); },
  newpage(c) { c.fillStyle = '#fff'; c.strokeStyle = '#8a7a6a'; c.lineWidth = 3; c.fillRect(24, 16, 52, 68); c.strokeRect(24, 16, 52, 68); c.strokeStyle = '#3c9a3c'; c.lineWidth = 9; c.lineCap = 'round'; c.beginPath(); c.moveTo(50, 36); c.lineTo(50, 64); c.moveTo(36, 50); c.lineTo(64, 50); c.stroke(); },
  gallery(c) { for (const [x, y, col] of [[18, 22, '#e8a33a'], [52, 22, '#3a8ad8'], [18, 54, '#d84a5a'], [52, 54, '#4aa84a']]) { c.fillStyle = '#7a5a3a'; c.fillRect(x, y, 30, 26); c.fillStyle = col; c.fillRect(x + 4, y + 4, 22, 18); } },
  tilt(c) { c.save(); c.translate(50, 46); c.rotate(-0.35); c.fillStyle = '#fff'; c.strokeStyle = '#8a7a6a'; c.lineWidth = 3; c.fillRect(-26, -30, 52, 54); c.strokeRect(-26, -30, 52, 54); c.restore();
    c.fillStyle = '#2f6fd0'; c.beginPath(); c.moveTo(40, 30); c.lineTo(62, 30); c.lineTo(62, 38); c.quadraticCurveTo(58, 44, 55, 40); c.lineTo(53, 66); c.quadraticCurveTo(51, 76, 49, 66); c.lineTo(47, 40); c.quadraticCurveTo(43, 44, 40, 38); c.fill();
    c.beginPath(); c.arc(51, 82, 5, 0, 7); c.fill(); },
  close(c) { c.strokeStyle = '#4a3a2a'; c.lineWidth = 10; c.lineCap = 'round'; c.beginPath(); c.moveTo(30, 30); c.lineTo(70, 70); c.moveTo(70, 30); c.lineTo(30, 70); c.stroke(); },
};
for (const t of ['oil', 'water', 'crayon', 'simple', 'sticker']) makeBtn(left, 'tool-' + t, ICON[t], () => { st.tool = t; refresh(); });
makeBtn(left, 'tilt', ICON.tilt, () => { st.tilt = !st.tilt; refresh(); }); // tilts the paper: wet watercolour runs down and drips
const sizeBtns = [0, 1, 2].map((i) => makeBtn(right, 'size-' + i, (c) => { c.fillStyle = '#3a2a1a'; c.beginPath(); c.arc(50, 50, [9, 18, 32][i], 0, 7); c.fill(); }, () => { st.size = i; refresh(); }));
const softBtns = [0, 1, 2].map((i) => makeBtn(right, 'soft-' + i, (c) => { const g = c.createRadialGradient(50, 50, 0, 50, 50, 34); g.addColorStop(0, '#3a2a1a'); g.addColorStop(SOFT[i], '#3a2a1a'); g.addColorStop(1, 'rgba(58,42,26,0)'); c.fillStyle = g; c.beginPath(); c.arc(50, 50, 34, 0, 7); c.fill(); }, () => { st.soft = i; refresh(); }));
makeBtn(right, 'undo', ICON.undo, () => undo());
makeBtn(right, 'new', ICON.newpage, () => newPicture());
makeBtn(right, 'gallery', ICON.gallery, () => openGallery());
const pots = COLORS.map((col, i) => makeBtn(bottom, 'color-' + i, (c) => { c.fillStyle = rgb(i); c.beginPath(); c.arc(50, 50, 40, 0, 7); c.fill(); c.strokeStyle = 'rgba(0,0,0,.25)'; c.lineWidth = 3; c.stroke(); }, () => { st.color = i; refresh(); }, 'pot'));
const trayBtns = STICKER_KINDS.map((k) => makeBtn(bottom, 'sticker-' + k, (c) => { c.save(); c.translate(50, 50); c.scale(38, 38); SKIN[k](c); c.restore(); }, (e) => newStickerDrag(e, k)));
function refresh() {
  for (const o of buttons) { const id = o.b.dataset.id;
    o.b.classList.toggle('on', id === 'tool-' + st.tool || id === 'color-' + st.color || id === 'size-' + st.size || (id === 'soft-' + st.soft && st.tool === 'simple') || (id === 'tilt' && st.tilt)); }
  const sticker = st.tool === 'sticker';
  for (const b of pots) b.classList.toggle('hide', sticker);
  for (const b of trayBtns) b.classList.toggle('hide', !sticker);
  for (const b of sizeBtns) b.classList.toggle('hide', sticker);
  for (const b of softBtns) b.classList.toggle('hide', st.tool !== 'simple');
  for (const o of buttons) if (!o.b.classList.contains('hide')) drawIcon(o);
}
function layout() {
  const vw = innerWidth, vh = innerHeight, b = Math.round(Math.min(vh * 0.085, vw * 0.06)), g = Math.round(b * 0.22);
  const root = document.documentElement.style; root.setProperty('--b', b + 'px'); root.setProperty('--g', g + 'px');
  left.style.left = g + 'px'; right.style.right = g + 'px';
  Object.assign(bottom.style, { left: (2 * g + b) + 'px', right: (2 * g + b) + 'px', bottom: g + 'px', height: b + 'px' });
  const x0 = 2 * g + b, x1 = vw - 2 * g - b, y0 = g, y1 = vh - 2 * g - b, s = Math.min((x1 - x0) / CW, (y1 - y0) / CH);
  const w = CW * s, h = CH * s, L = x0 + (x1 - x0 - w) / 2, T = y0 + (y1 - y0 - h) / 2;
  for (const el of [view, document.getElementById('stick')]) Object.assign(el.style, { left: L + 'px', top: T + 'px', width: w + 'px', height: h + 'px' });
  refresh();
}
addEventListener('resize', layout);
document.addEventListener('contextmenu', (e) => e.preventDefault());


// SECTION: GALLERY -- every picture kept on this PC (IndexedDB), the newest opens at start
let cur = { id: Date.now() }, isChanged = false, saveTimer = 0;
function changed() { isChanged = true; clearTimeout(saveTimer); saveTimer = setTimeout(() => save(), 2000); }
let dbp = null;
function db() { if (!dbp) dbp = new Promise((res, rej) => { const r = indexedDB.open('coloring-book', 1); r.onupgradeneeded = () => r.result.createObjectStore('pictures', { keyPath: 'id' }); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); return dbp; }
function req(mode, fn) { return db().then((d) => new Promise((res, rej) => { const t = d.transaction('pictures', mode), q = fn(t.objectStore('pictures')); t.oncomplete = () => res(q && q.result); t.onerror = () => rej(t.error); })); }
async function gz(u8) { return await new Response(new Blob([u8]).stream().pipeThrough(new CompressionStream('gzip'))).blob(); }
async function gunz(b) { return new Uint8Array(await new Response(b.stream().pipeThrough(new DecompressionStream('gzip'))).arrayBuffer()); }
function thumb() { render(); if (stickDirty) drawStickers(); const c = document.createElement('canvas'); c.width = 320; c.height = 200; const x = c.getContext('2d'); x.drawImage(view, 0, 0, 320, 200); x.drawImage(document.getElementById('stick'), 0, 0, 320, 200); return c.toDataURL('image/jpeg', 0.8); }
let saving = Promise.resolve();
function save() {
  saving = saving.then(async () => {
    if (!isChanged || stroke) return;
    if (water.active) { changed(); return; } // kept once the wet paint is dry
    clearTimeout(saveTimer); isChanged = false;
    const { A, H } = readPic(), qa = new Uint8Array(N * 3), qh = new Uint8Array(N);
    for (let i = 0; i < N * 3; i++) qa[i] = Math.min(255, Math.round(A[i] * 64));
    for (let i = 0; i < N; i++) qh[i] = Math.min(255, Math.round(H[i] * 127.5));
    const rec = { id: cur.id, time: Date.now(), thumb: thumb(), a: await gz(qa), h: await gz(qh), st: JSON.stringify(stickers) };
    await req('readwrite', (s) => s.put(rec));
  }).catch((e) => console.error(e));
  return saving;
}
function resetUndo() { for (const e of undoStack) release(e); undoStack.length = 0; open = null; }
function blank() {
  stopWater(); clearTex(PIC, [...PAPER_A, 0]); clearTex(WAT, [0, 0, 0, 0]); clearTex(DEP, [0, 0, 0, 0]); clearTex(MISC, [-1e6, 0, 0, 0]); version++;
}
async function load(id) {
  const rec = await req('readonly', (s) => s.get(id)); if (!rec) return false;
  const qa = await gunz(rec.a), qh = await gunz(rec.h), f = new Float32Array(N * 4);
  for (let k = 0; k < N; k++) { f[k * 4] = qa[k * 3] / 64; f[k * 4 + 1] = qa[k * 3 + 1] / 64; f[k * 4 + 2] = qa[k * 3 + 2] / 64; f[k * 4 + 3] = qh[k] / 127.5; }
  blank(); gl.bindTexture(gl.TEXTURE_2D, PIC.t); gl.texSubImage2D(gl.TEXTURE_2D, 0, 0, 0, CW, CH, gl.RGBA, gl.FLOAT, f); version++;
  stickers = JSON.parse(rec.st); stickDirty = true; cur = { id }; isChanged = false;
  resetUndo(); renderAll(); return true;
}
async function newPicture() {
  if (stroke) return; finishWater(); await save();
  blank(); stickers = []; stickDirty = true; cur = { id: Date.now() }; isChanged = false; resetUndo(); renderAll();
}
const gal = document.getElementById('gal');
async function openGallery() {
  if (stroke) return; finishWater(); await save();
  const all = (await req('readonly', (s) => s.getAll())) || [];
  all.sort((a, b) => b.time - a.time);
  gal.innerHTML = '';
  const close = document.createElement('button'); close.className = 'btn'; gal.appendChild(close);
  const cc = document.createElement('canvas'); close.appendChild(cc); close.dataset.id = 'gallery-close';
  close.addEventListener('pointerdown', (e) => { e.preventDefault(); gal.classList.add('hide'); });
  gal.classList.remove('hide'); drawIcon({ b: close, c: cc, draw: ICON.close });
  for (const r of all) {
    const card = document.createElement('button'); card.className = 'card' + (r.id === cur.id ? ' cur' : ''); card.dataset.id = 'pic-' + r.id;
    const im = document.createElement('img'); im.src = r.thumb; card.appendChild(im); gal.appendChild(card);
    card.addEventListener('click', async () => { gal.classList.add('hide'); if (r.id !== cur.id) await load(r.id); });
  }
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') { if (!stroke) finishWater(); save(); } });

// SECTION: LOOP -- wet paint moves, changed parts drawn once per frame
let lastT = 0;
function frame(t) {
  const dt = lastT ? Math.min(0.1, (t - lastT) / 1000) : 1 / 60; lastT = t;
  if (water.active) { water.acc = Math.min(water.acc + dt, MAX_STEPS * SIM_DT); while (water.acc >= SIM_DT) { simStep(SIM_DT); water.acc -= SIM_DT; } checkWater(); } // fixed steps: wet paint behaves the same at any frame rate
  render();
  if (stickDirty) drawStickers();
  requestAnimationFrame(frame);
}
(function upload() { gl.bindTexture(gl.TEXTURE_2D, GRAIN.t); gl.texSubImage2D(gl.TEXTURE_2D, 0, 0, 0, CW, CH, gl.RED, gl.FLOAT, grain); })();
(async () => {
  blank(); layout(); renderAll();
  try { const all = (await req('readonly', (s) => s.getAll())) || []; if (all.length) { all.sort((a, b) => b.time - a.time); await load(all[0].id); } } catch (e) { console.error(e); }
  window.__cb.ready = true;
})();
requestAnimationFrame(frame);

// SECTION: TEST HOOKS -- read-only views for the flow tests (age: let time pass for the oil paint)
window.__cb = { CW, CH, st, grain, undoStack, water, get A() { return readPic().A; }, get Ht() { return readPic().H; }, get stickers() { return stickers; }, get cur() { return cur; }, ready: false,
  screenOf(x, y) { const r = view.getBoundingClientRect(); return [r.left + x * r.width / CW, r.top + y * r.height / CH]; },
  btn(id) { const b = document.querySelector('[data-id="' + id + '"]'); if (!b || b.classList.contains('hide')) return null; const r = b.getBoundingClientRect(); return [r.left + r.width / 2, r.top + r.height / 2]; },
  shown(x, y) { render(); const d = new Uint8Array(4); gl.bindFramebuffer(gl.READ_FRAMEBUFFER, null); gl.readPixels(Math.round(x), CH - 1 - Math.round(y), 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, d); return [d[0], d[1], d[2]]; },
  age(s) { clockShift += s; },
  fast(sec) { for (let i = 0; i < sec / SIM_DT && water.active; i++) { simStep(SIM_DT); if (i % 24 === 0) { water.frames = CHECK_EVERY - 1; checkWater(); gl.finish(); checkWater(); } } render(); }, // debug: let the wet paint run on

  sum(T, r) { const t = { W: WAT, D: DEP, P: PIC }[T], w = r[2] - r[0], h = r[3] - r[1], f = new Float32Array(w * h * 4); gl.bindFramebuffer(gl.READ_FRAMEBUFFER, t.fb); gl.readPixels(r[0], r[1], w, h, gl.RGBA, gl.FLOAT, f); const s = [0, 0, 0, 0]; for (let i = 0; i < f.length; i++) s[i & 3] += f[i]; return s.map((v) => +v.toFixed(1)); },
  probe(pts) { const f = new Float32Array(4), o = []; for (const [x, y] of pts) { const v = []; for (const T of [WAT, DEP]) { gl.bindFramebuffer(gl.READ_FRAMEBUFFER, T.fb); gl.readPixels(x, y, 1, 1, gl.RGBA, gl.FLOAT, f); v.push(+f[3].toFixed(3)); } o.push(v); } return o; }, save: () => save(), count: async () => ((await req('readonly', (s) => s.getAll())) || []).length };
</script>
