</style></head><body>
<canvas id="paper" class="pic"></canvas>
<canvas id="stick" class="pic"></canvas>
<div id="left" class="bar"></div>
<div id="right" class="bar"></div>
<div id="bottom" class="bar"></div>
<div id="gal" class="hide"></div>
<script>
'use strict';
// SECTION: MODEL -- the paint model in plain words
/* The paint model (one part per material):
 1. The picture is a grid of pixels. Each pixel holds how much light its paint swallows, per red/green/blue
    (absorbance, A = -ln(reflectance)), and how thick the paint is (H). Mixing two paints averages their absorbance
    by amount, a subtractive mix, so blue and yellow make green (standard technique: Beer-Lambert pigment mixing).
 2. Oil brush (standard technique: two-way paint transfer, as ArtRage and Rebelle do it): the brush tip is a small grid
    of paint that travels with the finger. At every dab each tip pixel gives some of its paint to the picture and takes
    some of the picture's paint back, so the brush carries and mixes colour along the stroke and runs dry. Only the
    paint on the outside of the bristles mixes; the paint deep in them refills it with the brush's own colour,
    and neighbouring bristles share a little paint. Across the
    stroke the tip is split into bristles of uneven strength (streaks), and the stroke's edges get a ridge of paint.
 3. Watercolour (standard technique: Curtis et al. 1997, simplified): a stroke wets a see-through layer of pigment that
    spreads a little while wet, then dries into the picture (absorbance adds, so layers darken), darker at its rim.
 4. Crayon: wax lands only on the raised grain of the paper, a fixed paper texture, so specks of paper stay.
 5. Simple brush: a round dab with a size and a softness; one stroke is one even coat (standard technique: a stroke
    mask that keeps the strongest dab per pixel).
 Light: paint thickness is lit from the top left (bump shading from the slope of H). */

// SECTION: SETUP -- picture size, buffers, paper grain, colours
const CW = 1600, CH = 1000, N = CW * CH, TS = 64, TX = Math.ceil(CW / TS), TY = Math.ceil(CH / TS);

const tileStamp = new Int32Array(TX * TY).fill(-1);
const ab = (c) => -Math.log(Math.max(0.02, c));
const PAPER = [0.96, 0.945, 0.9], PAPER_A = PAPER.map(ab);
const COLORS = [ // reflectance, sRGB 0..1
  [0.97, 0.97, 0.95], [0.04, 0.04, 0.05], [0.86, 0.06, 0.07], [0.98, 0.45, 0.05], [1.0, 0.88, 0.06], [0.1, 0.55, 0.15],
  [0.35, 0.7, 0.95], [0.05, 0.2, 0.75], [0.45, 0.12, 0.6], [0.98, 0.55, 0.7], [0.45, 0.25, 0.1]];
const SIZES = [8, 18, 36]; // brush radius for each size dot, the same for every tool (owner 20 Nov)

function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

  for (let y = 1; y < CH - 1; y++) for (let x = 0; x < CW; x++) { const k = y * CW + x; f[k] = (t[k - CW] + t[k] + t[k + CW]) / 3; }
  const G = 7, gw = Math.ceil(CW / G) + 2, gh = Math.ceil(CH / G) + 2, c = new Float32Array(gw * gh);
  for (let i = 0; i < c.length; i++) c[i] = r();

    const gx = x / G, gy = y / G, ix = gx | 0, iy = gy | 0, fx = gx - ix, fy = gy - iy;
    const v = c[iy * gw + ix] * (1 - fx) * (1 - fy) + c[iy * gw + ix + 1] * fx * (1 - fy) + c[(iy + 1) * gw + ix] * (1 - fx) * fy + c[(iy + 1) * gw + ix + 1] * fx * fy;
    const k = y * CW + x, g = 0.65 * f[k] + 0.35 * v; grain[k] = g; hist[Math.min(1023, (g * 1024) | 0)]++;
  }

})();
function blank() { for (let k = 0; k < N; k++) { A[k * 3] = PAPER_A[0]; A[k * 3 + 1] = PAPER_A[1]; A[k * 3 + 2] = PAPER_A[2]; Ht[k] = 0; } }

// SECTION: RENDER -- picture buffers to the screen
const view = document.getElementById('paper'), vctx = view.getContext('2d');
view.width = CW; view.height = CH;
const img = vctx.createImageData(CW, CH), px = img.data;
let dirty = null;
function markDirty(x0, y0, x1, y1) {

  if (!dirty) dirty = [x0, y0, x1, y1]; else { dirty[0] = Math.min(dirty[0], x0); dirty[1] = Math.min(dirty[1], y0); dirty[2] = Math.max(dirty[2], x1); dirty[3] = Math.max(dirty[3], y1); }
}

    const h = Ht[k], xl = x > 0 ? -1 : 0, xr = x < CW - 1 ? 1 : 0, yu = y > 0 ? -CW : 0, yd = y < CH - 1 ? CW : 0;
    const gx = (Ht[k + yu + xr] + 2 * Ht[k + xr] + Ht[k + yd + xr]) - (Ht[k + yu + xl] + 2 * Ht[k + xl] + Ht[k + yd + xl]);
    const gy = (Ht[k + yd + xl] + 2 * Ht[k + yd] + Ht[k + yd + xr]) - (Ht[k + yu + xl] + 2 * Ht[k + yu] + Ht[k + yu + xr]);
    const nx = -gx * BUMP, ny = -gy * BUMP, nl = 1 / Math.sqrt(nx * nx + ny * ny + 1);

    px[o] = Math.exp(-a0) * sh * 255 + sp; px[o + 1] = Math.exp(-a1) * sh * 255 + sp; px[o + 2] = Math.exp(-a2) * sh * 255 + sp; px[o + 3] = 255;
  }

}

// SECTION: UNDO -- tiles copied the first time a stroke touches them (standard technique: tile-based undo)
let strokeNo = 0, entry = null;
const undoStack = []; let undoBytes = 0;
const UNDO_MAX = 12, UNDO_BYTES = 140e6;

    const ti = ty * TX + tx; if (tileStamp[ti] === strokeNo) continue; tileStamp[ti] = strokeNo;
    const bx = tx * TS, by = ty * TS, w = Math.min(TS, CW - bx), h = Math.min(TS, CH - by);
    const ta = new Float32Array(w * h * 3), th = new Float32Array(w * h);
    for (let j = 0; j < h; j++) {
      const k = (by + j) * CW + bx;
      ta.set(A.subarray(k * 3, (k + w) * 3), j * w * 3); th.set(Ht.subarray(k, k + w), j * w);
      B0A.set(A.subarray(k * 3, (k + w) * 3), k * 3); B0H.set(Ht.subarray(k, k + w), k); S.fill(0, k, k + w);

function newEntry() { strokeNo++; entry = { kind: 'paint', tiles: [], bytes: 0 }; }
function pushEntry(e) {

}
function undo() {
  if (stroke) return;

  const e = undoStack.pop(); if (!e) return;
  undoBytes -= e.bytes || 0;
  if (e.kind === 'paint') for (const t of e.tiles) {
    for (let j = 0; j < t.h; j++) { const k = (t.by + j) * CW + t.bx; A.set(t.a.subarray(j * t.w * 3, (j + 1) * t.w * 3), k * 3); Ht.set(t.h2.subarray(j * t.w, (j + 1) * t.w), k); }
    markDirty(t.bx, t.by, t.bx + t.w - 1, t.by + t.h - 1);
  } else { stickers = JSON.parse(e.before); stickDirty = true; }
  changed();
}

// SECTION: TOOLS -- one dab of each material (the model's parts 2-5)
const st = { tool: 'oil', color: 4, size: 1, soft: 0 };
let stroke = null;
const water = { active: false, pig: [0, 0, 0], rect: null, last: 0, stroking: false };
const smooth = (e0, e1, x) => { const t = Math.min(1, Math.max(0, (x - e0) / (e1 - e0))); return t * t * (3 - 2 * t); };
function oilStart(s) {
  const R = s.r, n = 2 * R + 1, ca = COLORS[st.color].map(ab);
  s.n = n; s.res = ca; s.tipA = new Float32Array(n * n * 3); s.tipL = new Float32Array(n * n).fill(OIL_LOAD);
  for (let t = 0; t < n * n; t++) { s.tipA[t * 3] = ca[0]; s.tipA[t * 3 + 1] = ca[1]; s.tipA[t * 3 + 2] = ca[2]; }
  const NB = 2 * R + 1, r = rng((Math.random() * 1e9) | 0), b = new Float32Array(NB); // one bristle per pixel across
  for (let i = 0; i < NB; i++) b[i] = r() * r();
  let sm = b; for (let pass = 0; pass < 3; pass++) { const t = sm; sm = t.map((v, i) => (t[Math.max(0, i - 2)] + 4 * t[Math.max(0, i - 1)] + 6 * v + 4 * t[Math.min(NB - 1, i + 1)] + t[Math.min(NB - 1, i + 2)]) / 16); } // bristles blend into soft grooves

function oilDab(s, cx, cy) {
  const R = s.r, n = s.n, dx = s.dir[0], dy = s.dir[1], NB = s.bristle.length, tipA = s.tipA, tipL = s.tipL;
  const X = Math.round(cx), Y = Math.round(cy);
  for (let i = 0; i < NB; i++) s.bristle[i] = Math.min(1, Math.max(0.2, s.bristle[i] + (s.rnd() - 0.5) * 0.02)); // each bristle wanders
  captureRect(X - R, Y - R, X + R, Y + R);
  for (let j = -R; j <= R; j++) {
    const y = Y + j; if (y < 0 || y >= CH) continue;
    for (let i = -R; i <= R; i++) {
      const x = X + i, d2 = i * i + j * j; if (x < 0 || x >= CW || d2 > R * R) continue;
      const sp = (-i * dy + j * dx) / R, bi = Math.min(NB - 1, Math.max(0, ((sp + 1) * 0.5 * NB) | 0));

      if (L2 > OIL_SURF) { const f = Math.min(1, give / (4 * OIL_SURF)); for (let c = 0; c < 3; c++) tipA[t * 3 + c] += (s.res[c] - tipA[t * 3 + c]) * f; } // paint from deep in the bristles refills the outside

function tipBlend(s) { // neighbouring bristles touch and share a little paint

function waterDab(s, cx, cy) {

function simpleDab(s, cx, cy) {

// SECTION: STROKE -- finger on the paper: one finger paints, others are ignored

let painter = null; // the one pointer that paints
function toPaper(e) { const r = view.getBoundingClientRect(); return { x: (e.clientX - r.left) * CW / r.width, y: (e.clientY - r.top) * CH / r.height }; }
view.addEventListener('pointerdown', (e) => {

// SECTION: STICKERS -- code-drawn stickers, dragged from the tray, they sit on top of the paint
const sctx = document.getElementById('stick').getContext('2d');

const STICKER_R = 75;
const SKIN = { // every sticker drawn round 0,0 within radius 1
  sun(c) { c.fillStyle = '#f7b500'; for (let i = 0; i < 12; i++) { c.save(); c.rotate(i * Math.PI / 6); c.beginPath(); c.moveTo(-0.12, 0.6); c.lineTo(0, 1); c.lineTo(0.12, 0.6); c.fill(); c.restore(); } c.fillStyle = '#ffd23a'; c.beginPath(); c.arc(0, 0, 0.6, 0, 7); c.fill(); },

  flower(c) { c.fillStyle = '#f25c94'; for (let i = 0; i < 6; i++) { const a = i * Math.PI / 3; c.beginPath(); c.arc(0.55 * Math.cos(a), 0.55 * Math.sin(a), 0.38, 0, 7); c.fill(); } c.fillStyle = '#ffd23a'; c.beginPath(); c.arc(0, 0, 0.34, 0, 7); c.fill(); },

  boat(c) { c.fillStyle = '#8a4b1f'; c.beginPath(); c.moveTo(-0.95, 0.3); c.lineTo(0.95, 0.3); c.lineTo(0.6, 0.75); c.lineTo(-0.6, 0.75); c.fill(); c.fillStyle = '#5a3414'; c.fillRect(-0.04, -0.9, 0.08, 1.2); c.fillStyle = '#fff'; c.strokeStyle = '#bbb'; c.lineWidth = 0.04; c.beginPath(); c.moveTo(0.06, -0.85); c.lineTo(0.75, 0.2); c.lineTo(0.06, 0.2); c.closePath(); c.fill(); c.stroke(); },
  heart(c) { c.fillStyle = '#e8243c'; c.beginPath(); c.moveTo(0, 0.85); c.bezierCurveTo(-1.2, 0, -0.6, -0.95, 0, -0.35); c.bezierCurveTo(0.6, -0.95, 1.2, 0, 0, 0.85); c.fill(); },

const STICKER_KINDS = Object.keys(SKIN);
function drawStickers() {

}
function hitSticker(p) { for (let i = stickers.length - 1; i >= 0; i--) if (Math.hypot(stickers[i].x - p.x, stickers[i].y - p.y) < STICKER_R) return i; return -1; }

function startStickerDrag(e, i, p) {

function newStickerDrag(e, kind) {

window.addEventListener('pointermove', (e) => { if (!dragging || e.pointerId !== dragging.id) return; const p = toPaper(e), s = stickers[dragging.i]; s.x = p.x + dragging.dx; s.y = p.y + dragging.dy; stickDirty = true; });

window.addEventListener('pointerup', dragUp); window.addEventListener('pointercancel', dragUp);

// SECTION: UI -- tool tray, paint pots, size and softness, undo, new, gallery (code-drawn icons)
const left = document.getElementById('left'), right = document.getElementById('right'), bottom = document.getElementById('bottom');
const buttons = [];
function makeBtn(parent, id, draw, onDown, cls) {
  const b = document.createElement('button'); b.className = 'btn' + (cls ? ' ' + cls : ''); b.dataset.id = id;
  const c = document.createElement('canvas'); b.appendChild(c); parent.appendChild(b);
  b.addEventListener('pointerdown', (e) => { e.preventDefault(); onDown(e); });
  buttons.push({ b, c, draw }); return b;
}
function drawIcon(o) { const r = o.b.getBoundingClientRect(), d = devicePixelRatio || 1; o.c.width = Math.max(1, r.width * d); o.c.height = Math.max(1, r.height * d); const c = o.c.getContext('2d'); c.scale(o.c.width / 100, o.c.height / 100); o.draw(c); }
const rgb = (i) => 'rgb(' + COLORS[i].map((v) => Math.round(v * 255)).join(',') + ')';
const ICON = {
  oil(c) { c.fillStyle = rgb(st.color); c.beginPath(); c.moveTo(14, 86); c.quadraticCurveTo(30, 60, 52, 66); c.lineTo(60, 76); c.quadraticCurveTo(40, 80, 14, 86); c.fill();
    c.save(); c.translate(56, 46); c.rotate(-0.8); c.fillStyle = '#7a4a22'; c.fillRect(-6, -40, 12, 36); c.fillStyle = '#b8b8b8'; c.fillRect(-10, -6, 20, 14); c.fillStyle = rgb(st.color); c.fillRect(-10, 8, 20, 16); c.restore(); },
  water(c) { c.fillStyle = rgb(st.color); c.globalAlpha = 0.45; c.beginPath(); c.arc(32, 70, 20, 0, 7); c.fill(); c.beginPath(); c.arc(48, 76, 14, 0, 7); c.fill(); c.globalAlpha = 1;
    c.save(); c.translate(58, 44); c.rotate(-0.8); c.fillStyle = '#3a2a1a'; c.fillRect(-4, -40, 8, 34); c.fillStyle = '#c9a23a'; c.fillRect(-6, -8, 12, 12); c.fillStyle = rgb(st.color); c.beginPath(); c.moveTo(-6, 4); c.quadraticCurveTo(0, 34, 6, 4); c.fill(); c.restore(); },
  crayon(c) { c.save(); c.translate(50, 50); c.rotate(-0.8); c.fillStyle = rgb(st.color); c.fillRect(-11, -30, 22, 50); c.beginPath(); c.moveTo(-11, 20); c.lineTo(0, 40); c.lineTo(11, 20); c.fill(); c.fillStyle = 'rgba(255,255,255,.5)'; c.fillRect(-11, -14, 22, 6); c.fillRect(-11, 4, 22, 6); c.restore(); },
  simple(c) { c.fillStyle = rgb(st.color); c.beginPath(); c.arc(38, 64, 18, 0, 7); c.fill();
    c.save(); c.translate(60, 40); c.rotate(-0.8); c.fillStyle = '#e0e0e0'; c.fillRect(-5, -36, 10, 30); c.strokeStyle = '#888'; c.lineWidth = 2; c.strokeRect(-5, -36, 10, 30); c.fillStyle = rgb(st.color); c.beginPath(); c.ellipse(0, 4, 7, 12, 0, 0, 7); c.fill(); c.restore(); },
  sticker(c) { c.save(); c.translate(50, 50); c.scale(34, 34); SKIN.star(c); c.restore(); },
  undo(c) { c.strokeStyle = '#4a3a2a'; c.lineWidth = 9; c.lineCap = 'round'; c.beginPath(); c.arc(52, 56, 24, Math.PI * 1.1, Math.PI * 2.4); c.stroke(); c.fillStyle = '#4a3a2a'; c.beginPath(); c.moveTo(14, 46); c.lineTo(36, 30); c.lineTo(38, 56); c.fill(); },
  newpage(c) { c.fillStyle = '#fff'; c.strokeStyle = '#8a7a6a'; c.lineWidth = 3; c.fillRect(24, 16, 52, 68); c.strokeRect(24, 16, 52, 68); c.strokeStyle = '#3c9a3c'; c.lineWidth = 9; c.lineCap = 'round'; c.beginPath(); c.moveTo(50, 36); c.lineTo(50, 64); c.moveTo(36, 50); c.lineTo(64, 50); c.stroke(); },
  gallery(c) { for (const [x, y, col] of [[18, 22, '#e8a33a'], [52, 22, '#3a8ad8'], [18, 54, '#d84a5a'], [52, 54, '#4aa84a']]) { c.fillStyle = '#7a5a3a'; c.fillRect(x, y, 30, 26); c.fillStyle = col; c.fillRect(x + 4, y + 4, 22, 18); } },
  close(c) { c.strokeStyle = '#4a3a2a'; c.lineWidth = 10; c.lineCap = 'round'; c.beginPath(); c.moveTo(30, 30); c.lineTo(70, 70); c.moveTo(70, 30); c.lineTo(30, 70); c.stroke(); },

for (const t of ['oil', 'water', 'crayon', 'simple', 'sticker']) makeBtn(left, 'tool-' + t, ICON[t], () => { st.tool = t; refresh(); });
const sizeBtns = [0, 1, 2].map((i) => makeBtn(right, 'size-' + i, (c) => { c.fillStyle = '#3a2a1a'; c.beginPath(); c.arc(50, 50, [9, 18, 32][i], 0, 7); c.fill(); }, () => { st.size = i; refresh(); }));
const softBtns = [0, 1, 2].map((i) => makeBtn(right, 'soft-' + i, (c) => { const g = c.createRadialGradient(50, 50, 0, 50, 50, 34); g.addColorStop(0, '#3a2a1a'); g.addColorStop(SOFT[i], '#3a2a1a'); g.addColorStop(1, 'rgba(58,42,26,0)'); c.fillStyle = g; c.beginPath(); c.arc(50, 50, 34, 0, 7); c.fill(); }, () => { st.soft = i; refresh(); }));
makeBtn(right, 'undo', ICON.undo, () => undo());
makeBtn(right, 'new', ICON.newpage, () => newPicture());
makeBtn(right, 'gallery', ICON.gallery, () => openGallery());
const pots = COLORS.map((col, i) => makeBtn(bottom, 'color-' + i, (c) => { c.fillStyle = rgb(i); c.beginPath(); c.arc(50, 50, 40, 0, 7); c.fill(); c.strokeStyle = 'rgba(0,0,0,.25)'; c.lineWidth = 3; c.stroke(); }, () => { st.color = i; refresh(); }, 'pot'));
const trayBtns = STICKER_KINDS.map((k) => makeBtn(bottom, 'sticker-' + k, (c) => { c.save(); c.translate(50, 50); c.scale(38, 38); SKIN[k](c); c.restore(); }, (e) => newStickerDrag(e, k)));
function refresh() {

    o.b.classList.toggle('on', id === 'tool-' + st.tool || id === 'color-' + st.color || id === 'size-' + st.size || (id === 'soft-' + st.soft && st.tool === 'simple')); }

function layout() {
  const vw = innerWidth, vh = innerHeight, b = Math.round(Math.min(vh * 0.085, vw * 0.06)), g = Math.round(b * 0.22);

  const x0 = 2 * g + b, x1 = vw - 2 * g - b, y0 = g, y1 = vh - 2 * g - b, s = Math.min((x1 - x0) / CW, (y1 - y0) / CH);

addEventListener('resize', layout);
document.addEventListener('contextmenu', (e) => e.preventDefault());

// SECTION: GALLERY -- every picture kept on this PC (IndexedDB), the newest opens at start
let cur = { id: Date.now() }, isChanged = false, saveTimer = 0;

let dbp = null;
function db() { if (!dbp) dbp = new Promise((res, rej) => { const r = indexedDB.open('coloring-book', 1); r.onupgradeneeded = () => r.result.createObjectStore('pictures', { keyPath: 'id' }); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); return dbp; }
function req(mode, fn) { return db().then((d) => new Promise((res, rej) => { const t = d.transaction('pictures', mode), q = fn(t.objectStore('pictures')); t.oncomplete = () => res(q && q.result); t.onerror = () => rej(t.error); })); }
async function gz(u8) { return await new Response(new Blob([u8]).stream().pipeThrough(new CompressionStream('gzip'))).blob(); }

let saving = Promise.resolve();
function save() {
  saving = saving.then(async () => {
    if (!isChanged || stroke) return; clearTimeout(saveTimer); bakeWater(); isChanged = false;
    const qa = new Uint8Array(N * 3), qh = new Uint8Array(N);
    for (let i = 0; i < N * 3; i++) qa[i] = Math.min(255, Math.round(A[i] * 64));
    for (let i = 0; i < N; i++) qh[i] = Math.min(255, Math.round(Ht[i] * 127.5));
    const rec = { id: cur.id, time: Date.now(), thumb: thumb(), a: await gz(qa), h: await gz(qh), st: JSON.stringify(stickers) };
    await req('readwrite', (s) => s.put(rec));

}
async function load(id) {
  const rec = await req('readonly', (s) => s.get(id)); if (!rec) return false;

}
async function newPicture() {

}
const gal = document.getElementById('gal');
async function openGallery() {

  gal.innerHTML = '';
  const close = document.createElement('button'); close.className = 'btn'; gal.appendChild(close);
  const cc = document.createElement('canvas'); close.appendChild(cc); close.dataset.id = 'gallery-close';
  close.addEventListener('pointerdown', (e) => { e.preventDefault(); gal.classList.add('hide'); });
  gal.classList.remove('hide'); drawIcon({ b: close, c: cc, draw: ICON.close });
  for (const r of all) {
    const card = document.createElement('button'); card.className = 'card' + (r.id === cur.id ? ' cur' : ''); card.dataset.id = 'pic-' + r.id;
    const im = document.createElement('img'); im.src = r.thumb; card.appendChild(im); gal.appendChild(card);
    card.addEventListener('click', async () => { gal.classList.add('hide'); if (r.id !== cur.id) await load(r.id); });
  }
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') save(); });

// SECTION: LOOP -- wet watercolour spreads then dries, dirty parts drawn once per frame
function frame() {
  if (water.active) {
    const age = (performance.now() - water.last) / 1000;
    if (water.stroking || age < WET_SECS) spreadWater(); else bakeWater();

}
(async () => {
  blank(); layout(); renderAll();
  try { const all = (await req('readonly', (s) => s.getAll())) || []; if (all.length) { all.sort((a, b) => b.time - a.time); await load(all[0].id); } } catch (e) { console.error(e); }

requestAnimationFrame(frame);

// SECTION: TEST HOOKS -- read-only views for the flow tests
window.__cb = { CW, CH, st, A, Ht, grain, undoStack, water, get stickers() { return stickers; }, get cur() { return cur; }, ready: false,
  screenOf(x, y) { const r = view.getBoundingClientRect(); return [r.left + x * r.width / CW, r.top + y * r.height / CH]; },

  shown(x, y) { const d = vctx.getImageData(Math.round(x), Math.round(y), 1, 1).data; return [d[0], d[1], d[2]]; },
  save: () => save(), count: async () => ((await req('readonly', (s) => s.getAll())) || []).length };
</script>
