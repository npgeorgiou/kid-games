<script>
'use strict';
// SECTION: MODEL -- the paint model in plain words
/* The paint model (all of it runs on the graphics card, one small program per step). Words used: a medium is what
 you paint with (oil, acrylic, watercolour, crayon, simple brush); a brush shape is the shape of the brush or crayon
 tip (round, flat, filbert, mop; point, blunt, side); paint load is how much paint the brush took (hold a colour longer).
 1. The picture is a grid of pixels on a canvas (watercolour paper, smooth paper, cotton canvas, linen; each has its
    own surface grain). Each pixel holds how much light its paint swallows, per red/green/blue (absorbance,
    A = -ln(reflectance)), and how thick the paint is (H). Wet paints mix with each other like real pigment (Mixbox
    library, Kubelka-Munk based, by Secret Weapons, CC BY-NC 4.0); paint laid over paper or dry paint covers it
    (standard technique: Kubelka-Munk). See-through watercolour layers add their absorbance on top
    (standard technique: Beer-Lambert glazing).
 2. Oil and acrylic (standard technique: two-way paint transfer, as ArtRage and Rebelle do it): the brush tip is a small
    grid of paint that travels with the finger, shaped like the brush, turned across the stroke. At every dab each tip
    pixel gives some of its paint to the picture and takes some of the picture's wet paint back, so the brush carries and
    mixes colour and runs dry; a brush low on paint touches only the raised grain of the canvas (dry brush). Only the
    paint on the outside of the bristles mixes; the paint deep in them refills it with the brush's own colour, and
    neighbouring bristles share a little paint. Across the tip the bristles are of uneven strength (streaks), and the
    stroke's sides get a ridge. Each pixel remembers when its paint was laid; paint dries (acrylic much faster than
    oil), and only the wet part can be picked up, so new paint sits on top of dry paint. Acrylic is thinner, covers
    better and is less glossy.
 3. Watercolour (standard techniques: Curtis et al. 1997 for pigment in water; the virtual-pipes shallow-water model,
    O'Brien and Hodgins 1995 / Mei et al. 2007, for the flow): the brush puts water and pigment on the paper and makes
    it damp; the brush's water runs out along the stroke. Water flows to lower neighbours (deeper water, the paper's
    dips) only into damp paper or pushed by deep water, and carries its pigment; pigment also spreads through the water.
    Water dries faster at the edge of a wet patch, so pigment moves out to the edge (darker rim). Pigment settles out of
    the water, a little more in the paper's dips (granulation), is lifted again while there is a lot of water, and is
    fixed when the paper is dry.
 4. Crayon: wax rubs off onto the raised grain of the canvas; pressing harder (or more wax) reaches deeper into the dips,
    and the crayon's own uneven tip leaves streaks along the stroke.
 5. Simple brush: a dab with a shape, a size and a softness; one stroke is one even coat (standard technique: a stroke
    mask that keeps the strongest dab per pixel).
 Pressure: a pen's pressure, or on a touch screen how much of the finger touches, gives more paint and a wider mark.
 Light: paint thickness and the canvas grain are lit from the top left (bump shading); damp paper looks a little darker. */

// SECTION: SETUP -- picture size, canvases, colours, brush shapes, tuning
const CW = 1600, CH = 1000, N = CW * CH, TS = 64, TX = Math.ceil(CW / TS), TY = Math.ceil(CH / TS);

const ab = (c) => -Math.log(Math.max(0.02, c));
const CANVASES = { // the canvas's colour and its surface (grain kind, how strongly it shows in the light)
  wc: { paper: [0.975, 0.968, 0.945], kind: 'rough', bump: 0.35 }, // watercolour paper (owner 21 Nov: whiter)
  smooth: { paper: [0.985, 0.982, 0.97], kind: 'smooth', bump: 0.12 },
  cotton: { paper: [0.95, 0.94, 0.91], kind: 'cotton', bump: 0.45 },

  [[0.97, 0.97, 0.95], [0.04, 0.04, 0.05], [0.86, 0.06, 0.07], [0.98, 0.45, 0.05], [1.0, 0.88, 0.06], [0.1, 0.55, 0.15], [0.35, 0.7, 0.95], [0.05, 0.2, 0.75], [0.45, 0.12, 0.6], [0.98, 0.55, 0.7], [0.45, 0.25, 0.1]],
  [[0.96, 0.82, 0.7], [0.9, 0.7, 0.55], [0.78, 0.55, 0.4], [0.6, 0.4, 0.28], [0.42, 0.27, 0.18], [0.28, 0.17, 0.11], [0.8, 0.6, 0.25], [0.75, 0.35, 0.2], [0.45, 0.45, 0.2], [0.88, 0.8, 0.6], [0.2, 0.12, 0.08]], // skin and earth

];

const SOFT = [0.95, 0.6, 0.05]; // sharp, medium, fuzzy: how far out the dab stays full strength
const LOADS = [1 / 3, 2 / 3, 1]; // paint load for 1, 2, 3 dots (owner 21 Nov: hold a colour, one more dot each half second)

  oil: [{ id: 'round', k: 0, al: 1 }, { id: 'flat', k: 1, al: 0.22 }, { id: 'filbert', k: 2, al: 0.45 }],
  acrylic: [{ id: 'round', k: 0, al: 1 }, { id: 'flat', k: 1, al: 0.22 }, { id: 'filbert', k: 2, al: 0.45 }],
  water: [{ id: 'round', k: 0, al: 1 }, { id: 'flat', k: 1, al: 0.25 }, { id: 'mop', k: 0, al: 1, soft: 0.5, water: 1.3 }],
  crayon: [{ id: 'point', k: 0, al: 1, sc: 0.5 }, { id: 'blunt', k: 0, al: 1 }, { id: 'side', k: 1, al: 0.3, light: 0.75 }],

  W_ADD: 0.35, W_MAX: 1.5, PDIF: 25, W_DENS: 0.8, W_LEN: 30, // water per dab, most water a pixel holds, pigment spreading, pigment per water, stroke length (in brush radii) a full brush's water lasts
  CF: 0.2, DEEP: 0.3, KP: 0.015, MAXF: 0.5, // flow: speed, how deep water pushes onto dry paper, pull of the paper's dips, most water leaving a pixel per step
  EV: 0.15, EDGE: 25, W0: 0.02, SETTLE: 30, DEP0: 0.05, GRAN: 0.35, LIFT: 0.3, DAMPW: 2, DAMPE: 2, FIX: 4, // drying, edge drying, settling, granulation, lifting, damp paper, fixing
  CRAY_COVER: 0.8, CRAY_FLOW: 0.5,

  const n = W * H, r = rng(7), f = new Float32Array(n), h = out || new Float32Array(n);
  for (let i = 0; i < n; i++) f[i] = r();
  const t = new Float32Array(n); // fine noise blurred once
  for (let y = 0; y < H; y++) for (let x = 1; x < W - 1; x++) { const k = y * W + x; t[k] = (f[k - 1] + f[k] + f[k + 1]) / 3; }
  for (let y = 1; y < H - 1; y++) for (let x = 0; x < W; x++) { const k = y * W + x; f[k] = (t[k - W] + t[k] + t[k + W]) / 3; }
  const G = 7, gw = Math.ceil(W / G) + 2, gh = Math.ceil(H / G) + 2, c = new Float32Array(gw * gh);
  for (let i = 0; i < c.length; i++) c[i] = r();
  const coarse = (x, y) => { const gx = x / G, gy = y / G, ix = gx | 0, iy = gy | 0, fx = gx - ix, fy = gy - iy; return c[iy * gw + ix] * (1 - fx) * (1 - fy) + c[iy * gw + ix + 1] * fx * (1 - fy) + c[(iy + 1) * gw + ix] * (1 - fx) * fy + c[(iy + 1) * gw + ix + 1] * fx * fy; };
  const P = kind === 'linen' ? 5 : 8, th = new Float32Array(Math.ceil(Math.max(W, H) / P) + 2).map(() => 0.65 + 0.6 * r()); // threads; linen's vary in thickness (slubs)
  const S = Math.PI;
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const k = y * W + x; let g;
    if (kind === 'rough') g = 0.65 * f[k] + 0.35 * coarse(x, y);
    else if (kind === 'smooth') g = 0.5 + 0.35 * (f[k] - 0.5);
    else { // plain weave (standard: threads alternate over and under): warp runs down, weft across
      const i = Math.floor(x / P), j = Math.floor(y / P), u = x / P - i, v = y / P - j;
      const warp = Math.pow(Math.sin(S * u), th[i]) * (0.55 + 0.45 * Math.sin(S * v)), weft = Math.pow(Math.sin(S * v), th[j]) * (0.55 + 0.45 * Math.sin(S * u));
      g = ((i + j) & 1 ? weft : warp) * 0.8 + (kind === 'linen' ? 0.3 : 0.15) * (f[k] - 0.5) + 0.1;
    }

  }

  for (let k = 0; k < n; k++) { lo = Math.min(lo, h[k]); hi = Math.max(hi, h[k]); }
  for (let k = 0; k < n; k++) { h[k] = (h[k] - lo) / (hi - lo + 1e-9); hist[Math.min(1023, (h[k] * 1024) | 0)]++; }
  const cdf = new Float32Array(1024); let s = 0; for (let i = 0; i < 1024; i++) { s += hist[i]; cdf[i] = s / n; }
  for (let k = 0; k < n; k++) h[k] = cdf[Math.min(1023, (h[k] * 1024) | 0)];
  if (kind === 'smooth') for (let k = 0; k < n; k++) h[k] = 0.55 + 0.4 * (h[k] - 0.5); // smooth paper: shallow grain
  return h;
}

// SECTION: GL -- the graphics card: picture textures, one pass = one small program over a rectangle (standard technique: render to texture)
const view = document.getElementById('paper'); view.width = CW; view.height = CH;
const gl = view.getContext('webgl2', { preserveDrawingBuffer: true, antialias: false, alpha: false, depth: false, stencil: false, powerPreference: 'high-performance' });
if (!gl || !gl.getExtension('EXT_color_buffer_float')) { document.body.innerHTML = '<p style="color:#fff;font:4vh sans-serif;padding:4vh">WebGL2</p>'; throw new Error('WebGL2 with float textures is needed'); }
gl.bindVertexArray(gl.createVertexArray());
function fbFor(...ts) { const f = gl.createFramebuffer(); gl.bindFramebuffer(gl.FRAMEBUFFER, f); ts.forEach((t, i) => gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0 + i, gl.TEXTURE_2D, t, 0)); return f; }
function tex(w, h, one) {
  const t = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, t);
  for (const p of [gl.TEXTURE_MIN_FILTER, gl.TEXTURE_MAG_FILTER]) gl.texParameteri(gl.TEXTURE_2D, p, gl.NEAREST);
  for (const p of [gl.TEXTURE_WRAP_S, gl.TEXTURE_WRAP_T]) gl.texParameteri(gl.TEXTURE_2D, p, gl.CLAMP_TO_EDGE);

const PIC = tex(CW, CH), WAT = tex(CW, CH), DEP = tex(CW, CH), MISC = tex(CW, CH), B0 = tex(CW, CH), FLUX = tex(CW, CH), GRAIN = tex(CW, CH, true);
// PIC: absorbance rgb + paint thickness. WAT: pigment in the water rgb + water depth. DEP: settled pigment rgb + damp paper.
// MISC: r when the oil or acrylic was laid (seconds), g simple-brush stroke mask, b which stroke that mask belongs to, a how much of the paint is acrylic. B0: the picture before this simple stroke.
const STATES = [PIC, WAT, DEP, MISC];
const SC = [tex(CW, CH), tex(CW, CH), tex(CW, CH)];
const scFB = [1, 2, 3].map((k) => { const f = fbFor(...SC.slice(0, k).map((s) => s.t)); gl.drawBuffers([...Array(k).keys()].map((i) => gl.COLOR_ATTACHMENT0 + i)); return f; });
const TIPN = 176, TIP = [tex(TIPN, TIPN), tex(TIPN, TIPN)], BTEX = tex(TIPN, 1, true), TILES = tex(TX, TY);
const LUT = (() => { const t = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, t); for (const p of [gl.TEXTURE_MIN_FILTER, gl.TEXTURE_MAG_FILTER]) gl.texParameteri(gl.TEXTURE_2D, p, gl.LINEAR); for (const p of [gl.TEXTURE_WRAP_S, gl.TEXTURE_WRAP_T]) gl.texParameteri(gl.TEXTURE_2D, p, gl.CLAMP_TO_EDGE); return { t }; })();
async function loadLut() { const im = new Image(); im.src = '%MIXBOX_LUT%'; await im.decode(); gl.bindTexture(gl.TEXTURE_2D, LUT.t); gl.pixelStorei(gl.UNPACK_COLORSPACE_CONVERSION_WEBGL, gl.NONE); gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL, false); gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, im); }
const pbo = gl.createBuffer(); gl.bindBuffer(gl.PIXEL_PACK_BUFFER, pbo); gl.bufferData(gl.PIXEL_PACK_BUFFER, TX * TY * 16, gl.STREAM_READ); gl.bindBuffer(gl.PIXEL_PACK_BUFFER, null);
const tileBuf = new Float32Array(TX * TY * 4);
let version = 0; // grows whenever the picture changes (test hooks read the picture back only then)

const MIXBOX_GLSL = /*%MIXBOX_GLSL%*/'';
const fl = (x) => (Number.isInteger(x) ? x.toFixed(1) : String(x));
const VS = '#version 300 es\nvoid main(){vec2 p=vec2(float((gl_VertexID&1)<<2),float((gl_VertexID&2)<<1));gl_Position=vec4(p-1.0,0.0,1.0);}';
const HEAD = `#version 300 es
precision highp float; precision highp int; precision highp sampler2D;
const int CW = ${CW}, CH = ${CH};
${Object.entries(K).map(([k, v]) => `const float ${k} = ${fl(v)};`).join('\n')}
uniform sampler2D mixbox_lut;
${MIXBOX_GLSL}
float sm(float e0, float e1, float x) { float t = clamp((x - e0) / (e1 - e0), 0., 1.); return t * t * (3. - 2. * t); }
vec3 rgbOf(vec3 a) { return exp(-a); } vec3 abOf(vec3 c) { return -log(clamp(c, .02, 1.)); }
vec3 mb(vec3 a, vec3 b, float t) { return t <= 0. ? a : abOf(mixbox_lerp(rgbOf(a), rgbOf(b), min(t, 1.))); } // two wet paints mixed like real pigment (Mixbox)
vec3 ks(vec3 a) { vec3 r = clamp(exp(-a), .02, .999); return (1. - r) * (1. - r) / (2. * r); }
vec3 unks(vec3 k) { vec3 r = 1. + k - sqrt(k * k + 2. * k); return -log(clamp(r, .02, 1.)); }
vec3 km(vec3 a, vec3 b, float t) { return t <= 0. ? a : unks(mix(ks(a), ks(b), min(t, 1.))); } // paint laid over paper or dry paint (Kubelka-Munk: the paper's white is not a pigment)
bool inside(ivec2 q) { return q.x >= 0 && q.y >= 0 && q.x < CW && q.y < CH; }
ivec2 cl(ivec2 q) { return clamp(q, ivec2(0), ivec2(CW - 1, CH - 1)); }
uniform vec2 D; uniform int SHK; uniform float SAL, SSC;
vec2 brushUV(vec2 d, float R) { return vec2(dot(d, D), -d.x * D.y + d.y * D.x) / (R * SSC); } // along, across the stroke, in brush radii
float foot(vec2 d, float R) { vec2 u = brushUV(d, R); // the brush shape: 1 at its edge
  if (SHK == 0) return length(u);
  if (SHK == 1) { vec2 a = abs(vec2(u.x / SAL, u.y)); return pow(pow(a.x, 6.) + pow(a.y, 6.), 1. / 6.); }
  return length(vec2(u.x / SAL, u.y)); }

`;
function shader(type, src) { const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s); if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s)); return s; }

      case gl.FLOAT: if (u.size > 1) gl.uniform1fv(u.loc, v); else gl.uniform1f(u.loc, v); break;
      case gl.FLOAT_VEC2: gl.uniform2f(u.loc, v[0], v[1]); break;
      case gl.FLOAT_VEC3: gl.uniform3f(u.loc, v[0], v[1], v[2]); break;

      case gl.INT_VEC2: gl.uniform2i(u.loc, v[0], v[1]); break;

}
const clip = (r) => r && [Math.max(0, r[0] | 0), Math.max(0, r[1] | 0), Math.min(CW - 1, Math.ceil(r[2])), Math.min(CH - 1, Math.ceil(r[3]))];
const grow = (r, d) => r && [r[0] - d, r[1] - d, r[2] + d, r[3] + d];
const join = (a, b) => (!a ? b && b.slice() : !b ? a.slice() : [Math.min(a[0], b[0]), Math.min(a[1], b[1]), Math.max(a[2], b[2]), Math.max(a[3], b[3])]);
function scissor(r) { gl.enable(gl.SCISSOR_TEST); gl.scissor(r[0], r[1], r[2] - r[0] + 1, r[3] - r[1] + 1); }
function blit(src, dst, sx, sy, w, h, dx, dy) {
  gl.disable(gl.SCISSOR_TEST); gl.bindFramebuffer(gl.READ_FRAMEBUFFER, src.fb); gl.bindFramebuffer(gl.DRAW_FRAMEBUFFER, dst.fb);
  gl.blitFramebuffer(sx, sy, sx + w, sy + h, dx, dy, dx + w, dy + h, gl.COLOR_BUFFER_BIT, gl.NEAREST);
}
function pass(pr, r, outs, uni) { // run a program over rectangle r of the picture, writing the listed picture textures
  if (!r || r[2] < r[0] || r[3] < r[1]) return;

// Paint pots: choosing a colour dips the brush; holding longer takes more paint, one more dot each half second (owner 21 Nov).
let potHold = null;
const pots = PALETTES[0].map((col, i) => makeBtn(bottom, 'color-' + i, (c) => {
  c.fillStyle = rgbS(colorOf(i)); c.beginPath(); c.arc(50, 50, 40, 0, 7); c.fill(); c.strokeStyle = 'rgba(0,0,0,.25)'; c.lineWidth = 3; c.stroke();

    const card = document.createElement('button'); card.className = 'card' + (id === st.canvas ? ' cur' : ''); card.dataset.id = 'canvas-' + id;
    card.appendChild(canvasSwatch(id)); cvBox.appendChild(card);
    card.addEventListener('click', async () => { cvBox.classList.add('hide'); await newPicture(id); });
  }
}
const ICON_CLOSE = (c) => { c.strokeStyle = '#3a2a1a'; c.lineWidth = 12; c.lineCap = 'round'; c.beginPath(); c.moveTo(28, 28); c.lineTo(72, 72); c.moveTo(72, 28); c.lineTo(28, 72); c.stroke(); };

// SECTION: GALLERY -- every picture kept on this PC (IndexedDB), the newest opens at start
let cur = { id: Date.now() }, isChanged = false, saveTimer = 0;
function changed() { isChanged = true; clearTimeout(saveTimer); saveTimer = setTimeout(() => save(), 2000); }
let dbp = null;
function db() { if (!dbp) dbp = new Promise((res, rej) => { const r = indexedDB.open('coloring-book', 1); r.onupgradeneeded = () => r.result.createObjectStore('pictures', { keyPath: 'id' }); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); return dbp; }
function req(mode, fn) { return db().then((d) => new Promise((res, rej) => { const t = d.transaction('pictures', mode), q = fn(t.objectStore('pictures')); t.oncomplete = () => res(q && q.result); t.onerror = () => rej(t.error); })); }
async function gz(u8) { return await new Response(new Blob([u8]).stream().pipeThrough(new CompressionStream('gzip'))).blob(); }
async function gunz(b) { return new Uint8Array(await new Response(b.stream().pipeThrough(new DecompressionStream('gzip'))).arrayBuffer()); }
function thumb() { render(); if (stickDirty) drawStickers(); const c = document.createElement('canvas'); c.width = 320; c.height = 200; const x = c.getContext('2d'); x.drawImage(view, 0, 0, 320, 200); x.drawImage(document.getElementById('stick'), 0, 0, 320, 200); return c.toDataURL('image/jpeg', 0.8); }
let saving = Promise.resolve();
function save() {
  saving = saving.then(async () => {
    if (!isChanged || stroke) return;
    if (water.active) { changed(); return; } // kept once the wet paint is dry
    clearTimeout(saveTimer); isChanged = false;
    const { A, H } = readPic(), qa = new Uint8Array(N * 3), qh = new Uint8Array(N);
    for (let i = 0; i < N * 3; i++) qa[i] = Math.min(255, Math.round(A[i] * 64));
    for (let i = 0; i < N; i++) qh[i] = Math.min(255, Math.round(H[i] * 127.5));
    const rec = { id: cur.id, time: Date.now(), thumb: thumb(), a: await gz(qa), h: await gz(qh), st: JSON.stringify(stickers), canvas: st.canvas, guide: guide.src };
    await req('readwrite', (s) => s.put(rec));
  }).catch((e) => console.error(e));
  return saving;
}
function resetUndo() { for (const e of undoStack) release(e); undoStack.length = 0; open = null; }
function blank() {
  stopWater(); clearTex(PIC, [...CANVASES[st.canvas].paper.map(ab), 0]); clearTex(WAT, [0, 0, 0, 0]); clearTex(DEP, [0, 0, 0, 0]); clearTex(MISC, [-1e6, 0, 0, 0]); version++;
}
async function load(id) {
  const rec = await req('readonly', (s) => s.get(id)); if (!rec) return false;
  const qa = await gunz(rec.a), qh = await gunz(rec.h), f = new Float32Array(N * 4);
  for (let k = 0; k < N; k++) { f[k * 4] = qa[k * 3] / 64; f[k * 4 + 1] = qa[k * 3 + 1] / 64; f[k * 4 + 2] = qa[k * 3 + 2] / 64; f[k * 4 + 3] = qh[k] / 127.5; }
  useCanvas(rec.canvas || 'wc'); blank(); gl.bindTexture(gl.TEXTURE_2D, PIC.t); gl.texSubImage2D(gl.TEXTURE_2D, 0, 0, 0, CW, CH, gl.RGBA, gl.FLOAT, f); version++;
  stickers = JSON.parse(rec.st); stickDirty = true; cur = { id }; isChanged = false; guide.src = rec.guide || null; guide.on = true; showGuide();
  resetUndo(); renderAll(); return true;
}
async function newPicture(canvas) { // a new picture on the same canvas, or on the one picked
  if (stroke) return; finishWater(); await save();
  if (canvas) useCanvas(canvas);
  blank(); stickers = []; stickDirty = true; cur = { id: Date.now() }; isChanged = false; guide.src = null; showGuide(); resetUndo(); renderAll(); refresh();
}
async function deletePicture() { // the open picture is removed from the gallery; the newest other one opens, or a new page
  if (stroke) return; finishWater(); clearTimeout(saveTimer); isChanged = false; await saving;
  await req('readwrite', (s) => s.delete(cur.id));
  const all = (await req('readonly', (s) => s.getAll())) || []; all.sort((a, b) => b.time - a.time);
  if (all.length) await load(all[0].id); else { blank(); stickers = []; stickDirty = true; cur = { id: Date.now() }; guide.src = null; showGuide(); resetUndo(); renderAll(); }
  refresh();
}
const gal = document.getElementById('gal');
async function openGallery() {
  if (stroke) return; finishWater(); await save();
  const all = (await req('readonly', (s) => s.getAll())) || [];
  all.sort((a, b) => b.time - a.time);
  gal.innerHTML = '';
  const close = document.createElement('button'); close.className = 'btn'; gal.appendChild(close);
  const cc = document.createElement('canvas'); close.appendChild(cc); close.dataset.id = 'gallery-close';
  close.addEventListener('pointerdown', (e) => { e.preventDefault(); gal.classList.add('hide'); });
  gal.classList.remove('hide'); drawIcon({ b: close, c: cc, draw: ICON_CLOSE });
  for (const r of all) {
    const card = document.createElement('button'); card.className = 'card' + (r.id === cur.id ? ' cur' : ''); card.dataset.id = 'pic-' + r.id;
    const im = document.createElement('img'); im.src = r.thumb; card.appendChild(im); gal.appendChild(card);
    card.addEventListener('click', async () => { gal.classList.add('hide'); if (r.id !== cur.id) { await load(r.id); refresh(); } });
  }
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') { if (!stroke) finishWater(); save(); } });

// SECTION: LOOP -- wet paint moves, changed parts drawn once per frame
let lastT = 0;
function frame(t) {
  const dt = lastT ? Math.min(0.1, (t - lastT) / 1000) : 1 / 60; lastT = t;
  if (water.active) { water.acc = Math.min(water.acc + dt, MAX_STEPS * SIM_DT); while (water.acc >= SIM_DT) { simStep(SIM_DT); water.acc -= SIM_DT; } checkWater(); } // fixed steps: wet paint behaves the same at any frame rate
  render();
  if (stickDirty) drawStickers();
  requestAnimationFrame(frame);
}
(async () => {
  await loadLut(); useCanvas('wc'); blank(); layout(); renderAll();
  try { const all = (await req('readonly', (s) => s.getAll())) || []; if (all.length) { all.sort((a, b) => b.time - a.time); await load(all[0].id); } } catch (e) { console.error(e); }
  window.__cb.ready = true;
})();
requestAnimationFrame(frame);

// SECTION: TEST HOOKS -- read-only views for the flow tests (age: let time pass for the oil paint)
window.__cb = { CW, CH, st, get grain() { return grain; }, undoStack, water, get A() { return readPic().A; }, get Ht() { return readPic().H; }, get stickers() { return stickers; }, get cur() { return cur; }, ready: false,
  screenOf(x, y) { const r = view.getBoundingClientRect(); return [r.left + x * r.width / CW, r.top + y * r.height / CH]; },
  btn(id) { const b = document.querySelector('[data-id="' + id + '"]'); if (!b || b.classList.contains('hide')) return null; const r = b.getBoundingClientRect(); return [r.left + r.width / 2, r.top + r.height / 2]; },
  shown(x, y) { render(); const d = new Uint8Array(4); gl.bindFramebuffer(gl.READ_FRAMEBUFFER, null); gl.readPixels(Math.round(x), CH - 1 - Math.round(y), 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, d); return [d[0], d[1], d[2]]; },
  age(s) { clockShift += s; },
  fast(sec) { for (let i = 0; i < sec / SIM_DT && water.active; i++) { simStep(SIM_DT); if (i % 24 === 0) { water.frames = CHECK_EVERY - 1; checkWater(); gl.finish(); checkWater(); } } render(); }, // debug: let the wet paint run on

  sum(T, r) { const t = { W: WAT, D: DEP, P: PIC }[T], w = r[2] - r[0], h = r[3] - r[1], f = new Float32Array(w * h * 4); gl.bindFramebuffer(gl.READ_FRAMEBUFFER, t.fb); gl.readPixels(r[0], r[1], w, h, gl.RGBA, gl.FLOAT, f); const s = [0, 0, 0, 0]; for (let i = 0; i < f.length; i++) s[i & 3] += f[i]; return s.map((v) => +v.toFixed(1)); },
  probe(pts) { const f = new Float32Array(4), o = []; for (const [x, y] of pts) { const v = []; for (const T of [WAT, DEP]) { gl.bindFramebuffer(gl.READ_FRAMEBUFFER, T.fb); gl.readPixels(x, y, 1, 1, gl.RGBA, gl.FLOAT, f); v.push(+f[3].toFixed(3)); } o.push(v); } return o; }, save: () => save(), count: async () => ((await req('readonly', (s) => s.getAll())) || []).length };
</script>
