<script>
'use strict';
// SECTION: MODEL -- the paint model in plain words
/* The paint model (all of it runs on the graphics card, one small program per step). Words used: a medium is what
 you paint with, called a drawing tool (acrylic, watercolour, crayon (oil pastel), marker, simple brush, spray, shapes, ink, pencil); a brush shape is the shape of the brush or crayon
 tip (round, flat, dry brush, knife, mop; tip, side); paint load is how much paint the brush took (hold a colour longer).
 1. The picture is a grid of pixels on a canvas (watercolour paper, smooth paper, cotton canvas; each has its
    own surface grain). Each pixel holds how much light its paint swallows, per red/green/blue (absorbance,
    A = -ln(reflectance)), and how thick the paint is (H). Wet paints mix with each other like real pigment (Mixbox
    library, Kubelka-Munk based, by Secret Weapons, CC BY-NC 4.0); paint laid over paper or dry paint covers it
    (standard technique: Kubelka-Munk). See-through watercolour layers add their absorbance on top
    (standard technique: Beer-Lambert glazing).
 2. Oil and acrylic (standard technique: two-way paint transfer, as ArtRage and Rebelle do it): the brush tip is a small
    grid of paint that travels with the finger, shaped like the brush, turned across the stroke. At every dab each tip
    pixel gives some of its paint to the picture and takes some of the picture's wet paint back, so the brush carries and
    mixes colour and runs dry; with less paint it lays a thinner coat and runs out sooner. Only the
    paint on the outside of the bristles mixes; the paint deep in them refills it with the brush's own colour, and
    neighbouring bristles share a little paint. Across the tip the bristles are of uneven strength (streaks), and the
    stroke's sides get a ridge. The bristles plough acrylic's wet paint: it moves from under the strong bristles into the gaps, so a stroke over
    wet paint leaves its own grooves, not the old ones. Each pixel remembers when its paint was laid; paint dries (acrylic much faster than
    oil), and only the wet part can be picked up, so new paint sits on top of dry paint. Acrylic is thinner, covers
    better and is less glossy.
 3. Watercolour (standard techniques: Curtis et al. 1997 for pigment in water; the virtual-pipes shallow-water model,
    O'Brien and Hodgins 1995 / Mei et al. 2007, for the flow): the brush puts water and pigment on the paper and makes
    it damp; the brush's water runs out along the stroke. Water flows to lower neighbours (deeper water, the paper's
    dips) only into damp paper or pushed by deep water, and carries its pigment; pigment also spreads through the water.
    Water dries faster at the edge of a wet patch, so pigment moves out to the edge (darker rim). Pigment settles out of
    the water, a little more in the paper's dips (granulation), is lifted again while there is a lot of water, and is
    fixed when the paper is dry.
 4. Crayon is an oil pastel (owner 21 Nov, his reference pictures): a stick of soft, thick, opaque paint that never dries.
    It uses the brush model of part 2 with a tip that does not run out: it lays paint and picks up the soft paint it passes
    over (so it smears and blends), it touches the raised grain first, and pressing harder (the bucket level) reaches into
    the dips; paint already laid fills the dips, so passes build up; small lumps break off and stay.
 5. Simple brush: a dab with a shape, a size and a softness; one stroke is one even coat: each dab's soft edge adds
    towards that coat, never past it (standard technique: Krita's wash mode), so a stroke crossing itself has round corners.
 6. Marker: like the simple brush, one even coat per stroke, but the ink is see-through (its colour adds on top, so
    crossing lines get darker) and gathers a little at the line's edge.
 7. Spray and shape stamps (owner 23 Nov): each dab is laid over what is there. Spray is an airbrush: while pressed it puffs, many times a second (so a fast hand leaves the puffs further
    apart), drops of different sizes scattered round its aim, most near the middle (a bell curve cut off at the edge), as many as its area holds (every size as far apart),
    each a little see-through, so they build up the longer it stays.
    Shapes (as the Squares Brush of av01d fabric-brushes): each shape (an outline) twice as wide across the stroke as the hand moved in one frame, the square half that along it,
    the others in their own proportions, the next starting where it ends; turned with the stroke, outlined in the colour chosen, filled with a lighter tint of it (SHAPE_FILL),
    each fill slightly different. The first shape comes with the first move; a tap is one shape at his usual speed's size.
 8. Ink and pencil (owner 23 Nov). Ink (as the av01d fabric-brushes ink): many fine opaque strands, one per hair of the tip,
    each drawn from where it was to where it is, thinner the faster the hand; a fast stroke throws drops off the tip, as
    many as the splash setting says. Pencil leaves its colour only where the paper's raised grain
    touches the lead; pressing harder (the bucket level; the hand's speed only a little) reaches lower into the grain, and the round lead presses
    hardest at its middle. Each pass of the lead lays its mark at once over what shows there; each time the lead has
    travelled more than its own width since its last pass over a place (crossing its own line, going back, turning) it adds another layer. The soft row lays a thinner see-through layer, so colours mix.
 Pressure: a pen's pressure, or for a finger or the mouse its speed (slower is harder), gives more paint and a wider mark.
 Lifting: a hand moving faster than a normal line lifts the brush, a little more each moment, the faster the sooner: the mark
    narrows smoothly to a point (its dabs come closer as it narrows); slowing down sets it down again.
 Light: paint thickness and the canvas grain are lit from the top left (bump shading); damp paper looks a little darker. */

// SECTION: SETUP -- picture size, canvases, colours, brush shapes, tuning
const FW = 1600, FH = 1000; // the picture's size
// ?paper=400x250@600,375 gives the tests a smaller paper (owner 21 Nov: tests run in seconds): that part of the full paper, with the same canvas grain there
const [CW, CH, OX, OY] = (/[?&]paper=(\d+)x(\d+)(?:@(\d+),(\d+))?/.exec(location.search) || [0, FW, FH]).slice(1).map((v) => +v || 0);
const N = CW * CH, TS = 64, TX = Math.ceil(CW / TS), TY = Math.ceil(CH / TS);
const grain = new Float32Array(N);
const ab = (c) => -Math.log(Math.max(0.02, c));
const CANVASES = { // the canvas's colour and its surface (grain kind, how strongly it shows in the light)
  wc: { paper: [0.975, 0.968, 0.945], kind: 'rough', bump: 0.35 }, // watercolour paper (owner 21 Nov: whiter)
  smooth: { paper: [0.985, 0.982, 0.97], kind: 'smooth', bump: 0.12 },
  cotton: { paper: [0.95, 0.94, 0.91], kind: 'cotton', bump: 0.45 },
};
const hexCols = (hex) => hex.split(' ').map((h) => [0, 2, 4].map((k) => parseInt(h.substr(k, 2), 16) / 255));
const SHOWN = /*%PALETTES%*/[]; // the palettes popup's columns (lib/palettes/palettes.txt), inlined by build.py; div: a divider line before it
const PALETTES = SHOWN.map((p, i) => ({ name: p.name, by: '', grp: p.grp, div: p.div, at: i, colors: hexCols(p.hex) })); // the owner's palettes, 12 to a column (owner 23 Nov), each exactly 10 colours (owner 21 Nov)
PALETTES.unshift(PALETTES.splice(PALETTES.findIndex((p) => p.name === 'Basic'), 1)[0]); // Basic, one of the extras in the popup, is the palette a new picture starts with
const SIZES = [8, 16, 28, 48, 80]; // brush radius for each size dot, the same for every medium (owner 21 Nov: 5 sizes, the biggest a little over double the old biggest)
const SOFT = [0.95, 0.05]; // sharp, blurred: how far out the dab stays full strength (owner 21 Nov: two rows, the brushes sharp and blurred)
const LOADS = [0.12, 0.4, 1]; // paint in the brush for a third-, two-thirds- and full bucket (owner 21 Nov: the lowest even less)
const FIXED = [Math.SQRT1_2, Math.SQRT1_2]; // brushes that are not round are held at one angle, a diagonal; they never turn by themselves (owner 21 Nov)
const PAINT = [{ id: 'round', k: 0, al: 1 }, { id: 'flat', k: 1, al: 0.22, fixed: 1 }, { id: 'scrub', k: 1, al: 0.35, fixed: 1, scrub: 0.72 }, { id: 'knife', k: 1, al: 0.12, fixed: 1, knife: 1 }]; // round, flat, scrub, knife (smear); owner 21 Nov 18:29: the 3rd like the Brusheezy 'Acrylic Paint' pack: a broad brush scrubbed on, dense in the middle, breaking into dry streaks at its sides and on the paper's grain // no brush that differs from another only in size: size has its own button (owner 21 Nov)
const ring = (n, rad) => [...Array(n).keys()].map((i) => { const a = -Math.PI / 2 + i * 2 * Math.PI / n; return [rad(i) * Math.cos(a), rad(i) * Math.sin(a)]; }); // n points round the middle, the first at the top
const heartPts = () => [...Array(28).keys()].map((i) => { const t = i * 2 * Math.PI / 28, x = 16 * Math.sin(t) ** 3, y = 13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t); return [x / 20, -(y + 2) / 20]; }); // the usual heart curve, point down
const SHAPES = { // brushes per tool (owner 21 Nov: all of them): kind (0 round, 1 flat, 2 oval), length along the stroke, size, edge softness, water, held at one angle
  acrylic: PAINT, // dry brush: little paint on stiff, uneven bristles; knife: no bristles, scrapes and smears flat (owner 21 Nov: no oil)
  water: [{ id: 'round', k: 0, al: 1 }, { id: 'flat', k: 1, al: 0.25, fixed: 1 }, { id: 'mop', k: 0, al: 1, soft: 0.1, water: 2.5, fringe: 1.6 }, { id: 'dry', k: 1, al: 0.35, fixed: 1, dry: 0.12 }], // owner 21 Nov: no sponge; dry brush: little water, full colour, breaks on the paper's tooth in streaks along the stroke,
  crayon: [{ id: 'tip', k: 0, al: 1 }, { id: 'side', k: 1, al: 0.3, light: 0.75, fixed: 1 }],
  marker: [{ id: 'bullet', k: 0, al: 1 }, { id: 'chisel', k: 1, al: 0.3, fixed: 1 }],
  simple: [{ id: 'round', k: 0, al: 1 }, { id: 'square', k: 1, al: 1, fixed: 1, upright: 1 }], // owner 21 Nov: like painting apps, the square stands upright
  spray: [{ id: 'fine', k: 0, al: 1, drop: 1 }, { id: 'coarse', k: 0, al: 1, drop: 2.5 }], // droplet size in pixels (owner 23 Nov)
  shapes: [{ id: 'square', k: 0, al: 1, asp: 2, pts: [[-0.7, -0.7], [0.7, -0.7], [0.7, 0.7], [-0.7, 0.7]] }, { id: 'circle', k: 0, al: 1, asp: 1, pts: ring(24, () => 0.8) },
    { id: 'triangle', k: 0, al: 1, asp: 1, pts: [[0, -0.8], [0.75, 0.6], [-0.75, 0.6]] }, { id: 'star', k: 0, al: 1, asp: 1, pts: ring(10, (i) => (i % 2 ? 0.38 : 0.9)) },
    { id: 'heart', k: 0, al: 1, asp: 1, pts: heartPts() }, { id: 'grass', k: 0, al: 1, asp: 1, pts: [[-0.7, 0.8], [-0.66, -0.3], [-0.52, 0.55], [-0.42, -0.9], [-0.28, 0.55], [-0.14, -0.5], [-0.02, 0.55], [0.14, -1], [0.26, 0.55], [0.4, -0.45], [0.52, 0.55], [0.68, -0.75], [0.7, 0.8]] }], // owner 23 Nov: squares and more; 24 Nov: a normal star and heart, and grass
  // each shape an outline (pts: x along the stroke, y across it, in brush radii); asp 2: half as long along the stroke as across (the Squares Brush's squares), 1: its own proportions
  ink: [{ id: 'round', k: 0, al: 1, sc: 0.6 }, { id: 'nib', k: 1, al: 0.25, fixed: 1 }],
  pencil: [{ id: 'sharp', k: 0, al: 1, sc: 0.3 }, { id: 'side', k: 1, al: 0.35, fixed: 1 }], // owner 23 Nov: drawing pencils; the side of the lead shades; 24 Nov: size only by the size button
};
// tuning (the prototype answers these with the child)
const K = {
  OIL_LOAD: 10 * 2 / 3, OIL_GIVE: 1 / 700, OIL_TAKE: 0.07, OIL_SURF: 0.3, OIL_RIDGE: 0.4, OIL_PAPER: 0.05, OIL_DRY: 1e6, // the 'oil' paint is the oil pastel's (no oil tool since 21 Nov): it never dries
  OIL_HIDE: 0.045, OIL_MIXW: 4, OIL_EDGE: 0.85, KNIFE_TAKE: 3, KNIFE_RIDGE: 2.5, // a coat this thick hides about two thirds of what is under it; edge softness; the knife scrapes harder and pushes paint to its sides
  ACR_PLOUGH: 0.05, ACR_GROOVE: 3, ACR_GIVE: 1.4 / 700, ACR_TAKE: 0.06, ACR_RIDGE: 1.2, ACR_HIDE: 0.035, ACR_EDGE: 0.95, ACR_DRY: 6, ACR_GLOSS: 0.35, ACR_LINES: 0.12, // acrylic, heavy body: thick paint that keeps the brush's lines (impasto), heaped at the sides, covers well, crisp edges, dries in about 15 s (owner 21 Nov: more leftover paint, in the brush's lines)
  BUMP: 2.8, GLOSS: 30, WETDARK: 0.08,
  LX: -0.45, LY: -0.55, LZ: 0.70, HX: -0.45 / 1.843, HY: -0.55 / 1.843, HZ: 1.7 / 1.843, // light from the top left; half-way vector between light and eye
  W_ADD: 0.35, W_MAX: 1.5, PDIF: 25, W_DENS: 0.8, W_LEN: 30, // water per dab, most water a pixel holds, pigment spreading, pigment per water, stroke length (in brush radii) a full brush's water lasts
  CF: 0.4, DEEP: 0.3, KP: 0.015, MAXF: 0.5, // flow: speed, how deep water pushes onto dry paper, pull of the paper's dips, most water leaving a pixel per step
  EV: 0.15, EDGE: 25, W0: 0.02, SETTLE: 30, DEP0: 0.05, GRAN: 0.35, LIFT: 0.3, DAMPW: 2, DAMPE: 2, FIX: 4, // drying, edge drying, settling, granulation, lifting, damp paper, fixing
  PASTEL_GIVE: 1 / 2500, PASTEL_TAKE: 0.06, PASTEL_STICK: 8, PASTEL_REACH: [0.45, 0.65, 0.82], PASTEL_FILL: 1.2, PASTEL_LUMP: 0.004, // oil pastel: lays thick, picks up and smears soft paint, a stick lasts (8 brushfuls); how far into the grain each bucket level (pressure) reaches; laid paint fills the dips; lumps
  PENCIL_WAX: [0.7, 0.37], PENCIL_PRESS: [0.35, 0.6, 1], STAMP_LIGHT: 0.25, STAMP_HUE: 0.1, SHAPE_FILL: 0.45, SHAPE_FRAME: 1 / 60, SHAPE_TOP_V: 1000, SHAPE_TAP_V: 550, INK_AMOUNT: 7, INK_SPLASH: [0, 0.12, 0.25, 0.5], INK_SPLASH_V: 900, // ink (av01d fabric-brushes): how much ink the strands carry; splash drops: none, few, some, many (owner 24 Nov: a quarter of before)
  SPRAY_DROPS: 24, SPRAY_HOLD: 200, // owner 23 Nov: pencil (lead pressure per bucket level), shapes (colour spread), spray
  MARK_INK: 0.6, MARK_RIM: 1.5, // one layer of ink is lighter than the colour, so layers build up darker; owner 21 Nov: a real marker: see-through ink, crossing strokes darker, ink gathers at the edge
  LIFT_FROM: 2000, LIFT_FAST: 4000, LIFT_TIME: 0.17, // owner 23 Nov: a fast hand lifts the brush (with the lift switch on). Paper pixels a second (his screen about 36 a cm): above LIFT_FROM (about 55 cm/s) it
  // lifts, the faster the quicker; at LIFT_FAST (about 1.1 m/s) it goes from full to off in LIFT_TIME seconds; slower than LIFT_FROM it presses down again (owner 24 Nov: it lifted too early and too fast for long lifts)
  SIMPLE_FLOW: 3, // simple brush: how much of its soft edge one dab adds over a brush width of dabs (owner 23 Nov: a stroke crossing itself has no crease)
};
const SIM_DT = 1 / 60, MAX_STEPS = 2, CHECK_EVERY = 6, W_EPS = 1e-4, DAMP_EPS = 0.01;

function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function makeGrain(kind, W, H, out) { // the canvas surface, 0 (dip) .. 1 (raised), spread evenly over 0..1
  const n = W * H, r = rng(7), f = new Float32Array(n), h = out || new Float32Array(n);
  for (let i = 0; i < n; i++) f[i] = r();
  const t = new Float32Array(n); // fine noise blurred once
  for (let y = 0; y < H; y++) for (let x = 1; x < W - 1; x++) { const k = y * W + x; t[k] = 0.25 * f[k - 1] + 0.5 * f[k] + 0.25 * f[k + 1]; } // owner 21 Nov: finer grain, a light blur only
  for (let y = 1; y < H - 1; y++) for (let x = 0; x < W; x++) { const k = y * W + x; f[k] = 0.25 * t[k - W] + 0.5 * t[k] + 0.25 * t[k + W]; }
  const G = 2, gw = Math.ceil(W / G) + 2, gh = Math.ceil(H / G) + 2, c = new Float32Array(gw * gh);
  for (let i = 0; i < c.length; i++) c[i] = r();
  const coarse = (x, y) => { const gx = x / G, gy = y / G, ix = gx | 0, iy = gy | 0, fx = gx - ix, fy = gy - iy; return c[iy * gw + ix] * (1 - fx) * (1 - fy) + c[iy * gw + ix + 1] * fx * (1 - fy) + c[(iy + 1) * gw + ix] * (1 - fx) * fy + c[(iy + 1) * gw + ix + 1] * fx * fy; };
  const P = kind === 'linen' ? 3 : 4, th = new Float32Array(Math.ceil(Math.max(W, H) / P) + 2).map(() => 0.65 + 0.6 * r()); // threads; linen's vary in thickness (slubs)
  const S = Math.PI;
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const k = y * W + x; let g;
    if (kind === 'rough') g = 0.65 * f[k] + 0.35 * coarse(x, y);
    else if (kind === 'smooth') g = 0.5 + 0.35 * (f[k] - 0.5);
    else { // plain weave (standard: threads alternate over and under): warp runs down, weft across
      const i = Math.floor(x / P), j = Math.floor(y / P), u = x / P - i, v = y / P - j;
      const warp = Math.pow(Math.sin(S * u), th[i]) * (0.55 + 0.45 * Math.sin(S * v)), weft = Math.pow(Math.sin(S * v), th[j]) * (0.55 + 0.45 * Math.sin(S * u));
      g = ((i + j) & 1 ? weft : warp) * 0.8 + (kind === 'linen' ? 0.3 : 0.15) * (f[k] - 0.5) + 0.1;
    }
    h[k] = g;
  }
  const hist = new Uint32Array(1024); let lo = 1e9, hi = -1e9;
  for (let k = 0; k < n; k++) { lo = Math.min(lo, h[k]); hi = Math.max(hi, h[k]); }
  for (let k = 0; k < n; k++) { h[k] = (h[k] - lo) / (hi - lo + 1e-9); hist[Math.min(1023, (h[k] * 1024) | 0)]++; }
  const cdf = new Float32Array(1024); let s = 0; for (let i = 0; i < 1024; i++) { s += hist[i]; cdf[i] = s / n; }
  for (let k = 0; k < n; k++) h[k] = cdf[Math.min(1023, (h[k] * 1024) | 0)];
  if (kind === 'smooth') for (let k = 0; k < n; k++) h[k] = 0.55 + 0.4 * (h[k] - 0.5); // smooth paper: shallow grain
  return h;
}

// SECTION: GL -- the graphics card: picture textures, one pass = one small program over a rectangle (standard technique: render to texture)
