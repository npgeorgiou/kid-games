<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Acrylic trial: five brushes, normal and impasto</title>
<style>
body{margin:0;background:#6b5a4a;font-family:sans-serif;display:flex;gap:12px;padding:12px;align-items:flex-start}
#paper{background:#fff;touch-action:none;box-shadow:0 2px 8px #0006}

.c{width:44px;height:44px;border-radius:50%;border:3px solid #fff;cursor:pointer}
.c.on{outline:4px solid #000}
button{font-size:18px;padding:8px 12px}
button.on{outline:4px solid #000}
</style></head><body>
<canvas id="paper" width="1000" height="760"></canvas>
<div id="side">
  <img src="%REF%" alt="his reference">
  <div class="row" id="cols"></div>
  <div class="row" id="brushes"></div>

  <div class="row" id="sizes"></div>
  <div class="row"><button id="clear">New paper</button></div>
</div>
