<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Tower Builder</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
  }
  canvas {
    display: block;
    touch-action: none;
    user-select: none;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script src="../lib/planck.min.js"></script>
<script src="../lib/map-land.js"></script>
<script>
(function () {
  "use strict";

  // Map: grep -n "SECTION:" this file for the list, then read just that
  // section (sed -n 'A,Bp' or Read with offset/limit). Do not read the whole file.

  // ---------------------------------------------------------------------
  // SECTION: SKIN -- drawing goes through here so art can be replaced later.
  // ---------------------------------------------------------------------
  const SKIN = {
    background(ctx, w, h) {
      ctx.fillStyle = "#bfe3f0";
      ctx.fillRect(0, 0, w, h);
    },
    ground(ctx, w, h) {
      ctx.fillStyle = "#d8c08a";
      ctx.fillRect(0, 0, w, h);
      ctx.fillStyle = "#c2a86f";
      ctx.fillRect(0, 0, w, Math.max(4, h * 0.08));
    },
    dust(ctx, x, y, r, alpha) {
      ctx.fillStyle = "rgba(214, 196, 160, " + (0.5 * alpha) + ")";
      ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
    },
    chip(ctx, x, y, r, angle, alpha) {
      ctx.save(); ctx.translate(x, y); ctx.rotate(angle);
      ctx.fillStyle = "rgba(120, 128, 135, " + alpha + ")";
      ctx.beginPath(); ctx.moveTo(-r, -r * 0.6); ctx.lineTo(r, -r * 0.3); ctx.lineTo(r * 0.3, r); ctx.closePath(); ctx.fill();
      ctx.restore();
    },
    mapSea(ctx, x, y, w, h) {
      ctx.fillStyle = "#9cc9d9"; ctx.fillRect(x, y, w, h);
    },
    mapLand(ctx, path) {
      ctx.fillStyle = "#e3cf9e"; ctx.fill(path);
      ctx.strokeStyle = "#a88f5c"; ctx.lineWidth = 1.5; ctx.stroke(path);
    },
    // An empty building site: a dashed ring with a little foundation inside.
    mapSite(ctx, x, y, r, trueX, trueY) {
      ctx.strokeStyle = "#5a4a36"; ctx.lineWidth = 2;
      if (Math.hypot(trueX - x, trueY - y) > r) {
        ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(trueX, trueY); ctx.stroke();
      }
      ctx.fillStyle = "#5a4a36"; ctx.beginPath(); ctx.arc(trueX, trueY, 3, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = "rgba(255, 248, 230, 0.85)";
      ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
      ctx.setLineDash([6, 5]); ctx.stroke(); ctx.setLineDash([]);
      ctx.fillStyle = "#b9a37c"; ctx.fillRect(x - r * 0.55, y + r * 0.2, r * 1.1, r * 0.25);
    },
    pile(ctx, w, h) {
      ctx.fillStyle = "#8a7560";
      ctx.fillRect(0, 0, w, h);
      ctx.fillStyle = "#73604d";
      ctx.fillRect(0, 0, w, Math.max(3, h * 0.05));
    },
    piece: {
      block(ctx, w, h) {
        ctx.fillStyle = "#c9b088";
        ctx.strokeStyle = "#5a4a36";
        ctx.lineWidth = 0.06;
        ctx.fillRect(-w / 2, -h / 2, w, h);
        ctx.strokeRect(-w / 2, -h / 2, w, h);
      },
      column(ctx, w, h, material) {
        ctx.fillStyle = "#d6c097";
        ctx.strokeStyle = "#5a4a36";
        ctx.lineWidth = 0.06;
        ctx.fillRect(-w / 2, -h / 2, w, h);
        ctx.strokeRect(-w / 2, -h / 2, w, h);
        if (material === "wood") return; // wood shows only its grain stripes
        // fluting lines along the long axis
        ctx.beginPath();
        const long = Math.max(w, h);
        const vertical = h >= w;
        const n = 3;
        for (let i = 1; i <= n; i++) {
          const t = -0.5 + i / (n + 1);
          if (vertical) {
            ctx.moveTo(t * w, -h / 2);
            ctx.lineTo(t * w, h / 2);
          } else {
            ctx.moveTo(-w / 2, t * h);
            ctx.lineTo(w / 2, t * h);
          }
        }
        ctx.stroke();
      },
      beam(ctx, w, h) {
        ctx.fillStyle = "#b99a6b";
        ctx.strokeStyle = "#5a4a36";
        ctx.lineWidth = 0.06;
        ctx.fillRect(-w / 2, -h / 2, w, h);
        ctx.strokeRect(-w / 2, -h / 2, w, h);
      },
      drum(ctx, r) {
        ctx.fillStyle = "#cdb892";
        ctx.strokeStyle = "#5a4a36";
        ctx.lineWidth = 0.06;
        ctx.beginPath();
        ctx.arc(0, 0, r, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
        // one line across it so rolling is visible
        ctx.beginPath();
        ctx.moveTo(-r, 0);
        ctx.lineTo(r, 0);
        ctx.stroke();
      },
    },
    button(ctx, name, x, y, size, pressed) {
      const r = size * (pressed ? 0.46 : 0.5);
      ctx.save();
      ctx.translate(x, y);
      ctx.fillStyle = pressed ? "#5f5042" : "#6e5d4a";
      ctx.strokeStyle = "#3c3226";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(0, 0, r, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle = "#e8dcc5";
      ctx.strokeStyle = "#3c3226";
      ctx.lineWidth = 1.5;
      const s = r * 0.55;
      if (name === "block") {
        ctx.fillRect(-s * 0.9, -s * 0.45, s * 1.8, s * 0.9);
        ctx.strokeRect(-s * 0.9, -s * 0.45, s * 1.8, s * 0.9);
      } else if (name === "block-end") {
        ctx.fillRect(-s * 0.45, -s * 0.9, s * 0.9, s * 1.8);
        ctx.strokeRect(-s * 0.45, -s * 0.9, s * 0.9, s * 1.8);
      } else if (name === "column") {
        ctx.fillRect(-s * 0.3, -s, s * 0.6, s * 2);
        ctx.strokeRect(-s * 0.3, -s, s * 0.6, s * 2);
      } else if (name === "column-lying") {
        ctx.fillRect(-s, -s * 0.3, s * 2, s * 0.6);
        ctx.strokeRect(-s, -s * 0.3, s * 2, s * 0.6);
      } else if (name === "beam") {
        ctx.fillRect(-s, -s * 0.25, s * 2, s * 0.5);
        ctx.strokeRect(-s, -s * 0.25, s * 2, s * 0.5);
      } else if (name === "drum") {
        ctx.beginPath();
        ctx.arc(0, 0, s * 0.8, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
      } else if (name === "home") {
        // a little folded map
        ctx.beginPath();
        ctx.moveTo(-s, -s * 0.6); ctx.lineTo(-s * 0.33, -s * 0.8); ctx.lineTo(s * 0.33, -s * 0.6); ctx.lineTo(s, -s * 0.8);
        ctx.lineTo(s, s * 0.6); ctx.lineTo(s * 0.33, s * 0.8); ctx.lineTo(-s * 0.33, s * 0.6); ctx.lineTo(-s, s * 0.8);
        ctx.closePath(); ctx.fill(); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(-s * 0.33, -s * 0.8); ctx.lineTo(-s * 0.33, s * 0.6);
        ctx.moveTo(s * 0.33, -s * 0.6); ctx.lineTo(s * 0.33, s * 0.8); ctx.stroke();
      } else if (name === "broom") {
        ctx.save();
        ctx.rotate(-0.5);
        ctx.fillRect(-s * 0.08, -s * 0.9, s * 0.16, s * 1.1);
        ctx.beginPath();
        ctx.moveTo(-s * 0.35, s * 0.15);
        ctx.lineTo(s * 0.35, s * 0.15);
        ctx.lineTo(s * 0.22, s * 0.95);
        ctx.lineTo(-s * 0.22, s * 0.95);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
        ctx.restore();
      }
      ctx.restore();
    },
  };

  // ---------------------------------------------------------------------
  // SECTION: PIECE DEFINITIONS -- materials, piece shapes/sizes, sidebar buttons
  // ---------------------------------------------------------------------
  const MATERIALS = {
    // maxLiftSpeed: how fast the material can be carried by hand (m/s) --
    // this, not sluggish acceleration, is what should make stone feel heavy.
    // maxSpin: hard cap on angular velocity while held (rad/s) -- heavier
    // material resists being spun around in the hand more.
    wood:  { label: "WOOD",  density: 1.1,  friction: 0.5,  restitution: 0.015, maxLiftSpeed: 9,  maxSpin: 3.0, maxAccel: 30 },
    stone: { label: "STONE", density: 5.0,  friction: 0.6,  restitution: 0.0,  maxLiftSpeed: 6,  maxSpin: 1.3, maxAccel: 22 },
  };
  let selectedMaterial = "wood";

  const PIECE_DEFS = {
    block:  { shape: "box", hx: 1.0, hy: 0.5, densityScale: 1.0, skin: "block" },
    column: { shape: "box", hx: 0.3, hy: 1.2, densityScale: 1.0, skin: "column" },
    beam:   { shape: "box", hx: 1.6, hy: 0.25, densityScale: 0.85, skin: "beam" },
    drum:   { shape: "circle", r: 0.6, densityScale: 1.0, skin: "drum" },
  };

  const BUTTONS = [
    { kind: "piece", def: "block", angle: 0, icon: "block" },
    { kind: "piece", def: "column", angle: 0, icon: "column" },
    { kind: "piece", def: "beam", angle: 0, icon: "beam" },
    { kind: "piece", def: "drum", angle: 0, icon: "drum" },
    { kind: "broom", icon: "broom" },
    { kind: "home", icon: "home" },
  ];

  // ---------------------------------------------------------------------
  // SECTION: WORLD SETUP -- planck world, ground, boundaries, piece list
  // ---------------------------------------------------------------------
  const WORLD_WIDTH = 16; // metres
  const WORLD_CENTER_X = WORLD_WIDTH / 2;
  const PICK_MARGIN = 0.12; // metres
  const WALL_THICKNESS = 0.18; // metres
  const WALL_EXTRA_HEIGHT = 30; // metres above the visible area

  const world = new planck.World({ gravity: planck.Vec2(0, -10) });

  const groundBody = world.createBody({ type: "static", position: planck.Vec2(WORLD_CENTER_X, -2) });
  groundBody.createFixture({
    shape: planck.Box(40, 2),
    friction: 0.8,
  });

  const anchorBody = world.createBody({ type: "static" });
  let boundaryBodies = [];

  // Keep every piece inside the visible building area. The walls extend well
  // above the viewport so tall towers are not capped by an invisible ceiling.
  function rebuildBoundaries() {
    for (const body of boundaryBodies) world.destroyBody(body);
    boundaryBodies = [];
    const visibleWorldHeight = buildingHeightPx / scale;
    const halfHeight = (visibleWorldHeight + WALL_EXTRA_HEIGHT) / 2 + 2;
    const centerY = (visibleWorldHeight + WALL_EXTRA_HEIGHT) / 2;
    for (const x of [-WALL_THICKNESS / 2, WORLD_WIDTH + WALL_THICKNESS / 2]) {
      const wall = world.createBody({ type: "static", position: planck.Vec2(x, centerY) });
      wall.createFixture({
        shape: planck.Box(WALL_THICKNESS / 2, halfHeight),
        friction: 1.35,
        restitution: 0,
      });
      boundaryBodies.push(wall);
    }
  }

  /** @type {Array<{id:number, defKey:string, body:any, hx?:number, hy?:number, r?:number}>} */
  const pieces = [];
  let nextPieceId = 1;

  function spawnPiece(defKey, worldX, worldY, angle, materialKey = selectedMaterial) {
    const def = PIECE_DEFS[defKey];
    const material = MATERIALS[materialKey];
    const body = world.createBody({
      type: "dynamic",
      position: planck.Vec2(worldX, worldY),
      angle: angle || 0,
      linearDamping: 0.015,
      angularDamping: 0.08,
    });
    const density = material.density * def.densityScale;
    const fixtureOptions = {
      density,
      friction: material.friction,
      restitution: material.restitution,
    };
    if (def.shape === "box") {
      body.createFixture({ ...fixtureOptions, shape: planck.Box(def.hx, def.hy) });
    } else {
      body.createFixture({ ...fixtureOptions, shape: planck.Circle(def.r) });
    }
    const piece = { id: nextPieceId++, defKey, material: materialKey, body, hx: def.hx, hy: def.hy, r: def.r };
    body.piece = piece;
    pieces.push(piece);
    return piece;
  }

  function removePiece(piece) {
    const idx = pieces.indexOf(piece);
    if (idx >= 0) pieces.splice(idx, 1);
    if (piece.joint) {
      world.destroyJoint(piece.joint);
      piece.joint = null;
    }
    world.destroyBody(piece.body);
  }

  function clearAllPieces() {
    // Destroy drag joints before destroying their bodies; this also clears
    // pointer ownership cleanly if the broom is used during a multi-touch drag.
    for (const pointerId of Array.from(pointers.keys())) releaseHold(pointerId);
    while (pieces.length) removePiece(pieces[pieces.length - 1]);
  }

  // ---------------------------------------------------------------------
  // SECTION: LAYOUT -- canvas, scale, screen<->world, sidebar/button positions
  // ---------------------------------------------------------------------
  const canvas = document.getElementById("c");
  const ctx = canvas.getContext("2d");

  let cssWidth = 0, cssHeight = 0;
  let scale = 1; // pixels per metre
  let buildingWidthPx = 0;
  let buildingHeightPx = 0;
  let sidebarWidthPx = 0;

  function layout() {
    const dpr = window.devicePixelRatio || 1;
    cssWidth = window.innerWidth;
    cssHeight = window.innerHeight;
    canvas.width = Math.round(cssWidth * dpr);
    canvas.height = Math.round(cssHeight * dpr);
    canvas.style.width = cssWidth + "px";
    canvas.style.height = cssHeight + "px";
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    sidebarWidthPx = Math.min(156, Math.max(92, cssWidth * 0.23));
    if (cssWidth - sidebarWidthPx < 160) sidebarWidthPx = Math.max(72, cssWidth * 0.28);
    buildingWidthPx = cssWidth - sidebarWidthPx;
    buildingHeightPx = cssHeight;
    scale = buildingWidthPx / WORLD_WIDTH;
    rebuildBoundaries();
  }
  layout();
  window.addEventListener("resize", layout);

  function worldToScreen(x, y) {
    return { x: x * scale, y: buildingHeightPx - y * scale };
  }
  function screenToWorld(px, py) {
    const rect = canvas.getBoundingClientRect();
    const localX = px - rect.left;
    const localY = py - rect.top;
    return { x: localX / scale, y: (buildingHeightPx - localY) / scale };
  }

  function materialLayout() {
    const pad = 7;
    const gap = 5;
    const w = (sidebarWidthPx - pad * 2 - gap) / 2;
    const h = Math.min(54, Math.max(38, cssHeight * 0.085));
    return [
      { key: "wood", x: buildingWidthPx + pad, y: 10, w, h },
      { key: "stone", x: buildingWidthPx + pad + w + gap, y: 10, w, h },
    ];
  }

  function buttonLayout() {
    const n = BUTTONS.length;
    const top = Math.max(76, Math.min(92, cssHeight * 0.16));
    const bottom = 10;
    const slot = Math.max(1, (cssHeight - top - bottom) / n);
    const size = Math.min(sidebarWidthPx * 0.58, slot * 0.72);
    const x = buildingWidthPx + sidebarWidthPx / 2;
    const list = [];
    for (let i = 0; i < n; i++) {
      list.push({ def: BUTTONS[i], x, y: top + slot * (i + 0.5), size });
    }
    return list;
  }

  // ---------------------------------------------------------------------
  // SECTION: POINTER HANDLING -- hit testing, hold/release, drag events
  // ---------------------------------------------------------------------
  // pointers: pointerId -> { piece }
  const pointers = new Map();

  function hitMaterial(px, py) {
    for (const b of materialLayout()) {
      if (px >= b.x && px <= b.x + b.w && py >= b.y && py <= b.y + b.h) return b.key;
    }
    return null;
  }

  function hitButton(px, py) {
    if (px < buildingWidthPx) return null;
    for (const b of buttonLayout()) {
      const dx = px - b.x, dy = py - b.y;
      if (dx * dx + dy * dy <= (b.size / 2) * (b.size / 2)) return b.def;
    }
    return null;
  }

  function hitPiece(worldPt) {
    // iterate from most-recently-added (likely on top) backwards
    for (let i = pieces.length - 1; i >= 0; i--) {
      const piece = pieces[i];
      if (piece.heldBy != null) continue;
      const local = piece.body.getLocalPoint(planck.Vec2(worldPt.x, worldPt.y));
      if (piece.r != null) {
        if (local.x * local.x + local.y * local.y <= (piece.r + PICK_MARGIN) * (piece.r + PICK_MARGIN)) {
          return piece;
        }
      } else {
        if (Math.abs(local.x) <= piece.hx + PICK_MARGIN && Math.abs(local.y) <= piece.hy + PICK_MARGIN) {
          return piece;
        }
      }
    }
    return null;
  }


  function startHold(piece, worldPt, pointerId, clientX, clientY) {
    if (pointers.has(pointerId) || piece.heldBy != null) return;
    piece.heldBy = pointerId;

    // A generous central balance zone avoids accidental tipping. Outside it,
    // the real grab point is used as a lever arm and produces torque.
    const localGrab = piece.body.getLocalPoint(planck.Vec2(worldPt.x, worldPt.y));
    // "Center third of the block": the zone spans the middle third of each
    // full dimension, i.e. one third of the half-extent either side of centre.
    const balanceX = piece.r != null ? piece.r / 3 : piece.hx / 3;
    const balanceY = piece.r != null ? piece.r / 3 : piece.hy / 3;
    const inBalanceZone =
      (localGrab.x * localGrab.x) / (balanceX * balanceX) +
      (localGrab.y * localGrab.y) / (balanceY * balanceY) <= 1;

    // The grab point stays under the finger (no jump towards the click).
    // Outside the balance zone the grab point is a lever and tilts the piece.
    piece.grabLocal = localGrab;
    piece.lever = !inBalanceZone;
    piece.holdAngle = piece.body.getAngle();
    piece.desired = { x: worldPt.x, y: worldPt.y };
    piece.controlMode = "hand";
    if (piece.lever) piece.body.setAngularDamping(3);

    pointers.set(pointerId, {
      piece,
      lastX: clientX,
      lastY: clientY,
      lastMoveTime: performance.now(),
    });
  }

  function releaseHold(pointerId) {
    const hand = pointers.get(pointerId);
    if (!hand) return;
    pointers.delete(pointerId);
    const piece = hand.piece;
    if (!piece) return;
    piece.heldBy = null;
    piece.grabLocal = null;
    piece.controlMode = null;
    piece.desired = null;
    piece.prevDesired = null;
    piece.uSmooth = null;
    piece.lever = false;
    piece.body.setAngularDamping(0.08);
  }

  function onPointerDown(e) {
    e.preventDefault();
    if (mode === "map") { onMapPointerDown(e); return; }
    if (e.pointerType === "mouse" && e.button !== 0) return;
    if (pointers.has(e.pointerId)) return;
    try { canvas.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
    const px = e.clientX, py = e.clientY;

    const material = hitMaterial(px, py);
    if (material) {
      selectedMaterial = material;
      return;
    }

    const btn = hitButton(px, py);
    if (btn) {
      if (btn.kind === "home") {
        releaseAllPointers();
        mode = "map";
        return;
      }
      if (btn.kind === "broom") {
        clearAllPieces();
        return;
      }
      const def = PIECE_DEFS[btn.def];
      const vertHalfExtent = def.shape === "circle" ? def.r : (btn.angle === 0 ? def.hy : def.hx);
      const horizHalfExtent = def.shape === "circle" ? def.r : (btn.angle === 0 ? def.hx : def.hy);
      // The piece must appear right at the sidebar edge, at the same height
      // as the finger, so it is visibly dragged out of the sidebar rather
      // than materialising somewhere else in the building area.
      const rawY = (buildingHeightPx - py) / scale;
      const spawnPt = {
        x: WORLD_WIDTH - horizHalfExtent - 0.08,
        y: Math.min(
          Math.max(rawY, vertHalfExtent + 0.05),
          buildingHeightPx / scale - vertHalfExtent - 0.05
        ),
      };
      const piece = spawnPiece(btn.def, spawnPt.x, spawnPt.y, btn.angle, selectedMaterial);
      startHold(piece, spawnPt, e.pointerId, px, py);
      return;
    }

    if (px < buildingWidthPx && py < buildingHeightPx) {
      const worldPt = screenToWorld(px, py);
      const piece = hitPiece(worldPt);
      if (piece) startHold(piece, worldPt, e.pointerId, px, py);
    }
  }

  // Record the pointer's raw desired world position on every move, however
  // small -- no minimum-distance threshold, so a slow drag is recognised just
  // as well as a fast one. The hand drive is what actually moves the piece
  // (in stepPhysics below, once per physics tick), not this handler.
  function onPointerMove(e) {
    const hand = pointers.get(e.pointerId);
    if (!hand || !hand.piece || !hand.piece.controlMode) return;
    hand.lastX = e.clientX;
    hand.lastY = e.clientY;
    hand.lastMoveTime = performance.now();
    hand.piece.desired = screenToWorld(e.clientX, e.clientY);
  }

  function onPointerUp(e) {
    const hand = pointers.get(e.pointerId);
    if (!hand) return;
    releaseHold(e.pointerId);
  }

  function onPointerCancel(e) {
    releaseHold(e.pointerId);
  }

  function onLostPointerCapture(e) {
    releaseHold(e.pointerId);
  }

  function releaseAllPointers() {
    for (const pointerId of Array.from(pointers.keys())) releaseHold(pointerId);
  }

  canvas.addEventListener("pointerdown", onPointerDown);
  canvas.addEventListener("pointermove", onPointerMove);
  canvas.addEventListener("pointerup", onPointerUp);
  canvas.addEventListener("pointercancel", onPointerCancel);
  canvas.addEventListener("lostpointercapture", onLostPointerCapture);
  window.addEventListener("blur", releaseAllPointers);
  document.addEventListener("visibilitychange", () => {
    if (document.hidden) releaseAllPointers();
  });

  // ---------------------------------------------------------------------
  // SECTION: CLEANUP -- remove pieces that fall off-world
  // ---------------------------------------------------------------------
  function cleanupOutOfBounds() {
    // A safety net only. Solid boundaries should prevent ordinary pieces
    // from reaching this code; never delete a piece just for leaving the view.
    for (let i = pieces.length - 1; i >= 0; i--) {
      const piece = pieces[i];
      const p = piece.body.getPosition();
      if (!Number.isFinite(p.x) || !Number.isFinite(p.y) || p.y < -100) {
        if (piece.heldBy != null) releaseHold(piece.heldBy);
        removePiece(piece);
      }
    }
  }

  // ---------------------------------------------------------------------
  // SECTION: PHYSICS STEP -- fixed step accumulator, held-piece tracking
  // ---------------------------------------------------------------------
  const STEP = 1 / 60;
  const MAX_STEPS = 5;
  let accumulator = 0;
  let lastTime = null;

  // Run once per physics tick, not per input event: a fast flick, or several
  // pointermove events the browser coalesces into one animation frame, can
  // report the pointer far from where it was a moment ago -- possibly
  // several times before a single tick runs. Reacting to each event directly
  // would let the piece be yanked through whatever is in its path within one
  // step, which the solver would resolve as a sudden deep overlap, launching
  // the obstacle at an unrealistic speed. Computing the drive fresh from the
  // piece's actual current position, once per tick, bounds that regardless
  // of how bursty the input was.
  //
  // The hand is a force with limits, not a teleport. Each tick it pushes the
  // grab point towards the pointer with at most the material's acceleration,
  // carries the piece's own weight, and never presses down on other pieces: pressing a piece
  // into another one rests it there with only its own weight, so nothing gets
  // crushed into overlap and launched, and a dragged piece cannot shove the
  // pieces under it harder than its weight allows.
  const GRAVITY = 10;
  // Hand strength for lifting beyond the piece's own weight, in newtons:
  // a stone block lifts with three more on top (slowly), not with four.
  const HAND_LIFT = 350;
  const PUSH_ACCEL = 8; // m/s^2: hand force while touching = 0.8 x own weight
  function touchesOtherPiece(body) {
    for (let ce = body.getContactList(); ce; ce = ce.next) {
      if (ce.contact.isTouching() && ce.other.piece) return true;
    }
    return false;
  }
  function advanceHeldTargets() {
    for (const hand of pointers.values()) {
      const piece = hand.piece;
      if (!piece || !piece.desired) continue;
      const body = piece.body;
      const material = MATERIALS[piece.material];
      const m = body.getMass() || 1;
      // Touching another piece, the hand pushes only gently (a fraction of the
      // held piece's own weight), so what it pushes resists by its own mass.
      const touching = touchesOtherPiece(body);
      const A = touching ? PUSH_ACCEL : material.maxAccel;
      const p = body.getWorldPoint(piece.grabLocal);
      const v = body.getLinearVelocityFromWorldPoint(p);
      const dx = piece.desired.x - p.x, dy = piece.desired.y - p.y;
      const dist = Math.hypot(dx, dy);
      // speed that can still brake to a stop on target with acceleration A
      // Move with the pointer (its own smoothed velocity), plus a correction
      // that closes the remaining gap and can brake to a stop on target.
      // Without the first part the piece lags and cuts across curves.
      const prev = piece.prevDesired || piece.desired;
      const ux = (piece.desired.x - prev.x) / STEP, uy = (piece.desired.y - prev.y) / STEP;
      piece.prevDesired = { x: piece.desired.x, y: piece.desired.y };
      piece.uSmooth = piece.uSmooth || { x: 0, y: 0 };
      piece.uSmooth.x += (ux - piece.uSmooth.x) * 0.35;
      piece.uSmooth.y += (uy - piece.uSmooth.y) * 0.35;
      const corr = Math.min(Math.sqrt(2 * A * dist) * 0.9, dist / STEP);
      let vx = piece.uSmooth.x + (dist > 1e-6 ? (dx / dist) * corr : 0);
      let vy = piece.uSmooth.y + (dist > 1e-6 ? (dy / dist) * corr : 0);
      const vlen = Math.hypot(vx, vy);
      if (vlen > material.maxLiftSpeed) { vx *= material.maxLiftSpeed / vlen; vy *= material.maxLiftSpeed / vlen; }
      const lim = m * A * STEP;
      const jx = Math.max(-lim, Math.min(lim, m * (vx - v.x)));
      const liftLim = m * GRAVITY * STEP + Math.max(m * material.maxAccel, HAND_LIFT) * STEP;
      // In free air the hand can also pull down (needed to swing a piece
      // round a curve); touching other pieces it never presses down.
      const jy = Math.max(touching ? 0 : -lim, Math.min(liftLim, m * (vy - v.y) + m * GRAVITY * STEP));
      if (piece.lever) {
        body.applyLinearImpulse(planck.Vec2(jx, jy), p, true);
      } else {
        body.applyLinearImpulse(planck.Vec2(jx, jy), body.getWorldCenter(), true);
        // centred grab: hold the pick-up angle with limited torque
        const I = body.getInertia();
        const rc = piece.r != null ? piece.r : Math.max(piece.hx, piece.hy);
        const tl = m * A * rc * STEP;
        const wDes = Math.max(-material.maxSpin, Math.min(material.maxSpin, (piece.holdAngle - body.getAngle()) * 10));
        body.applyAngularImpulse(Math.max(-tl, Math.min(tl, I * (wDes - body.getAngularVelocity()))), true);
      }
    }
  }

  // Heavier material resists being spun around in the hand.
  function clampHeldSpin() {
    for (const hand of pointers.values()) {
      const piece = hand.piece;
      if (!piece) continue;
      const maxSpin = MATERIALS[piece.material].maxSpin;
      const w = piece.body.getAngularVelocity();
      if (w > maxSpin) piece.body.setAngularVelocity(maxSpin);
      else if (w < -maxSpin) piece.body.setAngularVelocity(-maxSpin);
    }
  }

  function stepPhysics(dtSeconds) {
    accumulator += dtSeconds;
    let steps = 0;
    while (accumulator >= STEP && steps < MAX_STEPS) {
      advanceHeldTargets();
      world.step(STEP, 10, 5);
      clampHeldSpin();
      accumulator -= STEP;
      steps++;
    }
    if (steps === MAX_STEPS) accumulator = 0;
  }

  // ---------------------------------------------------------------------
  // SECTION: DRAWING -- render loop, piece drawing
  // ---------------------------------------------------------------------
  function drawPiece(piece) {
    const pos = piece.body.getPosition();
    const angle = piece.body.getAngle();
    const s = worldToScreen(pos.x, pos.y);
    ctx.save();
    ctx.translate(s.x, s.y);
    ctx.rotate(-angle);
    ctx.scale(scale, scale);
    const fn = SKIN.piece[PIECE_DEFS[piece.defKey].skin];
    if (piece.r != null) fn(ctx, piece.r);
    else fn(ctx, piece.hx * 2, piece.hy * 2, piece.material);

    // Wood is visibly striped; stone has a solid cool-grey finish.
    if (piece.r != null) {
      ctx.beginPath(); ctx.arc(0, 0, piece.r - 0.015, 0, Math.PI * 2); ctx.clip();
      if (piece.material === "wood") {
        ctx.strokeStyle = "rgba(91, 55, 25, 0.62)"; ctx.lineWidth = 0.045;
        for (let y = -piece.r; y <= piece.r; y += 0.19) {
          const half = Math.sqrt(Math.max(0, piece.r * piece.r - y * y));
          ctx.beginPath(); ctx.moveTo(-half, y); ctx.lineTo(half, y); ctx.stroke();
        }
      } else {
        ctx.fillStyle = "#89939b";
        ctx.beginPath(); ctx.arc(0, 0, piece.r - 0.02, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = "#4d5962"; ctx.lineWidth = 0.06;
        ctx.beginPath(); ctx.arc(0, 0, piece.r, 0, Math.PI * 2); ctx.stroke();
      }
    } else {
      if (piece.material === "wood") {
        // grain runs along the long side
        ctx.strokeStyle = "rgba(91, 55, 25, 0.62)"; ctx.lineWidth = 0.045;
        const along = piece.hx >= piece.hy, a = along ? piece.hx : piece.hy, c = along ? piece.hy : piece.hx;
        for (let t = -c + 0.13; t < c; t += 0.19) {
          ctx.beginPath();
          if (along) { ctx.moveTo(-a + 0.04, t); ctx.lineTo(a - 0.04, t); }
          else { ctx.moveTo(t, -a + 0.04); ctx.lineTo(t, a - 0.04); }
          ctx.stroke();
        }
      } else {
        ctx.fillStyle = "#89939b";
        ctx.fillRect(-piece.hx + 0.025, -piece.hy + 0.025, piece.hx * 2 - 0.05, piece.hy * 2 - 0.05);
        ctx.strokeStyle = "#4d5962"; ctx.lineWidth = 0.06;
        ctx.strokeRect(-piece.hx, -piece.hy, piece.hx * 2, piece.hy * 2);
      }
    }

    ctx.restore();
  }

  function render() {
    SKIN.background(ctx, buildingWidthPx, buildingHeightPx);
    ctx.fillStyle = "#d8c08a";
    ctx.fillRect(0, buildingHeightPx - 12, buildingWidthPx, 12);

    for (const piece of pieces) drawPiece(piece);

    // Right-side palette replaces the old bottom tray.
    ctx.fillStyle = "#514638";
    ctx.fillRect(buildingWidthPx, 0, sidebarWidthPx, cssHeight);
    ctx.fillStyle = "#3e352b";
    ctx.fillRect(buildingWidthPx, 0, 3, cssHeight);

    for (const b of materialLayout()) {
      const selected = selectedMaterial === b.key;
      ctx.fillStyle = selected ? "#e7d8b8" : "#796b59";
      ctx.strokeStyle = selected ? "#fff2d3" : "#30281f";
      ctx.lineWidth = selected ? 3 : 1.5;
      ctx.fillRect(b.x, b.y, b.w, b.h);
      ctx.strokeRect(b.x, b.y, b.w, b.h);
      if (b.key === "wood") {
        ctx.fillStyle = "#c49a62";
        ctx.fillRect(b.x + 5, b.y + 5, b.w - 10, b.h - 10);
        ctx.strokeStyle = "#76502e"; ctx.lineWidth = 2;
        for (let yy = b.y + 10; yy < b.y + b.h - 5; yy += 6) {
          ctx.beginPath(); ctx.moveTo(b.x + 7, yy); ctx.lineTo(b.x + b.w - 7, yy); ctx.stroke();
        }
      } else {
        ctx.fillStyle = "#89939b";
        ctx.fillRect(b.x + 5, b.y + 5, b.w - 10, b.h - 10);
      }
      ctx.fillStyle = "#211c17";
      ctx.font = "bold 9px sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "bottom";
      ctx.fillText(b.key === "wood" ? "WOOD" : "STONE", b.x + b.w / 2, b.y + b.h - 2);
    }

    for (const b of buttonLayout()) {
      SKIN.button(ctx, b.def.icon, b.x, b.y, b.size, false);
    }
  }

  // ---------------------------------------------------------------------
  // SECTION: FEEL -- impact dust puffs, thud sound hook, small screen shake
  // ---------------------------------------------------------------------
  // Owner-supplied sounds: put an <audio id="snd-thud-wood"> / "snd-thud-stone"
  // in the page; playSound finds and plays it, silently does nothing if absent.
  function playSound(name, volume) {
    const el = document.getElementById("snd-" + name);
    if (!el) return;
    try { const c = el.cloneNode(); c.volume = Math.max(0, Math.min(1, volume)); c.play().catch(() => {}); } catch (err) { /* ignore */ }
  }
  const puffs = [];
  let shake = 0;
  const lastImpact = new Map(); // body -> time, so one landing makes one thud
  world.on("post-solve", (contact, impulse) => {
    const bA = contact.getFixtureA().getBody(), bB = contact.getFixtureB().getBody();
    const n = Math.max(...impulse.normalImpulses.slice(0, contact.getManifold().pointCount));
    for (const b of [bA, bB]) {
      if (!b.piece) continue;
      const dv = n / (b.getMass() || 1); // speed change this contact caused, m/s
      if (dv < 1.2) continue;
      const now = performance.now();
      if (now - (lastImpact.get(b) || 0) < 250) continue;
      lastImpact.set(b, now);
      const wm = new planck.WorldManifold(); contact.getWorldManifold(wm);
      const p0 = wm.points[0] || b.getPosition();
      const p1 = contact.getManifold().pointCount > 1 ? wm.points[1] : p0;
      const strength = Math.min(1, dv / 6);
      const stone = b.piece.material === "stone";
      const other = b === bA ? bB : bA;
      // dust where a piece hits the ground, stone chips where stone hits stone, nothing otherwise
      const kind = other === groundBody ? "dust" : (stone && other.piece && other.piece.material === "stone") ? "chip" : null;
      const count = kind ? 4 + Math.round(strength * 6) + Math.round(Math.hypot(p1.x - p0.x, p1.y - p0.y) * 4) : 0;
      for (let i = 0; i < count; i++) {
        const t = count > 1 ? i / (count - 1) : 0.5; // spread over the whole contact edge
        const x = p0.x + (p1.x - p0.x) * t, y = p0.y + (p1.y - p0.y) * t;
        if (kind === "dust") puffs.push({ kind, x, y, vx: (Math.random() - 0.5) * 2, vy: Math.random() * 0.8, r: 0.08 + Math.random() * 0.1, life: 1 });
        else puffs.push({ kind, x, y, vx: (Math.random() - 0.5) * 3, vy: 1 + Math.random() * 2, r: 0.04 + Math.random() * 0.05, a: Math.random() * 6, life: 1 });
      }
      playSound(stone ? "thud-stone" : "thud-wood", strength);
      if (stone && kind) shake = Math.max(shake, strength * 11 * Math.min(1, b.getMass() / 10)); // px
    }
  });
  function updateFeel(dt) {
    for (let i = puffs.length - 1; i >= 0; i--) {
      const q = puffs[i];
      q.x += q.vx * dt; q.y += q.vy * dt;
      if (q.kind === "dust") { q.r += 0.5 * dt; q.life -= dt * 1.6; }
      else { q.vy -= GRAVITY * dt; q.a += dt * 8; q.life -= dt * 1.2; }
      if (q.life <= 0) puffs.splice(i, 1);
    }
    shake = Math.max(0, shake - dt * 45);
  }
  function drawFeel() {
    for (const q of puffs) {
      const s = worldToScreen(q.x, q.y);
      if (q.kind === "dust") SKIN.dust(ctx, s.x, s.y, q.r * scale, q.life);
      else SKIN.chip(ctx, s.x, s.y, q.r * scale, q.a, q.life);
    }
  }

  // ---------------------------------------------------------------------
  // SECTION: MAP -- world map start screen, the ten monument sites (empty for now)
  // ---------------------------------------------------------------------
  let mode = "map"; // "map" | "build"
  // Level order. lon/lat: the real place; mx/my: where the marker sits when
  // the real place is too close to another site for two big targets.
  const SITES = [
    { key: "mastaba",   lon: 31.13, lat: 29.98, mx: 30.0, my: 28.6 }, // mastaba fields, Giza
    { key: "ziggurat",  lon: 46.10, lat: 30.96 },                     // Ur
    { key: "djoser",    lon: 31.22, lat: 29.87, mx: 32.6, my: 29.0 }, // Saqqara
    { key: "liongate",  lon: 22.76, lat: 37.73, mx: 21.2, my: 38.4 }, // Mycenae
    { key: "karnak",    lon: 32.66, lat: 25.72 },                     // Karnak, Luxor
    { key: "parthenon", lon: 23.73, lat: 37.97, mx: 24.9, my: 39.2 }, // Athens
    { key: "pharos",    lon: 29.88, lat: 31.21, mx: 28.6, my: 32.6 }, // Alexandria
    { key: "ishtar",    lon: 44.42, lat: 32.54 },                     // Babylon
    { key: "valens",    lon: 28.96, lat: 41.01 },                     // Constantinople
    { key: "mystras",   lon: 22.37, lat: 37.07, mx: 21.6, my: 36.3 }, // Mystras
  ];
  const MAP_BOX = { lon0: 18, lon1: 50, lat0: 23, lat1: 44 };
  const MAP_KX = Math.cos(33.5 * Math.PI / 180);
  function mapView() {
    const wDeg = (MAP_BOX.lon1 - MAP_BOX.lon0) * MAP_KX, hDeg = MAP_BOX.lat1 - MAP_BOX.lat0;
    const k = Math.min(cssWidth / wDeg, cssHeight / hDeg);
    const ox = (cssWidth - wDeg * k) / 2, oy = (cssHeight - hDeg * k) / 2;
    return {
      k, ox, oy, w: wDeg * k, h: hDeg * k,
      pt: (lon, lat) => ({ x: ox + (lon - MAP_BOX.lon0) * MAP_KX * k, y: oy + (MAP_BOX.lat1 - lat) * k }),
    };
  }
  let mapPath = null, mapPathKey = "";
  function landPath(v) {
    const key = v.k + "," + v.ox + "," + v.oy;
    if (mapPath && key === mapPathKey) return mapPath;
    mapPath = new Path2D();
    for (const ring of MAP_LAND) {
      for (let i = 0; i < ring.length; i += 2) {
        const q = v.pt(ring[i] / 10, ring[i + 1] / 10);
        if (i === 0) mapPath.moveTo(q.x, q.y); else mapPath.lineTo(q.x, q.y);
      }
      mapPath.closePath();
    }
    mapPathKey = key;
    return mapPath;
  }
  function siteRadius(v) { return Math.max(22, Math.min(v.w, v.h) * 0.04); }
  function freePlayButton() {
    const size = Math.max(70, Math.min(cssWidth, cssHeight) * 0.14);
    return { x: cssWidth - size * 0.75, y: cssHeight - size * 0.75, size };
  }
  function renderMap() {
    ctx.fillStyle = "#6f9fb1"; ctx.fillRect(0, 0, cssWidth, cssHeight);
    const v = mapView();
    ctx.save();
    ctx.beginPath(); ctx.rect(v.ox, v.oy, v.w, v.h); ctx.clip();
    SKIN.mapSea(ctx, v.ox, v.oy, v.w, v.h);
    SKIN.mapLand(ctx, landPath(v));
    ctx.restore();
    const r = siteRadius(v);
    for (const site of SITES) {
      const t = v.pt(site.lon, site.lat), m = v.pt(site.mx ?? site.lon, site.my ?? site.lat);
      SKIN.mapSite(ctx, m.x, m.y, r, t.x, t.y);
    }
    const fb = freePlayButton();
    SKIN.button(ctx, "block", fb.x, fb.y, fb.size, false);
  }
  function onMapPointerDown(e) {
    const fb = freePlayButton();
    if (Math.hypot(e.clientX - fb.x, e.clientY - fb.y) <= fb.size / 2) { mode = "build"; return; }
    // Sites have no levels yet.
  }

  // ---------------------------------------------------------------------
  // SECTION: MAIN LOOP -- requestAnimationFrame driver
  // ---------------------------------------------------------------------
  function frame(time) {
    if (lastTime == null) lastTime = time;
    const dt = Math.min(0.1, (time - lastTime) / 1000);
    lastTime = time;
    if (mode === "map") {
      renderMap();
      requestAnimationFrame(frame);
      return;
    }
    stepPhysics(dt);
    cleanupOutOfBounds();
    updateFeel(dt);
    ctx.save();
    if (shake > 0) ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
    render();
    drawFeel();
    ctx.restore();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
