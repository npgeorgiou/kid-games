      if (b.def.kind === "test" && (tabHeldNow() || (test && test.fast))) SKIN.fastBadge(ctx, b.x, b.y, b.size);
    }
  }

  // ---------------------------------------------------------------------
  // SECTION: FEEL -- impact dust puffs, collision sound hooks, small screen shake
  // ---------------------------------------------------------------------
  // Sounds (owner-supplied, loudness-matched, in src/sounds; build.py embeds them).
  // Each name plays one or more files; the number is that file's volume (0..1), set by ear.
  const SOUNDS = {
    "hit-ground-wood": [["sounds/hit-ground-wood.mp3", 0.8]],
    "hit-ground-mudbrick": [["sounds/hit-ground-mudbrick.mp3", 0.8]],
    "hit-ground-stone": [["sounds/hit-ground-stone.mp3", 0.9]],
    "hit-wood-wood": [["sounds/hit-wood-wood.mp3", 0.8]],
    "hit-mudbrick-wood": [["sounds/hit-mudbrick-wood.mp3", 0.8]],
    "hit-stone-wood": [["sounds/hit-stone-wood.mp3", 0.8]],
    "hit-mudbrick-mudbrick": [["sounds/hit-mudbrick-mudbrick.mp3", 0.8]],
    "hit-mudbrick-stone": [["sounds/hit-mudbrick-mudbrick.mp3", 0.8]], // no own file: mudbrick on mudbrick
    "hit-stone-stone": [["sounds/hit-stone-stone.mp3", 0.9]],
    crumble: [["sounds/crumble.mp3", 1]],
    snap: [["sounds/snap.mp3", 1]],
    wind: [["sounds/wind.mp3", 0.35]],            // loops through the wind test
    quake: [["sounds/quake.mp3", 1.6]],          // cut off when the shaking ends
    cheer: [["sounds/victory.mp3", 0.8], ["sounds/crowd-cheer.mp3", 0.6]],
    fail: [["sounds/loss.mp3", 0.8], ["sounds/crowd-disappointment.mp3", 0.6]],
    "drag-stone": [["sounds/drag-stone.mp3", 0.6]], // loops; louder the faster stone or mudbrick slides
    "drag-wood": [["sounds/drag-wood.mp3", 0.6]],   // same for wood
    "music-map": [["sounds/music-map.mp3", 0.2]],
    "music-level": [["sounds/music-level.mp3", 0.17]],
    drumroll: [["sounds/drumroll.mp3", 0.8]],    // sped up or slowed down to last as long as the test load is lowered
    // collapse.mp3 is in src/sounds but not used yet
  };
  let actx = null;
  const buffers = {};
  // Browsers only allow sound after the first press; called from the pointer handlers.
  function startAudio() {
    if (actx) { if (actx.state === "suspended") actx.resume(); return; }
    try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (err) { return; }
    const files = new Set();
    for (const list of Object.values(SOUNDS)) for (const [f] of list) files.add(f);
    for (const f of files) {
      fetch(f).then((r) => r.arrayBuffer()).then((b) => actx.decodeAudioData(b)).then((buf) => { buffers[f] = buf; updateMusic(true); }).catch(() => {});
    }
  }
  // Plays a sound; returns a handle with stop(fadeSeconds) and setVolume(v), or null.
  // fitSeconds: play the clip faster or slower so it lasts exactly that long
  function soundLength(name) { const l = SOUNDS[name]; return l && buffers[l[0][0]] ? buffers[l[0][0]].duration : 0; }
  function playSound(name, volume, loop = false, fitSeconds = 0, opts = {}) {
    const list = SOUNDS[name];
    if (!actx || !list) return null;
    const parts = [];
    for (const [f, v] of list) {
      if (!buffers[f]) continue;
      const src = actx.createBufferSource(), gain = actx.createGain();
      src.buffer = buffers[f]; src.loop = loop;
      if (opts.rate) src.playbackRate.value = opts.rate;
      else if (fitSeconds > 0) src.playbackRate.value = Math.max(0.25, Math.min(4, buffers[f].duration / fitSeconds));
      gain.gain.value = Math.max(0, Math.min(1, volume)) * v;
      src.connect(gain).connect(actx.destination);
      src.start(actx.currentTime, Math.min(opts.offset || 0, Math.max(0, buffers[f].duration - 0.05)));
      parts.push({ src, gain, v });
    }
    if (!parts.length) return null;
    return {
      stop(fade = 0.3) { for (const p of parts) { const t = actx.currentTime; p.gain.gain.setTargetAtTime(0, t, fade / 3); p.src.stop(t + fade + 0.05); } },
      setVolume(x) { for (const p of parts) p.gain.gain.setTargetAtTime(Math.max(0, Math.min(1, x)) * p.v, actx.currentTime, 0.05); },
    };
  }
  // Music: one loop for the map, another while building.
  let music = null, musicName = null;
  function updateMusic(force) {
    const want = mode === "map" ? "music-map" : "music-level";
    if (want === musicName && music && !force) return;
    if (want === musicName && music) return;
    const next = playSound(want, 1, true);
    if (!next) return;
    if (music) music.stop(1);
    music = next; musicName = want;
  }
  // Sliding: a quiet loop per material group, as loud as the fastest sliding piece.
  const dragLoops = {};
  function updateDragSounds() {
    if (!actx) return;
    const speed = { "drag-stone": 0, "drag-wood": 0 };
    if (mode === "build") for (const p of pieces) {
      if (p.ghost) continue;
      const key = p.material === "wood" ? "drag-wood" : "drag-stone";
      for (let ce = p.body.getContactList(); ce; ce = ce.next) {
        const c = ce.contact;
        if (!c.isTouching()) continue;
        const wm = new planck.WorldManifold(); c.getWorldManifold(wm);
        const k = c.getManifold().pointCount, pt = k > 1 ? planck.Vec2((wm.points[0].x + wm.points[1].x) / 2, (wm.points[0].y + wm.points[1].y) / 2) : wm.points[0];
        if (!pt) continue;
        const n = wm.normal, va = p.body.getLinearVelocityFromWorldPoint(pt), vb = ce.other.getLinearVelocityFromWorldPoint(pt);
        const rx = va.x - vb.x, ry = va.y - vb.y, rn = rx * n.x + ry * n.y;
        const slide = Math.hypot(rx - rn * n.x, ry - rn * n.y);
        if (slide > speed[key]) speed[key] = slide;
      }
    }
    for (const key of Object.keys(speed)) {
      const v = speed[key] > 0.3 ? Math.min(1, speed[key] / 3) : 0;
      if (!dragLoops[key] && v > 0) dragLoops[key] = playSound(key, 0, true);
      if (dragLoops[key]) dragLoops[key].setVolume(v);
    }
  }
  const puffs = [];
  let shake = 0;
  const feelHits = [0, 0];
  const lastImpact = new Map(); // body -> time, so one landing makes one thud
  const MUD_SHATTER_SPEED = 7; // m/s lost in one step that crumbles a mudbrick at once (about a 2.5 m fall); placeholder
  // Also used by the sidebar pile (pile = true): same dust, chips and sounds, no shake, no breaking.
  world.on("post-solve", (contact, impulse) => feelContact(contact, impulse, false));
  // How fast the two bodies were closing at the contact before the solver ran (m/s).
  // A resting stack has ~0 here even though its contact impulse carries the weight of
  // everything above; reading impulse/mass alone mistook that weight for a hit every step.
  function approachSpeed(contact) {
    const bA = contact.getFixtureA().getBody(), bB = contact.getFixtureB().getBody();
    const wm = new planck.WorldManifold(); contact.getWorldManifold(wm);
    let vn = 0;
    for (let i = 0; i < contact.getManifold().pointCount; i++) {
      const p = wm.points[i], va = bA.getLinearVelocityFromWorldPoint(p), vb = bB.getLinearVelocityFromWorldPoint(p);
      vn = Math.max(vn, -((vb.x - va.x) * wm.normal.x + (vb.y - va.y) * wm.normal.y));
    }
    return vn;
  }
  world.on("pre-solve", (contact) => { contact.tbVn = approachSpeed(contact); });
  function feelContact(contact, impulse, pile) {
    const bA = contact.getFixtureA().getBody(), bB = contact.getFixtureB().getBody();
    const n = Math.max(...impulse.normalImpulses.slice(0, contact.getManifold().pointCount));
    if (pile && performance.now() < pileQuietUntil) return; // pieces settling into a freshly filled pile
    const item = (b) => (pile ? b.pileItem : b.piece);
    const isGround = (b) => (pile ? b.isStatic() : b === groundBody);
    let played = false; // one sound per collision, even when both pieces react
    for (const b of [bA, bB]) {
      const it = item(b);
      if (!it) continue;
      const dv = Math.min(n / (b.getMass() || 1), contact.tbVn || 0); // speed change this contact caused, m/s, at most the closing speed
      if (dv < 1.2) continue;
      feelHits[pile ? 1 : 0]++; // test counter (tools/harness.py)
      const now = performance.now();
      if (now - (lastImpact.get(b) || 0) < 250) continue;
      lastImpact.set(b, now);
      const wm = new planck.WorldManifold(); contact.getWorldManifold(wm);
      const p0 = wm.points[0] || b.getPosition();
      const p1 = contact.getManifold().pointCount > 1 ? wm.points[1] : p0;
      const strength = Math.min(1, dv / 6);
      const stone = it.material === "stone";
      const other = b === bA ? bB : bA;
      // dust where a piece hits the ground, stone chips where stone hits stone,
      // mud crumbs where mudbrick hits any piece, nothing otherwise
      const mud = it.material === "mudbrick";
      const kind = isGround(other) ? "dust" : (mud && item(other)) ? "mudchip"
        : (stone && item(other) && item(other).material === "stone") ? "chip" : null;
      const count = kind ? 4 + Math.round(strength * 6) + Math.round(Math.hypot(p1.x - p0.x, p1.y - p0.y) * 4) : 0;
      for (let i = 0; i < count; i++) {
        const t = count > 1 ? i / (count - 1) : 0.5; // spread over the whole contact edge
        const x = p0.x + (p1.x - p0.x) * t, y = p0.y + (p1.y - p0.y) * t;
        if (kind === "dust") puffs.push({ kind, pile, x, y, vx: (Math.random() - 0.5) * 2, vy: Math.random() * 0.8, r: 0.08 + Math.random() * 0.1, life: 1 });
        else if (kind === "mudchip") puffs.push({ kind, pile, x, y, vx: (Math.random() - 0.5) * 2.5, vy: 0.5 + Math.random() * 1.5, r: 0.04 + Math.random() * 0.05, a: Math.random() * 6, life: 1 });
        else puffs.push({ kind, pile, x, y, vx: (Math.random() - 0.5) * 3, vy: 1 + Math.random() * 2, r: 0.04 + Math.random() * 0.05, a: Math.random() * 6, life: 1 });
      }
      if (!played) {
        played = true;
        const om = isGround(other) ? "ground" : item(other) ? item(other).material : null;
        if (om) playSound("hit-" + [it.material, om].sort((x, y) => (x === "ground" ? -1 : y === "ground" ? 1 : x < y ? -1 : x > y ? 1 : 0)).join("-"), pile ? strength * 0.5 : strength); // the sidebar plays at half volume
      }
      if (stone && kind && !pile) shake = Math.max(shake, strength * 11 * Math.min(1, b.getMass() / 10)); // px
    }
  }
  function updateFeel(dt) {
    for (let i = puffs.length - 1; i >= 0; i--) {
      const q = puffs[i];
      q.x += q.vx * dt; q.y += q.vy * dt;
      if (q.kind === "dust") { q.r += 0.5 * dt; q.life -= dt * 1.6; }
      else if (q.kind === "wind") { q.life -= dt * 0.9; }
      else if (q.kind === "petal") { q.vy -= 2 * dt; q.a += dt * 4; q.life -= dt * 0.4; }
      else { q.vy -= GRAVITY * dt; q.a += dt * 8; q.life -= dt * 1.2; }
      if (q.life <= 0) puffs.splice(i, 1);
    }
    shake = Math.max(0, shake - dt * 45);
  }
  function drawFeel() {
    for (const q of puffs) {
      const r0 = pileBinRect, sc0 = q.pile ? pileScale : scale;
      if (q.pile && !r0) continue;
      const s = q.pile ? { x: r0.x + q.x * pileScale, y: r0.y + r0.h - q.y * pileScale } : worldToScreen(q.x, q.y);
      if (q.kind === "dust") SKIN.dust(ctx, s.x, s.y, q.r * sc0, q.life);
      else if (q.kind === "wind") { // kept to the building area, off the sidebar
        ctx.save(); ctx.beginPath(); ctx.rect(0, 0, buildingWidthPx, cssHeight); ctx.clip();
        SKIN.wind(ctx, s.x, s.y, q.r * sc0, q.life, q.dir || 1, q.ph || 0); ctx.restore();
      }
      else if (q.kind === "mudchip") SKIN.mudChip(ctx, s.x, s.y, q.r * sc0, q.a, q.life);
      else if (q.kind === "splinter") SKIN.splinter(ctx, s.x, s.y, q.r * sc0, q.a, q.life);
      else if (q.kind === "petal") SKIN.petal(ctx, s.x, s.y, q.r * sc0, q.a, Math.min(1, q.life * 2), q.hue);
      else SKIN.chip(ctx, s.x, s.y, q.r * sc0, q.a, q.life);
    }
  }

  // ---------------------------------------------------------------------
  // SECTION: BREAKING -- mudbrick crumbles under heavy weight, wood snaps when loaded over a gap
  // ---------------------------------------------------------------------
  // Placeholders to tune by play. A mudbrick holds three stone blocks stacked on
  // it, not four; a wooden beam over a gap holds one stone block, not two.
  const CRUSH_FORCE = 320; // N pressing down on one mudbrick
  const SNAP_MOMENT = 80;  // N*m bending a wood piece between (or beyond) its supports
  const STRAIN_TIME = { crumble: 0.5, snap: 0.25 }; // seconds of overload before it gives

  // Collect, per physics step, what presses on each mudbrick and where wood is held up and pushed down.
  world.on("post-solve", (contact, impulse) => {
    const bA = contact.getFixtureA().getBody(), bB = contact.getFixtureB().getBody();
    const watch = (b) => b.piece && (b.piece.material === "mudbrick" || b.piece.canSnap);
    if (!watch(bA) && !watch(bB)) return;
    const wm = new planck.WorldManifold(); contact.getWorldManifold(wm);
    const n = wm.normal, cnt = contact.getManifold().pointCount;
    for (const [body, sign] of [[bA, -1], [bB, 1]]) {
      if (!watch(body)) continue;
      const piece = body.piece;
      const pts = [];
      for (let i = 0; i < cnt; i++) {
        const j = impulse.normalImpulses[i] / STEP; // N
        if (j > 0) pts.push([wm.points[i].x, wm.points[i].y, sign * n.x * j, sign * n.y * j]);
      }
      if (!pts.length) continue;
      if (piece.material === "mudbrick") {
        for (const p of pts) if (p[3] < 0) piece.crush -= p[3];
        continue;
      }
      // wood: positions along the long axis, forces across it (towards up = holds it up)
      const a = body.getAngle(), along = piece.hx >= piece.hy;
      const ux = along ? Math.cos(a) : -Math.sin(a), uy = along ? Math.sin(a) : Math.cos(a);
      let px = -uy, py = ux;
      if (py < 0) { px = -px; py = -py; }
      if (py < 0.5) continue; // standing too upright to bend
      const c = body.getPosition();
      let s0 = Infinity, s1 = -Infinity, sl = 0, nl = 0;
      for (const [x, y, fx, fy] of pts) {
        const s = (x - c.x) * ux + (y - c.y) * uy, f = fx * px + fy * py;
        if (f > 0) { s0 = Math.min(s0, s); s1 = Math.max(s1, s); }
        else { piece.loads.push([s, -f]); sl += s; nl++; }
      }
      // what hit it: kinetic energy it brought in = J^2 / 2m (J = the impulse that stopped it this step)
      const other = body === bA ? bB : bA, mo = other.isDynamic() ? other.getMass() : 0;
      if (nl && mo > 0) {
        let J = 0;
        for (let i = 0; i < cnt; i++) J += impulse.normalImpulses[i];
        const hv = Math.min(J / mo, contact.tbVn || 0); // closing speed: resting weight is not a hit
        if (hv > 1.5) piece.impacts.push([sl / nl, 0.5 * mo * hv * hv, mo * GRAVITY]); // a real hit, not settling (over 1.5 m/s)
      }
      if (s1 >= s0) piece.sup.push([s0, s1]); // one support contact holds up the whole stretch between its points
    }
  });

  // Bending: a load over a gap counts as if spread over that gap (P x gap / 4, so a
  // stiff block sitting near the supports still loads the beam); a load beyond the
  // last support bends by its distance from it. Loads right over a support count nothing.
  function bendMoment(p) {
    if (!p.sup.length || !p.loads.length) return 0;
    let M = 0;
    for (const [x, P] of p.loads) {
      let l = -Infinity, r = Infinity, held = false;
      for (const [a, b] of p.sup) {
        if (x >= a - 0.05 && x <= b + 0.05) { held = true; break; }
        if (b < x) l = Math.max(l, b);
        if (a > x) r = Math.min(r, a);
      }
      if (held) continue;
      if (Number.isFinite(l) && Number.isFinite(r)) M += (P * (r - l)) / 4;
      else M += P * Math.min(Math.abs(x - l), Math.abs(r - x));
    }
    return M;
  }

  // Impact on a beam (energy method): an object bringing kinetic energy KE onto a span L
  // between supports raises the bending moment by sqrt(6 * KE * EI / L) wherever it lands,
  // on top of its weight's own moment W*a*b/L; past the last support the arm a replaces L
  // and the weight's moment is W*a. Stiffer or shorter spans take more of the blow.
  const WOOD_EI = 1;       // bending stiffness of the wooden pieces, N*m^2 (placeholder, tune by play)
  const IMPACT_MIN_SPAN = 0.5; // m: spans shorter than this count as this
  function impactMoment(p) {
    if (!p.sup.length || !p.impacts.length) return 0;
    let M = 0;
    for (const [x, ke, W] of p.impacts) {
      let l = -Infinity, r = Infinity, held = false;
      for (const [a, b] of p.sup) {
        if (x >= a - 0.05 && x <= b + 0.05) { held = true; break; }
        if (b < x) l = Math.max(l, b);
        if (a > x) r = Math.min(r, a);
      }
      if (held) continue;
      let m;
      if (Number.isFinite(l) && Number.isFinite(r)) {
        const L = r - l;
        m = (W * (x - l) * (r - x)) / L + Math.sqrt((6 * ke * WOOD_EI) / Math.max(IMPACT_MIN_SPAN, L));
      } else {
        const a = Math.min(Math.abs(x - l), Math.abs(r - x));
        m = W * a + Math.sqrt((6 * ke * WOOD_EI) / Math.max(IMPACT_MIN_SPAN, a));
      }
      M = Math.max(M, m);
    }
    return M;
  }

  function updateStrain() {
    for (const p of pieces.slice()) {
      if (p.material !== "mudbrick" && !p.canSnap) continue;
      // hard landing: a mudbrick whose speed changed by more than MUD_SHATTER_SPEED in one step crumbles at once
      if (p.material === "mudbrick") {
        const v = p.body.getLinearVelocity(), pv = p.prevV;
        p.prevV = { x: v.x, y: v.y };
        if (pv && p.heldBy == null && !p.auto && Math.hypot(v.x - pv.x, v.y - pv.y) > MUD_SHATTER_SPEED) { crumble(p); continue; }
      }
      // hit: wood snaps at once when an impact bends it past its strength
      if (p.canSnap && p.heldBy == null && impactMoment(p) > SNAP_MOMENT) { p.impacts.length = 0; snapWood(p); continue; }
      p.impacts.length = 0;
      let over = false, time = 1;
      if (p.heldBy == null) {
        if (p.material === "mudbrick") { over = p.crush > CRUSH_FORCE; time = STRAIN_TIME.crumble; }
        else { over = bendMoment(p) > SNAP_MOMENT; time = STRAIN_TIME.snap; }
      }
      p.strain = over ? p.strain + STEP / time : Math.max(0, p.strain - STEP);
      p.crush = 0; p.sup.length = 0; p.loads.length = 0;
      if (p.strain >= 1) { if (p.material === "mudbrick") crumble(p); else snapWood(p); }
    }
  }

  // Anything that breaks during the test fails it; its place is shown red.
  function noteBroken(p) {
    if (!test || !grid) return;
    const v = planck.Vec2(0, 0);
    for (let f = p.body.getFixtureList(); f; f = f.getNext()) {
      const bb = f.getAABB(0);
      for (let x = Math.floor(bb.lowerBound.x / CELL); x <= Math.floor(bb.upperBound.x / CELL); x++)
        for (let y = Math.max(0, Math.floor(bb.lowerBound.y / CELL)); y <= Math.floor(bb.upperBound.y / CELL); y++) {
          v.x = (x + 0.5) * CELL; v.y = (y + 0.5) * CELL;
          if (f.testPoint(v)) { const k = cellOf(v.x, v.y); if (k >= 0) test.broken.push(k); }
        }
    }
  }
  function crumble(p) {
    const body = p.body, c = body.getPosition(), a = body.getAngle(), ca = Math.cos(a), sa = Math.sin(a);
    const hx = p.hx != null ? p.hx : p.r, hy = p.hy != null ? p.hy : p.r;
    for (let i = 0; i < 26; i++) {
      const lx = (Math.random() * 2 - 1) * hx, ly = (Math.random() * 2 - 1) * hy;
      const x = c.x + lx * ca - ly * sa, y = c.y + lx * sa + ly * ca;
      if (i % 2) puffs.push({ kind: "dust", x, y, vx: (Math.random() - 0.5) * 1.5, vy: Math.random() * 0.6, r: 0.12 + Math.random() * 0.15, life: 1 });
      else puffs.push({ kind: "mudchip", x, y, vx: (Math.random() - 0.5) * 2.5, vy: Math.random() * 1.5, r: 0.05 + Math.random() * 0.07, a: Math.random() * 6, life: 1 });
    }
    playSound("crumble", 1);
    shake = Math.max(shake, 4);
    noteBroken(p);
    removePiece(p);
  }

  function snapWood(p) {
    const def = PIECE_DEFS[p.defKey];
    const body = p.body, c = body.getPosition(), a = body.getAngle(), v = body.getLinearVelocity(), w = body.getAngularVelocity();
    const along = p.hx >= p.hy, L = (along ? p.hx : p.hy) / 2;
    const ux = along ? Math.cos(a) : -Math.sin(a), uy = along ? Math.sin(a) : Math.cos(a);
    const vx = v.x, vy = v.y;
    noteBroken(p);
    removePiece(p);
    for (const s of [-1, 1]) {
      const q = spawnPiece(def.half, c.x + s * ux * L, c.y + s * uy * L, a, "wood");
      q.body.setLinearVelocity(planck.Vec2(vx, vy));
      q.body.setAngularVelocity(w + s * 0.6); // the broken middle drops: the halves fold into a V
    }
    for (let i = 0; i < 12; i++) puffs.push({ kind: "splinter", x: c.x, y: c.y, vx: (Math.random() - 0.5) * 3, vy: Math.random() * 2.5, r: 0.12 + Math.random() * 0.1, a: Math.random() * 6, life: 1 });
    playSound("snap", 1);
  }

  // ---------------------------------------------------------------------
  // SECTION: PILE -- levels only: the sidebar holds the level's limited pieces as a small physics pile
  // ---------------------------------------------------------------------
  // Pieces keep their real sizes in this separate world; only the drawing is
  // small. Dragging one out gives the real piece; dropping a piece back on
  // the sidebar returns it.
  const pileWorld = new planck.World({ gravity: planck.Vec2(0, -10) });
  let pileWalls = null, pileQuietUntil = 0;
  pileWorld.on("pre-solve", (contact) => { contact.tbVn = approachSpeed(contact); }); // SECTION FEEL
  pileWorld.on("post-solve", (contact, impulse) => feelContact(contact, impulse, true)); // SECTION FEEL
  let pileScale = 20;      // px per metre in the sidebar
  const PILE_ANG_DAMP = 3; // pile pieces not in the hand
  const PILE_SWING_DAMP = { wood: 0.25, mudbrick: 0.12, stone: 0.04 }; // held near an end in the sidebar it swings freely, so it can be turned upright
  const PILE_MAX_SPEED = 4, PILE_MAX_UP = 2; // m/s, pile pieces not in the hand
  let pileBinRect = null;  // px rect of the bin

  function pileBodies() {
    const out = [];
    for (let b = pileWorld.getBodyList(); b; b = b.getNext()) if (b.pileItem) out.push(b);
    return out;
  }
  function pileItems() { return pileBodies().map((b) => b.pileItem); }
  function pieceArea(defKey) {
    const d = PIECE_DEFS[defKey];
    return d.shape === "circle" ? Math.PI * d.r * d.r : d.shape === "poly" ? 4 * d.hx * d.hy * 0.83 : 4 * d.hx * d.hy;
  }
  function createPileBody(item, x, y) {
    const def = PIECE_DEFS[item.defKey], mat = MATERIALS[item.material];
    const body = pileWorld.createBody({ type: "dynamic", position: planck.Vec2(x, y), angularDamping: PILE_ANG_DAMP, linearDamping: 0.3 });
    const fo = { density: mat.density * def.densityScale, friction: 0.7, restitution: 0 };
    if (def.shape === "poly") body.createFixture({ ...fo, shape: planck.Polygon(def.verts.map(([vx, vy]) => planck.Vec2(vx, vy))) });
    else if (def.shape === "box") body.createFixture({ ...fo, shape: planck.Box(def.hx, def.hy) });
    else body.createFixture({ ...fo, shape: planck.Circle(def.r) });
    body.pileItem = { defKey: item.defKey, material: item.material };
    return body;
  }
  function fillPile(items) {
    for (const [id, h] of Array.from(pointers)) if (h.pileBody) pointers.delete(id);
    for (let b = pileWorld.getBodyList(); b; ) { const nb = b.getNext(); pileWorld.destroyBody(b); b = nb; }
    const r = pileBinRect;
    if (!r) return;
    // the same piece size in every level's pile (pilePx); only a screen too narrow for it shrinks it
    let places;
    [pileScale, places] = pileLayout(items, r, pilePx);
    const W = r.w / pileScale, H = r.h / pileScale;
    const walls = (pileWalls = pileWorld.createBody({ type: "static" }));
    pileQuietUntil = performance.now() + 1500;
    walls.createFixture({ shape: planck.Box(W, 0.5, planck.Vec2(W / 2, -0.5), 0), friction: 0.8 });
    walls.createFixture({ shape: planck.Box(0.5, H * 3, planck.Vec2(-0.5, H * 1.5), 0), friction: 0.3 });
    walls.createFixture({ shape: planck.Box(0.5, H * 3, planck.Vec2(W + 0.5, H * 1.5), 0), friction: 0.3 });
    // rows from the bottom up, then a short settle
    for (const [it, x, y, a] of places) { const b = createPileBody(it, x, y); if (a) b.setTransform(b.getPosition(), a); }
    for (let i = 0; i < 240; i++) { pileWorld.step(STEP, 8, 3); settlePile(); } // settled before it is shown
  }
  let pilePx = 34; // px per metre in the sidebar, set by layout()
  const PILE_BIN_W = 6.4; // m: three blocks side by side and a little room
  // Where each piece goes in the bin: [scale, [[item, x, y, angle]...]]. scale null: as big as fits.
  function pileLayout(items, r, fixedScale) {
    // Orderly: by material (sturdiest lowest: stone, wood, mudbrick), then tallest first and like
    // with like, packed in rows; as big as the bin allows with every row inside it.
    const STURDY = { stone: 0, wood: 1, mudbrick: 2 };
    const lying = (it) => it.defKey === "column"; // columns lie down in the pile (held near an end they swing upright)
    const size = (it) => { const d = PIECE_DEFS[it.defKey]; return d.r != null ? [2 * d.r, 2 * d.r] : lying(it) ? [2 * d.hy, 2 * d.hx] : [2 * d.hx, 2 * d.hy]; };
    // One kind of piece per row, so every row has a flat top. Wedges and triangles alternate up and
    // down and nest into a flat band; the curved forms and the pediment halves go on top, where nothing rests on them.
    const curved = (it) => (it.defKey === "centering" || it.defKey === "gableL" || it.defKey === "gableR" ? 1 : 0); // sloped or round tops
    items = items.slice().sort((a, b) => curved(a) - curved(b) || STURDY[a.material] - STURDY[b.material] || size(b)[1] - size(a)[1] || size(b)[0] - size(a)[0] || (a.defKey < b.defKey ? -1 : a.defKey > b.defKey ? 1 : 0));
    const GAP = 0.08;
    const pack = (W) => {
      const out = []; let x = GAP, y = 0.02, rowH = 0, rowKey = null, k = 0;
      for (const it of items) {
        const [w, h] = size(it), nested = it.defKey === "wedge" || it.defKey === "tri";
        const key = (nested || curved(it) ? it.defKey + "/" + it.material : h.toFixed(2)); // a row holds one height (blocks and squares of any material share)
        const pairW = it.defKey === "wedge" ? 1.95 : it.defKey === "tri" ? w + 0.03 : w; // a nested pair's width
        const second = (it.defKey === "wedge" || it.defKey === "tri") && key === rowKey && k % 2 === 1;
        if (key !== rowKey) k = 0;
        if (!second && rowH > 0 && (key !== rowKey || x + pairW > W - GAP)) { x = GAP; y += rowH + 0.03; rowH = 0; k = 0; }
        let px = x + w / 2, py = y + h / 2, a = lying(it) ? Math.PI / 2 : 0;
        if (it.defKey === "wedge") { px = x + 0.525 + (second ? 0.9 : 0); a = second ? Math.PI : 0; } // narrow end down, then wide end down beside it
        if (it.defKey === "tri") { const c = PIECE_DEFS.tri.verts; // two make a square: right angle bottom left, then top right
          const lx = -Math.min(...c.map((v) => v[0])), ly = -Math.min(...c.map((v) => v[1]));
          px = x + (second ? w - lx + 0.03 : lx); py = y + (second ? h - ly + 0.03 : ly); a = second ? Math.PI : 0; }
        out.push([it, px, py, a]); rowH = Math.max(rowH, h); rowKey = key; k++;
        if (second || !(it.defKey === "wedge" || it.defKey === "tri")) x += pairW + GAP;
      }
      return [out, y + rowH];
    };
    const fit = (sc, out, top) => top <= (r.h / sc) * 0.95 && out.every(([it]) => size(it)[0] < r.w / sc - 2 * GAP);
    if (fixedScale) { const [out, top] = pack(r.w / fixedScale); return [fixedScale, out, fit(fixedScale, out, top)]; }
    let sc = 48, places = [];
    for (; sc > 6; sc *= 0.98) {
      const [out, top] = pack(r.w / sc);
      places = out;
      if (fit(sc, out, top)) break;
    }
    return [sc, places];
  }
  function hitPile(px, py) {
    const r = pileBinRect;
    if (!r || px < r.x || px > r.x + r.w || py < r.y || py > r.y + r.h) return null;
    const p = planck.Vec2((px - r.x) / pileScale, (r.y + r.h - py) / pileScale);
    const margin = Math.max(0.15, 10 / pileScale); // at least 10 px of slack around each piece
    let best = null, bestD = Infinity;
    for (const b of pileBodies()) {
      const d = PIECE_DEFS[b.pileItem.defKey], l = b.getLocalPoint(p);
      const dist = d.shape === "circle" ? Math.max(0, Math.hypot(l.x, l.y) - d.r)
        : Math.hypot(Math.max(0, Math.abs(l.x) - d.hx), Math.max(0, Math.abs(l.y) - d.hy));
      if (dist <= margin && dist < bestD) { best = b; bestD = dist; }
    }
    return best;
  }
  function pilePoint(px, py) {
    const r = pileBinRect;
    return planck.Vec2((px - r.x) / pileScale, (r.y + r.h - py) / pileScale);
  }
  // A hand in the sidebar holds a small piece with a soft pin: grabbed in the middle it
  // keeps its angle; grabbed near an end it hangs and swings, so it can be turned
  // upright (or laid down) before it is dragged out.
  function startPileHold(pointerId, body, pt, forceCentre) {
    const d = PIECE_DEFS[body.pileItem.defKey], l = body.getLocalPoint(pt);
    const short = (h, o) => (h < o * 0.8 ? h * 0.8 : h / 3);
    const bx = d.r != null ? d.r / 3 : short(d.hx, d.hy), by = d.r != null ? d.r / 3 : short(d.hy, d.hx);
    const centred = forceCentre || (l.x * l.x) / (bx * bx) + (l.y * l.y) / (by * by) <= 1;
    const grab = centred ? body.getLocalCenter() : l;
    const joint = pileWorld.createJoint(planck.MouseJoint({ maxForce: (600 * body.getMass() + 24 * pileBodies().reduce((s, b) => s + b.getMass(), 0)) * 10, frequencyHz: 5, dampingRatio: 0.9 }, pileWalls, body, body.getWorldPoint(grab)));
    body.setAngularDamping(PILE_SWING_DAMP[body.pileItem.material]); body.setLinearDamping(0);
    if (centred) body.setAngularVelocity(0);
    pointers.set(pointerId, { piece: null, pileBody: body, pileGrab: planck.Vec2(grab.x, grab.y), pileTarget: pt, joint, centred });
  }
  const PILE_LEAD = 4.5, PILE_LEAD_DOWN = 0.05, PILE_HAND_SPEED = 15, PILE_HAND_UP = 7; // m, m, m/s, m/s (sidebar world)
  function capPileHand(b) {
    const v = b.getLinearVelocity(), sp = Math.hypot(v.x, v.y), ks = sp > PILE_HAND_SPEED ? PILE_HAND_SPEED / sp : 1;
    if (ks < 1 || v.y > PILE_HAND_UP) b.setLinearVelocity(planck.Vec2(v.x * ks, Math.min(PILE_HAND_UP, v.y * ks)));
  }
  // pieces resting (directly or through others) on top of a held sidebar piece: lifted with it, so the
  // pile's settling brake and its slow speed cap do not hold them (and the hand) back
  function carriedByHand() {
    const out = new Set(), todo = [];
    for (const h of pointers.values()) if (h.pileBody) { out.add(h.pileBody); todo.push(h.pileBody); }
    while (todo.length) {
      const b = todo.pop(), y = b.getPosition().y;
      for (let ce = b.getContactList(); ce; ce = ce.next) {
        const o = ce.other;
        if (o.pileItem && !out.has(o) && ce.contact.isTouching() && o.getPosition().y > y) { out.add(o); todo.push(o); }
      }
    }
    return out;
  }
  function drivePileHands() {
    const r = pileBinRect, W = r.w / pileScale, H = r.h / pileScale;
    for (const hand of pointers.values()) {
      if (!hand.pileBody) continue;
      // the target stays within PILE_LEAD of the grab point and the piece's speed is capped, so a buried
      // piece is pulled out hard but does not shoot up once it comes free
      const b = hand.pileBody, p = b.getWorldPoint(hand.pileGrab);
      let dx = Math.max(0, Math.min(W, hand.pileTarget.x)) - p.x, dy = Math.max(0, Math.min(H, hand.pileTarget.y)) - p.y;
      const d = Math.hypot(dx, dy);
      if (d > PILE_LEAD) { dx *= PILE_LEAD / d; dy *= PILE_LEAD / d; }
      dy = Math.max(dy, -PILE_LEAD_DOWN); // pressing down into the pile stays gentle
      hand.joint.setTarget(planck.Vec2(p.x + dx, p.y + dy));
      capPileHand(b);
      if (hand.centred) hand.pileBody.setAngularVelocity(hand.pileBody.getAngularVelocity() * 0.5);
    }
  }
  // Safety net: a sidebar piece pushed out of the bin drops back in from the top.
  function rescuePile() {
    const r = pileBinRect;
    if (!r) return;
    const W = r.w / pileScale, H = r.h / pileScale;
    const held = carriedByHand();

  let auto = null; // { queue, cur, wait }
  function autoBuildButton() {
    if (currentLevel == null || test || auto || !tabHeldNow() || !SOLUTIONS[LEVELS[currentLevel].key] || !pileBinRect) return null;
    const r = pileBinRect, size = Math.min(48, r.w * 0.35);
    return { x: r.x + r.w / 2, y: r.y + size / 2 + 6, size };
  }
  function startAutoBuild() {
    releaseAllPointers();
    const items = pileItems().concat(pieces.map((p) => ({ defKey: p.defKey, material: p.material })));
    clearAllPieces();
    fillPile(items);
    failShow = null;
    auto = { queue: SOLUTIONS[LEVELS[currentLevel].key].slice(), cur: null, wait: 0.3 };
  }
  function placeAuto(c) {
    const b = c.piece.body;
    b.setLinearVelocity(planck.Vec2(0, 0)); b.setAngularVelocity(0);
    b.setTransform(planck.Vec2(c.tx, c.ty), c.ta);
    b.setDynamic();
    for (let f = b.getFixtureList(); f; f = f.getNext()) f.setSensor(false);
    b.setAwake(true);
    c.piece.auto = false; c.piece.prevV = null;
    // it is set down, not dropped, so no impact makes a sound: play its landing here, on time
    const m = c.piece.material, lo = b.getFixtureList().getAABB(0).lowerBound.y;
    let under = lo < 0.08 ? "ground" : null;
    if (!under) world.queryAABB(planck.AABB(planck.Vec2(c.tx - 0.3, lo - 0.08), planck.Vec2(c.tx + 0.3, lo + 0.02)), (f) => {
      const o = f.getBody();
      if (o !== b && o.piece && !o.piece.ghost && !o.piece.auto) { under = o.piece.material; return false; }
      return true;
    });
    if (under) playSound("hit-" + (under === "ground" ? ["ground", m] : [m, under].sort()).join("-"), 0.6);
  }
  function cancelAuto() {
    if (auto && auto.cur && pieces.includes(auto.cur.piece)) placeAuto(auto.cur);
    auto = null;
  }
  function autoTick(dt) {
    if (!auto) return;
    const c = auto.cur;
    if (c && !pieces.includes(c.piece)) { auto.cur = null; return; }
    if (c) {
      const b = c.piece.body, q = b.getPosition(), dx = c.tx - q.x, dy = c.ty - q.y, d = Math.hypot(dx, dy);
      if (d <= AUTO_SPEED * dt) { placeAuto(c); auto.cur = null; auto.wait = AUTO_PAUSE; return; }
      b.setLinearVelocity(planck.Vec2((dx / d) * AUTO_SPEED, (dy / d) * AUTO_SPEED));
      b.setAngularVelocity((c.ta - b.getAngle()) / Math.max(dt, d / AUTO_SPEED));
      return;
    }
    if ((auto.wait -= dt) > 0) return;
    const step = auto.queue.shift();
    if (!step) {
      // the arches stand: take the wooden supports out again, one by one
      const sup = supportPieces();
      if (sup.length) { const p = sup[0]; dustAt(p.body.getPosition()); returnToPile(p); auto.wait = 0.15; return; }
      auto = null; return;
    }
    const [defKey, material, x, y, a] = step;
    const pb = pileBodies().find((bd) => bd.pileItem.defKey === defKey && bd.pileItem.material === material);
    if (!pb) return; // not in the pile any more: skip it
    pileWorld.destroyBody(pb);
    const d = PIECE_DEFS[defKey], e = d.r != null ? d.r : Math.max(d.hx, d.hy);
    const piece = spawnPiece(defKey, viewX0 + worldWidth - e, y, 0, material);
    piece.body.setKinematic();
    for (let f = piece.body.getFixtureList(); f; f = f.getNext()) f.setSensor(true);
    piece.auto = true;
    auto.cur = { piece, tx: x + LEVEL_X0, ty: y + 0.02, ta: a };
  }

  // --- the test: supports pulled out, wind, load lowered on, earthquake. After each
  // step the building is checked; the first failure stops the test and is shown in red.
  // Wooden pieces standing in an opening or a support zone: temporary supports.
  function supportPieces() {
    if (!grid || grid.L.woodRole !== "support") return [];
    return pieces.filter((p) => {
      if (p.material !== "wood" || p.auto) return false;
      const q = p.body.getPosition(), k = cellOf(q.x, q.y);
      return k >= 0 && (grid.inWood[k] || grid.inHole[k]);
    });
  }
  function startTest() {
    if (currentLevel == null || test) return;
    // Tab held (parent override): the test runs even when the building is not ready
    const ready = testReady() || tabHeldNow();
    if (!ready) {
      // grey button pressed: show why it is not ready yet
      if (pointers.size === 0) {
        check = runCheck();
        failShow = { cells: failingCells(check, CHECK.fill), loads: [], loadZone: check.load > CHECK.loadCells, unfilled: true, until: performance.now() + PHASE_TIME.why * 1000 };
        playSound("not-ready", 1);
      }
      return;
    }
    releaseAllPointers();
    failShow = null;
    for (const l of loads) world.destroyBody(l.body); // a finished site's load: the test lowers a new one
    loads = [];
    const snapshot = pieces.map((p) => { const q = p.body.getPosition(); return { defKey: p.defKey, material: p.material, x: q.x, y: q.y, angle: p.body.getAngle() }; });
    const toPull = []; // supports are no longer pulled by the test: left in, they fail the check
    test = { phase: "supports", t: 0, snapshot, toPull, after: null, fast: tabHeldNow(), broken: [] };
  }
  function nextPhase(phase) {
    if (test.loop) { test.loop.stop(0.6); test.loop = null; }
    test.phase = phase; test.t = 0;
    if (phase === "wind") test.loop = playSound("wind", 1, true);
    if (phase === "load") {
      spawnLoads();
      // The roll lasts exactly as long as the load is lowered, from its start, at nearly its own
      // speed (0.9-1.1x). A short drop (tall building) starts it up to DRUM_LEAD seconds before the
      // load moves; a long drop lowers the load faster instead of stretching the sound.
      // All in real seconds (Tab: test 10x faster).
      const sp = test.fast ? TEST_FAST : 1, R = soundLength("drumroll") ? DRUM_ROLL / sp : 0;
      const drop = Math.max(0.3, ...loads.map((l) => l.body.getPosition().y - l.ty));
      const T = drop / LOAD_SPEED / sp;
      let rate = R ? Math.max(0.9, Math.min(1.1, R / T)) : 1, lead = 0;
      if (R / rate > T) { lead = Math.min(DRUM_LEAD / sp, R / rate - T); rate = Math.max(rate, R / (T + lead)); }
      test.loadSpeed = R && R / rate < T ? (drop / sp) / (R / rate) : LOAD_SPEED; // m/s, game time
      test.lead = lead * sp; // game seconds the load waits before it starts down
      for (const l of loads) l.body.setLinearVelocity(planck.Vec2(0, lead > 0 ? 0 : -test.loadSpeed));
      test.loop = playSound("drumroll", 1, false, 0, { rate });
    }
    if (phase === "quake") test.loop = playSound("quake", 1);
  }
  // Wait, then check; go on to `next` or stop with the reason shown.
  function settleThenCheck(next) { test.after = next; nextPhase("settle"); }
  function checkpoint() {
    const c = runCheck();
    const badLoads = loads.filter((l) => !loadInPlace(l));
    if (test.broken.length) { // something broke: show where it was
      failShow = { cells: test.broken.slice(), loads: [], unfilled: false, until: null };
      nextPhase("fail"); playSound("fail", 1);
      return false;
    }
    if (c.fill < CHECK.fillAfter || badLoads.length) {
      failShow = badLoads.length ? { cells: [], loads: badLoads, unfilled: false, until: null } // only the load's place is red
        : { cells: failingCells(c, CHECK.fillAfter), loads: [], unfilled: true, until: null };
      nextPhase("fail");
      playSound("fail", 1);
      return false;
    }
    return true;
  }
  function testTick(dt) {
    if (!test) return;
    test.t += dt;
    const lv = currentLevel, T = test.t;
    if (test.phase === "supports") {
      if (test.toPull.length) {
        if (T >= 0.25) {
          const p = test.toPull.shift();
          if (pieces.includes(p)) { dustAt(p.body.getPosition()); removePiece(p); }
          test.t = 0;
        }
      } else settleThenCheck("wind");
    } else if (test.phase === "settle") {
      if (T >= PHASE_TIME.settle && checkpoint()) {
        if (test.after === "pass") { nextPhase("pass"); celebrate(); playSound("cheer", 1); }
        else nextPhase(test.after);
      }
    } else if (test.phase === "wind") {
      // from the left, a one-second lull, then from the right
      const D = PHASE_TIME.wind, GAP = 1, right = T >= D + GAP, t = right ? T - D - GAP : T;
      const ramp = T > D && !right ? 0 : Math.max(0, Math.min(1, t / 0.7, (D - t) / 0.7));
      const dir = right ? -1 : 1;
      applyWind(TEST_WIND[lv] * ramp, dir);
      for (let k = 0; k < 3; k++) if (Math.random() < 0.8 * ramp) puffs.push({ kind: "wind", x: dir > 0 ? viewX0 - 2 : viewX0 + worldWidth + 2, y: Math.random() * Math.max(levelTop, buildingHeightPx / scale), vx: (20 + Math.random() * 8) * dir, vy: (Math.random() - 0.5) * 1.5, r: 1.5 + Math.random() * 3, dir, ph: Math.random() * 6, life: 1 });
      if (T >= 2 * D + GAP) settleThenCheck("load");
    } else if (test.phase === "load") {
      if (test.lead > 0) {
        test.lead -= dt; test.t = 0;
        if (test.lead <= 0) for (const l of loads) if (!l.released) l.body.setLinearVelocity(planck.Vec2(0, -test.loadSpeed));
        return;
      }
      let all = true;
      for (const l of loads) {
        if (l.released) continue;
        all = false;
        if (touchesOtherPiece(l.body) || l.body.getPosition().y <= l.ty - 0.2) {
          l.body.setDynamic(); l.body.setAwake(true); l.released = true; test.t = 0;
          playSound("hit-stone-stone", 0.9); // the load lands with the stone thud
        }
      }
      if (all && test.loop) { test.loop.stop(0.4); test.loop = null; }
      if (all && T >= PHASE_TIME.loadSettle && checkpoint()) nextPhase("quake");
    } else if (test.phase === "quake") {
      const D = PHASE_TIME.quake, env = Math.sin((Math.PI * Math.min(T, D)) / D);
      groundBody.setLinearVelocity(planck.Vec2(TEST_QUAKE[lv] * env * Math.sin(2 * Math.PI * QUAKE_HZ * T), 0));
      shake = Math.max(shake, 10 * env);
      if (T >= D) { resetGround(); settleThenCheck("pass"); }
    } else if (test.phase === "pass") {
      if (T >= PHASE_TIME.pass) { saveMonument(); finishTest(); mode = "map"; mapEnteredAt = performance.now(); }
    } else if (test.phase === "fail") {
      if (T >= PHASE_TIME.fail) restoreSnapshot();
    }
  }

  // Wind from the left (dir 1) or right (dir -1): each 0.1 m band of height pushes only
  // on the first thing it meets; whatever is behind it is sheltered.
  function applyWind(P, dir) {
    const xa = dir > 0 ? viewX0 + 0.02 : viewX0 + worldWidth - 0.02, xb = dir > 0 ? viewX0 + worldWidth - 0.02 : viewX0 + 0.02;
    for (let y = 0.05; y < levelTop; y += 0.1) {
      let hit = null, hx = 0, hy = 0;
      world.rayCast(planck.Vec2(xa, y), planck.Vec2(xb, y), (f, pt, nrm, frac) => {
        const b = f.getBody();
        if (!b.piece && !b.isLoad) return -1;
        hit = b; hx = pt.x; hy = pt.y;
        return frac;
      });
      if (hit) hit.applyForce(planck.Vec2(dir * P * 0.1, 0), planck.Vec2(hx, hy), true);
    }
  }

  function spawnLoads() {
    loads = grid.load.map((ring) => {
      const [cx, cy] = ringCentre(ring);
      const verts = ring.map(([x, y]) => [x - cx, y - cy]);
      // starts just above the top of the screen and is lowered all the way
      const top = screenToWorld(0, 0).y, low = Math.min(...verts.map((v) => v[1]));
      const body = world.createBody({ type: "kinematic", position: planck.Vec2(cx, Math.max(cy + LOAD_DROP, top - low + 0.1)) });
      body.createFixture({ shape: planck.Polygon(verts.map(([x, y]) => planck.Vec2(x, y))), density: TEST_LOAD_DENSITY[currentLevel], friction: 0.6, restitution: 0 });
      body.isLoad = true;
      body.setLinearVelocity(planck.Vec2(0, -LOAD_SPEED));
      return { body, tx: cx, ty: cy, verts, released: false };
    });
  }
  function loadInPlace(l) {
    const q = l.body.getPosition();
    return l.released && Math.hypot(q.x - l.tx, q.y - l.ty) <= CHECK.loadMove && Math.abs(l.body.getAngle()) <= CHECK.loadTilt;
  }
  function resetGround() {
    groundBody.setLinearVelocity(planck.Vec2(0, 0));
    groundBody.setPosition(planck.Vec2(WORLD_CENTER_X, -2));
  }
  function finishTest() {
    if (test && test.loop) { test.loop.stop(0.6); test.loop = null; }
    for (const l of loads) world.destroyBody(l.body);
    loads = [];
    resetGround();
    test = null;
    checkTimer = 0;
  }
  // Failed: the pieces return to where the player put them.
  function restoreSnapshot() {
    const snap = test.snapshot;
    finishTest();
    failShow = null;
    clearAllPieces();
    for (const s of snap) spawnPiece(s.defKey, s.x, s.y, s.angle, s.material);
  }
  // Leaving mid-test keeps the player's work: a pass is saved, anything else is put back.
  function abortTest() {
    if (!test) return;
    if (test.phase === "pass") { saveMonument(); finishTest(); } else restoreSnapshot();
  }

  function dustAt(q) {
    for (let i = 0; i < 10; i++) puffs.push({ kind: "dust", x: q.x + (Math.random() - 0.5), y: q.y + (Math.random() - 0.5), vx: (Math.random() - 0.5) * 2, vy: Math.random(), r: 0.1 + Math.random() * 0.1, life: 1 });
  }
  function celebrate() {
    let x0 = Infinity, x1 = -Infinity, y1 = 0;
    for (const r of grid.solid) for (const [x, y] of r) { x0 = Math.min(x0, x); x1 = Math.max(x1, x); y1 = Math.max(y1, y); }
    for (let i = 0; i < 80; i++) {
      puffs.push({ kind: "petal", x: x0 + Math.random() * (x1 - x0), y: y1 + 1 + Math.random(), vx: (Math.random() - 0.5) * 3, vy: 1 + Math.random() * 3, r: 0.07 + Math.random() * 0.05, a: Math.random() * 6, hue: Math.floor(Math.random() * 360), life: 1 });
    }
  }

  function saveMonument() {
    const r3 = (n) => Math.round(n * 1000) / 1000;
    progress.done[grid.L.key] = {
      pieces: pieces.map((p) => { const q = p.body.getPosition(); return [p.defKey, p.material, r3(q.x), r3(q.y), r3(p.body.getAngle())]; }),
      loads: loads.map((l) => { const q = l.body.getPosition(); return [r3(q.x), r3(q.y), r3(l.body.getAngle()), l.verts]; }),
    };
    try { localStorage.setItem(SAVE_KEY, JSON.stringify(progress)); } catch (err) { /* ignore */ }
  }

  // --- drawing
  function drawLoadShape(verts, sx, sy, angle, sc, bad) {
    ctx.save(); ctx.translate(sx, sy); ctx.rotate(-angle); ctx.scale(sc, -sc);
    SKIN.load(ctx, verts, bad);
    ctx.restore();
  }
  function screenPath(rings) {
    const path = new Path2D();
    for (const r of rings) {
      r.forEach(([x, y], i) => { const s = worldToScreen(x, y); if (i) path.lineTo(s.x, s.y); else path.moveTo(s.x, s.y); });
      path.closePath();
    }
    return path;
  }
  function drawLevelBackdrop() {
    if (currentLevel == null || !grid) return;
    SKIN.outline(ctx, screenPath(grid.solid), screenPath(grid.holes));
    if (grid.wood.length) SKIN.woodZone(ctx, screenPath(grid.wood));
    const badGhost = failShow && (failShow.loads.length || failShow.loadZone);
    if (!loads.length || badGhost) SKIN.loadGhost(ctx, screenPath(grid.load), badGhost);
  }
  // Red, pulsing: the parts of the outline (or openings, or wood zones) that broke a rule.
  // Unfilled outline = the outline with every piece cut out (a little wider than itself, so
  // pieces that touch leave no seam), drawn on a spare canvas: straight edges, real gaps only.
  const SEAM = 0.04; // m
  let unfilledCanvas = null;
  function drawUnfilled(alpha) {
    const dpr = window.devicePixelRatio || 1;
    const oc = unfilledCanvas || (unfilledCanvas = document.createElement("canvas"));
    if (oc.width !== canvas.width || oc.height !== canvas.height) { oc.width = canvas.width; oc.height = canvas.height; }
    const o = oc.getContext("2d");
    o.setTransform(1, 0, 0, 1, 0, 0); o.clearRect(0, 0, oc.width, oc.height); o.setTransform(dpr, 0, 0, dpr, 0, 0);
    o.globalCompositeOperation = "source-over";
    o.fillStyle = "rgb(220, 40, 30)";
    o.fill(screenPath(grid.solid.concat(grid.holes)), "evenodd");
    o.globalCompositeOperation = "destination-out";
    o.fillStyle = o.strokeStyle = "#000"; o.lineWidth = 2 * SEAM * scale; o.lineJoin = "round";
    for (const p of pieces) {
      if (p.heldBy != null || p.auto) continue;
      for (let f = p.body.getFixtureList(); f; f = f.getNext()) {
        const sh = f.getShape(), path = new Path2D();
        if (sh.getType() === "circle") {
          const c = worldToScreen(p.body.getPosition().x, p.body.getPosition().y);
          path.arc(c.x, c.y, sh.getRadius() * scale, 0, Math.PI * 2);
        } else {
          sh.m_vertices.forEach((v, i) => { const w = p.body.getWorldPoint(v), q = worldToScreen(w.x, w.y); if (i) path.lineTo(q.x, q.y); else path.moveTo(q.x, q.y); });
          path.closePath();
        }
        o.fill(path); o.stroke(path);
      }
    }
    o.globalCompositeOperation = "source-over";
    ctx.save(); ctx.globalAlpha = alpha; ctx.drawImage(oc, 0, 0, cssWidth, cssHeight); ctx.restore();
  }
  function drawFailShow() {
    if (!failShow) return;
    const alpha = 0.35 + 0.2 * Math.sin(performance.now() / 120);
    if (failShow.unfilled && grid) drawUnfilled(alpha);
    if (!failShow.cells.length) return;
    const path = new Path2D(), px = CELL * scale;
    for (const k of failShow.cells) {
      const s = worldToScreen((k % GX) * CELL, (Math.floor(k / GX) + 1) * CELL);
      path.rect(s.x, s.y, px + 0.5, px + 0.5);
    }
    SKIN.failCells(ctx, path, alpha);
  }
  // The player's finished building, small, on its map site.
  function drawMonumentMini(done, cx, cy, r) {
    let x0 = Infinity, x1 = -Infinity, y0 = Infinity, y1 = -Infinity;
    for (const [d, , x, y] of done.pieces) {
      const def = PIECE_DEFS[d], e = def.r != null ? def.r : Math.max(def.hx, def.hy);
      x0 = Math.min(x0, x - e); x1 = Math.max(x1, x + e); y0 = Math.min(y0, y - e); y1 = Math.max(y1, y + e);
    }
    for (const [x, y, , verts] of done.loads) for (const [vx, vy] of verts) {
      x0 = Math.min(x0, x + vx); x1 = Math.max(x1, x + vx); y0 = Math.min(y0, y + vy); y1 = Math.max(y1, y + vy);
    }
    if (!Number.isFinite(x0)) return;
    const sc = (1.5 * r) / Math.max(x1 - x0, y1 - y0, 1), mx = (x0 + x1) / 2, my = (y0 + y1) / 2;
    const at = (x, y) => [cx + (x - mx) * sc, cy + (my - y) * sc];
    ctx.save();
    ctx.beginPath(); ctx.arc(cx, cy, r - 1.5, 0, Math.PI * 2); ctx.clip();
    for (const [d, m, x, y, a] of done.pieces) { const [sx, sy] = at(x, y); drawPieceShape(d, m, sx, sy, a, sc, 0); }
    for (const [x, y, a, verts] of done.loads) { const [sx, sy] = at(x, y); drawLoadShape(verts, sx, sy, a, sc, false); }
    ctx.restore();
  }

  // ---------------------------------------------------------------------
  // SECTION: MAP -- world map start screen, the ten sites (locked, open, finished), parent override
  // ---------------------------------------------------------------------
  let mode = "map"; // "map" | "build"
  // Chronological = level order.
  // Positions are pixels on the map picture (art/map.jpg, 2176 x 1408), placed by eye
  // and nudged apart so finished sites do not overlap.
  const SITES = [
    { key: "mastaba",   x: 720,  y: 1060 }, // Saqqara, c. 3000 BC
    { key: "djoser",    x: 880,  y: 1050 }, // Saqqara, c. 2650 BC
    { key: "ziggurat",  x: 1960, y: 900  }, // Ur, c. 2100 BC
    { key: "karnak",    x: 830,  y: 1300 }, // Karnak, c. 1290-1220 BC
    { key: "liongate",  x: 200,  y: 530  }, // Mycenae, c. 1250 BC
    { key: "ishtar",    x: 1720, y: 770  }, // Babylon, c. 575 BC
    { key: "parthenon", x: 340,  y: 425  }, // Athens, 447-432 BC
    { key: "mausoleum", x: 580,  y: 540  }, // Halicarnassus (Bodrum), c. 350 BC
    { key: "pharos",    x: 700,  y: 900  }, // Alexandria, c. 280 BC
    { key: "valens",    x: 720,  y: 180  }, // Constantinople, AD 368
  ];
  const MAP_W = 2176, MAP_H = 1408;
  const mapImg = new Image(); mapImg.src = "art/map.jpg";
  const boatImg = new Image(); boatImg.src = "art/boat-owner.png"; // owner's picture, white background cut out
  // The picture fills the screen; where it is cropped, the crop is centred on the sites.
  function mapView() {
    const k = Math.max(cssWidth / MAP_W, cssHeight / MAP_H);
    const rImg = (siteRadius() * DONE_SIZE) / k;
    let x0 = Infinity, x1 = -Infinity, y0 = Infinity, y1 = -Infinity;
    for (const s of SITES) { x0 = Math.min(x0, s.x); x1 = Math.max(x1, s.x); y0 = Math.min(y0, s.y); y1 = Math.max(y1, s.y); }
    const fit = (c, view, full) => Math.max(view - full * k, Math.min(0, view / 2 - c * k));
    const ox = fit((x0 + x1) / 2, cssWidth, MAP_W), oy = fit((y0 - rImg + y1 + rImg) / 2, cssHeight, MAP_H);
    return { k, ox, oy, w: MAP_W * k, h: MAP_H * k, pt: (x, y) => ({ x: ox + x * k, y: oy + y * k }) };
  }
  // Ten boats, each sailing its fixed ports back and forth (src/map-routes.js: legs keep to open water).
  const BOAT_SPEED = 20, BOAT_REST = 3, BOAT_SIZE = 56; // map pixels per second, seconds in port, map pixels wide
  const polyLen = (r) => { let L = 0; for (let i = 1; i < r.length; i++) L += Math.hypot(r[i][0] - r[i - 1][0], r[i][1] - r[i - 1][1]); return L; };
  function polyPoint(r, d) { // point at distance d along a polyline, and the direction it runs there
    for (let i = 1; i < r.length; i++) {
      const sl = Math.hypot(r[i][0] - r[i - 1][0], r[i][1] - r[i - 1][1]);
      if (d <= sl || i === r.length - 1) { const t = sl ? Math.max(0, Math.min(1, d / sl)) : 0; return [r[i - 1][0] + (r[i][0] - r[i - 1][0]) * t, r[i - 1][1] + (r[i][1] - r[i - 1][1]) * t, r[i][0] - r[i - 1][0]]; }
      d -= sl;
    }
    return [r[0][0], r[0][1], 0];
  }
  const boats = BOAT_LINES.map((line, i) => {
    const lens = line.legs.map(polyLen), leg = i % line.legs.length;
    return { line, lens, leg, dir: 1, d: lens[leg] * ((i * 0.37) % 1), wait: 0, x: 0, y: 0, vx: 1 };
  });
  // Seconds a boat of this line needs to sail from stop a to stop b (indexes), and for a whole round.
  const sailTime = (b, i, j) => { let L = 0; for (let k = Math.min(i, j); k < Math.max(i, j); k++) L += b.lens[k]; return L / BOAT_SPEED + Math.abs(i - j) * BOAT_REST; };
  function updateBoats(dt) {
    for (const b of boats) {
      if (b.wait > 0) { b.wait -= dt; continue; }
      b.d += b.dir * BOAT_SPEED * dt;
      const L = b.lens[b.leg];
      if (b.d < L && b.d > 0) continue;
      // in port: rest, let travellers on and off, then the next leg (turning round at either end)
      const stop = b.dir > 0 ? b.leg + 1 : b.leg;
      b.d = b.dir > 0 ? L : 0; b.wait = BOAT_REST;
      boatInPort(b, b.line.stops[stop]);
      if (b.dir > 0) { if (b.leg + 1 < b.lens.length) { b.leg++; b.d = 0; } else b.dir = -1; }
      else if (b.leg > 0) { b.leg--; b.d = b.lens[b.leg]; } else b.dir = 1;
    }
    for (const b of boats) { const [x, y, dx] = polyPoint(b.line.legs[b.leg], b.d); b.x = x; b.y = y; if (dx) b.vx = dx * b.dir; }
  }
  function drawBoats(v) {
    const t = performance.now() / 1000;
    boats.forEach((b, i) => {
      const q = v.pt(b.x, b.y), tilt = Math.sin(t * 1.3 + i) * 0.05;
      SKIN.mapBoat(ctx, boatImg, q.x, q.y, BOAT_SIZE * v.k, b.vx < 0, tilt);
      const g = groups.find((gr) => gr.state === "boat" && gr.boat === b);
      if (g) drawGroup(v, g, PEOPLE.map((_, k) => [b.x + (k - 2.5) * 5.5, b.y - 6]), "idle", b.vx < 0); // on deck
    });
  }

  // Travellers (owner decision): ten groups of the six villagers (src/art/villagers, craftpix free licence).
  // They start on the boats; in a port with a finished site reachable over land they get off and walk there
  // at boat speed, then on to another finished site by whichever is quicker, walking or a boat; after at most
  // three sites on foot they board the next boat that calls and go where it goes.
  const PEOPLE = ["Boy", "Girl", "Man", "Old_man", "Old_woman", "Woman"];
  const PEOPLE_ART = {
    Boy: ["art/villagers/Boy_walk.png", "art/villagers/Boy_idle.png"], Girl: ["art/villagers/Girl_walk.png", "art/villagers/Girl_idle.png"],
    Man: ["art/villagers/Man_walk.png", "art/villagers/Man_idle.png"], Old_man: ["art/villagers/Old_man_walk.png", "art/villagers/Old_man_idle.png"],
    Old_woman: ["art/villagers/Old_woman_walk.png", "art/villagers/Old_woman_idle.png"], Woman: ["art/villagers/Woman_walk.png", "art/villagers/Woman_idle.png"],
  };
  const peopleImg = {};
  for (const n of PEOPLE) peopleImg[n] = { walk: Object.assign(new Image(), { src: PEOPLE_ART[n][0] }), idle: Object.assign(new Image(), { src: PEOPLE_ART[n][1] }) };
  const WALK_SPEED = BOAT_SPEED, MAX_ON_FOOT = 3, VISIT_TIME = 4, PERSON_GAP = 9; // map px/s, sites, seconds, map px between walkers
  const groups = boats.map((b) => ({ state: "boat", boat: b, onFoot: 0, stops: 0, recent: [], plan: null }));
  function walkPath(from, to) {
    const p = MAP_WALKS[from + ">" + to];
    if (p) return p;
    const q = MAP_WALKS[to + ">" + from];
    return q ? q.slice().reverse() : null;
  }
  const doneSites = () => SITES.filter((s) => progress.done[s.key]).map((s) => s.key);
  function startWalk(g, path, then) { g.state = "walk"; g.path = path; g.len = polyLen(path); g.s = 0; g.then = then; }
  function boatInPort(b, port) {
    for (const g of groups) {
      if (g.state === "boat" && g.boat === b) {
        g.stops++;
        let site = null;
        if (g.plan) { if (g.plan.offAt === port) site = g.plan.site; }
        else if (g.stops >= 1) { // off where a finished site can be walked to; the nearest one
          let best = Infinity;
          for (const k of doneSites()) {
            const p = walkPath("port:" + port, "site:" + k);
            if (p && !g.recent.includes(k) && polyLen(p) < best) { best = polyLen(p); site = k; }
          }
        }
        const p = site && walkPath("port:" + port, "site:" + site);
        if (p) { g.plan = null; g.boat = null; startWalk(g, [MAP_PORTS[port]].concat(p), { site }); }
      } else if (g.state === "port" && g.port === port && (!g.plan || g.plan.line === b.line)) {
        g.state = "boat"; g.boat = b; g.onFoot = 0; g.stops = 0; // aboard: off at the planned port, or wherever a site is near
      }
    }
  }
  // At a site: where next. Walking there, or walking to a port and taking a boat, whichever is quicker.
  function chooseNext(g) {
    const here = g.site, ports = Object.keys(MAP_PORTS).filter((p) => walkPath("port:" + p, "site:" + here));
    const toPort = (p) => polyLen(walkPath("site:" + here, "port:" + p)) / WALK_SPEED;
    if (g.onFoot < MAX_ON_FOOT) {
      let best = null;
      for (const k of doneSites()) {
        if (k === here || g.recent.includes(k)) continue;
        const w = walkPath("site:" + here, "site:" + k);
        if (w) { const t = polyLen(w) / WALK_SPEED; if (!best || t < best.t) best = { t, walk: w, site: k }; }
        for (const b of boats) for (const p1 of ports) {
          const i = b.line.stops.indexOf(p1);
          if (i < 0) continue;
          b.line.stops.forEach((p2, j) => {
            const w2 = j !== i && walkPath("port:" + p2, "site:" + k);
            if (!w2) return;
            const t = toPort(p1) + sailTime(b, 0, b.lens.length) + sailTime(b, i, j) + polyLen(w2) / WALK_SPEED; // waiting: about one round
            if (!best || t < best.t) best = { t, port: p1, plan: { line: b.line, offAt: p2, site: k } };
          });
        }
      }
      if (best && best.walk) { startWalk(g, best.walk, { site: best.site }); return; }
      if (best) { startWalk(g, walkPath("site:" + here, "port:" + best.port), { port: best.port, plan: best.plan }); return; }
    }
    // three sites on foot (or nowhere else to go): the nearest port, and the next boat that calls
    let near = null;
    for (const p of ports) if (!near || toPort(p) < toPort(near)) near = p;
    if (near) startWalk(g, walkPath("site:" + here, "port:" + near), { port: near, plan: null });
    else g.wait = VISIT_TIME; // nowhere to go yet: stay a little longer
  }
  function updateTravellers(dt, v) {
    const rSite = (siteRadius() * DONE_SIZE) / v.k + 6; // walkers stop at the edge of a finished site's circle
    for (const g of groups) {
      if (g.state === "walk") {
        g.s += WALK_SPEED * dt;
        const end = g.then.site ? g.len - rSite : g.len;
        if (g.s >= end) {
          g.s = Math.max(0, end);
          if (g.then.site) { g.state = "visit"; g.site = g.then.site; g.wait = VISIT_TIME; g.onFoot++; g.recent = [g.site].concat(g.recent).slice(0, 2); }
          else { g.state = "port"; g.port = g.then.port; g.plan = g.then.plan; }
        }
      } else if (g.state === "visit" && (g.wait -= dt) <= 0) {
        if (!progress.done[g.site]) g.recent = []; // the site is gone (progress reset): just move on
        chooseNext(g);
      }
    }
  }
  // Six walkers, the leader at `pts[0]`; `anim` walk or idle.
  function drawGroup(v, g, pts, anim, flip) {
    const t = performance.now() / 1000, frames = anim === "walk" ? 6 : 4, H = 40 * v.k; // a 48 px frame drawn this tall
    ctx.save(); ctx.imageSmoothingEnabled = false;
    PEOPLE.forEach((n, k) => {
      const im = peopleImg[n][anim], [x, y] = pts[k], q = v.pt(x, y);
      if (!im.complete || !im.naturalWidth) return;
      const f = Math.floor(t * (anim === "walk" ? 10 : 5) + k * 1.7) % frames;
      ctx.save(); ctx.translate(q.x, q.y); if (flip) ctx.scale(-1, 1);
      ctx.drawImage(im, f * 48, 0, 48, 48, -H / 2, -H, H, H);
      ctx.restore();
    });
    ctx.restore();
  }
  function drawTravellers(v) {
    for (const g of groups) {
      if (g.state === "walk") {
        const pts = PEOPLE.map((_, k) => polyPoint(g.path, Math.max(0, g.s - k * PERSON_GAP)));
        drawGroup(v, g, pts, "walk", pts[0][2] < 0);
      } else if (g.state === "visit" || g.state === "port") {
        const end = g.path ? polyPoint(g.path, g.s) : [0, 0];
        drawGroup(v, g, PEOPLE.map((_, k) => [end[0] + (k - 2.5) * PERSON_GAP * 0.8, end[1] + (k % 2) * 3]), "idle", false);
      }
    }
  }
  function siteRadius() { return Math.max(22, Math.min(cssWidth, cssHeight) * 0.04); }
  const DONE_SIZE = 1.6; // finished sites are drawn this much bigger
  // Marker centre and radius; markers near the edge are pushed in so they stay fully on screen.
  function siteMarker(v, site) {
    const r = siteRadius() * (progress.done[site.key] ? DONE_SIZE : 1), m = v.pt(site.x, site.y);
    return { x: Math.max(r + 2, Math.min(cssWidth - r - 2, m.x)), y: Math.max(r + 2, Math.min(cssHeight - r - 2, m.y)), r };
  }
  function freePlayButton() {
    const size = Math.max(70, Math.min(cssWidth, cssHeight) * 0.14);
    return { x: cssWidth - size * 0.75, y: cssHeight - size * 0.75, size };
  }
  function renderMap(dt) {
    ctx.fillStyle = "#4f9ad0"; ctx.fillRect(0, 0, cssWidth, cssHeight);
    const v = mapView();
    SKIN.mapImage(ctx, mapImg, v.ox, v.oy, v.w, v.h);
    updateBoats(dt);
    updateTravellers(dt, v);
    drawBoats(v);
    for (const site of SITES) {
      const m = siteMarker(v, site), r = m.r;
      const i = LEVELS.findIndex((L) => L.key === site.key);
      const done = progress.done[site.key];
      if (done) { SKIN.mapSiteDone(ctx, m.x, m.y, r); drawMonumentMini(done, m.x, m.y, r); }
      else if (levelOpen(i)) SKIN.mapSiteOpen(ctx, m.x, m.y, r);
      else SKIN.mapSite(ctx, m.x, m.y, r);
    }
    drawTravellers(v);
    // Parent override: hold the top-left corner for three seconds to open (or re-lock) every site.
    if (cornerHold && performance.now() - cornerHold.t > 3000) { allOpen = !allOpen; cornerHold = null; }
    const fb = freePlayButton();
    SKIN.button(ctx, "block", fb.x, fb.y, fb.size, false);
  }
  function onMapPointerDown(e) {
    const fb = freePlayButton();
    if (Math.hypot(e.clientX - fb.x, e.clientY - fb.y) <= fb.size / 2) { startFree(); return; }
    if (e.clientX < 90 && e.clientY < 90) { cornerHold = { id: e.pointerId, t: performance.now() }; return; }
    const v = mapView();
    let best = -1, bestD = Infinity; // nearest marker wins where big ones overlap
    for (const site of SITES) {
      const m = siteMarker(v, site), d = Math.hypot(e.clientX - m.x, e.clientY - m.y);
      const i = LEVELS.findIndex((L) => L.key === site.key);
      if (d <= m.r * 1.15 && d < bestD && (levelOpen(i) || progress.done[site.key])) { best = i; bestD = d; }
    }
    if (best >= 0) startLevel(best);
  }

  // ---------------------------------------------------------------------
  // SECTION: MAIN LOOP -- requestAnimationFrame driver
  // ---------------------------------------------------------------------
  function frame(time) {
    if (lastTime == null) lastTime = time;
    const dt = Math.min(0.1, (time - lastTime) / 1000);
    lastTime = time;
    updateMusic(false);
    updateDragSounds();
    if (mode === "map") {
      renderMap(dt);
      requestAnimationFrame(frame);
      return;
    }
    const fast = test && test.fast && test.phase !== "fail" && test.phase !== "pass" ? TEST_FAST : 1;
    stepPhysics(dt * fast, MAX_STEPS * fast);
    cleanupOutOfBounds();
    updateCheck(dt);
    updateFeel(dt);
    ctx.save();
    if (shake > 0) ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
    render();
    drawFeel();
    ctx.restore();
    requestAnimationFrame(frame);
  }
  // Try sound right away (browsers may hold it until the first press or key; it then starts).
  startAudio();
  window.addEventListener("keydown", startAudio);
  requestAnimationFrame(frame);
})();
</script>
</body>
