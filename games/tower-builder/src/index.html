<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Tower Builder</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
  }
  canvas {
    display: block;
    touch-action: none;
    user-select: none;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script src="../lib/planck.min.js"></script>
<script src="levels.js"></script>
<script src="map-routes.js"></script>
<script>
(function () {
  "use strict";

  // Map: grep -n "SECTION:" this file for the list, then read just that
  // section (sed -n 'A,Bp' or Read with offset/limit). Do not read the whole file.

  // ---------------------------------------------------------------------
  // SECTION: SKIN -- drawing goes through here so art can be replaced later.
  // ---------------------------------------------------------------------
  const SKIN = {
    background(ctx, w, h) {
      ctx.fillStyle = "#bfe3f0";
      ctx.fillRect(0, 0, w, h);
    },
    ground(ctx, w, h) {
      ctx.fillStyle = "#d8c08a";
      ctx.fillRect(0, 0, w, h);
      ctx.fillStyle = "#c2a86f";
      ctx.fillRect(0, 0, w, Math.max(4, h * 0.08));
    },
    dust(ctx, x, y, r, alpha) {
      ctx.fillStyle = "rgba(214, 196, 160, " + (0.5 * alpha) + ")";
      ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
    },
    chip(ctx, x, y, r, angle, alpha) {
      ctx.save(); ctx.translate(x, y); ctx.rotate(angle);
      ctx.fillStyle = "rgba(120, 128, 135, " + alpha + ")";
      ctx.beginPath(); ctx.moveTo(-r, -r * 0.6); ctx.lineTo(r, -r * 0.3); ctx.lineTo(r * 0.3, r); ctx.closePath(); ctx.fill();
      ctx.restore();
    },
    mapImage(ctx, img, x, y, w, h) {
      if (img.complete && img.naturalWidth) ctx.drawImage(img, x, y, w, h);
    },
    // A boat on the map, drawn centred at (x, y), `size` pixels wide, mirrored when sailing left.
    mapBoat(ctx, img, x, y, size, flip, tilt) {
      if (!img.complete || !img.naturalWidth) return;
      const h = (size * img.naturalHeight) / img.naturalWidth;
      ctx.save(); ctx.translate(x, y); ctx.rotate(tilt); if (flip) ctx.scale(-1, 1);
      ctx.drawImage(img, -size / 2, -h * 0.8, size, h);
      ctx.restore();
    },
    // An empty building site: a pale dashed circle.
    mapSite(ctx, x, y, r) {
      ctx.fillStyle = "rgba(255, 248, 230, 0.85)";
      ctx.strokeStyle = "#5a4a36"; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
      ctx.setLineDash([6, 5]); ctx.stroke(); ctx.setLineDash([]);
    },
    // Level outline (screen-pixel paths): the building's shape, its openings kept clear.
    outline(ctx, solid, holes) {
      ctx.fillStyle = "rgba(255, 244, 214, 0.6)"; ctx.fill(solid);
      ctx.fillStyle = "#bfe3f0"; ctx.fill(holes);
      ctx.strokeStyle = "#8a6d3b"; ctx.lineWidth = 2; ctx.setLineDash([8, 6]);
      ctx.stroke(solid); ctx.stroke(holes); ctx.setLineDash([]);
    },
    // Where wood goes (wood courses, or temporary wooden supports).
    woodZone(ctx, path) {
      ctx.fillStyle = "rgba(196, 154, 98, 0.45)"; ctx.fill(path);
      ctx.strokeStyle = "#9a6a3a"; ctx.lineWidth = 2; ctx.setLineDash([4, 4]); ctx.stroke(path); ctx.setLineDash([]);
    },
    // Where the load will be lowered on.
    loadGhost(ctx, path, bad) {
      if (bad) { ctx.fillStyle = "rgba(220, 40, 30, " + (0.25 + 0.2 * Math.sin(performance.now() / 120)) + ")"; ctx.fill(path); }
      ctx.strokeStyle = bad ? "#c0281e" : "rgba(90, 60, 30, 0.75)"; ctx.lineWidth = bad ? 3 : 2; ctx.setLineDash([3, 5]); ctx.stroke(path); ctx.setLineDash([]);
    },
    // The load itself, drawn in metres with y up, centred on its body.
    load(ctx, verts, bad) {
      ctx.fillStyle = bad ? "#c0503c" : "#e8902e"; ctx.strokeStyle = bad ? "#7a1a10" : "#8a4a12"; ctx.lineWidth = 0.06;
      ctx.beginPath(); verts.forEach(([x, y], i) => (i ? ctx.lineTo(x, y) : ctx.moveTo(x, y))); ctx.closePath();
      ctx.fill(); ctx.stroke();
    },
    // a gust: a long wavy streak with a curl at its head, trailing behind the way it blows
    wind(ctx, x, y, len, alpha, dir, ph) {
      const a = Math.min(1, alpha * 1.6), amp = len * 0.06;
      ctx.save(); ctx.lineCap = "round";
      ctx.strokeStyle = "rgba(255, 255, 255, " + (0.85 * a) + ")"; ctx.lineWidth = 3.5;
      ctx.beginPath();
      for (let i = 0; i <= 16; i++) { const t = i / 16, px = x - dir * len * (1 - t), py = y + Math.sin(ph + t * 7) * amp * (1 - t); if (i) ctx.lineTo(px, py); else ctx.moveTo(px, py); }
      const cr = len * 0.07;
      ctx.arc(x, y - cr, cr, Math.PI / 2, dir > 0 ? Math.PI * 2.2 : -Math.PI * 0.2, dir < 0);
      ctx.stroke();
      ctx.strokeStyle = "rgba(255, 255, 255, " + (0.45 * a) + ")"; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(x - dir * len * 0.9, y + len * 0.12); ctx.lineTo(x - dir * len * 0.3, y + len * 0.12); ctx.stroke();
      ctx.restore();
    },
    petal(ctx, x, y, r, angle, alpha, hue) {
      ctx.save(); ctx.translate(x, y); ctx.rotate(angle);
      ctx.fillStyle = "hsla(" + hue + ", 80%, 60%, " + alpha + ")"; ctx.fillRect(-r, -r * 0.5, r * 2, r);
      ctx.restore();
    },
    // A site that can be played now: solid bright circle.
    mapSiteOpen(ctx, x, y, r) {
      ctx.fillStyle = "#e0473b"; ctx.strokeStyle = "#5a4a36"; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    },
    // A finished site; the player's own building is drawn on top of it.
    mapSiteDone(ctx, x, y, r) {
      ctx.fillStyle = "rgba(120, 200, 110, 0.6)"; ctx.strokeStyle = "#3d6b2f"; ctx.lineWidth = 3; // semi-transparent green
      ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    },
    // What broke a rule: red cells over the outline.
    failCells(ctx, path, alpha) {
      ctx.fillStyle = "rgba(220, 40, 30, " + alpha + ")"; ctx.fill(path);
    },
    // Cracks on an overloaded piece, in metres, centred, across its short side.
    crack(ctx, hx, hy, strain, material) {
      ctx.strokeStyle = "rgba(40, 25, 10, " + Math.min(1, strain * 1.3) + ")"; ctx.lineWidth = 0.05;
      const n = material === "mudbrick" ? 3 : 1, along = hx >= hy;
      for (let i = 0; i < n; i++) {
        const t = n === 1 ? 0 : (i - 1) * 0.55;
        ctx.beginPath();
        for (let k = 0; k <= 5; k++) {
          const u = -1 + (2 * k) / 5, z = (k % 2 ? 0.12 : -0.12) * Math.min(1, strain + 0.3);
          const x = along ? (t + z) * hx : u * hx, y = along ? u * hy : (t + z) * hy;
          if (k) ctx.lineTo(x, y); else ctx.moveTo(x, y);
        }
        ctx.stroke();
      }
    },
    mudChip(ctx, x, y, r, angle, alpha) {
      ctx.save(); ctx.translate(x, y); ctx.rotate(angle);
      ctx.fillStyle = "rgba(140, 98, 60, " + alpha + ")";
      ctx.beginPath(); ctx.moveTo(-r, -r * 0.6); ctx.lineTo(r, -r * 0.3); ctx.lineTo(r * 0.3, r); ctx.closePath(); ctx.fill();
      ctx.restore();
    },
    splinter(ctx, x, y, len, angle, alpha) {
      ctx.save(); ctx.translate(x, y); ctx.rotate(angle);
      ctx.strokeStyle = "rgba(150, 105, 60, " + alpha + ")"; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(-len / 2, 0); ctx.lineTo(len / 2, 0); ctx.stroke();
      ctx.restore();
    },
    // The sidebar bin that holds a level's pieces.
    pileBin(ctx, x, y, w, h) {
      ctx.fillStyle = "#3f362c"; ctx.fillRect(x, y, w, h);
      ctx.strokeStyle = "#2a231c"; ctx.lineWidth = 2; ctx.strokeRect(x, y, w, h);
    },
    pile(ctx, w, h) {
      ctx.fillStyle = "#8a7560";
      ctx.fillRect(0, 0, w, h);
      ctx.fillStyle = "#73604d";
      ctx.fillRect(0, 0, w, Math.max(3, h * 0.05));
    },
    piece: {
      block(ctx, w, h) {
        ctx.fillStyle = "#c9b088";
        ctx.strokeStyle = "#5a4a36";
        ctx.lineWidth = 0.06;
        ctx.fillRect(-w / 2, -h / 2, w, h);
        ctx.strokeRect(-w / 2, -h / 2, w, h);
      },
      column(ctx, w, h, material) {
        ctx.fillStyle = "#d6c097";
        ctx.strokeStyle = "#5a4a36";
        ctx.lineWidth = 0.06;
        ctx.fillRect(-w / 2, -h / 2, w, h);
        ctx.strokeRect(-w / 2, -h / 2, w, h);
        if (material === "wood") return; // wood shows only its grain stripes
        // fluting lines along the long axis
        ctx.beginPath();
        const long = Math.max(w, h);
        const vertical = h >= w;
        const n = 3;
        for (let i = 1; i <= n; i++) {
          const t = -0.5 + i / (n + 1);
          if (vertical) {
            ctx.moveTo(t * w, -h / 2);
            ctx.lineTo(t * w, h / 2);
          } else {
            ctx.moveTo(-w / 2, t * h);
            ctx.lineTo(w / 2, t * h);
          }
        }
        ctx.stroke();
      },
      beam(ctx, w, h) {
        ctx.fillStyle = "#b99a6b";
        ctx.strokeStyle = "#5a4a36";
        ctx.lineWidth = 0.06;
        ctx.fillRect(-w / 2, -h / 2, w, h);
        ctx.strokeRect(-w / 2, -h / 2, w, h);
      },
      centering(ctx, w, h) {
        const R = w / 2, c = (4 * R) / (3 * Math.PI);
        ctx.fillStyle = "#c9a36b"; ctx.strokeStyle = "#5a4a36"; ctx.lineWidth = 0.06;
        ctx.beginPath(); ctx.moveTo(R, -c); ctx.arc(0, -c, R, 0, Math.PI, false); ctx.closePath(); ctx.fill(); ctx.stroke();
      },
      gable() {}, // drawn from its polygon like any shaped piece (fill and outline below)
      wedge(ctx, w, h) {
        ctx.fillStyle = "#c9b088";
        ctx.strokeStyle = "#5a4a36";
        ctx.lineWidth = 0.06;
        ctx.beginPath();
        ctx.moveTo(-w / 3, -h / 2); ctx.lineTo(w / 3, -h / 2); ctx.lineTo(w / 2, h / 2); ctx.lineTo(-w / 2, h / 2);
        ctx.closePath(); ctx.fill(); ctx.stroke();
      },
      drum(ctx, r) {
        ctx.fillStyle = "#cdb892";
        ctx.strokeStyle = "#5a4a36";
        ctx.lineWidth = 0.06;
        ctx.beginPath();
        ctx.arc(0, 0, r, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
        // one line across it so rolling is visible
        ctx.beginPath();
        ctx.moveTo(-r, 0);
        ctx.lineTo(r, 0);
        ctx.stroke();
      },
    },
    // two arrowheads on a button: the test will run fast (Tab)
    fastBadge(ctx, x, y, size) {
      const r = size * 0.2, cx = x + size * 0.36, cy = y + size * 0.36;
      ctx.save();
      ctx.fillStyle = "#f2c230"; ctx.strokeStyle = "#3c3226"; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      ctx.fillStyle = "#3c3226";
      for (const dx of [-0.55, 0.05]) {
        ctx.beginPath(); ctx.moveTo(cx + dx * r, cy - 0.5 * r); ctx.lineTo(cx + (dx + 0.5) * r, cy); ctx.lineTo(cx + dx * r, cy + 0.5 * r); ctx.closePath(); ctx.fill();
      }
      ctx.restore();
    },
    button(ctx, name, x, y, size, pressed) {
      const r = size * (pressed ? 0.46 : 0.5);
      ctx.save();
      ctx.translate(x, y);
      ctx.fillStyle = name === "test" ? (pressed ? "#77756c" : "#4f8a3c") : pressed ? "#5f5042" : "#6e5d4a";
      ctx.strokeStyle = "#3c3226";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(0, 0, r, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle = "#e8dcc5";
      ctx.strokeStyle = "#3c3226";
      ctx.lineWidth = 1.5;
      const s = r * 0.55;
      if (name === "block") {
        ctx.fillRect(-s * 0.9, -s * 0.45, s * 1.8, s * 0.9);
        ctx.strokeRect(-s * 0.9, -s * 0.45, s * 1.8, s * 0.9);
      } else if (name === "block-end") {
        ctx.fillRect(-s * 0.45, -s * 0.9, s * 0.9, s * 1.8);
        ctx.strokeRect(-s * 0.45, -s * 0.9, s * 0.9, s * 1.8);
      } else if (name === "column") {
        ctx.fillRect(-s * 0.3, -s, s * 0.6, s * 2);
        ctx.strokeRect(-s * 0.3, -s, s * 0.6, s * 2);
      } else if (name === "column-lying") {
        ctx.fillRect(-s, -s * 0.3, s * 2, s * 0.6);
        ctx.strokeRect(-s, -s * 0.3, s * 2, s * 0.6);
      } else if (name === "beam") {
        ctx.fillRect(-s, -s * 0.25, s * 2, s * 0.5);
        ctx.strokeRect(-s, -s * 0.25, s * 2, s * 0.5);
      } else if (name === "wedge") {
        ctx.beginPath();
        ctx.moveTo(-s * 0.5, s * 0.8); ctx.lineTo(s * 0.5, s * 0.8); ctx.lineTo(s * 0.75, -s * 0.8); ctx.lineTo(-s * 0.75, -s * 0.8);
        ctx.closePath(); ctx.fill(); ctx.stroke();
      } else if (name === "drum") {
        ctx.beginPath();
        ctx.arc(0, 0, s * 0.8, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
      } else if (name === "home") {
        // a little folded map
        ctx.beginPath();
        ctx.moveTo(-s, -s * 0.6); ctx.lineTo(-s * 0.33, -s * 0.8); ctx.lineTo(s * 0.33, -s * 0.6); ctx.lineTo(s, -s * 0.8);
        ctx.lineTo(s, s * 0.6); ctx.lineTo(s * 0.33, s * 0.8); ctx.lineTo(-s * 0.33, s * 0.6); ctx.lineTo(-s, s * 0.8);
        ctx.closePath(); ctx.fill(); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(-s * 0.33, -s * 0.8); ctx.lineTo(-s * 0.33, s * 0.6);
        ctx.moveTo(s * 0.33, -s * 0.6); ctx.lineTo(s * 0.33, s * 0.8); ctx.stroke();
      } else if (name === "test") {
        // start the test: a little building with the orange load coming down onto it
        if (pressed) ctx.fillStyle = "#a8a59a";
        for (const [bx, by, bw, bh] of [[-0.95, 0.55, 0.9, 0.45], [0.05, 0.55, 0.9, 0.45], [-0.25, 0.1, 0.5, 0.45], [-0.75, -0.1, 1.5, 0.2]]) {
          ctx.fillRect(bx * s, by * s, bw * s, bh * s); ctx.strokeRect(bx * s, by * s, bw * s, bh * s);
        }
        ctx.fillStyle = pressed ? "#b08a60" : "#e8912f"; ctx.strokeStyle = "#8a4f12";
        ctx.beginPath();
        ctx.moveTo(-0.3 * s, -0.25 * s); ctx.lineTo(0.3 * s, -0.25 * s); ctx.lineTo(0.38 * s, -0.7 * s); ctx.lineTo(0, -1.0 * s); ctx.lineTo(-0.38 * s, -0.7 * s);
        ctx.closePath(); ctx.fill(); ctx.stroke();
      } else if (name === "autobuild") {
        // parent override: a little stack being built
        for (const [bx, by, bw] of [[-0.9, 0.35, 0.85], [0.05, 0.35, 0.85], [-0.42, -0.35, 0.85]]) {
          ctx.fillRect(bx * s, by * s, bw * s, 0.6 * s); ctx.strokeRect(bx * s, by * s, bw * s, 0.6 * s);
        }
      } else if (name === "broom") {
        ctx.save();
        ctx.rotate(-0.5);
        ctx.fillRect(-s * 0.08, -s * 0.9, s * 0.16, s * 1.1);
        ctx.beginPath();
        ctx.moveTo(-s * 0.35, s * 0.15);
        ctx.lineTo(s * 0.35, s * 0.15);
        ctx.lineTo(s * 0.22, s * 0.95);
        ctx.lineTo(-s * 0.22, s * 0.95);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
        ctx.restore();
      }
      ctx.restore();
    },
  };

  // ---------------------------------------------------------------------
  // SECTION: PIECE DEFINITIONS -- materials, piece shapes/sizes, sidebar buttons
  // ---------------------------------------------------------------------
  const MATERIALS = {
    // maxLiftSpeed: how fast the material can be carried by hand (m/s) --
    // this, not sluggish acceleration, is what should make stone feel heavy.
    // maxSpin: hard cap on angular velocity while held (rad/s) -- heavier
    // material resists being spun around in the hand more.
    wood:  { label: "WOOD",  density: 1.1,  friction: 0.5,  restitution: 0.015, maxLiftSpeed: 9,  maxSpin: 3.0, maxAccel: 30 },
    // mudbrick: between wood and stone in weight; crumbles under heavy weight (SECTION BREAKING)
    mudbrick: { label: "MUDBRICK", density: 3.2, friction: 0.7, restitution: 0.0, maxLiftSpeed: 7.5, maxSpin: 2.0, maxAccel: 26 },
    stone: { label: "STONE", density: 5.0,  friction: 0.6,  restitution: 0.0,  maxLiftSpeed: 6,  maxSpin: 1.3, maxAccel: 22 },
  };
  let selectedMaterial = "wood";

  const PIECE_DEFS = {
    block:  { shape: "box", hx: 1.0, hy: 0.5, densityScale: 1.0, skin: "block", half: "block-half" },
    column: { shape: "box", hx: 0.3, hy: 1.2, densityScale: 1.0, skin: "column", half: "column-half" },
    beam:   { shape: "box", hx: 1.6, hy: 0.25, densityScale: 0.85, skin: "beam", half: "beam-half" },
    // capital (new, fourth standard size): a flat slab laid on a pillar; an upright block (2 m) plus a capital is one column high
    capital: { shape: "box", hx: 0.8, hy: 0.2, densityScale: 1.0, skin: "beam", half: "capital-half" },
    // square (new, fifth standard size): half a block, for spandrels and staggered joints
    square: { shape: "box", hx: 0.5, hy: 0.5, densityScale: 1.0, skin: "block" },
    // pediment halves (new): right-angled triangles with a short flat tip for the top slab; shapes in src/levels.js
    gableL: { shape: "poly", verts: LEVEL_PIECES.gableL, hx: Math.max(...LEVEL_PIECES.gableL.map((v) => Math.abs(v[0]))), hy: Math.max(...LEVEL_PIECES.gableL.map((v) => Math.abs(v[1]))), densityScale: 1.0, skin: "gable" },
    gableR: { shape: "poly", verts: LEVEL_PIECES.gableR, hx: Math.max(...LEVEL_PIECES.gableR.map((v) => Math.abs(v[0]))), hy: Math.max(...LEVEL_PIECES.gableR.map((v) => Math.abs(v[1]))), densityScale: 1.0, skin: "gable" },
    // triangle (new): right-angled, short sides 1.5 m; fills the corner between an arch and the wall beside it (Lion Gate, Ishtar, Valens)
    tri: { shape: "poly", verts: LEVEL_PIECES.tri, hx: Math.max(...LEVEL_PIECES.tri.map((v) => Math.abs(v[0]))), hy: Math.max(...LEVEL_PIECES.tri.map((v) => Math.abs(v[1]))), densityScale: 1.0, skin: "gable" },
    // what a snapped wooden piece breaks into (two halves along its length; they do not snap again)
    "block-half":  { shape: "box", hx: 0.5, hy: 0.5, densityScale: 1.0, skin: "block" },
    "column-half": { shape: "box", hx: 0.3, hy: 0.6, densityScale: 1.0, skin: "column" },
    "beam-half":   { shape: "box", hx: 0.8, hy: 0.25, densityScale: 0.85, skin: "beam" },
    "capital-half": { shape: "box", hx: 0.4, hy: 0.2, densityScale: 1.0, skin: "beam" },
    drum:   { shape: "circle", r: 0.6, densityScale: 1.0, skin: "drum" },
    // arch stone: narrow end down; about ten make a half circle
    // nine make a half circle (20 degrees each, a keystone in the middle): inner radius 2, outer 3
    wedge:  { shape: "poly", verts: [[-0.35, -0.5], [0.35, -0.5], [0.525, 0.5], [-0.525, 0.5]], hx: 0.525, hy: 0.5, densityScale: 1.0, skin: "wedge" },
    // arch centering (new): the wooden half-round form an arch is built on, flat side down,
    // radius just under the arch's inner radius of 2 m; origin at its centre of mass
    centering: { shape: "poly", verts: Array.from({ length: 11 }, (_, i) => { const t = (Math.PI * i) / 10, R = 1.95; return [R * Math.cos(t), R * Math.sin(t) - (4 * R) / (3 * Math.PI)]; }),
                 hx: 1.95, hy: 0.975, densityScale: 1.0, skin: "centering" },
  };

  const BUTTONS = [
    { kind: "piece", def: "block", angle: 0, icon: "block" },
    { kind: "piece", def: "column", angle: 0, icon: "column" },
    { kind: "piece", def: "beam", angle: 0, icon: "beam" },
    { kind: "piece", def: "drum", angle: 0, icon: "drum" },
    { kind: "piece", def: "wedge", angle: 0, icon: "wedge" },
    { kind: "broom", icon: "broom" },
    { kind: "home", icon: "home" },
    { kind: "test", icon: "test" }, // levels only
  ];

  // ---------------------------------------------------------------------
  // SECTION: WORLD SETUP -- planck world, ground, boundaries, piece list
  // ---------------------------------------------------------------------
  const WORLD_WIDTH = 16; // metres
  const WORLD_CENTER_X = WORLD_WIDTH / 2;
  const PICK_MARGIN = 0.12; // metres
  const WALL_THICKNESS = 0.18; // metres
  const WALL_EXTRA_HEIGHT = 30; // metres above the visible area
  let worldWidth = WORLD_WIDTH; // visible width; wider than 16 m when a tall level zooms out
  let viewX0 = 0; // world x at the left edge of the building area (negative when zoomed out, so the level stays centred)

  const world = new planck.World({ gravity: planck.Vec2(0, -10) });
  // Collision groups: a piece just out of the sidebar (ghost) passes through other pieces but not the ground or walls.
  const SOLID_CAT = 2, GHOST_CAT = 4;

  // Kinematic so the earthquake can move it; at rest it behaves as static.
  const groundBody = world.createBody({ type: "kinematic", position: planck.Vec2(WORLD_CENTER_X, -2) });
  groundBody.createFixture({
    shape: planck.Box(40, 2),
    friction: 0.8,
    filterCategoryBits: SOLID_CAT,
  });

  const anchorBody = world.createBody({ type: "static" });
  let boundaryBodies = [];

  // Keep every piece inside the visible building area. The walls extend well
  // above the viewport so tall towers are not capped by an invisible ceiling.
  function rebuildBoundaries() {
    for (const body of boundaryBodies) world.destroyBody(body);
    boundaryBodies = [];
    const visibleWorldHeight = buildingHeightPx / scale;
    const halfHeight = (visibleWorldHeight + WALL_EXTRA_HEIGHT) / 2 + 2;
    const centerY = (visibleWorldHeight + WALL_EXTRA_HEIGHT) / 2;
    for (const x of [viewX0 - WALL_THICKNESS / 2, viewX0 + worldWidth + WALL_THICKNESS / 2]) {
      const wall = world.createBody({ type: "static", position: planck.Vec2(x, centerY) });
      wall.createFixture({
        filterCategoryBits: SOLID_CAT,
        shape: planck.Box(WALL_THICKNESS / 2, halfHeight),
        friction: 1.35,
        restitution: 0,
      });
      boundaryBodies.push(wall);
    }
  }

  /** @type {Array<{id:number, defKey:string, body:any, hx?:number, hy?:number, r?:number}>} */
  const pieces = [];
  let nextPieceId = 1;

  function spawnPiece(defKey, worldX, worldY, angle, materialKey = selectedMaterial) {
    const def = PIECE_DEFS[defKey];
    const material = MATERIALS[materialKey];
    const body = world.createBody({
      type: "dynamic",
      position: planck.Vec2(worldX, worldY),
      angle: angle || 0,
      linearDamping: 0.015,
      angularDamping: 0.08,
    });
    const density = material.density * def.densityScale;
    const fixtureOptions = {
      density,
      friction: material.friction,
      restitution: material.restitution,
    };
    if (def.shape === "poly") {
      body.createFixture({ ...fixtureOptions, shape: planck.Polygon(def.verts.map(([x, y]) => planck.Vec2(x, y))) });
    } else if (def.shape === "box") {
      body.createFixture({ ...fixtureOptions, shape: planck.Box(def.hx, def.hy) });
    } else {
      body.createFixture({ ...fixtureOptions, shape: planck.Circle(def.r) });
    }
    const piece = { id: nextPieceId++, defKey, material: materialKey, body, hx: def.hx, hy: def.hy, r: def.r, verts: def.verts };
    piece.strain = 0; piece.crush = 0; piece.sup = []; piece.loads = []; piece.impacts = []; // SECTION BREAKING
    piece.canSnap = materialKey === "wood" && def.shape === "box" && !!def.half;
    body.piece = piece;
    pieces.push(piece);
    return piece;
  }

  function removePiece(piece) {
    const idx = pieces.indexOf(piece);
    if (idx >= 0) pieces.splice(idx, 1);
    if (piece.joint) {
      world.destroyJoint(piece.joint);
      piece.joint = null;
    }
    world.destroyBody(piece.body);
  }

  function clearAllPieces() {
    // Destroy drag joints before destroying their bodies; this also clears
    // pointer ownership cleanly if the broom is used during a multi-touch drag.
    for (const pointerId of Array.from(pointers.keys())) releaseHold(pointerId);
    while (pieces.length) removePiece(pieces[pieces.length - 1]);
    for (const l of loads) world.destroyBody(l.body); // a finished site's load goes with its building
    loads = [];
  }

  // ---------------------------------------------------------------------
  // SECTION: LAYOUT -- canvas, scale, screen<->world, sidebar/button positions
  // ---------------------------------------------------------------------
  const canvas = document.getElementById("c");
  const ctx = canvas.getContext("2d");

  let cssWidth = 0, cssHeight = 0;
  let scale = 1; // pixels per metre
  let buildingWidthPx = 0;
  let buildingHeightPx = 0;
  const GROUND_PX = 24; // the ground strip at the bottom of the building area; its top is y = 0
  let sidebarWidthPx = 0;
  let currentLevel = null; // index into LEVELS; null = free play
  let levelTop = 0; // metres of height the current level needs on screen

  function layout() {
    const dpr = window.devicePixelRatio || 1;
    cssWidth = window.innerWidth;
    cssHeight = window.innerHeight;
    canvas.width = Math.round(cssWidth * dpr);
    canvas.height = Math.round(cssHeight * dpr);
    canvas.style.width = cssWidth + "px";
    canvas.style.height = cssHeight + "px";
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    sidebarWidthPx = Math.min(156, Math.max(92, cssWidth * 0.23));
    if (cssWidth - sidebarWidthPx < 160) sidebarWidthPx = Math.max(72, cssWidth * 0.28);
    if (currentLevel != null) { // the pile bin is PILE_BIN_W metres wide (three blocks and a little); one piece size for every
      // level: the largest at which every level's full pile fits in the bin's height (the sidebar follows from it)
      for (pilePx = 60; pilePx > 8; pilePx *= 0.97) {
        const w = PILE_BIN_W * pilePx + 16, size = Math.min(64, (w - 32) / 3), bin = { w: w - 16, h: cssHeight - size - 24 };
        if (w <= cssWidth * 0.45 && LEVELS.every((L, i) => pileLayout(stockItems(i), bin, pilePx)[2])) break;
      }
      pilePx *= 1.5; // owner: sidebar and its pieces one and a half times bigger
      sidebarWidthPx = PILE_BIN_W * pilePx + 16;
    }
    buildingWidthPx = cssWidth - sidebarWidthPx;
    buildingHeightPx = cssHeight;
    scale = buildingWidthPx / WORLD_WIDTH;
    if (currentLevel != null) scale = Math.min(scale, (buildingHeightPx - GROUND_PX) / levelTop);
    worldWidth = buildingWidthPx / scale;
    viewX0 = WORLD_CENTER_X - worldWidth / 2;
    rebuildBoundaries();
    if (currentLevel != null) { pileBinRect = levelSidebar().bin; fillPile(pileItems()); }
  }
  layout();
  window.addEventListener("resize", layout);

  function worldToScreen(x, y) {
    return { x: (x - viewX0) * scale, y: buildingHeightPx - GROUND_PX - y * scale };
  }
  function screenToWorld(px, py) {
    const rect = canvas.getBoundingClientRect();
    const localX = px - rect.left;
    const localY = py - rect.top;
    return { x: localX / scale + viewX0, y: (buildingHeightPx - GROUND_PX - localY) / scale };
  }

  function materialLayout() {
    const pad = 7;
    const gap = 5;
    if (currentLevel != null) return []; // levels take their materials from the pile
    const w = (sidebarWidthPx - pad * 2 - gap * 2) / 3;
    const h = Math.min(54, Math.max(38, cssHeight * 0.085));
    return ["wood", "mudbrick", "stone"].map((key, i) => ({ key, x: buildingWidthPx + pad + i * (w + gap), y: 10, w, h }));
  }

  // Levels: a row of map, broom and test buttons on top, the pile bin below.
  function levelSidebar() {
    const pad = 8, defs = BUTTONS.filter((b) => b.kind === "home" || b.kind === "broom" || b.kind === "test");
    const size = Math.min(64, (sidebarWidthPx - pad * 4) / 3);
    const total = defs.length * size + (defs.length - 1) * pad;
    const x0 = buildingWidthPx + (sidebarWidthPx - total) / 2 + size / 2;
    return {
      buttons: defs.map((def, i) => ({ def, x: x0 + i * (size + pad), y: pad + size / 2, size })),
      bin: { x: buildingWidthPx + pad, y: size + pad * 2, w: sidebarWidthPx - pad * 2, h: cssHeight - size - pad * 3 },
    };
  }

  function buttonLayout() {
    if (currentLevel != null) return levelSidebar().buttons;
    const defs = BUTTONS.filter((b) => b.kind !== "test" || currentLevel != null);
    const n = defs.length;
    const top = Math.max(76, Math.min(92, cssHeight * 0.16));
    const bottom = 10;
    const slot = Math.max(1, (cssHeight - top - bottom) / n);
    const size = Math.min(sidebarWidthPx * 0.58, slot * 0.72);
    const x = buildingWidthPx + sidebarWidthPx / 2;
    const list = [];
    for (let i = 0; i < n; i++) {
      list.push({ def: defs[i], x, y: top + slot * (i + 0.5), size });
    }
    return list;
  }

  // ---------------------------------------------------------------------
  // SECTION: POINTER HANDLING -- hit testing, hold/release, drag events
  // ---------------------------------------------------------------------
  // pointers: pointerId -> { piece }
  const pointers = new Map();

  function hitMaterial(px, py) {
    for (const b of materialLayout()) {
      if (px >= b.x && px <= b.x + b.w && py >= b.y && py <= b.y + b.h) return b.key;
    }
    return null;
  }

  function hitButton(px, py) {
    if (px < buildingWidthPx) return null;
    for (const b of buttonLayout()) {
      const dx = px - b.x, dy = py - b.y;
      if (dx * dx + dy * dy <= (b.size / 2) * (b.size / 2)) return b.def;
    }
    return null;
  }

  function hitPiece(worldPt) {
    // iterate from most-recently-added (likely on top) backwards
    for (let i = pieces.length - 1; i >= 0; i--) {
      const piece = pieces[i];
      if (piece.heldBy != null || piece.auto) continue;
      const local = piece.body.getLocalPoint(planck.Vec2(worldPt.x, worldPt.y));
      if (piece.r != null) {
        if (local.x * local.x + local.y * local.y <= (piece.r + PICK_MARGIN) * (piece.r + PICK_MARGIN)) {
          return piece;
        }
      } else {
        if (Math.abs(local.x) <= piece.hx + PICK_MARGIN && Math.abs(local.y) <= piece.hy + PICK_MARGIN) {
          return piece;
        }
      }
    }
    return null;
  }


  function startHold(piece, worldPt, pointerId, clientX, clientY, centred = false) {
    if (pointers.has(pointerId) || piece.heldBy != null) return;
    piece.heldBy = pointerId;

    // A generous central balance zone avoids accidental tipping. Outside it,
    // the real grab point is used as a lever arm and produces torque.
    const localGrab = piece.body.getLocalPoint(planck.Vec2(worldPt.x, worldPt.y));
    // "Center third of the block": the zone spans the middle third of each
    // full dimension, i.e. one third of the half-extent either side of centre.
    // Across the short side of a long piece the zone is most of the width, so a standing
    // column or plank picked anywhere across it is carried upright.
    const shortSide = (h, o) => (h < o * 0.8 ? h * 0.8 : h / 3);
    const balanceX = piece.r != null ? piece.r / 3 : shortSide(piece.hx, piece.hy);
    const balanceY = piece.r != null ? piece.r / 3 : shortSide(piece.hy, piece.hx);
    const inBalanceZone = centred ||
      (localGrab.x * localGrab.x) / (balanceX * balanceX) +
      (localGrab.y * localGrab.y) / (balanceY * balanceY) <= 1;

    // The grab point stays under the finger (no jump towards the click).
    // Outside the balance zone the grab point is a lever and tilts the piece.
    piece.grabLocal = localGrab;
    piece.lever = !inBalanceZone;
    piece.holdAngle = piece.body.getAngle();
    piece.desired = { x: worldPt.x, y: worldPt.y };
    piece.controlMode = "hand";
    piece.handT = { x: worldPt.x, y: worldPt.y };
    piece.joint = world.createJoint(planck.MouseJoint({ maxForce: 1, frequencyHz: HOLD_HZ, dampingRatio: HOLD_DAMP }, anchorBody, piece.body, planck.Vec2(worldPt.x, worldPt.y)));
    
    pointers.set(pointerId, {
      piece,
      lastX: clientX,
      lastY: clientY,
      lastMoveTime: performance.now(),
    });
  }

  function releaseHold(pointerId) {
    const hand = pointers.get(pointerId);
    if (!hand) return;
    pointers.delete(pointerId);
    if (hand.joint) { try { pileWorld.destroyJoint(hand.joint); } catch (err) { /* body already gone */ } }
    if (hand.pileBody && pileBodies().includes(hand.pileBody)) { hand.pileBody.setAngularDamping(PILE_ANG_DAMP); hand.pileBody.setLinearDamping(0.3); }
    const piece = hand.piece;
    if (!piece) return;
    if (piece.joint && pieces.includes(piece)) { try { world.destroyJoint(piece.joint); } catch (err) { /* body already gone */ } }
    piece.joint = null;
    piece.handT = null;
    // let go while still passing through other pieces: it was never placed, so it goes back to the pile
    if (piece.ghost && currentLevel != null && pieces.includes(piece)) { piece.heldBy = null; returnToPile(piece); return; }
    piece.heldBy = null;
    piece.grabLocal = null;
    piece.controlMode = null;
    piece.desired = null;
    piece.prevDesired = null;
    piece.uSmooth = null;
    piece.lever = false;
    piece.body.setAngularDamping(0.08);
  }

  // The piece appears right at the sidebar edge, at the height of the finger,
  // at its real size, already held, so it is visibly dragged out of the sidebar.
  function spawnHeldAtEdge(defKey, angle, material, pointerId, px, py) {
    const def = PIECE_DEFS[defKey];
    const vertHalfExtent = def.shape === "circle" ? def.r : (angle === 0 ? def.hy : def.hx);
    const horizHalfExtent = def.shape === "circle" ? def.r : (angle === 0 ? def.hx : def.hy);
    const rawY = (buildingHeightPx - GROUND_PX - py) / scale;
    const spawnPt = {
      x: viewX0 + worldWidth - horizHalfExtent - 0.08,
      y: Math.min(Math.max(rawY, vertHalfExtent + 0.05), (buildingHeightPx - GROUND_PX) / scale - vertHalfExtent - 0.05),
    };
    const piece = spawnPiece(defKey, spawnPt.x, spawnPt.y, angle, material);
    startHold(piece, spawnPt, pointerId, px, py);
  }

  function onPointerDown(e) {
    e.preventDefault();
    startAudio();
    if (mode === "map") { onMapPointerDown(e); return; }
    if (e.pointerType === "mouse" && e.button !== 0) return;
    if (pointers.has(e.pointerId)) return;
    try { canvas.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
    const px = e.clientX, py = e.clientY;

    const material = hitMaterial(px, py);
    if (material) {
      selectedMaterial = material;
      return;
    }

    const btn = hitButton(px, py);
    if ((test || auto) && !(btn && btn.kind === "home")) return; // hands off during the test and the quick build
    if (btn) {
      if (btn.kind === "home") {
        cancelAuto();
        releaseAllPointers();
        abortTest();
        mode = "map"; mapEnteredAt = performance.now();
        return;
      }
      if (btn.kind === "test") {
        startTest();
        return;
      }
      if (btn.kind === "broom") {
        if (currentLevel != null) { // levels: start again with the level's own pile, in its starting order
          clearAllPieces();
          fillPile(stockItems(currentLevel));
          return;
        }
        clearAllPieces();
        return;
      }
      spawnHeldAtEdge(btn.def, btn.angle, selectedMaterial, e.pointerId, px, py);
      return;
    }
    if (currentLevel != null) {
      const ab = autoBuildButton();
      if (ab && Math.hypot(px - ab.x, py - ab.y) <= ab.size / 2) { startAutoBuild(); return; }
      const pb = hitPile(px, py);
      if (pb) { // held small inside the sidebar; becomes the real piece when dragged out
        startPileHold(e.pointerId, pb, pilePoint(px, py), false);
        return;
      }
    }

    if (px < buildingWidthPx && py < buildingHeightPx) {
      const worldPt = screenToWorld(px, py);
      const piece = hitPiece(worldPt);
      if (piece) { startHold(piece, worldPt, e.pointerId, px, py); const h = pointers.get(e.pointerId); if (h) { h.downAt = performance.now(); h.downX = px; h.downY = py; } }
    }
  }

  // Record the pointer's raw desired world position on every move, however
  // small -- no minimum-distance threshold, so a slow drag is recognised just
  // as well as a fast one. The hand drive is what actually moves the piece
  // (in stepPhysics below, once per physics tick), not this handler.
  function onPointerMove(e) {
    const hand = pointers.get(e.pointerId);
    if (hand && currentLevel != null && !test) {
      if (hand.pileBody) {
        if (e.clientX < buildingWidthPx) pileToWorld(e.pointerId, hand, e.clientX, e.clientY);
        else { hand.pileTarget = pilePoint(e.clientX, e.clientY); return; }
      } else if (hand.piece && e.clientX >= buildingWidthPx && pieces.includes(hand.piece)) {
        worldToPile(e.pointerId, hand, e.clientX, e.clientY);
        return;
      }
    }
    if (!hand || !hand.piece || !hand.piece.controlMode) return;
    hand.lastX = e.clientX;
    hand.lastY = e.clientY;
    hand.lastMoveTime = performance.now();
    hand.piece.desired = screenToWorld(e.clientX, e.clientY);
  }

  function onPointerUp(e) {
    if (cornerHold && cornerHold.id === e.pointerId) cornerHold = null;
    const hand = pointers.get(e.pointerId);
    if (!hand) return;
    const piece = hand.piece;
    releaseHold(e.pointerId);
    // three quick taps on a piece take it away: back into the pile (levels) or gone (free play)
    if (piece && hand.downAt && performance.now() - hand.downAt < 350 && Math.hypot(e.clientX - hand.downX, e.clientY - hand.downY) < 15 && !test) {
      const now = performance.now();
      piece.taps = (piece.taps || []).filter((t) => now - t < 900);
      piece.taps.push(now);
      if (piece.taps.length >= 3 && pieces.includes(piece)) {
        playSound("take-back", 1);
        if (currentLevel != null) returnToPile(piece); else removePiece(piece);
        return;
      }
    }
    // levels: let go over the sidebar and the piece goes back into the pile
    if (piece && currentLevel != null && !test && e.clientX >= buildingWidthPx && pieces.includes(piece)) returnToPile(piece);
  }

  function onPointerCancel(e) {
    if (cornerHold && cornerHold.id === e.pointerId) cornerHold = null;
    releaseHold(e.pointerId);
  }

  function onLostPointerCapture(e) {
    releaseHold(e.pointerId);
  }

  function releaseAllPointers() {
    for (const pointerId of Array.from(pointers.keys())) releaseHold(pointerId);
  }

  // Open hand over something that can be picked up, closed hand while holding.
  function updateCursor(e) {
    let c = "default";
    if (mode !== "map") {
      if (Array.from(pointers.values()).some((h) => h.piece || h.pileBody)) c = "grabbing";
      else if ((currentLevel != null && hitPile(e.clientX, e.clientY)) ||
        (e.clientX < buildingWidthPx && hitPiece(screenToWorld(e.clientX, e.clientY)))) c = "grab";
    }
    if (canvas.style.cursor !== c) canvas.style.cursor = c;
  }
  canvas.addEventListener("pointerdown", onPointerDown);
  canvas.addEventListener("pointermove", onPointerMove);
  canvas.addEventListener("pointerup", onPointerUp);
  canvas.addEventListener("pointercancel", onPointerCancel);
  canvas.addEventListener("lostpointercapture", onLostPointerCapture);
  for (const ev of ["pointerdown", "pointermove", "pointerup"]) canvas.addEventListener(ev, updateCursor);
  window.addEventListener("blur", releaseAllPointers);
  document.addEventListener("visibilitychange", () => {
    if (document.hidden) releaseAllPointers();
  });

  // ---------------------------------------------------------------------
  // SECTION: CLEANUP -- remove pieces that fall off-world
  // ---------------------------------------------------------------------
  function cleanupOutOfBounds() {
    // A safety net only. Solid boundaries should prevent ordinary pieces
    // from reaching this code; never delete a piece just for leaving the view.
    for (let i = pieces.length - 1; i >= 0; i--) {
      const piece = pieces[i];
      const p = piece.body.getPosition();
      if (!Number.isFinite(p.x) || !Number.isFinite(p.y) || p.y < -100) {
        if (piece.heldBy != null) releaseHold(piece.heldBy);
        removePiece(piece);
      }
    }
  }

  // ---------------------------------------------------------------------
  // SECTION: PHYSICS STEP -- fixed step accumulator, held-piece tracking
  // ---------------------------------------------------------------------
  const STEP = 1 / 60;
  const MAX_STEPS = 5;
  let accumulator = 0;
  let lastTime = null;

  // Run once per physics tick, not per input event: a fast flick, or several
  // pointermove events the browser coalesces into one animation frame, can
  // report the pointer far from where it was a moment ago -- possibly
  // several times before a single tick runs. Reacting to each event directly
  // would let the piece be yanked through whatever is in its path within one
  // step, which the solver would resolve as a sudden deep overlap, launching
  // the obstacle at an unrealistic speed. Computing the drive fresh from the
  // piece's actual current position, once per tick, bounds that regardless
  // of how bursty the input was.
  //
  // The hand is a force with limits, not a teleport. Each tick it pushes the
  // grab point towards the pointer with at most the material's acceleration,
  // carries the piece's own weight, and never presses down on other pieces: pressing a piece
  // into another one rests it there with only its own weight, so nothing gets
  // crushed into overlap and launched, and a dragged piece cannot shove the
  // pieces under it harder than its weight allows.
  const GRAVITY = 10;
  // Hand strength for lifting beyond the piece's own weight, in newtons:
  // a stone block lifts with three more on top (slowly), not with four.
  const HAND_LIFT = 350;
  const PUSH_ACCEL = 8; // m/s^2: hand force while touching = 0.8 x own weight ...
  const HAND_PUSH = 120; // N ... plus this much hand strength, so a mudbrick can shove another along the ground (stone only slowly)
  const NEAR_GAP = 0.25, NEAR_SPEED = 1.5; // within this gap of another piece the held piece moves at most this fast (no sudden ramming)
  // Within NEAR_GAP of another piece only the speed towards it is capped; moving along
  // or away from it stays at full speed (capping all of it made dragging over the building lag).
  const dIn = new planck.DistanceInput(), dOut = new planck.DistanceOutput(), dCache = new planck.SimplexCache();
  function capApproach(body, vx, vy, cap) {
    for (let f = body.getFixtureList(); f; f = f.getNext()) {
      const bb = f.getAABB(0);
      const box = planck.AABB(planck.Vec2(bb.lowerBound.x - NEAR_GAP, bb.lowerBound.y - NEAR_GAP), planck.Vec2(bb.upperBound.x + NEAR_GAP, bb.upperBound.y + NEAR_GAP));
      world.queryAABB(box, (fx) => {
        const b = fx.getBody();
        if (b === body || !(b.piece || b.isLoad) || (b.piece && (b.piece.ghost || b.piece.auto))) return true;
        dIn.proxyA.set(f.getShape(), 0); dIn.proxyB.set(fx.getShape(), 0);
        dIn.transformA.set(body.getTransform()); dIn.transformB.set(b.getTransform());
        dIn.useRadii = true; dCache.count = 0;
        planck.Distance(dOut, dCache, dIn);
        const d = dOut.distance;
        if (d >= NEAR_GAP || d < 0.003) return true; // far, or already touching (the push force is limited then)
        const ux = (dOut.pointB.x - dOut.pointA.x) / d, uy = (dOut.pointB.y - dOut.pointA.y) / d;
        const toward = vx * ux + vy * uy;
        if (toward > cap) { vx -= (toward - cap) * ux; vy -= (toward - cap) * uy; }
        return true;
      });
    }
    return [vx, vy];
  }
  function touchesOtherPiece(body) {
    if (body.piece && body.piece.ghost) return false;
    for (let ce = body.getContactList(); ce; ce = ce.next) {
      if (ce.contact.isTouching() && ce.other.piece) return true;
    }
    return false;
  }
  // The hand is a soft point constraint at the grab point (planck MouseJoint, the Box2D testbed's
  // drag): solved inside the physics step together with the contacts, so the piece swings, hangs and
  // goes round like a real pendulum without the rocking that impulses applied outside the solver gave.
  // The joint's target is the hand, which eases towards the pointer once per tick (bursty pointer
  // events are filtered), moves at most at the material's carry speed, stays within HOLD_LEAD of the
  // grab point, and while touching another piece never goes below the grab point (no pressing down).
  const HOLD_HZ = 10, HOLD_DAMP = 0.9, HOLD_SMOOTH = 0.03, HOLD_LEAD = 0.5; // Hz, -, s, m
  const FREE_AIR_ACCEL = 400; // m/s^2: the hand keeps hold of a piece touching nothing however it is swung (its speed stays capped)
  const GRIP_DAMP = 4, GRIP_MAX = 0.4, HELD_EXTRA_G = 0.8; // HELD_EXTRA_G: held off-centre in free air it weighs 1.8x, so it swings less and settles faster // 1/s: the grip's friction, so a piece held off-centre swings and settles (amplitude halves in about 0.55 s)
  function advanceHeldTargets() {
    for (const hand of pointers.values()) {
      const piece = hand.piece;
      if (!piece || !piece.desired || !piece.joint) continue;
      const body = piece.body;
      const material = MATERIALS[piece.material];
      const m = body.getMass() || 1;
      const touching = touchesOtherPiece(body);
      const p = body.getWorldPoint(piece.grabLocal);
      const T = piece.handT;
      const k = Math.min(1, STEP / HOLD_SMOOTH);
      let vx = ((piece.desired.x - T.x) * k) / STEP, vy = ((piece.desired.y - T.y) * k) / STEP;
      const vlen = Math.hypot(vx, vy), vcap = material.maxLiftSpeed;
      if (vlen > vcap) { vx *= vcap / vlen; vy *= vcap / vlen; }
      if (!piece.ghost) [vx, vy] = capApproach(body, vx, vy, Math.min(NEAR_SPEED, vcap));
      T.x += vx * STEP; T.y += vy * STEP;
      // a spring tracking a moving point trails it by 2 x damping / stiffness x speed; aim that far ahead so the grab point stays on the hand
      const lead = (2 * HOLD_DAMP) / (2 * Math.PI * HOLD_HZ);
      let dx = T.x + vx * lead - p.x, dy = T.y + vy * lead - p.y;
      if (touching && dy < 0) dy = 0;
      const d = Math.hypot(dx, dy);
      if (d > HOLD_LEAD) { dx *= HOLD_LEAD / d; dy *= HOLD_LEAD / d; }
      piece.joint.setTarget(planck.Vec2(p.x + dx, p.y + dy));
      // Force: its own weight plus the hand's strength; touching another piece only a gentle push
      // (0.8 x own weight + HAND_PUSH), so what it pushes resists by its own mass.
      const W = m * GRAVITY;
      const extra = piece.lever && !touching ? HELD_EXTRA_G * W : 0;
      if (extra) body.applyForceToCenter(planck.Vec2(0, -extra), true);
      piece.joint.setMaxForce(touching ? Math.hypot(W, Math.min(m * material.maxAccel, m * PUSH_ACCEL + HAND_PUSH)) : W + extra + Math.max(m * FREE_AIR_ACCEL, HAND_LIFT));
      if (piece.lever) {
        // grip friction: a torque against the swing, scaled by the inertia about the grab point (a body's own
        // angular damping acts only about its centre and barely slows a pendulum)
        // angular damping acts only about its centre and barely slows a pendulum). Like real friction it is
        // capped (GRIP_MAX x the weight's turning force at the arm), so a hard whirl still swings it round.
        const c = body.getWorldCenter(), r2 = (c.x - p.x) ** 2 + (c.y - p.y) ** 2, lc = body.getLocalCenter();
        const Ip = body.getInertia() - m * (lc.x * lc.x + lc.y * lc.y) + m * r2, w = body.getAngularVelocity();
        const tq = Math.min(GRIP_DAMP * Ip * Math.abs(w), GRIP_MAX * m * GRAVITY * Math.sqrt(r2));
        body.applyAngularImpulse(-Math.sign(w) * tq * STEP, true);
      } else {
        // centred grab: hold the pick-up angle with limited torque
        const I = body.getInertia();
        const rc = piece.r != null ? piece.r : Math.max(piece.hx, piece.hy);
        const tl = m * (touching ? PUSH_ACCEL : material.maxAccel) * rc * STEP;
        const wDes = Math.max(-material.maxSpin, Math.min(material.maxSpin, (piece.holdAngle - body.getAngle()) * 10));
        body.applyAngularImpulse(Math.max(-tl, Math.min(tl, I * (wDes - body.getAngularVelocity()))), true);
      }
    }
  }

  // Heavier material resists being spun around in the hand; a piece held off-centre
  // swinging under its own weight may turn up to LEVER_SPIN.
  const LEVER_SPIN = 12; // rad/s
  function clampHeldSpin() {
    for (const hand of pointers.values()) {
      const piece = hand.piece;
      if (!piece) continue;
      const maxSpin = piece.lever ? Math.max(LEVER_SPIN, MATERIALS[piece.material].maxSpin) : MATERIALS[piece.material].maxSpin;
      const w = piece.body.getAngularVelocity();
      if (w > maxSpin) piece.body.setAngularVelocity(maxSpin);
      else if (w < -maxSpin) piece.body.setAngularVelocity(-maxSpin);
    }
  }

  function stepPhysics(dtSeconds, maxSteps = MAX_STEPS) {
    accumulator += dtSeconds;
    let steps = 0;
    while (accumulator >= STEP && steps < maxSteps) {
      advanceHeldTargets();
      autoTick(STEP);
      testTick(STEP);
      world.step(STEP, 10, 5);
      settleResting();
      clampHeldSpin();
      updateStrain();
      solidifyGhosts();
      if (currentLevel != null) { drivePileHands(); pileWorld.step(STEP, 10, 6); for (const h of pointers.values()) if (h.pileBody) capPileHand(h.pileBody); settlePile(); rescuePile(); }
      accumulator -= STEP;
      steps++;
    }
    if (steps === maxSteps) accumulator = 0;
  }
  // Pieces that are nearly still lose the last of their speed quickly, so contact noise
  // cannot keep them trembling or knocking each other in a loop, and they fall asleep.
  // Faster motion (falling, tipping, sliding) is untouched. Written into the velocity
  // directly: planck's setters would wake the body and stop it ever sleeping.
  function damp(b, vLin, vAng, k) {
    if (!b.isAwake() || !b.isDynamic()) return;
    const v = b.m_linearVelocity;
    if (Math.hypot(v.x, v.y) < vLin && Math.abs(b.m_angularVelocity) < vAng) { v.x *= k; v.y *= k; b.m_angularVelocity *= k; }
  }
  function settleResting() {
    if (test && (test.phase === "wind" || test.phase === "quake")) return; // the test's own shaking is real
    for (const p of pieces) if (p.heldBy == null && !p.ghost && !p.auto) damp(p.body, 0.05, 0.08, 0.85);
    for (const l of loads) if (l.released) damp(l.body, 0.05, 0.08, 0.85);
  }
  function settlePile() {
    const held = carriedByHand();
    for (const b of pileBodies()) if (!held.has(b)) damp(b, 0.4, 0.8, 0.7);
  }

  // ---------------------------------------------------------------------
  // SECTION: DRAWING -- render loop, piece drawing
  // ---------------------------------------------------------------------
  function drawPiece(piece) {
    const pos = piece.body.getPosition();
    const s = worldToScreen(pos.x, pos.y);
    if (piece.ghost) { ctx.save(); ctx.globalAlpha = 0.55; }
    drawPieceShape(piece.defKey, piece.material, s.x, s.y, piece.body.getAngle(), scale, piece.strain);
    if (piece.ghost) ctx.restore();
  }

  // Draws one piece at a screen point and pixels-per-metre (also used for the map's small monuments).
  function drawPieceShape(defKey, material, sx, sy, angle, sc, strain = 0) {
    const fillC = material === "mudbrick" ? "#ad7f52" : "#89939b", lineC = material === "mudbrick" ? "#5b3b20" : "#4d5962";
    const def = PIECE_DEFS[defKey];
    const piece = { material, r: def.r, hx: def.hx, hy: def.hy, verts: def.verts };
    ctx.save();
    ctx.translate(sx, sy);
    ctx.rotate(-angle);
    ctx.scale(sc, -sc); // y up, same as the physics shape
    const fn = SKIN.piece[def.skin];
    if (piece.r != null) fn(ctx, piece.r);
    else fn(ctx, piece.hx * 2, piece.hy * 2, piece.material);

    // Wood is visibly striped; stone has a solid cool-grey finish.
    if (piece.r != null) {
      ctx.beginPath(); ctx.arc(0, 0, piece.r - 0.015, 0, Math.PI * 2); ctx.clip();
      if (piece.material === "wood") {
        ctx.strokeStyle = "rgba(91, 55, 25, 0.62)"; ctx.lineWidth = 0.045;
        for (let y = -piece.r; y <= piece.r; y += 0.19) {
          const half = Math.sqrt(Math.max(0, piece.r * piece.r - y * y));
          ctx.beginPath(); ctx.moveTo(-half, y); ctx.lineTo(half, y); ctx.stroke();
        }
      } else {
        ctx.fillStyle = fillC;
        ctx.beginPath(); ctx.arc(0, 0, piece.r - 0.02, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = lineC; ctx.lineWidth = 0.06;
        ctx.beginPath(); ctx.arc(0, 0, piece.r, 0, Math.PI * 2); ctx.stroke();
      }
    } else {
      const poly = () => { ctx.beginPath(); piece.verts.forEach(([x, y], i) => (i ? ctx.lineTo(x, y) : ctx.moveTo(x, y))); ctx.closePath(); };
      if (piece.verts) { poly(); ctx.save(); ctx.clip(); }
      if (piece.material === "wood") {
        if (piece.verts) { ctx.fillStyle = "#c9a36b"; ctx.fillRect(-piece.hx, -piece.hy, piece.hx * 2, piece.hy * 2); } // a shaped wooden piece (triangle) has no skin fill of its own
        // grain runs along the long side
        ctx.strokeStyle = "rgba(91, 55, 25, 0.62)"; ctx.lineWidth = 0.045;
        const along = piece.hx >= piece.hy, a = along ? piece.hx : piece.hy, c = along ? piece.hy : piece.hx;
        for (let t = -c + 0.13; t < c; t += 0.19) {
          ctx.beginPath();
          if (along) { ctx.moveTo(-a + 0.04, t); ctx.lineTo(a - 0.04, t); }
          else { ctx.moveTo(t, -a + 0.04); ctx.lineTo(t, a - 0.04); }
          ctx.stroke();
        }
      } else {
        ctx.fillStyle = fillC;
        ctx.fillRect(-piece.hx + 0.025, -piece.hy + 0.025, piece.hx * 2 - 0.05, piece.hy * 2 - 0.05);
        ctx.strokeStyle = lineC; ctx.lineWidth = 0.06;
        if (!piece.verts) ctx.strokeRect(-piece.hx, -piece.hy, piece.hx * 2, piece.hy * 2);
      }
      if (piece.verts) {
        ctx.restore(); poly();
        ctx.strokeStyle = piece.material === "wood" ? "#5a4a36" : lineC; ctx.lineWidth = 0.06; ctx.stroke();
      }
    }

    if (strain > 0.05) SKIN.crack(ctx, piece.hx != null ? piece.hx : piece.r, piece.hy != null ? piece.hy : piece.r, strain, material);
    ctx.restore();
  }

  function render() {
    SKIN.background(ctx, buildingWidthPx, buildingHeightPx);

    drawLevelBackdrop();

    // Right-side palette replaces the old bottom tray.

    for (const b of materialLayout()) {

        for (let yy = b.y + 10; yy < b.y + b.h - 5; yy += 6) {
          ctx.beginPath(); ctx.moveTo(b.x + 7, yy); ctx.lineTo(b.x + b.w - 7, yy); ctx.stroke();
        }
      } else {
        ctx.fillStyle = b.key === "mudbrick" ? "#ad7f52" : "#89939b";

      }

    if (currentLevel != null) drawPile();

    for (const b of buttonLayout()) {
