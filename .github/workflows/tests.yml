# On every push and pull request (owner 24 Nov):
# - strict: the strict checks of the commit check (see .githooks/game_checks.py);
# - full: every check (each game's tools/ci-checks.txt) of each game the change touches, split over machines that run at once
#   (see .githooks/ci_plan.py; which games a change touches: .githooks/changed_games.py).
# Both compare with where the change starts: the pull request's base, or the commit before the push.
name: tests
on: [push, pull_request]
jobs:
  strict:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install playwright && python -m playwright install --with-deps chromium
      - run: git config core.hooksPath .githooks
      - run: python3 .githooks/ci_check.py "${{ github.event.pull_request.base.sha || github.event.before }}"
  plan:
    runs-on: ubuntu-latest
    outputs: { jobs: '${{ steps.plan.outputs.jobs }}' }
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - id: plan
        run: echo "jobs=$(python3 .githooks/ci_plan.py "${{ github.event.pull_request.base.sha || github.event.before }}")" >> "$GITHUB_OUTPUT"
  full:
    needs: plan
    if: fromJSON(needs.plan.outputs.jobs).include[0] != null
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.jobs) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: pip install playwright numpy pillow && python -m playwright install --with-deps chromium
      - run: git config core.hooksPath .githooks
      - run: python3 .githooks/ci_run.py "${{ matrix.game }}" "${{ matrix.check }}" ${{ matrix.shard }} ${{ matrix.of }}
  tests:  # the check main requires before a merge: passes only when the strict check, the plan and every full job passed (no full jobs: none to pass)
    needs: [strict, plan, full]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.strict.result }}" = success && test "${{ needs.plan.result }}" = success && case "${{ needs.full.result }}" in success|skipped) ;; *) false;; esac
