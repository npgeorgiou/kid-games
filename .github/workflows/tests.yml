# The same checks as the commit check, on GitHub, on every push and pull request (owner 24 Nov). See .githooks/game_checks.py.
name: tests
on: [push, pull_request]
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 50 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install playwright && python -m playwright install --with-deps chromium
      - run: git config core.hooksPath .githooks
      - run: python3 .githooks/ci_check.py ${{ github.event.before || 'HEAD~1' }}
